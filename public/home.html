<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOPE PMO</title>
<style>
  :root{--b950:#081C4A;--b900:#0B2A6B;--b700:#1D4ED8;--b600:#2563EB;--b500:#3B82F6;--b300:#93C5FD;--b100:#DBEAFE;--b50:#EFF6FF;
        --bg:#F6F8FC;--card:#FFFFFF;--ink:#0F172A;--mut:#64748B;--soft:#94A3B8;--line:#E2E8F0;--bad:#B42318;--badbg:#FDECEA;--badline:#F6CFCB}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);min-height:100%;
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  .top{background:var(--b900);color:#fff;padding:26px 20px 46px}
  .top h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.01em}
  .top p{margin:4px 0 0;font-size:12.5px;color:var(--b300)}
  .wrap{max-width:520px;margin:-32px auto 0;padding:0 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 10px 30px -18px rgba(8,28,74,.5)}
  label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:6px}
  input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:15px;font-family:inherit}
  input:focus{outline:none;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;cursor:pointer;border-radius:11px;
    padding:14px 18px;font-weight:700;font-size:15px;font-family:inherit;background:var(--b700);color:#fff;margin-top:12px}
  .btn:disabled{background:var(--b300)}
  .btn.ghost{background:transparent;color:var(--mut);border:1.5px solid var(--line)}
  .err{background:var(--badbg);border:1px solid var(--badline);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:13px;margin-top:12px}
  .who{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .who .av{width:42px;height:42px;border-radius:12px;background:var(--b50);color:var(--b700);display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:16px;flex:0 0 auto}
  .who b{display:block;font-size:15px}
  .who span{display:block;font-size:12px;color:var(--mut)}
  .tiles{display:grid;gap:12px;margin-top:16px}
  a.tile{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;text-decoration:none;color:var(--ink);box-shadow:0 10px 30px -22px rgba(8,28,74,.5)}
  a.tile:active{border-color:var(--b500);background:var(--b50)}
  .tile .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:0 0 auto;background:var(--b50)}
  .tile b{display:block;font-size:15.5px;font-weight:700}
  .tile span{display:block;font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.45}
  .tile .go{margin-left:auto;color:var(--soft);font-size:19px}
  .hint{font-size:12px;color:var(--soft);margin-top:14px;line-height:1.55;text-align:center}
  .hint a{color:var(--b700);font-weight:700;text-decoration:none}
  .sk{width:18px;height:18px;border:2.5px solid var(--b100);border-top-color:var(--b600);border-radius:50%;animation:sp .7s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="top">
  <div data-brandmark></div>
  <h1 data-brandname>HOPE MICROCREDIT CO. LTD</h1>
  <p>MKOPO CHAP CHAP &middot; PMO</p>
</div>

<div class="wrap">
  <div id="view"><div class="card"><div class="sk"></div></div></div>
</div>

<script>
/* Deliberately ES5-plain and dependency-free: this page is the first thing the Android
   WebView loads, so it must render on the oldest phone in the field, offline-tolerant. */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function store(k, v){ try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){} }
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }

/* The calls app keeps its OWN identity (a registered device, name + team, no access code),
   so Calls is always reachable -- a field officer never has a portal code at all. The
   system side is what an access code unlocks. */
function tile(href, icon, title, sub){
  return '<a class="tile" href="' + href + '"><span class="ico">' + icon + '</span>'
    + '<span><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></span>'
    + '<span class="go">&#8250;</span></a>';
}

function renderSignIn(err){
  $('view').innerHTML =
    '<div class="card">'
    + '<label>Msimbo wako / Your access code</label>'
    + '<input id="code" placeholder="Weka msimbo" autocomplete="off" data-secret data-upper>'
    + '<button class="btn" id="go">Ingia / Sign in</button>'
    + (err ? '<div class="err">' + esc(err) + '</div>' : '')
    + '</div>'
    /* ONE DOOR, NOT TWO.

         "at logging in: weka msimbo should not even have a hopecalls card below if someone
          puts code through app take them directly to hopecalls, they'll access the system by
          the switch whenever they need to"

       The HOPE Calls tile used to sit under the code box as the alternative for somebody
       without a code. It stopped being an alternative the day every code started landing on
       Calls: a team code goes there through tryTeamCode, and a leader's code goes there
       through renderHome. Offering it as a second choice made the screen look like a fork when
       both paths already end in the same place, which is a decision asked of somebody who has
       none to make.

       So the code box is the only thing on the screen, and the hint says where the code leads
       and how to get to the rest of the system afterwards -- the switch inside Calls -- rather
       than making that a tile to be chosen between.

       THE PLAIN LINK STAYS, and it is not the tile in smaller type. This page is the first
       thing the Android WebView loads, and an officer who has mistyped their team code or not
       yet been given one would otherwise be sitting at a box they cannot fill, inside the app
       they work in all day, with no way through. That is the call app being down for that
       person. One line of text is what stops it.

       MKOPO WANGU is still not offered here: the customer self-service door beside a staff
       sign-in invited exactly the confusion it was meant to prevent. /mkopo still answers for
       anyone holding its address. */
    + '<div class="hint">Msimbo wowote &mdash; wa timu au wa kiongozi &mdash; unafungua HOPE Calls'
    + ' moja kwa moja. Mfumo unapatikana kwa kitufe cha kubadilisha (&#128260;) ndani ya HOPE Calls.'
    + '<br>Any code &mdash; team or leader &mdash; opens HOPE Calls. The rest of the system is one'
    + ' press away, on the switch inside Calls.'
    + '<br><br>Huna msimbo? / No code? <a href="/call">Fungua HOPE Calls / Open HOPE Calls</a></div>';
  // The form is rebuilt on every error, so the masking is re-applied with it.
  if (window.hopeSecrets) window.hopeSecrets();
  $('code').value = load('hopeCode');
  $('go').onclick = signIn;
  $('code').onkeydown = function(e){ if (e.key === 'Enter') signIn(); };
}

/* THE SERVER DID NOT SEND JSON, AND SAYING SO IN JAVASCRIPT'S WORDS HELPS NOBODY.
   A function that runs out of time or memory is answered by the HOST with an HTML page, so
   reading the answer as JSON throws  Unexpected token 'A', "An error o"...  -- which looks
   like a bug in this page and is in fact the server saying it gave up. Told plainly, with the
   status, it is something somebody can act on instead of paste into a search engine. */
function readJson_(r){
  return r.text().then(function(t){
    try { return { status: r.status, body: JSON.parse(t) }; }
    catch (e) {
      var slow = r.status === 504 || r.status === 408 || /timed? ?out|TIMEOUT/i.test(t);
      throw new Error((slow
        ? 'Seva imechukua muda mrefu mno / the server took too long'
        : 'Seva imeshindwa kujibu / the server could not answer')
        + ' \u2014 HTTP ' + r.status);
    }
  });
}
function signIn(){
  var code = $('code').value.trim();
  if (!code){ renderSignIn('Weka msimbo wako. / Enter your code.'); return; }
  $('go').disabled = true; $('go').textContent = 'Inaingia…';
  /* A DEADLINE, BECAUSE "Inaingia…" WITH NO END IS THE WORST SCREEN IN THE SYSTEM.
     Signing in is one tiny read of one row. If it has not answered in twenty seconds the
     database is not going to answer at all -- and without a deadline the button simply says
     "Inaingia…" for ever, with nothing to press and nothing to report. The phone app and the
     customer screen have had one for months; the door everybody comes through did not. */
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 20000);
  fetch('/api/me?code=' + encodeURIComponent(code), { signal: ctl ? ctl.signal : undefined })
    .then(function(r){ clearTimeout(timer); return readJson_(r); })
    .then(function(res){
      if (res.status < 200 || res.status >= 300 || res.body.ok === false){
        // A field officer has exactly one code -- their TEAM code -- and typing it here used
        // to end at "Msimbo si sahihi", which is both wrong and a dead end. It is a valid
        // code, just for the other door: so open that door for them instead of teaching them
        // which button they should have pressed.
        tryTeamCode(code, function(){ renderSignIn(res.body.error || 'Msimbo si sahihi. / Invalid code.'); });
        return;
      }
      store('hopeCode', code);            // dashboard.html and upload.html read this same key
      renderHome(res.body);
    })
    .catch(function(e){
      clearTimeout(timer);
      // Same reasoning as app.html: name what actually went wrong, or the message sends
      // somebody to check a network that was never the problem.
      var m = String((e && e.message) || e);
      // An aborted request is OUR deadline, not the network. Saying "no connection" there
      // sends somebody to restart a router when the server is the one not answering.
      if (/abort/i.test(m) || (e && e.name === 'AbortError')) {
        m = 'Seva haijibu / the server is not answering. Jaribu tena / try again.';
      }
      renderSignIn(/Seva|HTTP/.test(m) ? m : ('Hakuna mtandao / No connection. (' + m + ')'));
    });
}

/** A team code goes straight through to HOPE Calls, with the code carried across so the
    officer never types it twice. `no` runs when it is not a team code either. */
function tryTeamCode(code, no){
  fetch('/api/call', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ fn:'api_teamCode', args:[code] }) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || !d.ok) { no(); return; }
      store('hcTeamCode', code);          // call.html prefills its team-code box from this
      $('go').textContent = 'Inafungua HOPE Calls…';
      window.location.href = '/call';
    })
    .catch(no);
}

function renderHome(me){
  /* =====================================================================================
     EVERYBODY LANDS ON CALLS.

       "App is default land to call app when code Is inserted, unless one uses the switch
        button, I want users to focus on calling so do this"

     A valid code -- any code, the admin's included -- goes straight to HOPE Calls. The rest
     of the system is one press away, not gone: the switch button inside Calls (shown while
     the system is open) leads to the dashboard, and every screen keeps its own address for
     anyone who needs it directly. The code is carried across so an unregistered handset
     finds its sign-in box already filled, the same courtesy the team-code path has always
     had.

     `/?menu=1` still shows this launcher's tile menu -- the office TV pointing at HOPE Live,
     or an admin who wants the upload door without a detour, should not need to remember five
     addresses. */
  if (!/[?&]menu=1/.test(window.location.search)) {
    store('hcTeamCode', load('hopeCode'));
    $('view').innerHTML = '<div class="card" style="text-align:center;color:var(--mut)">Inafungua HOPE Calls…</div>';
    window.location.replace('/call');
    return;
  }
  var scope = me.teams ? (me.teamCount + (me.teamCount === 1 ? ' team' : ' teams')) : 'Timu zote / All teams';
  var initials = String(me.name || '?').trim().split(/\s+/).slice(0, 2).map(function(w){ return w.charAt(0); }).join('').toUpperCase();
  /* When the admin has closed the system, the portal is not merely refused -- it is not
     offered. A door that is drawn and then slams in somebody's face is worse than no door:
     they retype their code, they ring the office, and somebody's afternoon goes on it. Calls
     is always here, because Calls is never closed. */
  var open = me.systemOpen !== false;
  var tiles =
      tile('/call', '&#128222;', 'HOPE Calls', 'Orodha za simu, ufuatiliaji, ripoti / call lists & follow-ups')
    + (open ? tile('/dashboard', '&#128202;', 'Mfumo / System', 'Dashboard, followup, PAR, ripoti zote / the full portal') : '')
    + (open && me.can.upload ? tile('/upload', '&#128228;', 'Pakia faili / Upload', 'Expected, Defaulters, Received, mikopo / loan files') : '')
    /* HOPE LIVE IS NO LONGER A TILE. It is a wall display, not a door anybody signs in to use,
       and offering it in the staff menu sent people to a screen with no controls that then had
       no way back. The address still serves it, so the office TV pointed at /live -- and the
       `/?menu=1` note above, which exists for that TV -- keep working untouched. */
    + (me.can.admin ? tile('/upload?admin=1', '&#128273;', 'Misimbo / Access codes', 'Pakia Access Codes na User Roles / manage who signs in') : '');
  // Said plainly, once, so nobody spends the morning deciding whether it is broken.
  var closedNote = open ? '' :
    '<div class="hint">Mfumo umefungwa kwa sasa &mdash; tumia HOPE Calls.<br>'
    + 'The system is closed for now &mdash; please use HOPE Calls.</div>';
  $('view').innerHTML =
    '<div class="card">'
    + '<div class="who"><span class="av">' + esc(initials) + '</span>'
    + '<span><b>' + esc(me.name) + '</b><span>' + esc(me.role) + ' &middot; ' + esc(scope) + '</span></span></div>'
    + '<button class="btn ghost" id="out">Toka / Sign out</button>'
    + '</div>'
    + '<div class="tiles">' + tiles + '</div>' + closedNote
    + '<div class="hint">Chagua sehemu unayotaka kuendelea nayo.<br>Choose which part of the system to open.</div>';
  $('out').onclick = function(){ store('hopeCode', null); renderSignIn(); };
}

/* A saved code signs you straight back in, but a stale/revoked one must not strand the
   launcher on a spinner -- it falls back to the sign-in card with the reason. */
(function boot(){
  var saved = load('hopeCode');
  if (!saved){ renderSignIn(); return; }
  fetch('/api/me?code=' + encodeURIComponent(saved))
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (res.status >= 200 && res.status < 300 && res.body.ok !== false) renderHome(res.body);
      else { store('hopeCode', null); renderSignIn(res.body.error || ''); }
    })
    .catch(function(){ renderSignIn(); });
})();
</script>
<script src="/brand.js"></script>
</body>
</html>
