<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOPE PMO — Dashboard</title>
<style>
  :root{--bg:#0B1120;--card:#131C2E;--line:#22304A;--txt:#E5EAF2;--mut:#8B9AB3;--b500:#3B82F6;--b600:#2563EB;--ok:#4ADE80;--bad:#F87171}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:24px}
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 24px}
  a{color:var(--b500);text-decoration:none}
  a:hover{text-decoration:underline}
  .setup{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:20px}
  .setup label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;font-weight:600}
  .setup .row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
  .setup .row>div{flex:1;min-width:200px}
  input{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:#0F1830;color:var(--txt);font-size:14px}
  input:focus{outline:none;border-color:var(--b500)}
  button{padding:9px 16px;border:0;border-radius:8px;background:var(--b600);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  button:hover{background:var(--b500)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .kpi .l{font-size:11.5px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px}
  .kpi .v{font-size:22px;font-weight:800}
  .kpi .s{font-size:11.5px;color:var(--mut);margin-top:4px}
  .good{color:var(--ok)}.bad{color:var(--bad)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:20px}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
  .card-h span{font-weight:400;color:var(--mut);font-size:12px}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{text-align:left;padding:10px 18px;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line)}
  td{padding:10px 18px;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  .r{text-align:right}
  .msg{padding:40px;text-align:center;color:var(--mut)}
  .msg.bad{color:var(--bad)}
  .meta{color:var(--mut);font-size:12px;margin:0 0 12px}
  .note{margin:0 0 20px;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--bad);border-radius:8px;color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <div data-brandmark></div>
  <h1>HOPE PMO — Dashboard</h1>
  <p class="sub"><a href="/">&larr; Menu</a> &middot; <a href="/upload">Upload files</a> &middot; <a href="/call">HOPE Calls</a></p>

  <div class="setup">
    <div class="row">
      <div><label>Access code</label><input id="code" placeholder="Your HOPE PMO access code"></div>
      <div><label>API endpoint (optional &mdash; leave blank to use this site)</label><input id="apiBase" placeholder="This site"></div>
      <div style="flex:0"><button id="go">Load</button></div>
    </div>
  </div>

  <div id="body"><div class="msg">Enter your access code and API endpoint above, then Load.</div></div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
$('apiBase').value = localStorage.getItem('hopeApiBase') || '';
$('code').value = localStorage.getItem('hopeCode') || '';
$('apiBase').addEventListener('change', function(){ localStorage.setItem('hopeApiBase', this.value.trim().replace(/\/$/, '')); });
$('code').addEventListener('change', function(){ localStorage.setItem('hopeCode', this.value.trim()); });

function money(n){ n = Number(n)||0; return Math.round(n).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function kpi(label, value, sub, cls){
  return '<div class="kpi"><div class="l">'+esc(label)+'</div><div class="v'+(cls?' '+cls:'')+'">'+value+'</div>'
    + (sub ? '<div class="s">'+esc(sub)+'</div>' : '') + '</div>';
}

function load(){
  // The dashboard is served by the same Vercel app as the API, so same-origin is the
  // default -- the endpoint field only matters when pointing this page at ANOTHER deploy.
  var apiBase = ($('apiBase').value.trim() || window.location.origin).replace(/\/$/, '');
  var code = $('code').value.trim();
  var body = $('body');
  if (!code){ body.innerHTML = '<div class="msg bad">Enter your access code first.</div>'; return; }
  body.innerHTML = '<div class="msg">Loading\u2026</div>';
  fetch(apiBase + '/api/dashboard?code=' + encodeURIComponent(code))
    .then(function(r){ return r.json().then(function(d){ return { status: r.status, body: d }; }); })
    .then(function(res){
      if (!(res.status >= 200 && res.status < 300) || res.body.ok === false){
        body.innerHTML = '<div class="msg bad">Failed: ' + esc(res.body.error || 'unknown error') + '</div>';
        return;
      }
      render(res.body);
    })
    .catch(function(e){ body.innerHTML = '<div class="msg bad">Failed: ' + esc(String(e)) + '</div>'; });
}

function render(d){
  var t = d.totals || {};
  var rec = t.recovery || {};
  var dt = d.dates || {};
  var wk = d.period === 'week';                       // weekends show week-to-date, matching the live system
  var when = wk ? 'this week' : 'today';

  var kpis = kpi('Expected customers', money(t.expectedCustomers), when + ' \u00B7 ' + d.asOfWeekday)
    + kpi('Expected amount', 'TZS ' + money(t.expectedAmount))
    + kpi('Collected ' + when, 'TZS ' + money(t.collected), null, 'good')
    + kpi('Uncollected', 'TZS ' + money(t.uncollected), null, t.uncollected > 0 ? 'bad' : 'good')
    + kpi('Recovery', rec.pct == null ? '\u2014' : rec.pct + '%',
          'TZS ' + money(rec.recovered) + ' / ' + money(rec.denominator) + ' \u00B7 ' + (rec.basisLabel || ''))
    + kpi('Defaulter customers', money(t.defaulterCustomers))
    + kpi('Defaulter arrears', 'TZS ' + money(t.defaulterArrears), null, 'bad')
    + kpi('Sales (approved)', money(t.salesCount) + ' loans', 'this week \u00B7 TZS ' + money(t.salesAmount))
    + kpi('Received ' + when, money(t.receivedCount) + ' payments', 'TZS ' + money(t.receivedAmount), 'good');

  var meta = 'As of ' + (dt.today || '')
    + (wk ? ' \u00B7 week ' + (dt.weekMon || '') + ' \u2192 ' + (dt.weekFri || '') : '')
    + ' \u00B7 expected snapshot(s): ' + ((dt.expected || []).join(', ') || '\u2014')
    + ' \u00B7 recovery denominator: ' + ((dt.recoveryDen || []).join(', ') || '\u2014')
    + (rec.yesterdaySource ? ' (' + rec.yesterdaySource + ')' : '');

  var teams = d.teams || [];
  var rows = teams.map(function(r){
    return '<tr><td><b>' + esc(r.team) + '</b></td>'
      + '<td class="r">' + money(r.expectedAmount) + '</td>'
      + '<td class="r good">' + money(r.collected) + '</td>'
      + '<td class="r good">' + money(r.recovered) + '</td>'
      + '<td class="r bad">' + money(r.defaulterArrears) + '</td>'
      + '<td class="r">' + money(r.defaulterCustomers) + '</td>'
      + '<td class="r good">' + money(r.receivedAmount) + '</td>'
      + '<td class="r">' + money(r.salesAmount) + '</td></tr>';
  }).join('');

  $('body').innerHTML =
    '<div class="meta">' + esc(meta) + '</div>'
    + '<div class="kpis">' + kpis + '</div>'
    + (rec.note ? '<div class="note">' + esc(rec.note) + '</div>' : '')
    + '<div class="card"><div class="card-h">By team<span>' + teams.length + ' team(s) \u00B7 ' + esc(when) + '</span></div>'
    + '<table><thead><tr><th>Team</th><th class="r">Expected</th><th class="r">Collected</th><th class="r">Recovered</th>'
    + '<th class="r">Arrears</th><th class="r">Defaulters</th><th class="r">Received</th><th class="r">Sales</th></tr></thead>'
    + '<tbody>' + (rows || '<tr><td colspan="8" style="text-align:center;color:var(--mut)">No data yet for this scope.</td></tr>') + '</tbody></table></div>';
}

$('go').addEventListener('click', load);
$('code').addEventListener('keydown', function(e){ if (e.key === 'Enter') load(); });
if ($('code').value) load();
</script>
<script src="/brand.js"></script>
</body>
</html>
