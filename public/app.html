<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>HOPE PMO — Portal</title>
<style>
  :root{--b950:#081C4A;--b900:#0B2A6B;--b800:#10357F;--b700:#1D4ED8;--b600:#2563EB;--b500:#3B82F6;--b300:#93C5FD;--b100:#DBEAFE;--b50:#EFF6FF;
        --bg:#F6F8FC;--card:#FFF;--ink:#0F172A;--mut:#64748B;--soft:#94A3B8;--line:#E2E8F0;
        --ok:#067647;--okbg:#E7F6EE;--okline:#CFEADD;--warn:#92400E;--warnbg:#FEF3DC;--warnline:#F6E3BC;
        --bad:#B42318;--badbg:#FDECEA;--badline:#F6CFCB;--rad:14px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  .hide{display:none !important}
  .sk{width:20px;height:20px;border:2.5px solid var(--b100);border-top-color:var(--b600);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* A hairline that slides across the top while the screen you are already reading is quietly
     brought up to date behind you. It replaces the old habit of wiping the page to a spinner
     on every single click -- you keep your place, and the numbers change under you when they
     are ready. Two pixels tall on purpose: it should be noticeable, not distracting. */
  /* The print frame. Invisible on screen; on paper it is the ONLY thing, at full page width.
     A legal document with the app's navigation printed down the side of it is not a legal
     document anybody wants to hand to a customer. */
  #printFrame{position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;visibility:hidden}
  @media print{
    body > *{display:none !important}
    #printFrame{position:static;left:0;width:100%;height:auto;min-height:100vh;
                visibility:visible;display:block !important}
  }
  /* The noticeboard. It covers everything on purpose -- that is what "announcement" means
     here -- but it is always dismissible, because a notice nobody can get past is an outage. */
  #annBg{position:fixed;inset:0;background:rgba(6,26,54,.92);z-index:80;display:none;
         align-items:center;justify-content:center;padding:20px}
  #annBg.on{display:flex}
  #annBox{background:var(--card);border-radius:18px;max-width:520px;width:100%;
          max-height:88vh;overflow:auto;padding:18px;text-align:center}
  #annBox img{max-width:100%;border-radius:12px;display:block;margin:0 auto 12px}
  #annBox .t{font-size:16px;line-height:1.5;white-space:pre-wrap;text-align:left}
  /* The bell. A count nobody can read is a dot nobody looks at. */
  .bell{position:relative}
  .bell b{position:absolute;top:-5px;right:-5px;background:#B42318;color:#fff;border-radius:999px;
          font-size:10px;line-height:1;padding:3px 5px;min-width:16px;font-weight:800}
  #notifList{max-height:60vh;overflow:auto}
  .nrow{display:block;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .nrow.new{background:var(--b50);margin:0 -16px;padding-left:16px;padding-right:16px}
  .nrow .m{color:var(--mut);font-size:11.5px;margin-top:2px}
  .busy{height:2px;background:transparent;overflow:hidden;flex:0 0 auto}
  .busy.on{background:var(--b100)}
  .busy.on::after{content:'';display:block;height:100%;width:40%;background:var(--b600);animation:bz 1.1s ease-in-out infinite}
  @keyframes bz{0%{margin-left:-40%}100%{margin-left:100%}}

  /* sign-in */
  #signin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--b900),var(--b800));padding:20px;z-index:50}
  #signin .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  #signin h2{margin:0 0 4px;font-size:18px}
  #signin p{margin:0 0 18px;font-size:13px;color:var(--mut)}
  #signin input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:12px}
  #signin input:focus{outline:none;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
  .btn.w{width:100%;padding:13px}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.ghost{background:#fff;color:var(--mut);border:1.5px solid var(--line)}
  .btn:disabled{opacity:.55}

  /* shell */
  .shell{display:flex;height:100%}
  /* The sidebar is the SAME navy the phone app's header uses, not the darkest shade in the
     ramp. The app's colour was right; what made the system read as hard was painting 225
     pixels of near-black down the whole height of the screen, next to a white page. One step
     lighter is the app's own header colour, which is the thing it was meant to match. */
  .side{width:225px;flex:0 0 auto;background:var(--b900);color:#cfe0ff;display:flex;flex-direction:column;padding:16px 12px}
  .side .brand{color:#fff;font-weight:800;font-size:14px;line-height:1.35}
  .side .brand small{display:block;color:var(--b300);font-weight:500;font-size:11px;margin-top:2px}
  .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:#cfe0ff;
    padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .nav button svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
  .nav button.on svg{opacity:1}
  .nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:#fff;color:var(--b800)}
  /* ONE FLOW, NOT TWO SIDEBARS. HOPE Loan's own tabs sit in the SAME list as HOPE PMO's, one
     continuous scroll -- this is only a quiet label above them, not a switch to flip and not a
     banner to warn anybody they have left somewhere. Drawn once, only when there is at least
     one HOPE Loan item this code actually holds a tab for. */
  .navhead{padding:14px 11px 4px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--b300);text-transform:uppercase}
  .side .foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px}
  .side .foot b{color:#fff;font-size:12.5px;display:block}
  .side .foot span{font-size:11px;color:var(--b300);display:block;margin-bottom:8px}
  .side .foot a,.side .foot button{display:block;width:100%;text-align:center;margin-top:6px;font-size:12px;padding:8px;
    border-radius:8px;text-decoration:none;background:rgba(255,255,255,.1);color:#fff;border:0;cursor:pointer;font-weight:600}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px}
  .top h1{margin:0;font-size:16.5px;font-weight:800;flex:1;min-width:0}
  .top .q{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;min-width:150px}
  .top .q:focus{outline:none;border-color:var(--b500)}
  .body{flex:1;overflow:auto;padding:16px 18px 60px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .kpi .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--soft);margin-top:2px}
  .good{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .card-h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-h .sub{font-weight:400;color:var(--mut);font-size:12px;margin-left:auto}
  /* THE PER-TABLE SEARCH -- distinct from the magnifier (Tafuta mteja) up in the top bar. That
     one is company-wide and opens the full customer insight; this one only narrows whatever
     list is already on screen, in ANY of its columns, exactly the way sorting or a dropdown
     filter already narrows it. */
  .tblsearch{padding:8px 14px;border-bottom:1px solid var(--line)}
  .tblsearch input{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px}
  .tblsearch input:focus{outline:none;border-color:var(--b500)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;padding:8px 12px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1px solid var(--line);white-space:nowrap;background:var(--b50);cursor:pointer;user-select:none}
  td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--b50)}
  .r{text-align:right}
  th.sn,td.sn{width:1%;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums;padding-right:6px}
  td.sn{font-size:11.5px}
  /* weekday trend grids */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 14px}
  .tcell{background:var(--b50);border:1px solid var(--b100);border-radius:10px;padding:9px 10px;text-align:center}
  /* A day nobody has uploaded yet. Deliberately faint: it is not a bad number, it is not a
     number. Zero collection and no sheet must never look the same on a wall. */
  .tcell.pend{background:transparent;border-style:dashed;opacity:.6}
  .tcell.tot{background:var(--b900);border-color:var(--b900);color:#fff}
  .tcell.tot .th,.tcell.tot .mutl{color:var(--b300)}
  .tcell .th{font-size:11.5px;font-weight:800;letter-spacing:.03em;margin-bottom:4px}
  .tcell .tl{font-size:12.5px;line-height:1.5}
  .tcell .mutl{color:var(--mut);font-size:11px}
  .tcell .badl{color:var(--bad);font-size:11px}
  /* pipeline funnel */
  .fun{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .fun .fl{width:150px;color:var(--mut);text-transform:capitalize}
  .fun .fv{width:60px;text-align:right;font-weight:700}
  .fun .fb{flex:1;height:8px;background:var(--b50);border-radius:99px;overflow:hidden}
  .fun .fb i{display:block;height:100%;background:var(--b500)}
  /* weekday pills + filters */
  .pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pills .pill{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--mut);
    font-weight:700;font-size:12.5px;cursor:pointer}
  .pills .pill.on{background:var(--b700);border-color:var(--b700);color:#fff}
  .pills select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .tblfoot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--b50)}
  a.tel{color:var(--b600);text-decoration:none}

  /* dark mode -- one class on <body>, every colour comes from the variables above */
  body.dark{--bg:#0B1120;--card:#131C2E;--line:#22304A;--ink:#E5EAF2;--mut:#8B9AB3;--soft:#64748B;
    --b50:#16233C;--b100:#22304A;--b900:#060D1C;--b950:#040914;
    --okbg:#12301F;--okline:#1D5136;--warnbg:#33260C;--warnline:#5C4517;--badbg:#3A1512;--badline:#6B2620}
  body.dark input,body.dark select,body.dark textarea,body.dark .btn.ghost,body.dark .tcell{background:#0F1830;color:var(--ink)}
  body.dark th{background:#101B31}
  body.dark .menuBtn{background:#0F1830;color:var(--ink)}
  body.dark #signin .box{background:var(--card)}
  /* paired boards side by side on a wide screen, stacked on a phone */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:1000px){ .pair{grid-template-columns:1fr} }
  tr.totrow td{font-weight:800;background:var(--b50);border-top:2px solid var(--b100)}
  /* presentation: a real projector deck, full screen, dark, readable across a room */
  /* THE DECK FOLLOWS THE THEME. It was a fixed dark navy whatever the rest of the system was
     set to, so somebody working in light mode got a black screen thrown at them on the
     projector -- and a bright meeting room is exactly where a light deck reads better. Every
     colour here is a variable that flips with body.dark, so one toggle changes both. */
  :root{ --pbg:#FFFFFF; --pink:#0F172A; --plab:#1D4ED8; --pline:rgba(8,28,74,.14);
         --psoft:rgba(11,42,107,.06); --pedge:rgba(8,28,74,.10) }
  body.dark{ --pbg:#081C4A; --pink:#FFFFFF; --plab:#93C5FD; --pline:rgba(255,255,255,.22);
             --psoft:rgba(255,255,255,.07); --pedge:rgba(255,255,255,.12) }
  #pres{display:none;position:fixed;inset:0;z-index:200;background:var(--pbg);color:var(--pink);padding:26px 34px;overflow:auto}
  #pres .phead{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;margin-bottom:18px}
  #pres .pnum{margin-left:auto;font-size:15px;font-weight:600;color:var(--plab)}
  #pres .pclose{background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
  /* PRAYERS, AND THE TELEVISION. Switching the TV off and back on costs the meeting a minute
     of waiting for the deck to come back. This covers the screen instead: pure black, one white
     mark to end it, the deck untouched underneath and the clock stopped so nothing is missed. */
  #pres .pblankbtn{background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);
    height:38px;padding:0 15px;border-radius:19px;font-size:13.5px;font-weight:700;cursor:pointer;
    white-space:nowrap;margin-right:8px}
  #pres .pblank{position:fixed;inset:0;background:#000;z-index:99;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  #pres .pblank .pbx{color:#fff;font-size:34px;opacity:.5;line-height:1;
    border:2px solid rgba(255,255,255,.5);border-radius:50%;width:74px;height:74px;
    display:flex;align-items:center;justify-content:center}
  #pres .pblank .pbnote{position:absolute;bottom:38px;left:0;right:0;text-align:center;
    color:rgba(255,255,255,.32);font-size:13px;letter-spacing:.04em}
  /* The arrows. On a TV nobody is holding a keyboard, and on a phone or tablet there are no
     arrow keys at all -- so the two things a person wants during a deck have to be touchable.
     Big, at the vertical middle, hard against each edge where a thumb already is. */
  #pres .ptot td{border-top:2px solid var(--pline);font-weight:800;background:var(--psoft)}
  #pres .pnav{position:fixed;top:50%;transform:translateY(-50%);z-index:210;
    background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:64px;height:96px;
    font-size:34px;line-height:1;cursor:pointer;border-radius:12px;
    display:flex;align-items:center;justify-content:center}
  #pres .pnav:hover{background:var(--b100);color:var(--b800)}
  #pres .pprev{left:10px} #pres .pnext{right:10px}
  /* Out of the way on a small screen: half the size, and low enough not to sit over a name. */
  @media (max-width:700px){ #pres .pnav{width:44px;height:64px;font-size:24px} }
  #pres .pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  #pres .pkpi{background:var(--psoft);border:1px solid var(--pedge);border-radius:16px;padding:22px}
  #pres .pl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--plab)}
  #pres .pv{font-size:40px;font-weight:800;margin-top:8px}
  /* A SLIDE THAT DOES NOT FIT IS A SLIDE NOBODY CAN READ FROM THE BACK OF THE ROOM.
     The deck was written for six columns and now carries nine -- the five collection days plus
     the week -- and at a fixed 19px the wide boards ran off the edge of the projector. Nobody
     scrolls sideways during a meeting; they just do not see the last column.

     So the type SIZES ITSELF to the screen instead of being a number somebody guessed:
     clamp() keeps it between 11px and 19px and lets the viewport choose in between, and the
     padding shrinks with it. On a wide monitor nothing changes at all. On a laptop or a small
     projector the table gets smaller rather than wider, which is the trade a room actually
     wants.

     `table-layout:fixed` with wrapping headers stops one long officer name stretching a column
     past its share, which is what turns a table that ALMOST fits into one that does not. */
  #pres .ptable{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed;
    font-size:clamp(11px, 1.25vw, 19px)}
  #pres .ptable th{text-align:left;padding:clamp(4px,.55vw,10px) clamp(5px,.7vw,12px);color:var(--plab);
    font-size:clamp(9px,.9vw,14px);text-transform:uppercase;line-height:1.2;
    border-bottom:1px solid var(--pline);background:transparent;
    overflow-wrap:anywhere;word-break:break-word}
  #pres .ptable td{padding:clamp(4px,.55vw,10px) clamp(5px,.7vw,12px);border-bottom:1px solid var(--pedge);
    overflow-wrap:anywhere}
  /* The first column is the name and needs the room; the figure columns are all short. */
  #pres .ptable th:first-child, #pres .ptable td:first-child{width:auto}
  #pres .ptable .r{text-align:right;white-space:nowrap}
  /* And a last resort: if a board is still wider than the screen, it scrolls INSIDE its own
     box rather than pushing the whole slide sideways and hiding the navigation arrows. */
  #pres .pscroll{overflow-x:auto;max-width:100%}
  /* tips toast */
  #tip{position:fixed;right:18px;bottom:18px;max-width:330px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--b500);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink);
    box-shadow:0 14px 34px -18px rgba(8,28,74,.6);opacity:0;transform:translateY(12px);transition:all .3s ease;
    pointer-events:none;z-index:70}
  #tip.show{opacity:1;transform:none}
  .msg{padding:34px 18px;text-align:center;color:var(--mut);font-size:13px}
  .msg.bad{color:var(--bad)}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600);border:1px solid var(--b100)}
  .chip.ok{background:var(--okbg);color:var(--ok);border-color:var(--okline)}
  .chip.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
  .chip.bad{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
  .chip.mut{background:#F1F5F9;color:var(--mut);border-color:var(--line)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar select,.bar input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .bar select:focus,.bar input:focus{outline:none;border-color:var(--b500)}
  .note{padding:10px 13px;border:1px solid var(--warnline);background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:12.5px;margin-bottom:12px}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}

  /* commission rate editor + report cleanup: forms that live INSIDE a card, not a drawer,
     because typing a rate and watching the numbers move is the whole point of both. */
  .cmsrates,.cleanbox{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .cmsrates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;align-items:end}
  .cmsrates .note,.cleanbox .note{grid-column:1/-1;margin:0}
  .checks{display:flex;flex-wrap:wrap;gap:6px 16px}
  .checks label,.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .checks input,.chk input{width:auto;margin:0}
  .chk{margin:6px 0 10px}
  .clact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .passout{margin:12px 0;padding:12px 14px;border:1.5px solid var(--okline);background:var(--okbg);border-radius:10px;text-align:center}
  .passout .pl{font-size:11.5px;color:var(--ok);font-weight:700;margin-bottom:6px}
  .passout .pv{font-size:26px;font-weight:800;letter-spacing:.14em;font-family:ui-monospace,Menlo,monospace;color:var(--ok)}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
  .clickrow{cursor:pointer}
  .kpis.sm .kpi{padding:8px 10px}
  .kpis.sm .kpi .v{font-size:16px}
  .rxsched{margin:10px 0 14px;max-height:280px;overflow:auto}
  /* Complaint audit trail. Deliberately NOT .hist -- that class already styles the follow-up
     comment history, and reusing it silently restyled both. */
  .cxhist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .cxhist h4{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
  .cxhist .hrow{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .cxhist .hrow:last-child{border-bottom:0}
  .cxhist .hat{float:right;color:var(--mut);font-size:11px}
  .cxhist .hnote{color:var(--mut);margin-top:2px;clear:both;font-size:12px}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(8,17,34,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
  .drawer{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
  .drawer h3{margin:0 0 4px;font-size:16px}
  .drawer .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--b500)}
  .facts{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
  .frow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .frow:last-child{border-bottom:0}
  .frow span:first-child{color:var(--mut)}
  .hist{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .t{display:flex;justify-content:space-between;color:var(--soft);font-size:10.5px;margin-bottom:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:11px 18px;
    border-radius:10px;font-size:13px;z-index:80;display:none;max-width:90vw}
  .toast.bad{background:var(--bad)}

  /* The menu stays on the LEFT at every size -- on a phone it slides in over the content
     instead of becoming a row of tabs across the top, so the navigation is always in the
     same place and the header stays readable. */
  .menuBtn{display:none;flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;align-items:center;justify-content:center}
  .scrim{display:none;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:39}
  @media (max-width:820px){
    .menuBtn{display:flex}
    .side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:230px;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    body.navopen .side{transform:none}
    body.navopen .scrim{display:block}
    .main{width:100%}
    .top{padding:10px 12px}
    .body{padding:12px}
    .top h1{font-size:15px}
    .top .q{min-width:0;flex:1}
  }

  /* =====================================================================================
     GLASS EDGES -- the outline of every panel, and nothing else.
     =====================================================================================
       "can the app outer widgets margins be like the nowdays iphone glassed-like ones,
        not distrubing colors but only margins i think , am not sure"

     So this block touches THREE properties: the corner radius, the hairline on panels whose
     line is the neutral grey, and the shadow that puts a little air under a panel. Not one
     background, not one text colour, and not one of the SEMANTIC borders -- a warning keeps
     its amber edge, the total tile keeps its navy, the chosen pill keeps its blue -- because
     those carry meaning and an edge does not.

     WHY IT READS AS GLASS WITHOUT BEING SEE-THROUGH. On a phone, what makes a panel look like
     a pane is not the transparency; it is the edge. A wider, rounder corner, a hairline
     softer than a drawn line, a faint catch of light along the top, and a wide low shadow
     that lifts the panel off the page. Actual translucency over a white card would tint every
     figure printed on it, which is the one thing that was asked not to happen. Where something
     genuinely floats OVER the page -- a drawer, the notice, the menu on a phone -- the blur is
     real, because there the glass is doing what glass does and no figure sits behind it.

     Interior lines are deliberately left alone. A table's row rules, a card's header divider
     and a field's border are structure, not margin, and rounding them would only make the
     content look loose.

     It is last in the file on purpose, and every selector is at most as specific as the rule
     it softens, so anything carrying its own colour keeps it. */
  :root{
    --gr:16px;                                            /* panels */
    --gr-sm:12px;                                         /* tiles and controls */
    --gline:rgba(15,23,42,.09);
    --ghi:inset 0 1px 0 rgba(255,255,255,.85);            /* the light along the top edge */
    --gsh:0 1px 1.5px rgba(8,28,74,.045), 0 10px 26px -16px rgba(8,28,74,.30);
    --gsh-sm:0 1px 1px rgba(8,28,74,.04), 0 5px 14px -10px rgba(8,28,74,.26);
  }
  /* In the dark the light comes from inside the pane, not off it -- a white highlight at 85%
     on a dark card is a scratch, not a sheen. */
  body.dark{
    --gline:rgba(255,255,255,.11);
    --ghi:inset 0 1px 0 rgba(255,255,255,.05);
    --gsh:0 1px 1.5px rgba(0,0,0,.30), 0 12px 30px -18px rgba(0,0,0,.85);
    --gsh-sm:0 1px 1px rgba(0,0,0,.25), 0 6px 16px -11px rgba(0,0,0,.75);
  }

  /* Panels */
  .card,.facts{border-color:var(--gline);border-radius:var(--gr);box-shadow:var(--gsh),var(--ghi)}
  .kpi{border-color:var(--gline);border-radius:var(--gr-sm);box-shadow:var(--gsh-sm),var(--ghi)}
  /* The tip keeps its blue left edge -- that stripe is how you know which kind of message it
     is -- so it is given the shape and the lift and none of the hairline. */
  #tip{border-radius:var(--gr);box-shadow:0 18px 40px -20px rgba(8,28,74,.55),var(--ghi)}
  /* Shape only: every one of these carries a colour that means something. */
  .tcell,.note,.passout{border-radius:var(--gr-sm)}

  /* Controls -- rounder to match the panels they sit on, nothing else changed. */
  .btn{border-radius:12px}
  .btn.sm{border-radius:11px}
  .menuBtn,.pills .pill,.pills select,.bar select,.bar input,.top .q{border-radius:11px}
  .fld input,.fld select,.fld textarea{border-radius:12px}

  /* THINGS THAT ACTUALLY FLOAT, where the blur is real glass rather than an impression of it.
     Nothing readable sits behind these while they are open, so nothing is tinted. */
  .drawer{border-radius:22px 22px 0 0;box-shadow:0 -18px 50px -24px rgba(8,28,74,.55)}
  #annBox,#signin .box{border-radius:20px}
  .drawer-bg,.scrim,#annBg{-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%)}
  @media (max-width:820px){
    .side{border-radius:0 20px 20px 0}
  }

  /* TWO PANELS THAT NEVER LEARNED ABOUT THE DARK.
     Not part of the edges above -- found while looking at them. Every other surface takes its
     background from --card and flips with the theme; these two were painted #fff outright, so
     in dark mode they came back as white slabs carrying pale grey text that cannot be read.
     The chosen pill is excluded by name so it keeps its blue, which is how you know which day
     you are looking at. */
  body.dark .facts,
  body.dark .pills .pill:not(.on){background:var(--card)}
</style>
</head>

<script>
/* ES5-plain on purpose: this runs inside the Android WebView on whatever phone an officer
   owns. No build step, no framework, no CDN. */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n = Number(n)||0; return Math.round(n).toLocaleString('en-US'); }
/* A percentage, or a string that is ALREADY one. The grand-total row hands back "~62.5%" for
   a column it could only average rather than recompute -- the ~ is the whole point of it, so
   this has to let a formatted string through instead of running it past isNaN and printing a
   dash where a real summary was worked out. */
function pct(v){
  if (typeof v === 'string' && v.charAt(v.length-1) === '%') return v;
  return (v==null||isNaN(v)) ? '\u2014' : v + '%';
}
function mb(b){ b = Number(b)||0;
  if (b >= 1073741824) return (b/1073741824).toFixed(2)+' GB';
  if (b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  return Math.round(b/1024)+' KB'; }
function fmtDur(sec){ sec = Math.max(0, Math.round(Number(sec)||0)); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  function p2(n){ return (n<10?'0':'')+n; } return h>0 ? (h+':'+p2(m)+':'+p2(s)) : (m+':'+p2(s)); }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function toast(m, bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':'');
  t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3200); }
function today(){ var d=new Date(Date.now()+3*3600*1000); return d.toISOString().slice(0,10); }   // EAT
function addDays(key,n){ var d=new Date(key+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

var WDFULL = { MON:'Monday', TUE:'Tuesday', WED:'Wednesday', THU:'Thursday', FRI:'Friday', SAT:'Saturday', SUN:'Sunday' };
var WD7 = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];   // calendar order, Monday first
/* THE DAYS AS THE OFFICERS SAY THEM. Swahili weekday names carry their own number -- Jumamosi
   (mosi, 1st), Jumapili (pili, 2nd), Jumatatu (tatu, 3rd), Jumanne (nne, 4th), Jumatano (tano,
   5th) -- then Alhamisi and Ijumaa. So the working week reads J3 J4 J5 AL IJ, which is what is
   written on every board in every branch. MON/TUE/WED is the translation, not the original. */
var SWDAY = { MON:'J3', TUE:'J4', WED:'J5', THU:'AL', FRI:'IJ', SAT:'J1', SUN:'J2' };
function wdLabel(w){ return SWDAY[String(w||'').toUpperCase()] || w; }
var S = { code:'', me:null, view:'dashboard', data:null, rows:[], cols:[], q:'', sort:null, asc:true,
          sort2:null, asc2:false,
          args:{}, filters:{}, foot:'', roles:[], lang:'sw', tips:null, tipTimer:null, rid:0,
          /* ALWAYS BOOTS TO 'hopepmo', NEVER REMEMBERED. Only an admin ever sees the switch at
             all, and even for them a page load lands on the real book by default every time --
             the sandbox has to be chosen on purpose, on this visit, never carried in from a
             tab that was left open in it yesterday. */
          workspace: 'hopepmo' };

/* Which portal calls only LOOK at data. Everything not on this list is treated as a change to
   the books, which throws the whole remembered screen away -- a save on one tab can move the
   numbers on any other, so it is never safe to keep showing what we had.
   Fails safe on purpose: a name nobody listed here is assumed to write, so the worst a
   forgotten entry can do is bring back the old behaviour of always asking the server. */
var READ_FNS = { dashboardFull:1, officerBoards:1, expectedDay:1, expdfReport:1,
  expectedDefaulters:1, assignments:1, followup:1, followupReport:1, promises:1, par:1,
  weekly:1, leaderReports:1, reports:1, commission:1, callReport:1, callAgents:1,
  complaints:1, complaintLog:1, restructures:1, restructureEligible:1, legalPreview:1,
  demandNotices:1, abnormal:1, credit:1, teams:1, staffRoster:1, settings:1, storageUsage:1,
  accessCodes:1, officerAccounts:1, loans:1, loanPipeline:1, hints:1, comments:1,
  // HOPE Loan's own reads -- opening a queue must not wipe the HOPE PMO screens' cache, and
  // vice versa; both live under one cache key scheme, so both lists matter equally.
  csSearch:1, managerQueue:1, teamQueue:1, seniorQueue:1, creditQueue:1, disburseQueue:1,
  disburseWindowStatus:1, financeBankReport:1, carriersList:1, adjustmentsList:1, pipelineSummary:1,
  reversalsList:1, paymentsList:1, complaintsList:1 };
// key = which remembered screen is on display right now. Views fill in their own defaults as
// they load (Expected decides the weekday, for one), so the key a screen is FILED under is not
// the key you would work out from the state afterwards -- keep the real one, or later touches
// like a team filter get written to a slot nobody reads.
var VC = { store:{}, watch:null, key:'' };
/* THE BUILD STAMP. Bumped by hand with every front-end change -- there is no build step in
   this system (public/*.html is served exactly as written), so this string IS the version.
   Read it aloud when a screen looks wrong: it says at once whether the fix is even present. */
var BUILD = '2026-08-18-d';

/* One call shape for the whole portal -- every tab goes through /api/portal. */
/* THE SERVER DID NOT SEND JSON, AND SAYING SO IN JAVASCRIPT'S WORDS HELPS NOBODY.
   A function that runs out of time or crashes is answered by the host with an HTML page, so
   r.json() throws  Unexpected token 'A', "An error o"...  -- which reads like a bug in this page
   and is in fact the server saying it gave up. Told plainly, with the status, it is something
   somebody can act on instead of paste into a search engine. */
function readJson_(r){
  return r.text().then(function(t){
    try { return { status: r.status, body: JSON.parse(t) }; }
    catch (e) {
      var slow = r.status === 504 || r.status === 408 || /timed? ?out|TIMEOUT/i.test(t);
      throw new Error((slow
        ? 'Seva imechukua muda mrefu mno / the server took too long'
        : 'Seva imeshindwa kujibu / the server could not answer')
        + ' \u2014 HTTP ' + r.status);
    }
  });
}
function srv(fn, args){
  if (!READ_FNS[fn]) {
    VC.store = {};                       // something changed: nothing remembered is trustworthy
    if (VC.watch) VC.watch.ok = false;   // and a screen built on top of a change is not either
  }
  /* A DEADLINE. The platform gives up on a function at sixty seconds; this stops just short,
     so a screen that is never going to arrive says so instead of spinning until somebody
     reloads the page and starts the same wait again. Longer than the phone's twenty-five
     seconds on purpose -- the heaviest screens here legitimately take several. */
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 45000);
  return fetch('/api/portal', {
    method:'POST', headers:{'Content-Type':'application/json'},
    // `workspace` travels on EVERY call, not just the loan ones -- the server is the one place
    // that decides whether it is honoured (see api/_lib/workspace.js), so a stray value here
    // can, at worst, be ignored, never grant anything on its own.
    body: JSON.stringify({ code:S.code, fn:fn, args:args||{}, workspace:S.workspace }),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){ clearTimeout(timer); return readJson_(r); },
     function(e){
       clearTimeout(timer);
       if (/abort/i.test(String((e && e.message) || e)) || (e && e.name === 'AbortError')) {
         throw new Error('Seva haijibu ndani ya sekunde 45 / the server did not answer within 45 seconds');
       }
       throw e;
     })
    .then(function(x){
      if (x.status>=200 && x.status<300 && x.body.ok!==false) return x.body;
      /* The admin closed the system while this page was open. Every tab from here on would
         answer the same way, so a red message on each one teaches nothing -- say it once and
         go back to the launcher, which knows how to explain what is still available. */
      if (x.status === 403 && x.body && /HOPE Calls/.test(String(x.body.error||''))){
        document.body.innerHTML = '<div class="msg" style="padding:40px;text-align:center;line-height:1.8">'
          + 'Mfumo umefungwa kwa sasa &mdash; tumia HOPE Calls.<br>'
          + 'The system is closed for now &mdash; please use HOPE Calls.<br><br>'
          + '<a class="btn" href="/">Rudi / Back</a></div>';
        throw new Error(x.body.error);
      }
      throw new Error((x.body && x.body.error) || ('HTTP '+x.status));
    });
}

/* ----------------------------------------------------------- sign in */
function signIn(){
  var code = $('#code').value.trim();
  if (!code){ $('#inErr').textContent='Weka msimbo. / Enter your code.'; return; }
  $('#inBtn').disabled = true; $('#inBtn').textContent = 'Inaingia…';
  fetch('/api/me?code='+encodeURIComponent(code))
    .then(readJson_)
    .then(function(x){
      $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in';
      if (x.status<200||x.status>=300||x.body.ok===false){ $('#inErr').textContent = x.body.error||'Msimbo si sahihi.'; return; }
      S.code = code; store('hopeCode', code); start(x.body);
    })
    /* A SERVER THAT ANSWERED BADLY IS NOT A MISSING NETWORK, and telling somebody to check
       their connection when the connection is fine sends them looking in the wrong place --
       which is exactly what happened at 8am with Supabase serving 296,000 requests. readJson_
       throws a described error for a non-JSON reply; only a fetch that never completed is
       genuinely "no connection". */
    .catch(function(e){
      $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in';
      var m = String((e && e.message) || e);
      $('#inErr').textContent = /Seva|HTTP/.test(m)
        ? m
        : ('Hakuna mtandao / no connection. (' + m + ')');
    });
}
$('#inBtn').onclick = signIn;
$('#code').onkeydown = function(e){ if (e.key==='Enter') signIn(); };
$('#outBtn').onclick = function(){ store('hopeCode', null); location.reload(); };

  { id:'followup',    label:'Defaulters Followup', ic:'<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.8 19.8 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.08 4.18 2 2 0 0 1 4.06 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.22a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>' },

/* A view id says which workspace it belongs to just by its own name -- every HOPE Loan id is
   prefixed ln_, on purpose (see NAV_LOAN above), so nothing needs to be told separately which
   book a screen reads from. This is what let the switch go away: there is no mode to be in
   ahead of time, only the tab in front of you. */
function isLoanId_(id){ return typeof id === 'string' && id.indexOf('ln_') === 0; }
function allowed(id){
  if (isLoanId_(id)) {
    var n = NAV_LOAN.filter(function(x){ return x.id===id; })[0];
    if (!n) return false;
    // ln_pipeline has tab:null -- everyone who can even open HOPE Loan may see the summary.
    // A few screens (reversals) need either of two tabs, so `tab` may be one name or a list.
    if (!n.tab) return true;
    if (S.me.role === 'ADMIN') return true;
    var need = Array.isArray(n.tab) ? n.tab : [n.tab];
    return need.some(function(t){ return (S.me.tabs||[]).indexOf(t) >= 0; });
  }
  if (id==='upload' || id==='settings') return (S.me.tabs||[]).indexOf(id)>=0;
  return ALWAYS.indexOf(id)>=0;
}
/* ONE SIDEBAR, NOT TWO -- "i thout we killing the sandbox shotcut and having one flow from now
   on". HOPE Loan's items are appended after HOPE PMO's own, gated exactly like every other
   tab: a code with no HOPE Loan tab draws nothing extra and never learns the section exists.
   `hopeLoanAvailable` (from /api/me) covers the other half -- a code that DOES hold a HOPE
   Loan tab still sees nothing here on a deployment where HOPE Loan itself was never configured,
   so nobody is ever shown a door that leads nowhere. */
function buildNav(){
  var el = $('#nav'); el.innerHTML='';
  function drawItem(n){
    var b = document.createElement('button');
    // The icon is how people find a tab in a list of 23 -- they recognise the shape before
    // they read the word, which is the whole reason v1 had them.
    b.innerHTML = (n.ic
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
        + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n.ic + '</svg>'
      : '') + '<span>' + esc(n.label) + '</span>';
    b.setAttribute('data-v', n.id);
    b.onclick = function(){ go(n.id); };
    el.appendChild(b);
  }
  // HOPE LOAN FIRST, THEN HOPE PMO -- "hopeloanones should start before the pmo ones". Origination
  // is the front door for anyone who holds one of its tabs; everything else follows below it.
  var loanShown = false;
  if (S.me.hopeLoanAvailable) {
    var loanItems = NAV_LOAN.filter(function(n){ return allowed(n.id) && !n.hidden; });
    if (loanItems.length) {
      var loanHead = document.createElement('div');
      loanHead.className = 'navhead';
      loanHead.textContent = 'HOPE Loan';
      el.appendChild(loanHead);
      loanItems.forEach(drawItem);
      loanShown = true;
    }
  }
  // A second label only once there is something above it to tell it apart from -- a code with
  // no HOPE Loan tab still gets the plain, unlabelled list it always had.
  if (loanShown) {
    var pmoHead = document.createElement('div');
    pmoHead.className = 'navhead';
    pmoHead.textContent = 'HOPE PMO';
    el.appendChild(pmoHead);
  }
  NAV.forEach(function(n){ if (allowed(n.id) && !n.hidden) drawItem(n); });
}
function go(view){
  S.view = view; S.q=''; S.sort=null; S.sort2=null; S.asc=true; S.asc2=false;
  S.args={}; S.filters={}; S.foot='';
  /* WHICH BOOK THIS REQUEST READS, DECIDED FROM THE TAB ITSELF -- no toggle to flip first, no
     mode left over from whatever was open before. Every request from here rides S.workspace to
     the server (see srv() below), which resolves it for real against this code's own tabs --
     this is only what picks the RIGHT one, never what grants it. */
  S.workspace = isLoanId_(view) ? 'hopeloan' : 'hopepmo';
  /* THE TABLE BELONGS TO THE TAB, AND IT WAS BEING INHERITED.
     Reported from the field: "downloading most reports excel brings team performance report
     instead of the desired one; found this at expected and so on."

     S.rows / S.cols / HEAD are what paint() draws and what Excel, CSV and JPG all export, and
     they were the only parts of the view state this did not clear. A tab that draws no table
     of its own -- there are several, they set KPIs and boards and expect paintHeadOnly() --
     therefore kept whatever the LAST tab had left in them. The dashboard is where everybody
     lands, and it leaves S.rows holding Team Performance, so that is the report that followed
     people around.

     Worse, the view cache then stored that borrowed table AS the new tab's snapshot, so it
     came back on every later visit to it within the cache window.

     Cleared here, a tab with no table of its own now exports nothing and says so, which is the
     honest answer. A tab with a table sets these before it paints, exactly as it always did. */
  S.rows = []; S.cols = []; HEAD = ''; ONROW = null;
  document.body.classList.remove('navopen');        // picking a tab closes the phone drawer
  var t = (isLoanId_(view) ? NAV_LOAN : NAV).filter(function(n){ return n.id===view; })[0];
  $('#title').textContent = t ? t.label : view;
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v')===view);
  });
  if (view==='upload'){ location.href='/upload'; return; }
  render();
}
/* THE RELOAD BUTTON, DOING BOTH JOBS SINCE THE BUILD STAMP WAS TAKEN OFF THE BAR.
     tap        -- reload the DATA, always from the server. What it has always done.
     long press -- reload the PAGE itself past any cache, which is what the build stamp's tap
                   used to do. Kept because "is the fix on my screen yet" is a real question
                   that has cost three round trips to answer, and telling somebody to clear a
                   browser cache on a phone is not an answer.
   The version itself now lives in this button's tooltip rather than as text in the bar. */
(function(){
  var b = $('#refBtn');
  if (!b) return;
  b.title = 'Reload · ' + BUILD + ' — bonyeza kwa muda kupata toleo jipya / long-press to force the newest version';
  var timer = null, held = false;
  function hardReload(){ held = true; location.replace(location.pathname + '?v=' + Date.now()); }
  function down(){ held = false; timer = setTimeout(hardReload, 700); }
  function up(){ clearTimeout(timer); }
  b.addEventListener('mousedown', down);
  b.addEventListener('touchstart', down, { passive: true });
  b.addEventListener('mouseup', up);
  b.addEventListener('mouseleave', up);
  b.addEventListener('touchend', up);
  b.onclick = function(){ if (!held) render({ force: true }); };
})();

/* THE NOTICEBOARD, on the reader's side.

   Dismissed PER ANNOUNCEMENT, not per session: waving away Monday's notice must not also wave
   away Tuesday's, and reading Monday's twice because you opened a second tab is worse than
   useless. The version stamp the server sends is what tells them apart, and it is also what
   keeps the image off the wire -- a phone that has already seen this one asks for nothing. */
function annKey_(ts){ return 'hopeAnnSeen_' + ts; }
function annCheck(){
  return srv2('api_announcement').then(function(a){
    if (!a || !a.on || !a.ts) { $('#annBg').classList.remove('on'); return; }
    if (load(annKey_(a.ts))) return;                 // this one has already been waved away
    $('#annBox').innerHTML =
        (a.image ? '<img src="' + esc(a.image) + '" alt="">' : '')
      + (a.text ? '<div class="t">' + esc(a.text) + '</div>' : '')
      + '<button class="btn w" id="annOk" style="margin-top:14px">Sawa / Got it</button>';
    $('#annBg').classList.add('on');
    $('#annOk').onclick = function(){
      store(annKey_(a.ts), '1');
      $('#annBg').classList.remove('on');
    };
  }).catch(function(){ /* a noticeboard that will not load must never block the system */ });
}
/* The announcement is read WITHOUT an access code -- it has to reach the sign-in screen -- so
   it goes to the calls door, not the portal one. */
function srv2(fn, args){
  return fetch('/api/call', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fn:fn, args:args||[] }) })
    .then(readJson_).then(function(x){ return x.body; });
}

/* THE BELL. How a supervisor learns a complaint was logged without opening the tab. */
/* Stored UTC, shown EAT -- one helper so the bell and the tables cannot disagree. */
function eatDt_(v){
  var t = Date.parse(v);
  if (isFinite(t)) return new Date(t + 3*3600*1000).toISOString().replace('T',' ').slice(0,16);
  return String(v).replace('T',' ').slice(0,16);
}
function bellRefresh(){
  return srv('notifications').then(function(d){
    S.notif = d;
    var b = $('#bellBtn');
    b.innerHTML = '&#128276;' + (d.unseen ? '<b>' + (d.unseen > 99 ? '99+' : d.unseen) + '</b>' : '');
  }).catch(function(){ /* the bell is never the reason a screen fails */ });
}
function bellOpen(){

          + esc(i.who || i.ref || '')
          + '<div>' + esc(i.what) + '</div>'
          + '<div class="m">' + esc(i.team || '') + ' · ' + esc(i.by || '')
            /* Same rule as every When column: stored UTC, read in East Africa. */
            + ' · ' + esc(eatDt_(i.at)) + '</div></div>';
      }).join('') : '<div class="hint">Hakuna kipya. / Nothing new.</div>') + '</div>'
    + (d.unseen ? '<button class="btn w" id="notifSeen" style="margin-top:10px">'
        + 'Nimesoma zote / Mark all read</button>' : ''));
  var b = $('#notifSeen');
  if (b) b.onclick = function(){
    srv('notifSeen', {}).then(function(){ closeDrawer(); bellRefresh(); })

function start(me){
  S.me = me;
  /* THE FOLLOW-UP STATUS LIST COMES FROM THE DATABASE, not from this file. It is editable in
     Settings, and the office and the field must offer the same words -- two hard-coded copies
     drifting apart would have officers and supervisors logging different vocabularies for the
     same thing, which is invisible until somebody tries to count them.

     Asked for once at sign-in and kept: it changes when an admin edits it, which is roughly
     never. If the call fails the built-in list below stands, so a follow-up can always be
     logged -- a form nobody can submit is worse than one offering a slightly old word. */
  srv('fuStatuses').then(function(f){
    if (f && f.fuStatuses && f.fuStatuses.length) {
      FU_STATUSES = f.fuStatuses;
      FU_NEED_DATE = f.fuNeedDate || [];
      FU_NEED_NUMBER = f.fuNeedNumber || [];
      S.fuMeta = f;
    }
  }).catch(function(){});
  // Before anything is drawn: the first tab load already uses the remembered-screen window.
  applyCadences(me.ui);
  $('#signin').classList.add('hide');
  $('#shell').classList.remove('hide');
  $('#meName').textContent = me.name;
  $('#meRole').textContent = me.role + ' · ' + (me.teams ? me.teamCount+' team(s)' : 'All teams');
  // me.hopeLoanAvailable rides along on S.me (set above) and is all buildNav() needs to decide
  // whether HOPE Loan's own items belong in this sidebar at all -- see /api/me.js. Nothing
  // client-side decides this on its own.
  buildNav();
  tipsStart();
  go('dashboard');
  annCheck();
  bellRefresh();
  $('#bellBtn').onclick = bellOpen;
  /* THE MAGNIFIER IS TAFUTA MTEJA. It used to open a lighter search drawer while the full
     find-a-customer screen -- the one that says in words whether today's screens can see the
     person -- hid behind a sidenav entry. One search, one door: the icon opens the full
     screen, and the duplicate sidenav entry is gone. */
  $('#findBtn').onclick = function(){ go('findcust'); };
  // Checked again when somebody comes back to the tab, so a notice posted mid-morning reaches
  // a screen that has been sitting open since eight.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ annCheck(); bellRefresh(); }
  });
}

/* ----------------------------------------------------------- table engine

function col(key, label, kind){ return { key:key, label:label, kind:kind||'text' }; }
// Read one key out of the settings rows the page already has, rather than a call of its own.
function settingVal(rows, key, dflt){
  var r = (rows||[]).find(function(x){ return x.key === key; });
  return r ? r.value : dflt;
}

function cellText(r, c){
  var v = r[c.key];
  if (c.get) v = c.get(r);
  if (v==null || v==='') return '';
  if (c.kind==='money') return money(v);
  if (c.kind==='pct') return pct(v);
  if (c.kind==='dur') return fmtDur(v);
  if (c.kind==='date') return String(v).slice(0,10);
  if (c.kind==='dt'){
    /* Stored UTC, read in East Africa: the raw ISO string showed every comment three hours
       early ("The time of comments in app is not reading EAT, +3hrs please"). Timestamps
       arrive from PostgREST with an offset, so parse and shift; anything unparseable is
       shown as written rather than blanked. */
    var t = Date.parse(v);
    if (isFinite(t)) return new Date(t + 3*3600*1000).toISOString().replace('T',' ').slice(0,16);
    return String(v).replace('T',' ').slice(0,16);
  }
  return String(v);
}
/* The dialling form of a number, whatever shape it was stored in. Byte-for-byte the call app's
   telHref: strip everything but digits, drop a leading 255 or any leading zeros, put +255 back
   on the front. A number already carrying 255 is left with a single +. */
function telHref_(v){
  var d = String(v==null?'':v).replace(/\D/g,'');
  if (!d) return '';

  /* WHAT IS SHOWN AND WHAT IS DIALLED ARE NOT THE SAME STRING. Phones are stored the way
     normPhone leaves them -- nine digits, no leading zero, no 255 -- so putting the stored text
     straight after `tel:` handed the dialler a number no Tanzanian network completes. The text
     on screen stays as it is; the href gets the full +255 form, the same rule the call app's
     telHref has always used. */
  if (c.kind==='tel') return txt ? '<a class="tel" href="tel:'+esc(telHref_(txt))+'" onclick="event.stopPropagation()">'+esc(txt)+'</a>' : '';

function filtered(){
  var rows = S.rows;

  // the CSV/Excel export always describe exactly what is on screen.
  if (S.filters.team) rows = rows.filter(function(r){ return String(r.team||'')===S.filters.team; });
  /* "Status" is spelled two ways in this system and the dropdown only knew one of them.
     Expected reads `todays_status` (PAID / UNPAID / UNDERPAID); the defaulter tabs read
     `status` (DEFAULTER / EXPIRED / CHRONIC). Filtering only on the first meant that picking
     a status on Expected Defaulters compared 'CHRONIC' against an absent column, matched
     nothing, and emptied the table -- which reads as "there are none" rather than as a
     dropdown that does not work. */
  if (S.filters.status) rows = rows.filter(function(r){
    var v = r.todays_status == null || r.todays_status === '' ? r.status : r.todays_status;
    return String(v||'').trim().toUpperCase() === S.filters.status
        || (!v && S.filters.status === '(BLANK)'); });

/* SORTING BY THE ORDER THE WORK HAPPENS IN, NOT BY THE ALPHABET.

   A follow-up status sorted A-Z puts AMETOA AHADI above ANALIPA LEO above HAPATIKANI, which is
   no order anybody works in. A recovery officer wants the people who said they would pay today
   at the top, then the promises, then the ones who cannot be reached at all.

   So a column may carry its own order of VALUES, and the user may drag that order about. It is
   remembered on the device, because it is a personal working preference and not company data.
   Columns with no custom order sort normally. */
function customOrder(key){
  try { var raw = load('hopeOrder_' + key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function cmpOn(c, a, b, asc){
  var av = c.get?c.get(a):a[c.key], bv = c.get?c.get(b):b[c.key];
  var ord = customOrder(c.key);
  if (ord && ord.length){
    // Anything not in the saved order sorts after everything that is, rather than jumping to
    // the top -- a status nobody has ranked is not the most urgent thing on the screen.
    var ai = ord.indexOf(String(av==null?'':av)), bi = ord.indexOf(String(bv==null?'':bv));
    if (ai < 0) ai = ord.length; if (bi < 0) bi = ord.length;
    if (ai !== bi) return asc ? ai-bi : bi-ai;
    return 0;
  }
  if (isNum(c)){ av=Number(av)||0; bv=Number(bv)||0; return asc ? av-bv : bv-av; }
  av=String(av==null?'':av).toUpperCase(); bv=String(bv==null?'':bv).toUpperCase();
  return asc ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
}
function sorted(rows){
  var c1 = S.sort ? S.cols.filter(function(x){ return x.key===S.sort; })[0] : null;
  var c2 = S.sort2 ? S.cols.filter(function(x){ return x.key===S.sort2; })[0] : null;
  if (!c1 && !c2) return rows;
  var out = rows.slice();
  // Two levels: sort by follow-up status, THEN by arrears descending inside each status. One
  // level answers "who is worst"; two answers "who is worst among the ones I can act on".
  out.sort(function(a,b){
    if (c1){ var r = cmpOn(c1, a, b, S.asc); if (r) return r; }
    if (c2) return cmpOn(c2, a, b, S.asc2);
    return 0;
  });
  return out;
}

/* THE APK CANNOT BE HANDED A blob: URL, AND BEING HANDED ONE KILLS IT.
 *
 * "Downloading JPG from the call app just closes the app." Exactly that: a download inside the
 * WebView goes to Android's DownloadManager, DownloadManager does not understand blob: or data:
 * and throws, the fallback tries to open the same URL with an ordinary app, nothing on the phone
 * can, and the process goes down. No file, no message, no app.
 *
 * So inside the APK the bytes are handed to the app itself. saveBase64 arrived in a later build,
 * and officers update on their own schedule -- so a handset that does not have it yet is told
 * plainly to use the browser instead of being walked into the crash. On a real browser nothing
 * about this changes.
 */
function androidBridge_(){ return (window.HopeCalls && window.HopeCalls.getDeviceId) ? window.HopeCalls : null; }
function download(blob, name){
  var nb = androidBridge_();
  if (nb) {
    if (!nb.saveBase64) {
      toast('Kupakua hakufanyi kazi ndani ya app bado — fungua mfumo kwenye Chrome kupakua. / '
        + 'Downloads need the newer app; open the system in Chrome to save this file.', true);
      return;
    }
    var fr = new FileReader();
    fr.onload = function(){
      // dataURL is "data:<mime>;base64,<payload>" -- the app wants the payload and the type.
      var s = String(fr.result), i = s.indexOf(',');
      try {
        var msg = nb.saveBase64(name, blob.type || 'application/octet-stream', s.slice(i + 1));
        toast(msg && String(msg).indexOf('OK') === 0 ? 'Imehifadhiwa Downloads. / Saved to Downloads.'
          : ('Imeshindikana kuhifadhi. / Could not save. ' + (msg || '')), !(msg && String(msg).indexOf('OK') === 0));
      } catch (e) { toast('Imeshindikana kuhifadhi / could not save: ' + (e.message || e), true); }
    };
    fr.onerror = function(){ toast('Imeshindikana kusoma faili / could not read the file.', true); };
    fr.readAsDataURL(blob);
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 1500);
}

/* JPG: draws the element to a canvas by rasterising a cloned copy through an SVG
   foreignObject -- no html2canvas, no CDN, so it works offline in the app. Falls back to a
   clear message rather than a silent nothing if the browser refuses to taint-free render. */
/* WHY THE PICTURE WAS ONLY EVER THE PART YOU COULD SEE.

     "downloading jpg reports in app is cutting the current screen size that has not been
      scrolled instead of the whole current report"

   The size was measured off the LIVE element, and the live element is clipped by design:
   `.card` is `overflow:hidden` and the table inside it sits in a `.scroll` wrapper that is
   `overflow-x:auto`. So scrollWidth and scrollHeight reported the size of the WINDOW onto the
   report, not the report -- and the width was then capped at 1600 on top of that, cutting a
   wide table a second time.

   Worse, the whole stylesheet is copied into the picture, so those same clipping rules applied
   again INSIDE the drawing. Even measured correctly, the content would still have been cut.

   Both halves are fixed the same way: the CLONE is unclipped -- every overflow, max-height and
   max-width neutralised -- then measured for real by attaching it off-screen, and an override
   style is appended AFTER the copied CSS so the unclipping also wins inside the foreignObject.

   Client-side only. Nothing here asks the database anything. */
/* AUTO COLUMN WIDTH, AND A PICTURE YOU CAN READ WITHOUT PINCHING.

     "The downloaded pictures in app are too wide not autocolumn width and unreadable without
      too much zoom"

   Two faults, and the first causes the second. `table{width:100%}` is right on a screen -- the
   board should fill its card -- and wrong in a picture, because the picture's width is measured
   from the UNCLIPPED content. A wide board therefore stretched to the widest thing on the page
   and every column was padded out with empty space, so a report that needs 900 pixels of actual
   text was drawn four thousand wide. Opened on a phone, that is a postage stamp.

   `width:auto` with `table-layout:auto` is the browser's own column sizing: each column ends up
   as wide as its widest cell and not one pixel more, which is exactly "auto column width". The
   image gets narrower, and narrower is what makes it legible at the same zoom.

   Then it is drawn at TWICE the size. Same layout, twice the pixels, so the text stays sharp
   when it is enlarged instead of turning to mush -- which is the other half of "unreadable
   without too much zoom". */
/* ONE TO ONE. THE PICTURE IS THE SIZE OF THE REPORT.

   I made this 2 for sharpness -- same layout, twice the pixels, crisp when you zoom in. The
   reasoning was fine and the result was not:

     "the current are even cutting info"

   A viewer opens an image at its actual pixel size. At 2x a report 1,270 points wide becomes a
   file 2,540 pixels wide, so a 1,170-pixel screen shows less than half of it and cuts the right
   hand columns and the bottom rows -- which looks exactly like data missing, and is
   indistinguishable from it unless you know to scroll a picture.

   The owner said what it should be and was right: the picture is the report AS VIEWED. At 1:1 it
   opens whole, it is the same size and the same sharpness as the screen it came from, and there
   is nothing to scroll or pinch to be sure you have all of it. Sharpness when enlarged is worth
   something; a report you cannot see the edge of is worth nothing. */
/** THE SCREEN'S OWN PIXEL RATIO, which is what "as viewed" actually means.

    Two goes at this were both wrong for the same reason: I picked a NUMBER. Two was too much --
    a 1,270-point report became a 2,540-pixel file and a viewer opening it at actual size showed
    half of it. One was too little, and here is why, which I had not accounted for at all:

      a CSS pixel is not a screen pixel.

    Every phone and most laptops draw at a device pixel ratio of 2 or 3 -- the browser renders
    that 1,270-point report into 2,540 or 3,810 REAL pixels, and that is the crispness you are
    reading on the screen. An image exported at 1:1 in CSS pixels therefore carries HALF or a
    THIRD of the detail your screen is showing you, and looks softer and smaller than the page it
    came from. "Real size, readable" is not 1 and it is not 2: it is whatever this screen uses.

    So it is asked rather than assumed. On an ordinary desktop that is 1 and nothing changes; on
    a phone it is 2 or 3 and the picture matches the handset it was made on. Capped at 3 and
    bounded by the canvas ceiling below, because the point is fidelity, not file size. */
/* BACK TO 1:1, ASKED FOR PLAINLY: "return the wide ones full data".

   Scaling by the device ratio is defensible in theory and it costs the thing that matters: on a
   handset at 2x or 3x the file is two or three times the report, and a viewer opening it at
   actual size shows a corner of it. 1:1 is the only setting where every report, at every width,
   opens whole -- and whole is worth more than sharp. */
var JPG_SCALE = 1;
var JPG_UNCLIP = '.jpgshot,.jpgshot *{overflow:visible !important;max-height:none !important;'
  + 'max-width:none !important;}'
  + '.jpgshot .body,.jpgshot .scroll,.jpgshot .card{overflow:visible !important;height:auto !important;}'
  /* The tables size themselves to their content rather than to the page. */
  + '.jpgshot table{width:auto !important;table-layout:auto !important;}'
  /* MEASURED, NOT ASSUMED -- and the first attempt at this made it worse. `fit-content` on the
     KPI row collapsed a six-tile grid into ONE 155px column stacked down the side of a 999px
     table, because `repeat(auto-fit, minmax(155px, 1fr))` has no width to fit against once the
     container shrink-wraps. The tiles flow as a wrapping row instead. */
  /* EVERY auto-fit GRID IN THE SYSTEM, not just the one that was reported.
     `repeat(auto-fit, minmax(N, 1fr))` has no width to fit against once the container
     shrink-wraps, so it resolves to a SINGLE column and the tiles stack in a narrow ribbon down
     the side of the report. Four of these exist -- the KPI row, the weekday trend grids on the
     dashboard and the weekly report, the presentation's own KPI row, and the commission rate
     form -- and only the first was covered. Measured: the weekday grid came out 148px holding
     six cells stacked; as a wrapping row it is 788px with all six side by side.
     `flex-direction:row` is stated because .cmsrates is a column flex before it is a grid, and
     inheriting that turned the override into the same stack it was meant to undo. */
  + '.jpgshot .kpis,.jpgshot .tgrid,.jpgshot .pkpis,.jpgshot .cmsrates{'
  + 'display:flex !important;flex-direction:row !important;flex-wrap:wrap !important;gap:8px !important;}'
  + '.jpgshot .kpi{width:auto !important;min-width:140px !important;flex:0 0 auto !important;}'
  + '.jpgshot .tcell,.jpgshot .pkpi{width:auto !important;min-width:120px !important;flex:0 0 auto !important;}'
  + '.jpgshot .cmsrates>*{width:auto !important;min-width:200px !important;flex:0 0 auto !important;}'
  /* Two boards side by side is a screen idea. A picture is read top to bottom. */
  + '.jpgshot .pair{display:block !important;}'
  /* THE WIDTH THAT IS NOT TEXT. A ten-column board is wide because it has ten columns -- that
     part is the report -- but 12px of padding either side of every cell is 240px of nothing,
     and a header is very often the widest cell in its column purely because it will not wrap.
     Both of those are pixels spent on no information, and on a phone every one of them is
     taken out of the size of the writing. */
  + '.jpgshot td,.jpgshot th{padding:5px 8px !important;white-space:nowrap !important;}'
  + '.jpgshot th{white-space:normal !important;}'
  /* One three-hundred-character comment must not set the width of the whole image. */
  + '.jpgshot td.wrap,.jpgshot .cmt,.jpgshot .note{white-space:normal !important;max-width:420px !important;}'

  /* =====================================================================================
     AND HERE IS WHAT WAS ACTUALLY MAKING THEM WIDE. It was not the tables.

     A picture is measured from the UNCLIPPED clone, and the widest thing in it wins. The card
     HEADER is a one-line strip -- a title, then a sub-line pushed to the far end by
     `margin-left:auto` -- and laid out with no width to fit into it takes its max-content
     width, which is the whole sentence on a single line. On a real board that is three and a
     half THOUSAND pixels. The card became that wide, and `table{width:100%}` obediently
     stretched the table to match, which is why a column holding "HAMZA SAID" was measured at
     596 pixels and the report read as a row of numbers scattered across an empty field.

     Measured on their own board: 3,683px before, 620px after. The columns go from 596px to
     92px. Nothing was removed from the report -- the same header, the same eight columns, the
     same rows. It is only that the header wraps like a paragraph instead of setting the width
     of everything beneath it.

       header    a block that wraps, with the sub-line under the title rather than pushed to
                 the far edge of a line that then has to be that long
       tables    max-content: as wide as the widest cell in each column and no wider, which is
                 what "auto column width" means
       ceiling   1100px on the things that are prose, so a long note cannot do it again */
  + '.jpgshot .card-h{display:block !important;white-space:normal !important;}'
  + '.jpgshot .card-h .sub{display:block !important;margin-left:0 !important;}'
  + '.jpgshot table{width:-moz-max-content !important;width:max-content !important;}'
  // The per-table search box types into the LIVE screen -- a static image of it is an empty
  // input nobody can use, not data. Same reasoning as leaving it out of CSV/Excel's own columns.
  + '.jpgshot .tblsearch{display:none !important;}'

  /* EVERY REPORT IS ITS OWN WIDTH, AND CAPPING THEM ALL AT ONE NUMBER CUTS THE WIDE ONES OFF.

       "Every JPG have their own size, keeping them at one may result like this"

     Exactly right, and it was mine: a flat 1,100px ceiling on the CARD, with the table held to
     100% of it, drew a board whose eighth column was simply not in the picture. REQUESTED ended
     mid-number. A report that is cut off is worse than one that is wide -- wide can be zoomed,
     missing cannot be recovered.

     So nothing that carries FIGURES is capped. The cap belongs only on the things made of
     SENTENCES, because a sentence has no natural width -- it is one line as long as you let it
     be, and that is what was setting a three-and-a-half-thousand pixel picture in the first
     place. A heading wraps at a readable measure; the board beneath it is then exactly as wide
     as its own columns need, whatever number that turns out to be, and every report gets its
     own size. */
  /* NO CAP AT ALL NOW. The heading only needed one while the picture was measured with
     `width:auto`, where a sentence has no natural width and stretched to one enormous line.
     Laid out at the report's real on-screen width it wraps exactly as it does on the page, so
     the cap has nothing left to protect against -- and a cap is the thing that cut a board in
     half two commits ago. */
  + '';

function saveJpg(el){
  if (!el){ toast(t('nothing'), true); return; }
  var probe = null;
  try {
    var clone = el.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('button'), function(b){ b.remove(); });
    clone.classList.add('jpgshot');

    /* MEASURED FROM THE UNCLIPPED CLONE, not from the window onto it. Attached off-screen so
       the browser lays it out for real -- a detached node has no size at all, and guessing
       from the original is exactly what produced a cropped picture. */
    /* LAID OUT AT THE WIDTH IT REALLY HAS ON THE SCREEN.

         "i thout auto takes the font size and clip the report as viewed no matter which one"

       That is the right model and it is not what this was doing. Measuring with `width:auto`
       shrink-wraps the clone, which is a DIFFERENT layout from the one on screen: headings stop
       wrapping and stretch to one enormous line, and everything under them follows. Every fight
       I have had with this -- the 3,683px picture, the stretched columns, the capped card that
       then cut a board in half -- came from measuring a layout nobody was looking at.

       Given the report's real on-screen width, the browser wraps and sizes exactly as the
       screen does, and there is nothing left to correct with CSS. */
    probe = document.createElement('div');
    var onScreen = Math.max(Math.round(el.getBoundingClientRect().width), 320);
    probe.setAttribute('style', 'position:fixed;left:-99999px;top:0;visibility:hidden;'
      + 'width:' + onScreen + 'px;height:auto;overflow:visible;pointer-events:none;z-index:-1');
    probe.className = document.body.className;
    var pstyle = document.createElement('style');
    pstyle.textContent = JPG_UNCLIP;
    probe.appendChild(pstyle);
    probe.appendChild(clone);
    document.body.appendChild(probe);
    /* MEASURED FROM WHAT IS ACTUALLY PAINTED, because scrollWidth lies here.

       scrollWidth reports the scrollable extent of a box. Unclipping sets every container to
       `overflow:visible`, and a box that does not scroll has no scrollable extent -- so a table
       hanging out past the edge of its card contributes NOTHING to the number, and the picture
       was cut at the card's edge with the last columns simply outside it. Same for the height
       and the last rows. That is "the current are even cutting info", and it is why every CSS
       change I made moved the crop around without ever curing it.

       The one measurement that cannot lie is where the ink lands: the furthest right and
       furthest bottom edge of every element in the clone. It costs one walk of a report-sized
       subtree, on a click, in a page that is doing nothing else. */
    var origin = clone.getBoundingClientRect();
    var maxR = origin.right, maxB = origin.bottom;
    var kids = clone.querySelectorAll('*');
    for (var ki = 0; ki < kids.length; ki++) {
      var kr = kids[ki].getBoundingClientRect();
      if (!kr.width && !kr.height) continue;          // nothing painted, nothing to include
      if (kr.right > maxR) maxR = kr.right;
      if (kr.bottom > maxB) maxB = kr.bottom;
    }
    /* Four pixels of slack because a sub-pixel rounding here is a column shaved off the edge. */
    var w = Math.max(Math.ceil(maxR - origin.left), clone.offsetWidth, onScreen, 320) + 4;
    var h = Math.max(Math.ceil(maxB - origin.top), clone.offsetHeight, 120) + 4;
    document.body.removeChild(probe); probe = null;
    // A canvas beyond a few thousand pixels a side starts failing on phones; no real report
    // reaches this, and clipping loudly at 8000 beats a blank file.
    w = Math.min(w, 8000); h = Math.min(h, 20000);

    var css = '';
    Array.prototype.forEach.call(document.styleSheets, function(sh){
      try { Array.prototype.forEach.call(sh.cssRules, function(r){ css += r.cssText; }); } catch(e){}
    });
    var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="'+document.body.className+'">'
      // The override goes AFTER the copied stylesheet, so it wins inside the drawing too.
      + '<style>'+css+'</style><style>'+JPG_UNCLIP+'</style>'
      /* box-sizing:content-box ON PURPOSE. The copied stylesheet sets `*{box-sizing:border-box}`,
         so `width:w` here gave the content w MINUS the 20px of padding -- twenty pixels of the
         report pushed outside the picture on every single export, which is "the current are
         even cutting info" in one line of CSS. */
      + '<div style="background:var(--bg);padding:10px;box-sizing:content-box;width:'+w+'px">'
      + clone.outerHTML + '</div></div>';
    /* SCALED BY THE viewBox, WHICH IS WHAT SVG IS FOR -- not by `zoom`.

       `zoom` scales the LAYOUT: the box becomes (w+20) x sc and the picture is exactly that
       size, so a single sub-pixel rounding puts the right-hand edge outside the canvas. A
       viewBox leaves the layout alone at its natural size and scales the DRAWING of it, which
       cannot round content out of frame and re-rasterises crisply because it is still vector at
       that point. Same sharpness when enlarged, none of the risk. */
    var W = w + 20, H = h + 20;
    var sc = (W * JPG_SCALE <= 8000 && H * JPG_SCALE <= 20000) ? JPG_SCALE : 1;
    var sw = Math.ceil(W * sc), sh = Math.ceil(H * sc);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+sw+'" height="'+sh+'"'
      + ' viewBox="0 0 '+W+' '+H+'">'
      + '<foreignObject width="'+W+'" height="'+H+'">'
      + html + '</foreignObject></svg>';
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      cv.width = sw; cv.height = sh;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = document.body.classList.contains('dark') ? '#0B1120' : '#F6F8FC';
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      cv.toBlob(function(b){
        if (!b){ toast(t('jpgfail'), true); return; }
        download(b, S.view+'-'+today()+'.jpg');
      }, 'image/jpeg', 0.94);
    };
    img.onerror = function(){ toast(t('jpgfail'), true); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch(e){
    // The probe must never be left behind in the page if anything above threw.
    if (probe && probe.parentNode) probe.parentNode.removeChild(probe);
    toast(t('jpgfail'), true);
  }
}

var STR = {
