   on". HOPE Loan's items are appended after HOPE PMO's own, gated exactly like every other
   tab: a code with no HOPE Loan tab draws nothing extra and never learns the section exists.
   `hopeLoanAvailable` (from /api/me) covers the other half -- a code that DOES hold a HOPE
   Loan tab still sees nothing here on a deployment where HOPE Loan itself was never configured,
   so nobody is ever shown a door that leads nowhere. */
function buildNav(){
  var el = $('#nav'); el.innerHTML='';
  function drawItem(n){
    var b = document.createElement('button');
    // The icon is how people find a tab in a list of 23 -- they recognise the shape before
    // they read the word, which is the whole reason v1 had them.
    b.innerHTML = (n.ic
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
        + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n.ic + '</svg>'
      : '') + '<span>' + esc(n.label) + '</span>';
    b.setAttribute('data-v', n.id);
    b.onclick = function(){ go(n.id); };
    el.appendChild(b);
  }
  /* THREE DIVISIONS, ONE SCROLL. HOPE Loan first ("hopeloanones should start before the pmo
     ones" -- origination is the front door for anyone holding one of its tabs), then HOPE PMO
     in its working-day order, then HOPE Management in MGMT_ORDER. Each heading is drawn only
     when its division has at least one tab this code holds, and headings appear at all only
     when more than one division is drawn -- a code holding tabs of one division alone still
     gets the plain, unlabelled list it always had. */
  var sections = [];
  if (S.me.hopeLoanAvailable) {
    var loanItems = NAV_LOAN.filter(function(n){ return allowed(n.id) && !n.hidden; });
    if (loanItems.length) sections.push({ label: 'HOPE Loan', items: loanItems });
  }
  var pmoItems = NAV.filter(function(n){ return n.div !== 'mgmt' && allowed(n.id) && !n.hidden; });
  if (pmoItems.length) sections.push({ label: 'HOPE PMO', items: pmoItems });
  var mgmtItems = MGMT_ORDER.map(function(id){ return NAV.filter(function(n){ return n.id===id; })[0]; })
    .concat(NAV.filter(function(n){ return n.div === 'mgmt' && MGMT_ORDER.indexOf(n.id) < 0; }))   // flagged but not placed: last
    .filter(function(n){ return n && n.div === 'mgmt' && allowed(n.id) && !n.hidden; });
  if (mgmtItems.length) sections.push({ label: 'HOPE Management', items: mgmtItems });
  sections.forEach(function(s){
    if (sections.length > 1) {
      var head = document.createElement('div');
      head.className = 'navhead';
      head.textContent = s.label;
      el.appendChild(head);
    }
    s.items.forEach(drawItem);
  });
}
/* =====================================================================================
   SCREENS THAT LOAD WHEN THEIR TAB OPENS.
     "We can't load everything from there, these imprests, advances demands etc that don't
      pivot results can be loaded when retrieved or at tab open" / "Do everything to recover
      smoothness"
   This page had grown to 977 KB that every opening parsed whole -- imprest, the advance
   system, legal demands, deductions, the device register, Teams & Staff and Settings, the
   bonus-plan preview, the presentation deck and all of HOPE Loan -- for a person who opens
   one screen. Each of those now lives in public/mod/<name>.js, a plain script fetched the
   first time one of its tabs opens and kept for the session; the core page is what everyone
   pays for at opening, a little over half the size. No build step: a module is the same code
   it was here, with the same globals, in a file of its own (a "MODULE:" marker comment below
   says where each went). The URL carries BUILD, so a new version is fetched exactly when the
   page itself is. The core calls into module code only from screens that have already
   opened; the three places that could run earlier are guarded (window.wireDevices, bpWire_,
   presStop). */
var MOD_OF = { deduct:'deduct', advreq:'advance', advappr:'advance', advrep:'advance', advstaff:'advance',
  legal:'legal', adjust:'adjust', impreq:'imprest', impappr:'imprest', imprep:'imprest',
  devlock:'devices', devunlock:'devices', teams:'admin', settings:'admin', bonusplan:'bonusplan', present:'present',
  /* THE REPORTS AND ANALYSIS SCREENS -- read, not worked: the month report and team trend,
     PAR, the audit report, Reports, commission and its month, calls, the credit boards, Best
     of, the audit log, officer locations. One module, since a person reading one tends to
     read the next. The working screens -- dashboard, applications, expected, follow-up,
     promises, the weekly book, complaints, restructuring -- stay in the page. */
  teamtrend:'reports', monthreport:'reports', par:'reports', auditrep:'reports', reports:'reports',
  commission:'reports', cmmonth:'reports', calls:'reports', credit:'reports', creditinfo:'reports',
  perf:'reports', audit:'reports', officerloc:'reports' };
var MOD_READY_ = {}, MOD_LOADING_ = {};
function modOf_(view){ return MOD_OF[view] || (isLoanId_(view) ? 'loan' : null); }
function modLoad_(name){
  if (MOD_READY_[name]) return Promise.resolve();
  if (MOD_LOADING_[name]) return MOD_LOADING_[name];
  MOD_LOADING_[name] = new Promise(function(res, rej){
    var s = document.createElement('script');
    s.src = '/mod/' + name + '.js?v=' + encodeURIComponent(BUILD);
    s.onload = function(){ MOD_READY_[name] = true; delete MOD_LOADING_[name]; res(); };
    s.onerror = function(){
      delete MOD_LOADING_[name];
      if (s.parentNode) s.parentNode.removeChild(s);
      rej(new Error('Skrini hii haikupakia (' + name + '). Angalia mtandao kisha jaribu tena. / This screen did not load (' + name + '). Check the connection and try again.'));
    };
    document.head.appendChild(s);
  });
  return MOD_LOADING_[name];
}
/* WHERE TO LAND NEXT TIME: the tab you were on, so opening the portal costs that one screen
   and not the dashboard every morning.

   NEVER A DOOR. The upload tab is not a screen: go() sends the browser to /upload. Remembering
   it sent every opening of the portal straight back out -- "dashboard hits back to upload page
   and i cant access portal on pc" -- with no way back in from the keyboard, since the only
   way to land somewhere else was to open the portal. The deck runs timers and is never
   resumed; 'noaccess' is nowhere to return to. One list, used both where the tab is stored
   and where it is read, so a browser that remembered 'upload' before this list existed is
   let back in too. */
var NO_LANDING_ = { upload: 1, present: 1, noaccess: 1 };
function lastView_(){
  var v = load('hopeLastView');
  return v && !NO_LANDING_[v] && allowed(v) ? v : null;
}
function go(view, args){
  // A new version noted by buildWatch_ is applied here, where the screen changes anyway: the reload lands on the tab asked for.
  if (S.buildBehind && view !== 'upload' && buildApply_({ view: view, args: args || {} })) return;
  S.view = view; S.q=''; S.sort=null; S.sort2=null; S.asc=true; S.asc2=false;
  /* args is only ever passed by a [data-go] button that CARRIES something across the switch
     (the month-report chip carries the chosen week); everything else still starts clean. */
  S.args = args || {}; S.filters={}; S.foot=''; S.foldMain=''; S.foldLabel=''; S.foldDot=''; S.fit=false;
  /* WHICH BOOK THIS REQUEST READS, DECIDED FROM THE TAB ITSELF -- no toggle to flip first, no
     mode left over from whatever was open before. Every request from here rides S.workspace to
     the server (see srv() below), which resolves it for real against this code's own tabs --
     this is only what picks the RIGHT one, never what grants it. */
  S.workspace = isLoanId_(view) ? 'hopeloan' : 'hopepmo';
  /* THE TABLE BELONGS TO THE TAB, AND IT WAS BEING INHERITED.
     Reported from the field: "downloading most reports excel brings team performance report
     instead of the desired one; found this at expected and so on."

     S.rows / S.cols / HEAD are what paint() draws and what Excel, CSV and JPG all export, and
     they were the only parts of the view state this did not clear. A tab that draws no table
     of its own -- there are several, they set KPIs and boards and expect paintHeadOnly() --
     therefore kept whatever the LAST tab had left in them. The dashboard is where everybody
     lands, and it leaves S.rows holding Team Performance, so that is the report that followed
     people around.

     Worse, the view cache then stored that borrowed table AS the new tab's snapshot, so it
     came back on every later visit to it within the cache window.

     Cleared here, a tab with no table of its own now exports nothing and says so, which is the
     honest answer. A tab with a table sets these before it paints, exactly as it always did. */
  S.rows = []; S.cols = []; HEAD = ''; ONROW = null;
  // Ticks belong to the tab that drew them -- see the note above tableHtml.
  S.pickKey = null; S.pick = {};
  navClose_();                                       // picking a tab closes the phone drawer
  var t = (isLoanId_(view) ? NAV_LOAN : NAV).filter(function(n){ return n.id===view; })[0];
  // 'noaccess' has no nav entry by design -- it is where somebody lands when their role holds
  // nothing -- so it would otherwise show its own id as the page title.
  $('#title').textContent = t ? t.label
    : (view === 'noaccess' ? 'Ruhusa hazijawekwa / Access not set yet' : view);
  if (t && !NO_LANDING_[view]) store('hopeLastView', view);   // where the next opening lands -- lastView_
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v')===view);
  });
  if (view==='upload'){ location.href='/upload'; return; }
  render();
}
/* THE RELOAD BUTTON, DOING BOTH JOBS SINCE THE BUILD STAMP WAS TAKEN OFF THE BAR.
     tap        -- reload the DATA, always from the server. What it has always done.
     long press -- reload the PAGE itself past any cache, which is what the build stamp's tap
                   used to do. Kept because "is the fix on my screen yet" is a real question
                   that has cost three round trips to answer, and telling somebody to clear a
                   browser cache on a phone is not an answer.
   The version itself now lives in this button's tooltip rather than as text in the bar. */
(function(){
  var b = $('#refBtn');
  if (!b) return;
  b.title = 'Reload · ' + BUILD + ' — bonyeza kwa muda kupata toleo jipya / long-press to force the newest version';
  var timer = null, held = false;
  function hardReload(){ held = true; location.replace(location.pathname + '?v=' + Date.now()); }
  function down(){ held = false; timer = setTimeout(hardReload, 700); }
  function up(){ clearTimeout(timer); }
  b.addEventListener('mousedown', down);
  b.addEventListener('touchstart', down, { passive: true });
  b.addEventListener('mouseup', up);
  b.addEventListener('mouseleave', up);
  b.addEventListener('touchend', up);
  b.onclick = function(){ if (!held) render({ force: true }); };
})();
$('#langBtn').onclick = function(){ applyLang(S.lang === 'sw' ? 'en' : 'sw'); tipShow(); };
$('#themeBtn').onclick = function(){ applyTheme(!document.body.classList.contains('dark')); };
$('#tipBtn').onclick = function(){ tipShow(); };
$('#menuBtn').onclick = function(){ if (document.body.classList.contains('navopen')) navClose_(); else navOpen_(); };
$('#scrim').onclick = function(){ navClose_(); };

/* THE NOTICEBOARD, on the reader's side.

   Dismissed PER ANNOUNCEMENT, not per session: waving away Monday's notice must not also wave
   away Tuesday's, and reading Monday's twice because you opened a second tab is worse than
   useless. The version stamp the server sends is what tells them apart, and it is also what
   keeps the image off the wire -- a phone that has already seen this one asks for nothing. */
function annKey_(ts){ return 'hopeAnnSeen_' + ts; }
function annCheck(){
  return srv2('api_announcement').then(function(a){
    if (!a || !a.on || !a.ts) { $('#annBg').classList.remove('on'); return; }
    if (load(annKey_(a.ts))) return;                 // this one has already been waved away
    $('#annBox').innerHTML =

      + (a.text ? '<div class="t">' + esc(a.text) + '</div>' : '')

/* The announcement is read WITHOUT an access code -- it has to reach the sign-in screen -- so
   it goes to the calls door, not the portal one. */
function srv2(fn, args){
  return fetch('/api/call', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fn:fn, args:args||[] }) })
    .then(readJson_).then(function(x){ return x.body; });
}

function eatDt_(v){

          + '<div>' + esc(i.what) + '</div>'

/* THE PAGE THAT WAS OUT OF DATE AND SAID NOTHING.
     "I logged in using a code of someone i didnt assign any nav and when entered through the
      switch found many of them, even if i refresh they are there"
   The server had stopped granting those tabs; an old copy of THIS FILE, still carrying the
   ALWAYS list, was drawing them anyway. A permission is the worst thing to have arrive late,
   because the screen is the only evidence anybody has that it arrived -- and a stale page
   states the opposite of the truth with complete confidence.
   /api/me now says which version this deployment serves. If we are behind it, reload past the
   cache. ONCE, guarded per tab: a reload that does not fix the stamp must not become a loop,
   which would be a far worse fault than the one it is fixing. Doing nothing when the server
   sends no stamp keeps every older deployment behaving exactly as it does today. */
function freshEnough_(me){
  if (!me || !me.build || me.build === BUILD) return true;
  try {
    if (sessionStorage.getItem('hopeBuildTried') === me.build) return true;   // already tried
    sessionStorage.setItem('hopeBuildTried', me.build);
  } catch (e) { return true; }   // no session storage to guard with -- never risk the loop
  location.replace(location.pathname + '?v=' + encodeURIComponent(me.build));
  return false;
}

/* THE PORTAL ITSELF KEEPS UP, NOT ONLY THE DECK.
     "I expect both the catherine type issue and presentation slides all autofix at interfaces
      with no need to refresh nor logout"
   freshEnough_ ran once, at sign-in. A tab left open since the morning kept the morning's
   code all day. Every fifteen minutes the page asks /api/me which version the server has; when
   it is behind it NOTES it, and the reload past the cache happens at a quiet moment only
   (buildApply_): while the tab is hidden, or at the next tab switch, where the screen changes
   anyway -- never under somebody's eyes, never while typing or with a drawer open. It writes
   down the tab it is on and start() opens the same tab again. Signed in throughout: the code
   is in local storage. A playing deck has its own check (presCheckBuild_) and is left to it.

   IT USED TO BE EVERY FIVE MINUTES AND THE MOMENT THE TAB CAME BACK INTO VIEW, reloading at
   once -- "The system is like autorefreshing the current page so constant that it bores ...
   shifting windows or apps autorefreshes immediately - better sync data but dont do so or do
   so like timely 15mins". On a day of several deploys that was a page reloading under people
   every time they glanced at WhatsApp. The data syncs (the bell, the announcement, a tab's own
   quiet re-read) stay; only the RELOAD waits for a moment nobody is looking. */
var BUILD_WATCH_MS = 15 * 60 * 1000;
var VIEW_RESUME_KEY = 'hopeViewResume';
/** Something on the screen that a reload would lose: a field being typed in, a drawer, a form
    with a value changed from what it was drawn with, or the deck playing. */
function pageBusy_(){
  var a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
  var bg = document.getElementById('drawerBg');
  if (bg && bg.style.display === 'flex') return true;
  var pres = document.getElementById('pres');
  if (pres && pres.style.display === 'block') return true;
  var els = document.querySelectorAll('input, textarea');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked !== el.defaultChecked) return true; continue; }
    if (el.type === 'hidden' || el.type === 'button' || el.type === 'submit') continue;
    if ((el.value || '') !== (el.defaultValue || '')) return true;
  }
  return false;
}
function buildWatch_(){
  if (!S.code || !S.me) return;
  fetch('/api/me?code=' + encodeURIComponent(S.code)).then(readJson_).then(function(x){
    var me = x && x.body;
    if (!me || !me.build || me.build === BUILD) return;
    S.buildBehind = me;                            // noted; applied by buildApply_ at a quiet moment
    buildApply_();
  }).catch(function(){ /* a missed check is tried again on the next tick */ });
}
/** The reload itself, when nobody is looking: the tab is hidden (then it comes back fresh, on the
    same screen), or a tab switch is under way (`to`: the screen asked for is the one resumed).
    Not while typing, not with a drawer open, not with the deck playing -- tried again later. */
function buildApply_(to){
  if (!S.buildBehind || pageBusy_()) return false;
  if (!document.hidden && !to) return false;       // visible and reading: wait for a tab switch
  var n = to || { view: S.view, args: S.args || {} };
  try { sessionStorage.setItem(VIEW_RESUME_KEY, JSON.stringify({ view: n.view, args: n.args || {} })); } catch (e) {}
  var reloading = !freshEnough_(S.buildBehind);
  if (!reloading) S.buildBehind = null;            // already tried this build once: not asked again until the next note
  return reloading;
}
function viewResumeTake_(){
  try {
    var raw = sessionStorage.getItem(VIEW_RESUME_KEY);
    if (!raw) return null;
    sessionStorage.removeItem(VIEW_RESUME_KEY);
    var n = JSON.parse(raw);
    return n && typeof n === 'object' && n.view ? n : null;
  } catch (e) { return null; }
}

function start(me){
  if (!freshEnough_(me)) return;
  S.me = me;
  /* THE FOLLOW-UP STATUS LIST COMES FROM THE DATABASE, not from this file. It is editable in
     Settings, and the office and the field must offer the same words -- two hard-coded copies
     drifting apart would have officers and supervisors logging different vocabularies for the
     same thing, which is invisible until somebody tries to count them.

     Asked for once at sign-in and kept: it changes when an admin edits it, which is roughly
     never. If the call fails the built-in list below stands, so a follow-up can always be
     logged -- a form nobody can submit is worse than one offering a slightly old word. */
  srv('fuStatuses').then(function(f){
    if (f && f.fuStatuses && f.fuStatuses.length) {
      FU_STATUSES = f.fuStatuses;
      FU_NEED_DATE = f.fuNeedDate || [];
      FU_NEED_NUMBER = f.fuNeedNumber || [];
      S.fuMeta = f;
    }
  }).catch(function(){});
  // Before anything is drawn: the first tab load already uses the remembered-screen window.
  applyCadences(me.ui);
  $('#signin').classList.add('hide');
  $('#shell').classList.remove('hide');
  $('#meName').textContent = me.name;
  /* THE VERSION, WHERE IT CAN BE READ RATHER THAN HOVERED. It lived only in the reload
     button's tooltip, and a phone has no tooltips -- so "is the fix on my screen yet", the
     question that has now cost several rounds, could not be answered by the person holding
     the screen. Beside the role, where the eye already goes to check who is signed in. */
  $('#meRole').textContent = me.role + ' · ' + (me.teams ? me.teamCount+' team(s)' : 'All teams')
    + ' · ' + BUILD;
  // me.hopeLoanAvailable rides along on S.me (set above) and is all buildNav() needs to decide
  // whether HOPE Loan's own items belong in this sidebar at all -- see /api/me.js. Nothing
  // client-side decides this on its own.
  buildNav();
  /* WHERE THEY LAND IS THE FIRST TAB THEY ACTUALLY HOLD, not the dashboard. Now that the
     dashboard is granted like everything else, sending everybody there would open a screen
     half of them have not been given -- and the server would refuse it, which reads as a
     broken app rather than as a permission. */
  /* THE EMAIL'S "OPEN IN THE PORTAL" LINK -- ?imp=<id>, from the GM's imprest notice (see
     gmActionLinks_ in api/_lib/imprest.js). Landing on the tab that holds the item is more
     useful than landing on whatever tab happens to be first, so this overrides that choice
     only when the id names something the signed-in code can actually see; imprestOpenDeepLink_
     (below) does the actual opening once that tab's own data has loaded. */
  var impId = (function(){ try { return new URLSearchParams(location.search).get('imp') || ''; } catch (e) { return ''; } })();
  var impTab = impId && (allowed('impappr') ? 'impappr' : allowed('imprep') ? 'imprep' : allowed('impreq') ? 'impreq' : null);
  IMPREST_DEEPLINK_ID = impTab ? impId : null;
  /* A DECK THAT RELOADED ITSELF FOR A NEW VERSION COMES BACK PLAYING -- see presCheckBuild_.
     The note names the slide, the seconds and the week; the present tab loads its figures as
     it always does and Play is pressed for the room the moment the dashboard half is in. */
  var resume = presResumeTake_();
  if (resume && allowed('present')) {
    S.presSecs = Math.max(5, Math.min(300, Number(resume.secs) || 15));
    go('present', resume.weekOf ? { weekOf: resume.weekOf } : {});
    var tries = 0, wait = setInterval(function(){
      if (S.view !== 'present') { clearInterval(wait); return; }
      if (S.presData && S.presData.d && S.slides && S.slides.length) {
        clearInterval(wait);
        presStart(Math.min(Number(resume.i) || 0, S.slides.length - 1));
      } else if (++tries > 120) clearInterval(wait);        // a minute, then the tab stands as it is
    }, 500);
  } else {
    // A tab that reloaded itself for a new version comes back on the tab it was on -- see buildWatch_.
    var vres = viewResumeTake_();
    if (!impTab && vres && allowed(vres.view)) go(vres.view, vres.args || {});
    else go(impTab || lastView_() || firstAllowed_() || 'noaccess');
  }
  setInterval(buildWatch_, BUILD_WATCH_MS);
  // A noted new version is applied the moment the tab goes out of view -- it comes back fresh.
  document.addEventListener('visibilitychange', function(){ if (document.hidden) buildApply_(); });
  /* THE FIRST SCREEN'S OWN READS GO FIRST. The tips, the announcement and the bell are three
     more requests nobody is waiting for at the moment of opening; they follow a breath later,
     after the tab somebody actually opened has had the connection to itself. */
  setTimeout(function(){ tipsStart(); annCheck(); bellRefresh(); }, 2500);
  $('#bellBtn').onclick = bellOpen;
  /* THE MAGNIFIER IS TAFUTA MTEJA. It used to open a lighter search drawer while the full
     find-a-customer screen -- the one that says in words whether today's screens can see the
     person -- hid behind a sidenav entry. One search, one door: the icon opens the full
     screen, and the duplicate sidenav entry is gone. */
  $('#findBtn').onclick = function(){ go('findcust'); };
  // Checked again when somebody comes back to the tab, so a notice posted mid-morning reaches
  // a screen that has been sitting open since eight.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ annCheck(); bellRefresh(); }          // syncs, not a reload: buildWatch_ keeps to its clock
  });
}

/* ----------------------------------------------------------- table engine
   Every list tab is the same thing: rows + a column spec. One renderer means a new tab is a
   few lines of config instead of a new screen, and search/sort/CSV work everywhere for free. */
function col(key, label, kind){ return { key:key, label:label, kind:kind||'text' }; }
/* MODULE: admin -- this screen lives in public/mod/admin.js and loads when its tab opens (modLoad_). */

/* WHAT THE PHONE WILL ACTUALLY SAY, as you type it.
   ---------------------------------------------------------------------------------------
   This screen is not one somebody can pop open and check: by the time it is on the glass the
   handset is locked, usually in a pocket in another region. The one mistake it invites is a
   sentence that promises a number and then does not give one -- "Piga namba ." -- which is
   why the server keeps TWO built-in sentences and picks by whether a number is set. Typing
   your own {namba} with the number field blank walks straight back into it, and nothing
   downstream would ever tell you.

   MIRRORS fill() IN api/_lib/device-core.js, which stays the authority -- the handset is sent
   what the SERVER composes, never this. It is duplicated only because a preview must render
   text that has not been saved yet. Keep the two substitutions identical; if fill() gains a
   placeholder, it belongs here too. */
function lockFill_(text, brand, phone){
  return String(text == null ? '' : text)
    .replace(/\{\s*(brand|kampuni)\s*\}/gi, brand)
    .replace(/\{\s*(namba|phone|simu)\s*\}/gi, phone)
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}
function wireLockPreview_(){
  var out = document.getElementById('cfgPreview_lockscreen');
  if (!out) return;
  var b = document.getElementById('cfg_DEVICE_LOCK_BRAND'),
      m = document.getElementById('cfg_DEVICE_LOCK_MESSAGE'),
      p = document.getElementById('cfg_DEVICE_HELP_PHONE');
  if (!b || !m || !p) return;
  var upd = function(){
    var brand = (b.value || '').trim() || 'HOPE MICROCREDIT';
    var phone = (p.value || '').trim();
    // The same two defaults device-core.js falls back on, and the same reason for there
    // being two: no number, no promise of one.
    var raw = (m.value || '').trim()
      || (phone ? 'Simu hii ni mali ya {brand}. Irudishe ofisini au piga {namba}.'
                : 'Simu hii ni mali ya {brand}. Irudishe ofisini.');
    var said = lockFill_(raw, brand, phone);
    /* The warning is the whole point of the preview: a placeholder with nothing to fill it
       leaves a sentence pointing at a number that is not there. */
    var dangling = !phone && /\{\s*(namba|phone|simu)\s*\}/i.test(raw);
    out.innerHTML = '<div style="background:#0B2A6B;color:#fff;border-radius:10px;padding:12px;'
      + 'text-align:center;line-height:1.5"><b style="letter-spacing:.5px">' + esc(brand) + '</b><br>'
      + esc(said) + '</div>'
      + (dangling
          ? '<div class="note bad" style="margin-top:6px">Ujumbe unataja {namba} lakini hakuna namba. '
            + 'Simu itaonyesha nafasi tupu. / The message names {namba} but no number is set — the '
            + 'phone will show a gap where it should be.</div>'
          : '');
  };
  b.oninput = upd; m.oninput = upd; p.oninput = upd; upd();
}
function cellText(r, c){
  var v = r[c.key];
  if (c.get) v = c.get(r);
  if (v==null || v==='') return '';
  if (c.kind==='money') return money(v);
  if (c.kind==='pct') return pct(v);
  if (c.kind==='dur') return fmtDur(v);
  if (c.kind==='date') return String(v).slice(0,10);
  if (c.kind==='dt'){
    /* Stored UTC, read in East Africa: the raw ISO string showed every comment three hours
       early ("The time of comments in app is not reading EAT, +3hrs please"). Timestamps
       arrive from PostgREST with an offset, so parse and shift; anything unparseable is
       shown as written rather than blanked.

       A NUMBER IS ALREADY A MOMENT, NOT A STRING TO PARSE -- "time stamp is reading as
       1789799553103". Imprest's own rows (impRow, api/_lib/imprest.js) hand every timestamp
       across the wire as epoch-ms, already Date.parse()'d server-side so the client can do
       plain numeric comparisons (retiredAt, the retirement claim lock) without re-parsing a
       string on every read. Date.parse(<a number>) stringifies it first and fails to parse a
       13-digit epoch as a date, so this fell through to printing the raw milliseconds. A
       number here IS the timestamp; only a string still needs parsing. */
    var t = typeof v === 'number' ? v : Date.parse(v);
    if (isFinite(t)) return new Date(t + 3*3600*1000).toISOString().replace('T',' ').slice(0,16);
    return String(v).replace('T',' ').slice(0,16);
  }
  return String(v);
}
/* The dialling form of a number, whatever shape it was stored in. Byte-for-byte the call app's
   telHref: strip everything but digits, drop a leading 255 or any leading zeros, put +255 back
   on the front. A number already carrying 255 is left with a single +. */
function telHref_(v){
  var d = String(v==null?'':v).replace(/\D/g,'');
  if (!d) return '';
  return d.indexOf('255')===0 ? '+'+d : '+255'+d.replace(/^0+/,'');
}
function cellHtml(r, c){
  var txt = cellText(r, c);
  if (c.kind==='chip') return txt ? '<span class="chip '+(c.chip? c.chip(r):'mut')+'">'+esc(txt)+'</span>' : '';
  // Phone numbers are dialable everywhere in v1 -- keep that, it is how officers actually work.
  /* WHAT IS SHOWN AND WHAT IS DIALLED ARE NOT THE SAME STRING. Phones are stored the way
     normPhone leaves them -- nine digits, no leading zero, no 255 -- so putting the stored text
     straight after `tel:` handed the dialler a number no Tanzanian network completes. The text
     on screen stays as it is; the href gets the full +255 form, the same rule the call app's
     telHref has always used. */
  if (c.kind==='tel') return txt ? '<a class="tel" href="tel:'+esc(telHref_(txt))+'" onclick="event.stopPropagation()">'+esc(txt)+'</a>' : '';
  return esc(txt);
}
function isNum(c){ return c.kind==='money'||c.kind==='num'||c.kind==='pct'||c.kind==='dur'; }

/* =====================================================================================
   THE COLOUR RULE -- one rule, every table, the deck included.

     "at setting sales target I need to set early col, col and rec % targets so that those
      who hit targets the % turns green, those below average are red the rest stay black
      and team names column or officers names column below gen average should be on red"
     "current settings to apply everywhere so even reports in every pane presentations
      inclusive I'll find the red values"

   A percentage cell:  at or above its TARGET -> green;  under the JUMLA row's own figure for
   that column -> red;  otherwise black.  The targets are the three set beside the sales
   target in Settings (sales itself is measured against its target already, so 100% IS the
   target there); a column with no target only ever goes red.  Which target a column answers
   to is read off its key -- tEColPct, collPctEarly, mColPct, recPct, salesPct name
   themselves -- or is named outright (`target`) where the key is a bare `pct`.

   A NAME cell (team, officer, analyst, the four officers on the Orodha) goes red when the
   row's GENERAL AVERAGE is red -- the first average-like percentage on the table (T.Avg
   first, then M.Avg, the strip's avg, Perf, a lone %), or the one the column names
   (`avgKey`).  So the eye lands on WHO is under the line, not only on which figure.

   OPT-OUT, never opt-in: `lowGood` marks the few columns where a low percentage is the good
   news (a defaulter's share of the book, PAR), and those are left alone -- red there would
   say the opposite of the truth.

   The floor is whatever the total row shows, so screen and rule cannot disagree; a column
   with no total row has no floor and nothing goes red under it. */
var NAME_KEYS = { team:1, officer:1, analyst:1, name:1, creditUser:1, credit:1, expected:1,
  collection:1, recovery:1, gmo:1, manager:1, opm:1, bike:1 };
var AVG_KEYS = ['tAvg', 'mAvg', 'avgPct', 'perf', 'score', 'overall', 'weekPct', 'pct'];
function targetOf_(c){
  var t = c.target;
  if (!t){
    var k = String(c.key || '');
    if (/ecol|early/i.test(k)) t = 'ecol';
    else if (/sales/i.test(k)) t = 'sales';
    else if (/rec/i.test(k)) t = 'rec';
    else if (/col/i.test(k)) t = 'col';
  }
  if (!t) return null;
  if (t === 'sales') return 100;
  var v = S.targets ? S.targets[t] : null;
  return (v == null || v === '' || isNaN(Number(v))) ? null : Number(v);
}
/* Everything the per-cell rule needs, worked out ONCE per table rather than per cell. */
function colourCtx_(cols, tot, rows){
  var ctx = { floors: {}, avgCol: null };
  (cols || []).forEach(function(c){
    /* A COUNT COLUMN'S LINE IS THE MEAN ACROSS THE ROWS, NOT THE TOTAL.
       "those below average in grand total row marked red" -- on a percentage column the total
       row IS the line, which is the rule everywhere else in this app. On a column of counts it
       cannot be: every team is below the sum of all teams, so the whole table would go red.
       The honest line for a count is what an average team did, so `meanFloor` says to take it
       from the rows. */
    if (c.meanFloor && rows && rows.length && !c.lowGood) {
      var s = 0, n = 0;
      rows.forEach(function(r){
        var x = Number(c.get ? c.get(r) : r[c.key]);
        if (!isNaN(x)) { s += x; n++; }
      });
      if (n) ctx.floors[c.key] = s / n;
      return;
    }
    /* `noAuto` OPTS A COLUMN OUT OF THE AUTOMATIC RULE ALTOGETHER -- for a board whose colours
       mean something else. The GM's team trend paints a cell by whether it DROPPED against the
       week before it, and "below the total row" would fight that: two rules on one cell, and
       the loser is whichever the stylesheet happens to list last. */
    if (c.kind !== 'pct' || c.lowGood || c.noAuto || !tot) return;
    var v = tot[c.key];
    if (v == null || v === '') return;
    var n2 = Number(String(v).replace(/[~%\s,]/g, ''));
    if (!isNaN(n2)) ctx.floors[c.key] = n2;
  });
  var named = (cols || []).filter(function(c){ return c.avgKey; })[0];
  var want = named ? [named.avgKey] : AVG_KEYS;
  for (var i = 0; i < want.length && !ctx.avgCol; i++){
    ctx.avgCol = (cols || []).filter(function(c){ return c.key === want[i] && c.kind === 'pct'; })[0] || null;
  }
  return ctx;
}
function pctClass_(r, c, ctx){
  if (c.kind !== 'pct' || c.lowGood || c.noAuto) return '';
  var v = c.get ? c.get(r) : r[c.key];
  if (v == null || v === '' || isNaN(Number(v))) return '';
  v = Number(v);
  var tg = targetOf_(c);
  if (tg != null && v >= tg) return 'good';
  if (ctx.floors[c.key] != null && v < ctx.floors[c.key]) return 'bad';
  return '';
}
function cellCls_(r, c, ctx){
  if (c.meanFloor && ctx.floors[c.key] != null && c.kind !== 'pct') {
    var v = Number(c.get ? c.get(r) : r[c.key]);
    return (!isNaN(v) && v < ctx.floors[c.key]) ? 'bad' : '';
  }
  if (c.kind === 'pct') return pctClass_(r, c, ctx);
  if ((NAME_KEYS[c.key] || c.nameCol) && ctx.avgCol) return pctClass_(r, ctx.avgCol, ctx) === 'bad' ? 'bad' : '';
  return '';
}

function filtered(){
  var rows = S.rows;
  // Dropdown filters (team / status) narrow BEFORE the text search, so the footer totals and
  // the CSV/Excel export always describe exactly what is on screen.
  if (S.filters.team) rows = rows.filter(function(r){ return String(r.team||'')===S.filters.team; });
  /* "Status" is spelled two ways in this system and the dropdown only knew one of them.
     Expected reads `todays_status` (PAID / UNPAID / UNDERPAID); the defaulter tabs read
     `status` (DEFAULTER / EXPIRED / CHRONIC). Filtering only on the first meant that picking
     a status on Expected Defaulters compared 'CHRONIC' against an absent column, matched
     nothing, and emptied the table -- which reads as "there are none" rather than as a
     dropdown that does not work. */
  if (S.filters.status) rows = rows.filter(function(r){
    var v = r.todays_status == null || r.todays_status === '' ? r.status : r.todays_status;
    return String(v||'').trim().toUpperCase() === S.filters.status
        || (!v && S.filters.status === '(BLANK)'); });
  // Any other data-filter="x" narrows on the row property of the same name, so a tab can add
  // a dropdown (analyst, state, officer, follow-up status) without touching this function.
  Object.keys(S.filters).forEach(function(k){
    if (k==='team' || k==='status' || !S.filters[k]) return;
    rows = rows.filter(function(r){ return String(r[k]==null?'':r[k]).trim() === S.filters[k]; });
  });
  var q = S.q.trim().toUpperCase();
  if (!q) return rows;
  return rows.filter(function(r){
    for (var i=0;i<S.cols.length;i++){ if (cellText(r,S.cols[i]).toUpperCase().indexOf(q)>=0) return true; }
    return false;
  });
}
/* SORTING BY THE ORDER THE WORK HAPPENS IN, NOT BY THE ALPHABET.

   A follow-up status sorted A-Z puts AMETOA AHADI above ANALIPA LEO above HAPATIKANI, which is
   no order anybody works in. A recovery officer wants the people who said they would pay today
   at the top, then the promises, then the ones who cannot be reached at all.

   So a column may carry its own order of VALUES, and the user may drag that order about. It is
   remembered on the device, because it is a personal working preference and not company data.
   Columns with no custom order sort normally. */
function customOrder(key){
  try { var raw = load('hopeOrder_' + key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function cmpOn(c, a, b, asc){
  var av = c.get?c.get(a):a[c.key], bv = c.get?c.get(b):b[c.key];
  var ord = customOrder(c.key);
  if (ord && ord.length){
    // Anything not in the saved order sorts after everything that is, rather than jumping to
    // the top -- a status nobody has ranked is not the most urgent thing on the screen.
    var ai = ord.indexOf(String(av==null?'':av)), bi = ord.indexOf(String(bv==null?'':bv));
    if (ai < 0) ai = ord.length; if (bi < 0) bi = ord.length;
    if (ai !== bi) return asc ? ai-bi : bi-ai;
    return 0;
  }
  if (isNum(c)){ av=Number(av)||0; bv=Number(bv)||0; return asc ? av-bv : bv-av; }
  av=String(av==null?'':av).toUpperCase(); bv=String(bv==null?'':bv).toUpperCase();
  return asc ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
}
function sorted(rows){
  var c1 = S.sort ? S.cols.filter(function(x){ return x.key===S.sort; })[0] : null;
  var c2 = S.sort2 ? S.cols.filter(function(x){ return x.key===S.sort2; })[0] : null;
  if (!c1 && !c2) return rows;
  var out = rows.slice();
  // Two levels: sort by follow-up status, THEN by arrears descending inside each status. One
  // level answers "who is worst"; two answers "who is worst among the ones I can act on".
  out.sort(function(a,b){
    if (c1){ var r = cmpOn(c1, a, b, S.asc); if (r) return r; }
    if (c2) return cmpOn(c2, a, b, S.asc2);
    return 0;
  });
  return out;
}
/* The sort bar. Offered on any tab that asks for it, so this does not become a followup-only
   feature that the next tab has to reinvent. */
function sortBarHtml(){
  var opts = function(sel){
    return '<option value="">—</option>' + S.cols.map(function(c){
      return '<option value="'+esc(c.key)+'"'+(sel===c.key?' selected':'')+'>'+esc(c.label)+'</option>'; }).join('');
  };
  return '<select id="sortA">' + opts(S.sort) + '</select>'
    + '<select id="sortAd"><option value="1"'+(S.asc?' selected':'')+'>↑</option><option value="0"'+(!S.asc?' selected':'')+'>↓</option></select>'
    + '<span style="color:var(--mut);font-size:12px">kisha / then</span>'
    + '<select id="sortB">' + opts(S.sort2) + '</select>'
    + '<select id="sortBd"><option value="1"'+(S.asc2?' selected':'')+'>↑</option><option value="0"'+(!S.asc2?' selected':'')+'>↓</option></select>'
    + '<button class="btn sm ghost" id="ordBtn">Panga mwenyewe / Custom order…</button>';
}
/* Every table carries a serial number. These lists run to thousands of rows and get read
   aloud in meetings ("number 42..."), so position has to be visible without counting. It is
   the row's position in the CURRENT view, so it stays 1..n after a search or a re-sort. */
/* =====================================================================================
   TICKING ROWS, for the screens where the work is done to MANY rows at once.

     "no bulk tick/selct checkboxes on the left"

   A view opts in by setting S.pickKey to the field that identifies a row -- the phone
   register sets 'imei'. Everything below is inert on every other tab, and go() clears the
   selection with S.rows and S.cols so no tab ever inherits another's ticks.

   THE TICKS SURVIVE A SORT AND A SEARCH, because they live in S rather than in the DOM: they
   are a set of row KEYS, not a set of table positions. Tick a phone, search for another, tick
   that too, and both are still ticked -- which is what somebody working down a paper list
   actually does. It also means the master tick covers WHAT IS ON SCREEN, which is the only
   reading of "all" that makes sense under a filter. */
function pickOn_(){ return !!S.pickKey; }
function pickKeyOf_(r){ return String(r && r[S.pickKey] == null ? '' : r[S.pickKey]); }
function pickHas_(r){ return S.pick && S.pick[pickKeyOf_(r)] === true; }
function pickCount_(){ return S.pick ? Object.keys(S.pick).length : 0; }
function pickList_(){ return S.pick ? Object.keys(S.pick) : []; }
function pickClear_(){ S.pick = {}; pickPaintCount_(); }
/* The count is written into whatever element the view put on its bar, rather than the view
   being re-rendered on every tick: re-rendering would close the keyboard, lose the scroll
   position and reset the search box, all to change one number. */
function pickPaintCount_(){
  var n = pickCount_();
  Array.prototype.forEach.call(document.querySelectorAll('[data-pickcount]'), function(el){
    el.textContent = n ? String(n) : '0';
    el.className = n ? 'chip ok' : 'chip mut';
  });
}
function tableHtml(rows, cols, onRow){
  if (!rows.length) return '<div class="msg">Hakuna taarifa. / Nothing here yet.</div>';
  var pick = pickOn_();
  var head = (pick ? '<th class="sn"><input type="checkbox" data-pickall="1" title="Chagua zote / select all"></th>' : '')
    + '<th class="sn">S/N</th>' + cols.map(function(c){
    var arrow = S.sort===c.key ? (S.asc?' ↑':' ↓') : '';
    // An abbreviated header carries its full name as the tooltip (see the dashboard Orodha).
    var tip = c.title ? ' title="'+esc(c.title)+'"' : '';
    return '<th class="'+(isNum(c)?'r':'')+'" data-sort="'+esc(c.key)+'"'+tip+'>'+esc(c.label)+arrow+'</th>';
  }).join('');
  /* THE GRAND TOTAL ON THE MAIN LIST TOO. Every card board and every projected slide grew one,
     and this table -- the biggest on every tab, and the one the commission week is read from --
     did not. Same rule as everywhere else, so the figure at the bottom of a card and the figure
     at the bottom of the list are worked out the same way and cannot disagree.

     It totals what is ON SCREEN. Filter to one team and the total is that team's; that is the
     only reading that makes sense under a filter, and a total that ignored the filter would be
     read as the filtered one by everybody. */
  var tot = autoTotals(rows, cols);
  // Green at target, red under the JUMLA line, names red with their row's average -- see cellCls_.
  var ctx = colourCtx_(cols, tot, rows);
  var body = rows.map(function(r, i){
    return '<tr'+(onRow?' data-i="'+i+'" style="cursor:pointer"':'')+'>'
      + (pick ? '<td class="sn"><input type="checkbox" data-pick="'+esc(pickKeyOf_(r))+'"'
          + (pickHas_(r)?' checked':'')+'></td>' : '')
      + '<td class="sn">'+(i+1)+'</td>'
      + cols.map(function(c){
          var k = cellCls_(r, c, ctx);
          return '<td class="'+(isNum(c)?'r':'')+(c.cls?(' '+c.cls(r)):'')+(k?' '+k:'')+'">'+cellHtml(r,c)+'</td>';
        }).join('') + '</tr>';
  }).join('');
  /* THE HEADERS AGAIN, ABOVE THE TOTAL. "repeat the headers from t.sales to abn above the
     grand totals because it is too down to refer": on a list of eighty-odd teams the column
     names are a screen and a half away from the JUMLA row they explain. Only on a long list
     -- a short one has its headers in sight -- and they sort exactly like the ones at the top. */
  if (tot && rows.length > 25) body += '<tr class="hdr2">' + head + '</tr>';
  if (tot) body += '<tr class="totrow">' + (pick ? '<td class="sn"></td>' : '') + '<td class="sn"></td>'
    + cols.map(function(c, i){
    return '<td class="'+(isNum(c)?'r':'')+'">'+(i===0?'JUMLA / TOTAL':cellHtml(tot,c))+'</td>'; }).join('') + '</tr>';
  // S.fit: the list wraps to the card's width on a laptop instead of scrolling sideways (see the .scroll.fit rule).
  return '<div class="scroll'+(S.fit?' fit':'')+'"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function wireTable(rows, onRow){
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'), function(th){
    th.onclick = function(){
      var k = th.getAttribute('data-sort');
      /* LIKE EXCEL: THE SORT YOU HAD BECOMES "THEN BY".
           "When i sort table headers at dashboard orodha like by collection then by OPM, I
            expect that to behave as excel: every opm will have descending collection"
         Clicking a second header threw the first sort away, and the rows inside each OPM fell
         back to the order they arrived in -- a zigzag. The column you were sorted on, and its
         direction, now move down to the second level, so the groups keep the order you gave
         them. Clicking the same header again still just turns it round. */
      if (S.sort===k) S.asc = !S.asc;
      else { if (S.sort) { S.sort2 = S.sort; S.asc2 = S.asc; } S.sort=k; S.asc=false; }
      paint(true);                                   // in place: the page must not move
    };
  });
  if (onRow) Array.prototype.forEach.call(document.querySelectorAll('tbody tr[data-i]'), function(tr){
    tr.onclick = function(){ onRow(rows[+tr.getAttribute('data-i')]); };
  });
  if (pickOn_()) {
    S.pick = S.pick || {};
    /* THE TICK MUST NOT OPEN THE ROW. Both live on the same <tr>, and without this every tick
       would also open the drawer over the table somebody is trying to work down. */
    Array.prototype.forEach.call(document.querySelectorAll('input[data-pick]'), function(cb){
      cb.onclick = function(ev){ ev.stopPropagation(); };
      cb.onchange = function(ev){
        ev.stopPropagation();
        var k = cb.getAttribute('data-pick');
        if (cb.checked) S.pick[k] = true; else delete S.pick[k];
        pickPaintCount_();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('input[data-pickall]'), function(all){
      all.onclick = function(ev){ ev.stopPropagation(); };
      all.onchange = function(){
        // What is ON SCREEN, which is the only reading of "all" that survives a filter.
        rows.forEach(function(r){
          var k = pickKeyOf_(r);
          if (all.checked) S.pick[k] = true; else delete S.pick[k];
        });
        paint(true);
      };
    });
    pickPaintCount_();
  }
}
function exportCsv(){
  if (!S.rows.length){ toast('Hakuna cha kupakua.', true); return; }
  var rows = sorted(filtered());
  var lines = ['"S/N",' + S.cols.map(function(c){ return '"'+String(c.label).replace(/"/g,'""')+'"'; }).join(',')];
  rows.forEach(function(r, i){
    lines.push('"'+(i+1)+'",' + S.cols.map(function(c){ return '"'+cellText(r,c).replace(/"/g,'""')+'"'; }).join(','));
  });
  download(new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}), S.view+'-'+today()+'.csv');
}
/* THE APK CANNOT BE HANDED A blob: URL, AND BEING HANDED ONE KILLS IT.
 *
 * "Downloading JPG from the call app just closes the app." Exactly that: a download inside the
 * WebView goes to Android's DownloadManager, DownloadManager does not understand blob: or data:
 * and throws, the fallback tries to open the same URL with an ordinary app, nothing on the phone
 * can, and the process goes down. No file, no message, no app.
 *
 * So inside the APK the bytes are handed to the app itself. saveBase64 arrived in a later build,
 * and officers update on their own schedule -- so a handset that does not have it yet is told
 * plainly to use the browser instead of being walked into the crash. On a real browser nothing
 * about this changes.
 */
function androidBridge_(){ return (window.HopeCalls && window.HopeCalls.getDeviceId) ? window.HopeCalls : null; }
/* THE HANDSET THIS PORTAL IS OPEN ON -- "the legal phone number should be the one used at
   current login". HOPE Calls keeps its device id beside this page: the app's bridge inside the
   APK, or the same-origin localStorage key (hcDev) in a browser where the call app has been
   opened. Sent with the Legal calls only, and only ever used to look up the number a letter
   carries -- never as authority: the access code decides everything else. A computer that has
   never opened HOPE Calls sends nothing, and the letter falls back to the code's name. */
function hcDevice_(){
  var nb = androidBridge_();
  if (nb) { try { var id = nb.getDeviceId(); if (id) return String(id); } catch(e){} }
  try { return localStorage.getItem('hcDev') || ''; } catch(e){ return ''; }
}
function download(blob, name){
  var nb = androidBridge_();
  if (nb) {
    if (!nb.saveBase64) {
      toast('Kupakua hakufanyi kazi ndani ya app bado — fungua mfumo kwenye Chrome kupakua. / '
        + 'Downloads need the newer app; open the system in Chrome to save this file.', true);
      return;
    }
    var fr = new FileReader();
    fr.onload = function(){
      // dataURL is "data:<mime>;base64,<payload>" -- the app wants the payload and the type.
      var s = String(fr.result), i = s.indexOf(',');
      try {
        var msg = nb.saveBase64(name, blob.type || 'application/octet-stream', s.slice(i + 1));
        toast(msg && String(msg).indexOf('OK') === 0 ? 'Imehifadhiwa Downloads. / Saved to Downloads.'
          : ('Imeshindikana kuhifadhi. / Could not save. ' + (msg || '')), !(msg && String(msg).indexOf('OK') === 0));
      } catch (e) { toast('Imeshindikana kuhifadhi / could not save: ' + (e.message || e), true); }
    };
    fr.onerror = function(){ toast('Imeshindikana kusoma faili / could not read the file.', true); };
    fr.readAsDataURL(blob);
    return;
  }
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 1500);
}
/* Excel: a real .xls workbook written as SpreadsheetML-flavoured HTML. Excel and WPS both
   open it natively, it keeps numbers as numbers, and it needs no library -- which matters
   because this has to work inside the Android WebView with no CDN. */
function exportXls(){
  if (!S.rows.length){ toast(t('nothing'), true); return; }
  var rows = sorted(filtered());
  function cell(v, numeric){
    return '<td'+(numeric?' x:num':'')+'>'+esc(v)+'</td>';
  }
  var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    + '<xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    + '<x:Name>'+esc(S.view)+'</x:Name><x:WorksheetOptions><x:FreezePanes/><x:SplitHorizontal>1</x:SplitHorizontal>'
    + '<x:TopRowBottomPane>1</x:TopRowBottomPane></x:WorksheetOptions></x:ExcelWorksheet>'
    + '</x:ExcelWorksheets></x:ExcelWorkbook></xml>'
    + '<style>th{background:#0B2A6B;color:#fff;font-weight:700}td,th{border:1px solid #ccc;padding:4px 6px}</style>'
    + '</head><body><table><thead><tr><th>S/N</th>'
    // A sheet has room the screen does not: an abbreviated header exports under its full name.
    + S.cols.map(function(c){ return '<th>'+esc(c.title || c.label)+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r,i){
        return '<tr>'+cell(i+1,true)+S.cols.map(function(c){
          var raw = c.get ? c.get(r) : r[c.key];
          // A percentage exports as the whole number the screen shows, never a hidden decimal.
          return isNum(c) ? cell(c.kind==='pct' ? Math.round(Number(raw)||0) : (Number(raw)||0), true) : cell(cellText(r,c), false);
        }).join('')+'</tr>';
      }).join('')
    + '</tbody></table>' + (S.foot ? '<p>'+esc(S.foot)+'</p>' : '') + '</body></html>';
  download(new Blob(['﻿'+html], {type:'application/vnd.ms-excel;charset=utf-8;'}), S.view+'-'+today()+'.xls');
}
/* JPG: draws the element to a canvas by rasterising a cloned copy through an SVG
   foreignObject -- no html2canvas, no CDN, so it works offline in the app. Falls back to a
   clear message rather than a silent nothing if the browser refuses to taint-free render. */
/* WHY THE PICTURE WAS ONLY EVER THE PART YOU COULD SEE.

     "downloading jpg reports in app is cutting the current screen size that has not been
      scrolled instead of the whole current report"

   The size was measured off the LIVE element, and the live element is clipped by design:
   `.card` is `overflow:hidden` and the table inside it sits in a `.scroll` wrapper that is
   `overflow-x:auto`. So scrollWidth and scrollHeight reported the size of the WINDOW onto the
   report, not the report -- and the width was then capped at 1600 on top of that, cutting a
   wide table a second time.

   Worse, the whole stylesheet is copied into the picture, so those same clipping rules applied
   again INSIDE the drawing. Even measured correctly, the content would still have been cut.

   Both halves are fixed the same way: the CLONE is unclipped -- every overflow, max-height and
   max-width neutralised -- then measured for real by attaching it off-screen, and an override
   style is appended AFTER the copied CSS so the unclipping also wins inside the foreignObject.

   Client-side only. Nothing here asks the database anything. */
/* AUTO COLUMN WIDTH, AND A PICTURE YOU CAN READ WITHOUT PINCHING.

     "The downloaded pictures in app are too wide not autocolumn width and unreadable without
      too much zoom"

   Two faults, and the first causes the second. `table{width:100%}` is right on a screen -- the
   board should fill its card -- and wrong in a picture, because the picture's width is measured
   from the UNCLIPPED content. A wide board therefore stretched to the widest thing on the page
   and every column was padded out with empty space, so a report that needs 900 pixels of actual
   text was drawn four thousand wide. Opened on a phone, that is a postage stamp.

   `width:auto` with `table-layout:auto` is the browser's own column sizing: each column ends up
   as wide as its widest cell and not one pixel more, which is exactly "auto column width". The
   image gets narrower, and narrower is what makes it legible at the same zoom.

   Then it is drawn at TWICE the size. Same layout, twice the pixels, so the text stays sharp
   when it is enlarged instead of turning to mush -- which is the other half of "unreadable
   without too much zoom". */
/* ONE TO ONE. THE PICTURE IS THE SIZE OF THE REPORT.

   I made this 2 for sharpness -- same layout, twice the pixels, crisp when you zoom in. The
   reasoning was fine and the result was not:

     "the current are even cutting info"

   A viewer opens an image at its actual pixel size. At 2x a report 1,270 points wide becomes a
   file 2,540 pixels wide, so a 1,170-pixel screen shows less than half of it and cuts the right
   hand columns and the bottom rows -- which looks exactly like data missing, and is
   indistinguishable from it unless you know to scroll a picture.

   The owner said what it should be and was right: the picture is the report AS VIEWED. At 1:1 it
   opens whole, it is the same size and the same sharpness as the screen it came from, and there
   is nothing to scroll or pinch to be sure you have all of it. Sharpness when enlarged is worth
   something; a report you cannot see the edge of is worth nothing. */
/** THE SCREEN'S OWN PIXEL RATIO, which is what "as viewed" actually means.

    Two goes at this were both wrong for the same reason: I picked a NUMBER. Two was too much --
    a 1,270-point report became a 2,540-pixel file and a viewer opening it at actual size showed
    half of it. One was too little, and here is why, which I had not accounted for at all:

      a CSS pixel is not a screen pixel.

    Every phone and most laptops draw at a device pixel ratio of 2 or 3 -- the browser renders
    that 1,270-point report into 2,540 or 3,810 REAL pixels, and that is the crispness you are
    reading on the screen. An image exported at 1:1 in CSS pixels therefore carries HALF or a
    THIRD of the detail your screen is showing you, and looks softer and smaller than the page it
    came from. "Real size, readable" is not 1 and it is not 2: it is whatever this screen uses.

    So it is asked rather than assumed. On an ordinary desktop that is 1 and nothing changes; on
    a phone it is 2 or 3 and the picture matches the handset it was made on. Capped at 3 and
    bounded by the canvas ceiling below, because the point is fidelity, not file size. */
/* BACK TO 1:1, ASKED FOR PLAINLY: "return the wide ones full data".

   Scaling by the device ratio is defensible in theory and it costs the thing that matters: on a
   handset at 2x or 3x the file is two or three times the report, and a viewer opening it at
   actual size shows a corner of it. 1:1 is the only setting where every report, at every width,
   opens whole -- and whole is worth more than sharp. */
/* AND BACK TO 2, FOR A DIFFERENT REASON THAN THE FIRST TIME.

     "we want to start regular posting the jpg from orodha at dashboard and move from our old
      excel reports now the quality downloaded is too low"

   The picture is now something POSTED -- to the groups, in place of the Excel -- and a posted
   picture is opened fit-to-screen and pinched into, not viewed at actual size. At 1x an
   84-team Orodha is soft the moment anybody zooms; at 2x it is the same layout with four
   times the pixels, and stays sharp under the zoom. The cut that 2x once got blamed for was
   never the scale's doing -- it was the font mismatch fixed in saveJpg below -- so the two
   reasons for 1x are both gone. The canvas ceiling still drops it to 1x for a picture that
   would not fit at 2x. */
var JPG_SCALE = 2;
/* The picture's own background and margin -- literals, because the drawing cannot read the
   page's theme variables and the ink walk has to know exactly what "nothing" looks like. */
var JPG_BG = '#F6F8FC', JPG_PAD = 10;
/** The last column and the last row of a canvas that carry anything but the background --
    read from the right edge inward and the bottom edge upward, one strip at a time, stopping
    at the first strip with ink in it. A tolerance of a few levels forgives anti-aliasing. */
function inkBox_(ctx, w, h, bg){
  var R = parseInt(bg.slice(1,3),16), G = parseInt(bg.slice(3,5),16), B = parseInt(bg.slice(5,7),16);
  var ink = function(d, i){ return Math.abs(d[i]-R) > 6 || Math.abs(d[i+1]-G) > 6 || Math.abs(d[i+2]-B) > 6; };
  var right = 0, bottom = 0, x, y, i, d;
  for (x = w - 1; x >= 0 && !right; x--) {
    d = ctx.getImageData(x, 0, 1, h).data;
    for (i = 0; i < d.length; i += 4) if (ink(d, i)) { right = x + 1; break; }
  }
  for (y = h - 1; y >= 0 && !bottom; y--) {
    d = ctx.getImageData(0, y, w, 1).data;
    for (i = 0; i < d.length; i += 4) if (ink(d, i)) { bottom = y + 1; break; }
  }
  return { right: right || w, bottom: bottom || h };
}
var JPG_UNCLIP = '.jpgshot,.jpgshot *{overflow:visible !important;max-height:none !important;'
  + 'max-width:none !important;}'
  + '.jpgshot .body,.jpgshot .scroll,.jpgshot .card{overflow:visible !important;height:auto !important;}'
  /* The tables size themselves to their content rather than to the page. */
  + '.jpgshot table{width:auto !important;table-layout:auto !important;}'
  /* MEASURED, NOT ASSUMED -- and the first attempt at this made it worse. `fit-content` on the
     KPI row collapsed a six-tile grid into ONE 155px column stacked down the side of a 999px
     table, because `repeat(auto-fit, minmax(155px, 1fr))` has no width to fit against once the
     container shrink-wraps. The tiles flow as a wrapping row instead. */
  /* EVERY auto-fit GRID IN THE SYSTEM, not just the one that was reported.
     `repeat(auto-fit, minmax(N, 1fr))` has no width to fit against once the container
     shrink-wraps, so it resolves to a SINGLE column and the tiles stack in a narrow ribbon down
     the side of the report. Four of these exist -- the KPI row, the weekday trend grids on the
     dashboard and the weekly report, the presentation's own KPI row, and the commission rate
     form -- and only the first was covered. Measured: the weekday grid came out 148px holding
     six cells stacked; as a wrapping row it is 788px with all six side by side.
     `flex-direction:row` is stated because .cmsrates is a column flex before it is a grid, and
     inheriting that turned the override into the same stack it was meant to undo. */
  + '.jpgshot .kpis,.jpgshot .tgrid,.jpgshot .pkpis,.jpgshot .cmsrates{'
  + 'display:flex !important;flex-direction:row !important;flex-wrap:wrap !important;gap:8px !important;}'
  + '.jpgshot .kpi{width:auto !important;min-width:140px !important;flex:0 0 auto !important;}'
  + '.jpgshot .tcell,.jpgshot .pkpi{width:auto !important;min-width:120px !important;flex:0 0 auto !important;}'
  + '.jpgshot .cmsrates>*{width:auto !important;min-width:200px !important;flex:0 0 auto !important;}'
  /* Two boards side by side is a screen idea. A picture is read top to bottom. */
  + '.jpgshot .pair{display:block !important;}'
  /* THE WIDTH THAT IS NOT TEXT. A ten-column board is wide because it has ten columns -- that
     part is the report -- but 12px of padding either side of every cell is 240px of nothing,
     and a header is very often the widest cell in its column purely because it will not wrap.
     Both of those are pixels spent on no information, and on a phone every one of them is
     taken out of the size of the writing. */
  + '.jpgshot td,.jpgshot th{padding:5px 8px !important;white-space:nowrap !important;}'
  + '.jpgshot th{white-space:normal !important;}'
  /* One three-hundred-character comment must not set the width of the whole image. */
  + '.jpgshot td.wrap,.jpgshot .cmt,.jpgshot .note{white-space:normal !important;max-width:420px !important;}'

  /* =====================================================================================
     AND HERE IS WHAT WAS ACTUALLY MAKING THEM WIDE. It was not the tables.

     A picture is measured from the UNCLIPPED clone, and the widest thing in it wins. The card
     HEADER is a one-line strip -- a title, then a sub-line pushed to the far end by
     `margin-left:auto` -- and laid out with no width to fit into it takes its max-content
     width, which is the whole sentence on a single line. On a real board that is three and a
     half THOUSAND pixels. The card became that wide, and `table{width:100%}` obediently
     stretched the table to match, which is why a column holding "HAMZA SAID" was measured at
     596 pixels and the report read as a row of numbers scattered across an empty field.

     Measured on their own board: 3,683px before, 620px after. The columns go from 596px to
     92px. Nothing was removed from the report -- the same header, the same eight columns, the
     same rows. It is only that the header wraps like a paragraph instead of setting the width
     of everything beneath it.

       header    a block that wraps, with the sub-line under the title rather than pushed to
                 the far edge of a line that then has to be that long
       tables    max-content: as wide as the widest cell in each column and no wider, which is
                 what "auto column width" means
       ceiling   1100px on the things that are prose, so a long note cannot do it again */
  + '.jpgshot .card-h{display:block !important;white-space:normal !important;}'
  + '.jpgshot .card-h .sub{display:block !important;margin-left:0 !important;}'
  + '.jpgshot table{width:-moz-max-content !important;width:max-content !important;}'
  // The per-table search box types into the LIVE screen -- a static image of it is an empty
  // input nobody can use, not data. Same reasoning as leaving it out of CSV/Excel's own columns.
  + '.jpgshot .tblsearch{display:none !important;}'

  /* EVERY REPORT IS ITS OWN WIDTH, AND CAPPING THEM ALL AT ONE NUMBER CUTS THE WIDE ONES OFF.

       "Every JPG have their own size, keeping them at one may result like this"

     Exactly right, and it was mine: a flat 1,100px ceiling on the CARD, with the table held to
     100% of it, drew a board whose eighth column was simply not in the picture. REQUESTED ended
     mid-number. A report that is cut off is worse than one that is wide -- wide can be zoomed,
     missing cannot be recovered.

     So nothing that carries FIGURES is capped. The cap belongs only on the things made of
     SENTENCES, because a sentence has no natural width -- it is one line as long as you let it
     be, and that is what was setting a three-and-a-half-thousand pixel picture in the first
     place. A heading wraps at a readable measure; the board beneath it is then exactly as wide
     as its own columns need, whatever number that turns out to be, and every report gets its
     own size. */
  /* NO CAP AT ALL NOW. The heading only needed one while the picture was measured with
     `width:auto`, where a sentence has no natural width and stretched to one enormous line.
     Laid out at the report's real on-screen width it wraps exactly as it does on the page, so
     the cap has nothing left to protect against -- and a cap is the thing that cut a board in
     half two commits ago. */
  + '';

function saveJpg(el){
  if (!el){ toast(t('nothing'), true); return; }
  var probe = null;
  try {
    var clone = el.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('button, .tblsearch'), function(b){ b.remove(); });
    clone.classList.add('jpgshot');

    /* MEASURED FROM THE UNCLIPPED CLONE, not from the window onto it. Attached off-screen so
       the browser lays it out for real -- a detached node has no size at all, and guessing
       from the original is exactly what produced a cropped picture. */
    /* LAID OUT AT THE WIDTH IT REALLY HAS ON THE SCREEN.

         "i thout auto takes the font size and clip the report as viewed no matter which one"

       That is the right model and it is not what this was doing. Measuring with `width:auto`
       shrink-wraps the clone, which is a DIFFERENT layout from the one on screen: headings stop
       wrapping and stretch to one enormous line, and everything under them follows. Every fight
       I have had with this -- the 3,683px picture, the stretched columns, the capped card that
       then cut a board in half -- came from measuring a layout nobody was looking at.

       Given the report's real on-screen width, the browser wraps and sizes exactly as the
       screen does, and there is nothing left to correct with CSS. */
    probe = document.createElement('div');
    var onScreen = Math.max(Math.round(el.getBoundingClientRect().width), 320);
    probe.setAttribute('style', 'position:fixed;left:-99999px;top:0;visibility:hidden;'
      + 'width:' + onScreen + 'px;height:auto;overflow:visible;pointer-events:none;z-index:-1');
    probe.className = document.body.className;
    var pstyle = document.createElement('style');
    pstyle.textContent = JPG_UNCLIP;
    probe.appendChild(pstyle);
    probe.appendChild(clone);
    document.body.appendChild(probe);
    /* MEASURED FROM WHAT IS ACTUALLY PAINTED, because scrollWidth lies here.

       scrollWidth reports the scrollable extent of a box. Unclipping sets every container to
       `overflow:visible`, and a box that does not scroll has no scrollable extent -- so a table
       hanging out past the edge of its card contributes NOTHING to the number, and the picture
       was cut at the card's edge with the last columns simply outside it. Same for the height
       and the last rows. That is "the current are even cutting info", and it is why every CSS
       change I made moved the crop around without ever curing it.

       The one measurement that cannot lie is where the ink lands: the furthest right and
       furthest bottom edge of every element in the clone. It costs one walk of a report-sized
       subtree, on a click, in a page that is doing nothing else. */
    var origin = clone.getBoundingClientRect();
    var maxR = origin.right, maxB = origin.bottom;
    var kids = clone.querySelectorAll('*');
    for (var ki = 0; ki < kids.length; ki++) {
      var kr = kids[ki].getBoundingClientRect();
      if (!kr.width && !kr.height) continue;          // nothing painted, nothing to include
      if (kr.right > maxR) maxR = kr.right;
      if (kr.bottom > maxB) maxB = kr.bottom;
    }
    /* Four pixels of slack because a sub-pixel rounding here is a column shaved off the edge. */
    var w = Math.max(Math.ceil(maxR - origin.left), clone.offsetWidth, onScreen, 320) + 4;
    var h = Math.max(Math.ceil(maxB - origin.top), clone.offsetHeight, 120) + 4;
    document.body.removeChild(probe); probe = null;
    // A canvas beyond a few thousand pixels a side starts failing on phones; no real report
    // reaches this, and clipping loudly at 8000 beats a blank file.
    w = Math.min(w, 8000); h = Math.min(h, 20000);

    var css = '';
    Array.prototype.forEach.call(document.styleSheets, function(sh){
      try { Array.prototype.forEach.call(sh.cssRules, function(r){ css += r.cssText; }); } catch(e){}
    });
    /* THE DRAWING IS XML, AND HTML IS NOT.

         "downloading jpg in the app says could not build the picture"

       An SVG data: URI is parsed as XML, strictly. `outerHTML` serialises the clone as HTML --
       `<input ...>` with no closing slash -- and the day the per-list search box (an <input>)
       went into every Orodha card, every JPG of every list became malformed XML, the image
       refused to load, and the button said "could not build the picture" from then on. The
       search box is dropped above (it is not part of the report), and the clone is serialised
       by the XML serialiser, which closes every void element and escapes every entity --
       so a <br>, an <img> or a stray & anywhere in a report can never do this again. The
       copied stylesheet is escaped the same way: CSS text is free to contain & and <, and
       inside an XML <style> those must be entities. */
    var xmlText = function(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); };
    /* THE PICTURE'S FONT IS THE PAGE'S FONT, SAID OUTRIGHT.

         "the quality downloaded is too low ... and not all columns fitted"

       The page's font lives on `html,body{font-family:...}`, and inside the drawing there is
       no body -- the root is this div -- so that rule matched nothing and the picture fell
       back to the browser's default serif. The clone was MEASURED in the page's font (the
       probe sits inside the real body) and DRAWN in another: wider glyphs pushed the last
       columns past the right edge, a different line height pushed the last rows past the
       bottom, and 84 teams came out as 78 with T.Avg half gone. Proven by giving the page a
       wide serif and watching the picture ignore it. The body's computed font, size, line
       height and colour go on the root of the drawing, so the two layouts are one layout. */
    var bs = getComputedStyle(document.body);
    var fontCss = 'font-family:' + bs.fontFamily + ';font-size:' + bs.fontSize + ';line-height:' + bs.lineHeight

    var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="'+document.body.className+'" style="'+esc(fontCss)+'">'
      // The override goes AFTER the copied stylesheet, so it wins inside the drawing too.
      + '<style>'+xmlText(css)+'</style><style>'+xmlText(JPG_UNCLIP)+'</style>'
      /* box-sizing:content-box ON PURPOSE. The copied stylesheet sets `*{box-sizing:border-box}`,
         so `width:w` here gave the content w MINUS the 20px of padding -- twenty pixels of the
         report pushed outside the picture on every single export, which is "the current are
         even cutting info" in one line of CSS. */
      /* A LITERAL background, the same literal the canvas is filled with, so the ink walk
         below can tell page from picture in either theme. */
      + '<div style="background:'+JPG_BG+';padding:'+JPG_PAD+'px;box-sizing:content-box;width:'+w+'px">'
      + new XMLSerializer().serializeToString(clone) + '</div></div>';
    /* SCALED BY THE viewBox, WHICH IS WHAT SVG IS FOR -- not by `zoom`.

       `zoom` scales the LAYOUT: the box becomes (w+20) x sc and the picture is exactly that
       size, so a single sub-pixel rounding puts the right-hand edge outside the canvas. A
       viewBox leaves the layout alone at its natural size and scales the DRAWING of it, which
       cannot round content out of frame and re-rasterises crisply because it is still vector at
       that point. Same sharpness when enlarged, none of the risk. */
    /* MEASURED WHERE THE INK LANDS, NOT WHERE IT WAS PREDICTED TO.

         "also the pic didn't download the whole table"  -- a third time, and by the same
         fraction on the right as at the bottom: the drawing came out a few percent larger than
         the probe had measured, and two columns and six rows fell off the edge.

       Every cure so far corrected one difference between the probe's layout and the drawing's
       (the unclipping, the width, the font) and there is always another one a device can
       hide -- a font the picture cannot reach, a metric the image renderer rounds its own way.
       So the prediction is no longer trusted to the pixel. The drawing is made with a third
       more room than it should need, and then the CANVAS is read: the last column and the
       last row that carry anything other than the background are found, and the picture is
       cropped there. Whatever the drawing decided to do with the layout, the file holds all
       of it. Costs one scan of the edges of a bitmap, on a click. */
    var W = w + 2 * JPG_PAD, H = h + 2 * JPG_PAD;
    var GW = Math.ceil(W * 1.3) + 60, GH = Math.ceil(H * 1.3) + 60;
    /* THE CEILING IS A SLOPE, NOT A CLIFF. This dropped straight from 2x to 1x the moment the
       drawing would not fit at 2x -- and a hundred-team Orodha, one column wider with the OPM,
       crossed that line, so the posted picture went soft overnight ("the image quality has
       suddenly decreased into blurred"). The largest scale the canvas budget allows is taken
       instead: 1.7x of a picture that cannot have 2x is still nearly three times the pixels
       of 1x, and the budget itself (8000 x 20000) is what a phone's canvas will still hold. */
    var sc = Math.max(1, Math.min(JPG_SCALE, 8000 / GW, 20000 / GH));
    sc = Math.floor(sc * 100) / 100;
    var sw = Math.ceil(GW * sc), sh = Math.ceil(GH * sc);
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+sw+'" height="'+sh+'"'
      + ' viewBox="0 0 '+GW+' '+GH+'">'
      + '<foreignObject width="'+GW+'" height="'+GH+'">'
      + html + '</foreignObject></svg>';
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      cv.width = sw; cv.height = sh;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = JPG_BG;
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      var box = inkBox_(ctx, sw, sh, JPG_BG);
      var out = document.createElement('canvas');
      out.width = Math.min(sw, Math.ceil(box.right + JPG_PAD * sc));
      out.height = Math.min(sh, Math.ceil(box.bottom + JPG_PAD * sc));
      var octx = out.getContext('2d');
      octx.fillStyle = JPG_BG;
      octx.fillRect(0, 0, out.width, out.height);
      octx.drawImage(cv, 0, 0);
      out.toBlob(function(b){
        if (!b){ toast(t('jpgfail'), true); return; }
        download(b, S.view+'-'+today()+'.jpg');
      }, 'image/jpeg', 0.94);
    };
    img.onerror = function(){ toast(t('jpgfail'), true); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch(e){
    // The probe must never be left behind in the page if anything above threw.
    if (probe && probe.parentNode) probe.parentNode.removeChild(probe);
    toast(t('jpgfail'), true);
  }
}
