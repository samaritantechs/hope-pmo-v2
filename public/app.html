<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>HOPE PMO — Portal</title>
<style>
  :root{--zebra:#F3F6FB;--b950:#081C4A;--b900:#0B2A6B;--b800:#10357F;--b700:#1D4ED8;--b600:#2563EB;--b500:#3B82F6;--b300:#93C5FD;--b100:#DBEAFE;--b50:#EFF6FF;
        --bg:#F6F8FC;--card:#FFF;--ink:#0F172A;--mut:#64748B;--soft:#94A3B8;--line:#E2E8F0;
        --ok:#067647;--okbg:#E7F6EE;--okline:#CFEADD;--warn:#92400E;--warnbg:#FEF3DC;--warnline:#F6E3BC;
        --bad:#B42318;--badbg:#FDECEA;--badline:#F6CFCB;--rad:14px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  .hide{display:none !important}
  .sk{width:20px;height:20px;border:2.5px solid var(--b100);border-top-color:var(--b600);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* A hairline that slides across the top while the screen you are already reading is quietly
     brought up to date behind you. It replaces the old habit of wiping the page to a spinner
     on every single click -- you keep your place, and the numbers change under you when they
     are ready. Two pixels tall on purpose: it should be noticeable, not distracting. */
  /* The print frame. Invisible on screen; on paper it is the ONLY thing, at full page width.
     A legal document with the app's navigation printed down the side of it is not a legal
     document anybody wants to hand to a customer. */
  #printFrame{position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;visibility:hidden}
  @media print{
    body > *{display:none !important}
    #printFrame{position:sticky;left:0;width:100%;height:auto;min-height:100vh;
                visibility:visible;display:block !important}
  }
  /* The noticeboard. It covers everything on purpose -- that is what "announcement" means
     here -- but it is always dismissible, because a notice nobody can get past is an outage. */
  #annBg{position:fixed;inset:0;background:rgba(6,26,54,.92);z-index:80;display:none;
         align-items:center;justify-content:center;padding:20px}
  #annBg.on{display:flex}
  #annBox{background:var(--card);border-radius:18px;max-width:520px;width:100%;
          max-height:88vh;overflow:auto;padding:18px;text-align:center}
  #annBox img{max-width:100%;border-radius:12px;display:block;margin:0 auto 12px}
  #annBox .t{font-size:16px;line-height:1.5;white-space:pre-wrap;text-align:left}
  /* The bell. A count nobody can read is a dot nobody looks at. */
  .bell{position:relative}
  .bell b{position:absolute;top:-5px;right:-5px;background:#B42318;color:#fff;border-radius:999px;
          font-size:10px;line-height:1;padding:3px 5px;min-width:16px;font-weight:800}
  #notifList{max-height:60vh;overflow:auto}
  .nrow{display:block;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .nrow.new{background:var(--b50);margin:0 -16px;padding-left:16px;padding-right:16px}
  .nrow .m{color:var(--mut);font-size:11.5px;margin-top:2px}
  .busy{height:2px;background:transparent;overflow:hidden;flex:0 0 auto}
  .busy.on{background:var(--b100)}
  .busy.on::after{content:'';display:block;height:100%;width:40%;background:var(--b600);animation:bz 1.1s ease-in-out infinite}
  @keyframes bz{0%{margin-left:-40%}100%{margin-left:100%}}

  /* sign-in */
  #signin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--b900),var(--b800));padding:20px;z-index:50}
  #signin .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  #signin h2{margin:0 0 4px;font-size:18px}
  #signin p{margin:0 0 18px;font-size:13px;color:var(--mut)}
  #signin input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:12px}
  #signin input:focus{outline:none;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
  .btn.w{width:100%;padding:13px}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.ghost{background:#fff;color:var(--mut);border:1.5px solid var(--line)}
  .btn:disabled{opacity:.55}

  /* shell */
  .shell{display:flex;height:100%}
  /* The sidebar is the SAME navy the phone app's header uses, not the darkest shade in the
     ramp. The app's colour was right; what made the system read as hard was painting 225
     pixels of near-black down the whole height of the screen, next to a white page. One step
     lighter is the app's own header colour, which is the thing it was meant to match. */
  /* "top buttons unreachable when I switch into system using app too" -- same notch problem
     call.html's header had, on this page's two top edges: viewport-fit=cover runs the page
     under the status bar on cutout phones, so both the top bar's buttons and the slid-in
     menu's first entries sat beneath it. env(safe-area-inset-top) is that phone's cutout
     height and 0 everywhere else (desktops included), so nothing moves where it was fine. */
  .side{width:225px;flex:0 0 auto;background:var(--b900);color:#cfe0ff;display:flex;flex-direction:column;
    padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px}
  .side .brand{color:#fff;font-weight:800;font-size:14px;line-height:1.35}
  .side .brand small{display:block;color:var(--b300);font-weight:500;font-size:11px;margin-top:2px}
  .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:#cfe0ff;
    padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .nav button svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
  .nav button.on svg{opacity:1}
  .nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:#fff;color:var(--b800)}
  /* ONE FLOW, NOT TWO SIDEBARS. HOPE Loan's own tabs sit in the SAME list as HOPE PMO's, one
     continuous scroll -- this is only a quiet label above them, not a switch to flip and not a
     banner to warn anybody they have left somewhere. Drawn once, only when there is at least
     one HOPE Loan item this code actually holds a tab for. */
  .navhead{padding:14px 11px 4px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--b300);text-transform:uppercase}
  .side .foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px}
  .side .foot b{color:#fff;font-size:12.5px;display:block}
  .side .foot span{font-size:11px;color:var(--b300);display:block;margin-bottom:8px}
  .side .foot a,.side .foot button{display:block;width:100%;text-align:center;margin-top:6px;font-size:12px;padding:8px;
    border-radius:8px;text-decoration:none;background:rgba(255,255,255,.1);color:#fff;border:0;cursor:pointer;font-weight:600}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:calc(13px + env(safe-area-inset-top,0px)) 18px 13px;display:flex;align-items:center;gap:12px}
  .top h1{margin:0;font-size:16.5px;font-weight:800;flex:1;min-width:0}
  .top .q{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;min-width:150px}
  .top .q:focus{outline:none;border-color:var(--b500)}
  .body{flex:1;overflow:auto;padding:16px 18px 60px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .kpi .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--soft);margin-top:2px}
  /* A TAPPABLE CARD: a KPI that is also a pill -- it carries the bar's data-arg/data-val and narrows the list below it
     (PMO Deduction's cards). Lit while it is the one chosen. */
  .kpi.tap{cursor:pointer;transition:border-color .12s}
  .kpi.tap:hover,.kpi.tap:focus-visible{border-color:var(--b500);outline:none}
  .kpi.tap.on{border-color:var(--b500);background:var(--b50)}
  .good{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .card-h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-h .sub{font-weight:400;color:var(--mut);font-size:12px;margin-left:auto}
  /* THE PER-TABLE SEARCH -- distinct from the magnifier (Tafuta mteja) up in the top bar. That
     one is company-wide and opens the full customer insight; this one only narrows whatever
     list is already on screen, in ANY of its columns, exactly the way sorting or a dropdown
     filter already narrows it. */
  .tblsearch{padding:8px 14px;border-bottom:1px solid var(--line)}
  .tblsearch input{width:100%;padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;font-size:13px}
  .tblsearch input:focus{outline:none;border-color:var(--b500)}
  .scroll{overflow-x:auto}
  /* FIT. A tab that sets S.fit draws its list to the card's width on a laptop: the cells wrap instead of the
     table scrolling sideways, so the LAST column is in sight -- "the table should autofit width so that hr sees
     to status of active and inactive without scrolling right" (HR staff data, eleven columns). A phone keeps
     the sideways scroll: eleven columns wrapped into 360px read as nothing. The JPG copy keeps nowrap (its own
     sheet, below). */
  @media (min-width:900px){
    .scroll.fit th,.scroll.fit td{white-space:normal;overflow-wrap:anywhere;padding:7px 8px}
    .scroll.fit th{line-height:1.2}
  }
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;padding:8px 12px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1px solid var(--line);white-space:nowrap;background:var(--b50);cursor:pointer;user-select:none}
  td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  /* ZEBRA. "no zebra stripping" -- 84 teams across seventeen columns is a table the eye loses
     its row in, on the screen and worse in the posted picture where there is no hover to
     help. Every second row sits on a faint wash; the total row keeps its own. On the cells,
     not the row, so the picture (which copies this stylesheet) gets it too. */
  tbody tr:nth-child(even):not(.totrow) td{background:var(--zebra)}
  tbody tr:hover:not(.totrow) td{background:var(--b50)}
  .r{text-align:right}
  th.sn,td.sn{width:1%;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums;padding-right:6px}
  td.sn{font-size:11.5px}
  /* weekday trend grids */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 14px}
  .tcell{background:var(--b50);border:1px solid var(--b100);border-radius:10px;padding:9px 10px;text-align:center}
  /* A day nobody has uploaded yet. Deliberately faint: it is not a bad number, it is not a
     number. Zero collection and no sheet must never look the same on a wall. */
  .tcell.pend{background:transparent;border-style:dashed;opacity:.6}
  .tcell.tot{background:var(--b900);border-color:var(--b900);color:#fff}
  .tcell.tot .th,.tcell.tot .mutl{color:var(--b300)}
  .tcell .th{font-size:11.5px;font-weight:800;letter-spacing:.03em;margin-bottom:4px}
  .tcell .tl{font-size:12.5px;line-height:1.5}
  .tcell .mutl{color:var(--mut);font-size:11px}
  .tcell .badl{color:var(--bad);font-size:11px}
  /* The month report's week tiles: the live week wears a ring, and a thin collection bar
     under each week says at a glance how much of the month's line was met. */
  .tcell.now{border-color:var(--b700);box-shadow:inset 0 0 0 1.5px var(--b700)}
  .tcell .mrbar{display:block;height:4px;border-radius:3px;background:var(--line);margin-top:7px;overflow:hidden}
  .tcell .mrbar i{display:block;height:100%;border-radius:3px;background:var(--ok)}
  .tcell.tot .mrbar{background:rgba(255,255,255,.22)}
  /* The unlabeled month-report dot -- "the directors hate exposing data so keep monthly in
     the chip ... remove it's naming and just put a dot like the blinking synchronization at
     phone calls". No name, no tooltip: a quiet pulse beside the week bar. The GM knows
     where it lives; anyone who does not is on their own, by design. */
  .syncdot{width:13px;height:13px;border-radius:50%;border:0;padding:0;margin-left:10px;
    background:var(--b700);cursor:pointer;flex:0 0 auto;animation:syncpulse 1.5s ease-in-out infinite}
  @keyframes syncpulse{0%,100%{opacity:.25}50%{opacity:1}}
  /* pipeline funnel */
  .fun{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .fun .fl{width:150px;color:var(--mut);text-transform:capitalize}
  .fun .fv{width:60px;text-align:right;font-weight:700}
  .fun .fb{flex:1;height:8px;background:var(--b50);border-radius:99px;overflow:hidden}
  .fun .fb i{display:block;height:100%;background:var(--b500)}
  /* weekday pills + filters */
  .pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pills .pill{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--mut);
    font-weight:700;font-size:12.5px;cursor:pointer}
  .pills .pill.on{background:var(--b700);border-color:var(--b700);color:#fff}
  .pills select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  /* the team pick: a dropdown of tick boxes, loaded on OK */
  .teampick{position:relative;display:inline-block;vertical-align:middle;margin-left:8px}
  .teampick .pill{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--mut);font-weight:700;font-size:12.5px;cursor:pointer}
  .teampick .pill.on{background:var(--b700);border-color:var(--b700);color:#fff}
  .teampick-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:40;background:#fff;border:1.5px solid var(--line);border-radius:11px;
    padding:10px 12px;min-width:230px;max-height:60vh;overflow:auto;box-shadow:0 10px 30px rgba(15,23,42,.14);text-align:left}
  .teampick-menu[hidden]{display:none}
  .teampick-menu label{display:flex;gap:9px;align-items:center;padding:6px 2px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
  .teampick-menu label.all{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:8px}
  .teampick-menu input{width:16px;height:16px;accent-color:var(--b700)}
  .teampick-act{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
  .tblfoot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--b50)}
  a.tel{color:var(--b600);text-decoration:none}

  /* dark mode -- one class on <body>, every colour comes from the variables above */
  body.dark{--zebra:#0F1828;--bg:#0B1120;--card:#131C2E;--line:#22304A;--ink:#E5EAF2;--mut:#8B9AB3;--soft:#64748B;
    --b50:#16233C;--b100:#22304A;--b900:#060D1C;--b950:#040914;
    --okbg:#12301F;--okline:#1D5136;--warnbg:#33260C;--warnline:#5C4517;--badbg:#3A1512;--badline:#6B2620}
  body.dark input,body.dark select,body.dark textarea,body.dark .btn.ghost,body.dark .tcell{background:#0F1830;color:var(--ink)}
  body.dark th{background:#101B31}
  body.dark .menuBtn{background:#0F1830;color:var(--ink)}
  body.dark #signin .box{background:var(--card)}
  /* paired boards side by side on a wide screen, stacked on a phone */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:1000px){ .pair{grid-template-columns:1fr} }
  tr.totrow td{font-weight:800;background:var(--b50);border-top:2px solid var(--b100)}
  /* The leader reports' segments: one leader's teams, then that leader's own JUMLA, then the
     next leader in the same table -- so the subtotal has to read as a rule under the group,
     and the narrow column is the wall between "how we are doing" and "how we did on this same
     day last time". */
  td.subrow{font-weight:800;background:var(--b50);border-top:1.5px solid var(--b100)}
  td.gapcol{width:6px;min-width:6px;padding:0;background:var(--line)}
  /* presentation: a real projector deck, full screen, dark, readable across a room */
  /* THE DECK FOLLOWS THE THEME. It was a fixed dark navy whatever the rest of the system was
     set to, so somebody working in light mode got a black screen thrown at them on the
     projector -- and a bright meeting room is exactly where a light deck reads better. Every
     colour here is a variable that flips with body.dark, so one toggle changes both. */
  :root{ --pbg:#FFFFFF; --pink:#0F172A; --plab:#1D4ED8; --pline:rgba(8,28,74,.14);
         --psoft:rgba(11,42,107,.06); --pedge:rgba(8,28,74,.10) }
  body.dark{ --pbg:#081C4A; --pink:#FFFFFF; --plab:#93C5FD; --pline:rgba(255,255,255,.22);
             --psoft:rgba(255,255,255,.07); --pedge:rgba(255,255,255,.12) }
  #pres{display:none;position:fixed;inset:0;z-index:200;background:var(--pbg);color:var(--pink);padding:26px 34px;overflow:auto}
  #pres .phead{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;margin-bottom:18px}
  #pres .pnum{margin-left:auto;font-size:15px;font-weight:600;color:var(--plab)}
  #pres .pclose{background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
  /* PRAYERS, AND THE TELEVISION. Switching the TV off and back on costs the meeting a minute
     of waiting for the deck to come back. This covers the screen instead: pure black, one white
     mark to end it, the deck untouched underneath and the clock stopped so nothing is missed. */
  #pres .pblankbtn{background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);
    height:38px;padding:0 15px;border-radius:19px;font-size:13.5px;font-weight:700;cursor:pointer;
    white-space:nowrap;margin-right:8px}
  #pres .pblank{position:fixed;inset:0;background:#000;z-index:99;cursor:pointer;
    display:flex;align-items:center;justify-content:center}
  #pres .pblank .pbx{color:#fff;font-size:34px;opacity:.5;line-height:1;
    border:2px solid rgba(255,255,255,.5);border-radius:50%;width:74px;height:74px;
    display:flex;align-items:center;justify-content:center}
  #pres .pblank .pbnote{position:absolute;bottom:38px;left:0;right:0;text-align:center;
    color:rgba(255,255,255,.32);font-size:13px;letter-spacing:.04em}
  /* The arrows. On a TV nobody is holding a keyboard, and on a phone or tablet there are no
     arrow keys at all -- so the two things a person wants during a deck have to be touchable.
     Big, at the vertical middle, hard against each edge where a thumb already is. */
  #pres .ptot td{border-top:2px solid var(--pline);font-weight:800;background:var(--psoft)}
  #pres .pnav{position:fixed;top:50%;transform:translateY(-50%);z-index:210;
    background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:64px;height:96px;
    font-size:34px;line-height:1;cursor:pointer;border-radius:12px;
    display:flex;align-items:center;justify-content:center}
  #pres .pnav:hover{background:var(--b100);color:var(--b800)}
  #pres .pprev{left:10px} #pres .pnext{right:10px}
  /* Out of the way on a small screen: half the size, and low enough not to sit over a name. */
  @media (max-width:700px){ #pres .pnav{width:44px;height:64px;font-size:24px} }
  #pres .pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  #pres .pkpi{background:var(--psoft);border:1px solid var(--pedge);border-radius:16px;padding:22px}
  #pres .pl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--plab)}
  #pres .pv{font-size:40px;font-weight:800;margin-top:8px}
  /* A SLIDE THAT DOES NOT FIT IS A SLIDE NOBODY CAN READ FROM THE BACK OF THE ROOM.
     The deck was written for six columns and now carries nine -- the five collection days plus
     the week -- and at a fixed 19px the wide boards ran off the edge of the projector. Nobody
     scrolls sideways during a meeting; they just do not see the last column.

     So the type SIZES ITSELF to the screen instead of being a number somebody guessed:
     clamp() keeps it between 11px and 19px and lets the viewport choose in between, and the
     padding shrinks with it. On a wide monitor nothing changes at all. On a laptop or a small
     projector the table gets smaller rather than wider, which is the trade a room actually
     wants.

     `table-layout:fixed` with wrapping headers stops one long officer name stretching a column
     past its share, which is what turns a table that ALMOST fits into one that does not. */
  #pres .ptable{width:100%;max-width:100%;border-collapse:collapse;table-layout:fixed;
    font-size:clamp(11px, 1.25vw, 19px)}
  #pres .ptable th{text-align:left;padding:clamp(4px,.55vw,10px) clamp(5px,.7vw,12px);color:var(--plab);
    font-size:clamp(9px,.9vw,14px);text-transform:uppercase;line-height:1.2;
    border-bottom:1px solid var(--pline);background:transparent;
    overflow-wrap:anywhere;word-break:break-word}
  #pres .ptable td{padding:clamp(4px,.55vw,10px) clamp(5px,.7vw,12px);border-bottom:1px solid var(--pedge);
    overflow-wrap:anywhere}
  /* The first column is the name and needs the room; the figure columns are all short. */
  #pres .ptable th:first-child, #pres .ptable td:first-child{width:auto}
  #pres .ptable .r{text-align:right;white-space:nowrap}
  /* And a last resort: if a board is still wider than the screen, it scrolls INSIDE its own
     box rather than pushing the whole slide sideways and hiding the navigation arrows. */
  #pres .pscroll{overflow-x:auto;max-width:100%}
  /* A SLIDE THAT DOES NOT FIT TOP TO BOTTOM IS THE SAME FAULT SIDEWAYS.
       "Hope calls slide height should autofit since we cant keep scrolling to see the last
        pmo's data"
     The HOPE Calls slide lists every officer of the three units -- deliberately, so nobody sits
     unseen in the middle -- which on a full roster is thirty-odd rows, and the room was
     scrolling to reach the bottom of the ranking. presFit_ measures the drawn table against
     the space under the heading and, when it is taller, sets the table's font size to the
     ratio; everything below is in em so the rows shrink with the type. The floor is 8px:
     past that a slide is not readable from the back of the room, and the box scrolls as it
     always did. A table that fits is left exactly as the clamp() rule above sizes it. */
  #pres .ptable.pfit th{font-size:.75em;padding:.3em .5em}
  #pres .ptable.pfit td{padding:.3em .5em}
  /* The caption under a table slide: a heading word, then one line per unit. */
  #pres .pcap{margin-top:clamp(8px,1.4vh,18px);font-size:clamp(11px,1.05vw,17px);line-height:1.5;color:var(--pink)}
  #pres .pcap .pcaph{font-weight:800;color:#DC2626;text-transform:uppercase;letter-spacing:.04em;font-size:.9em}
  #pres .pcap b{color:var(--plab)}
  /* The stand-in slide for boards that are loading or did not load: readable from the back of the room. */
  #pres .pnote{padding:10vh 6vw;text-align:center;font-size:clamp(16px,2.2vw,40px);line-height:1.5;color:var(--pink)}
  /* DAY PROGRESS -- the three office units on ONE slide, and it has to fit: sixteen officers
     with a bar apiece. Three columns, each sized to the screen the way the tables are (clamp on
     width for the type, on height for the row spacing), so a laptop and a television both show
     the whole thing without anybody scrolling in a meeting. */
  #pres .pprog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.4vw,26px)}
  @media (max-width:900px){ #pres .pprog{grid-template-columns:1fr} }
  #pres .pgrp{background:var(--psoft);border:1px solid var(--pedge);border-radius:14px;padding:clamp(8px,1.2vw,22px);min-width:0}
  #pres .pgh{color:var(--plab);font-size:clamp(10px,1vw,15px);text-transform:uppercase;letter-spacing:.05em;font-weight:800;
    margin-bottom:clamp(4px,.6vh,10px);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  #pres .pgh small{text-transform:none;letter-spacing:0;font-weight:600;opacity:.75;white-space:nowrap}
  /* Six rows a column has to fill a television, not huddle in its top half: the type follows
     the width and the spacing follows the HEIGHT, so a tall screen spreads the rows out. */
  #pres .prow{padding:clamp(2px,1.1vh,18px) 0;border-top:1px solid var(--pedge);font-size:clamp(10px,1vw,19px);line-height:1.25}
  #pres .prow:first-of-type{border-top:0}
  #pres .prow.none{opacity:.5}
  /* The grand total, ruled off like the tables' own JUMLA row. */
  #pres .prow.ptotal{border-top:2px solid var(--pline);background:var(--psoft);margin-top:4px;
    padding-left:clamp(4px,.5vw,8px);padding-right:clamp(4px,.5vw,8px);border-radius:8px}
  #pres .prow.ptotal .po{color:var(--plab)}
  #pres .prow.pavg{border-top:1px solid var(--pedge);margin-top:0;background:transparent}
  #pres .pr1{display:flex;align-items:baseline;gap:8px;min-width:0}
  #pres .pr1 .pn{width:1.6em;color:var(--plab);font-weight:800;flex:none}
  #pres .pr1 .po{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #pres .pr1 .pd{font-weight:800;flex:none;white-space:nowrap;font-variant-numeric:tabular-nums}
  #pres .pr1 .pd.up{color:#16A34A} #pres .pr1 .pd.down{color:#DC2626} #pres .pr1 .pd.flat{opacity:.6}
  #pres .pbar{position:relative;height:clamp(6px,1.1vh,15px);border-radius:6px;background:var(--pedge);margin:clamp(2px,.5vh,9px) 0;overflow:hidden}
  #pres .pbar i{position:absolute;top:0;bottom:0;border-radius:6px}
  #pres .pbar .ps{left:0;background:var(--plab);opacity:.55}
  #pres .pbar .pg{background:#16A34A}
  #pres .pbar .pls{background:#DC2626}
  #pres .pr2{display:flex;justify-content:space-between;gap:8px;font-size:.82em;opacity:.85;white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
  #pres .pr2 span{overflow:hidden;text-overflow:ellipsis}
  /* Its own flex item, after the name: the NAME gives way to the ellipsis, never the tag. */
  #pres .ptag{font-size:.7em;font-weight:800;padding:1px 6px;border-radius:999px;flex:none;white-space:nowrap}
  #pres .ptag.best{background:rgba(22,163,74,.18);color:#16A34A}
  #pres .ptag.stuck{background:rgba(220,38,38,.18);color:#DC2626}
  /* tips toast */
  #tip{position:fixed;right:18px;bottom:18px;max-width:330px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--b500);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink);
    box-shadow:0 14px 34px -18px rgba(8,28,74,.6);opacity:0;transform:translateY(12px);transition:all .3s ease;
    pointer-events:none;z-index:70}
  #tip.show{opacity:1;transform:none}
  .msg{padding:34px 18px;text-align:center;color:var(--mut);font-size:13px}
  .msg.bad{color:var(--bad)}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600);border:1px solid var(--b100)}
  .chip.ok{background:var(--okbg);color:var(--ok);border-color:var(--okline)}
  .chip.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
  .chip.bad{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
  .chip.mut{background:#F1F5F9;color:var(--mut);border-color:var(--line)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar select,.bar input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .bar select:focus,.bar input:focus{outline:none;border-color:var(--b500)}
  .note{padding:10px 13px;border:1px solid var(--warnline);background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:12.5px;margin-bottom:12px}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
  /* A note that REPORTS rather than warns -- the Expected tab's date line, on screen every
     time, turning red only when the list is not today's. Without this it wore the warning
     colours with green text laid over them, which reads as a fault dressed up as good news.
     Both themes already carry the ok palette. */
  .note.good{border-color:var(--okline);background:var(--okbg);color:var(--ok)}
  /* THE DAILY BONUS PLAN preview (bonusplan). Tokens only, so it follows the dark theme. */
  .bp .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;padding:12px 14px}
  .bp .box{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
  .bp .box.new{border-color:var(--b300);background:var(--b50);color:var(--b900)}
  body.dark .bp .box.new{background:#0F1830;color:var(--ink)}
  .bp .box .t{display:block;font-size:13px;margin-bottom:3px}
  .bp .cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:12px 14px;align-items:end}
  .bp .cfg .fld{margin:0}
  .bp .scroll2{overflow-x:auto}
  .bp .bpt{width:100%;border-collapse:collapse;font-size:12.5px}
  .bp .bpt th,.bp .bpt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:middle}
  .bp .bpt th:first-child,.bp .bpt td:first-child{text-align:left}
  .bp .bpt input{width:66px;padding:5px 6px;border:1.5px solid var(--line);border-radius:7px;text-align:right}
  .bp .bpt select{padding:5px 6px;border:1.5px solid var(--line);border-radius:7px}
  .bp .bpt tr.ahead td{opacity:.45}
  .bp .gate{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;font-size:11px;font-weight:700;text-align:center;background:var(--line);color:var(--mut)}
  .bp .gate.y{background:var(--okbg);color:var(--ok)}
  .bp .gate.n{background:var(--badbg);color:var(--bad)}
  .bp .meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden;min-width:90px}
  .bp .meter i{display:block;height:100%;background:var(--ok)}
  .bp .bpul{margin:8px 0 0;padding:0 14px 12px 32px;font-size:12.5px;line-height:1.6}
  .bp .pills .pill{cursor:pointer}
  /* the open/close chip for the long Settings sections */
  details.fold{margin:14px 0}
  details.fold>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:8px;
    padding:7px 14px;border:1.5px solid var(--line);border-radius:20px;font-weight:700;font-size:12.5px;
    background:var(--card);user-select:none}
  details.fold>summary::-webkit-details-marker{display:none}
  details.fold>summary .arr::after{content:'▸'}
  details.fold[open]>summary .arr::after{content:'▾'}
  details.fold>summary .fsub{font-weight:400;color:var(--mut)}
  details.fold[open]>summary{margin-bottom:10px}

  /* commission rate editor + report cleanup: forms that live INSIDE a card, not a drawer,
     because typing a rate and watching the numbers move is the whole point of both. */
  .cmsrates,.cleanbox{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .cmsrates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;align-items:end}
  .cmsrates .note,.cleanbox .note{grid-column:1/-1;margin:0}
  .checks{display:flex;flex-wrap:wrap;gap:6px 16px}
  .checks label,.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .checks input,.chk input{width:auto;margin:0}
  .chk{margin:6px 0 10px}
  .clact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .passout{margin:12px 0;padding:12px 14px;border:1.5px solid var(--okline);background:var(--okbg);border-radius:10px;text-align:center}
  .passout .pl{font-size:11.5px;color:var(--ok);font-weight:700;margin-bottom:6px}
  .passout .pv{font-size:26px;font-weight:800;letter-spacing:.14em;font-family:ui-monospace,Menlo,monospace;color:var(--ok)}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
  .clickrow{cursor:pointer}
  .kpis.sm .kpi{padding:8px 10px}
  .kpis.sm .kpi .v{font-size:16px}
  .rxsched{margin:10px 0 14px;max-height:280px;overflow:auto}
  /* Complaint audit trail. Deliberately NOT .hist -- that class already styles the follow-up
     comment history, and reusing it silently restyled both. */
  .cxhist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .cxhist h4{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
  .cxhist .hrow{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .cxhist .hrow:last-child{border-bottom:0}
  .cxhist .hat{float:right;color:var(--mut);font-size:11px}
  .cxhist .hnote{color:var(--mut);margin-top:2px;clear:both;font-size:12px}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
  .btn.good{background:var(--ok);border-color:var(--ok);color:#fff}   /* the green half of a green/red pair (the staff card's Active / Inactive) */

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(8,17,34,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
  .drawer{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
  /* A drawer that holds a TABLE, not a form, takes the WHOLE screen of whatever device it is on: seven money columns in 560px is a strip somebody
     scrolls sideways through -- "widen the recovery card ... its so thick for the content". */
  .drawer.wide{max-width:100%;border-radius:0}
  .drawer h3{margin:0 0 4px;font-size:16px}
  .drawer .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}

  /* THE ASSESSMENT DRAWER'S OWN HEADER + STAGE SWITCHER -- "sticky customer card header while
     scrolling" and "horizontal (not vertical) assessment stage switcher, business as 2nd
     stage". Sticky to the DRAWER's own scroll box (.drawer has the overflow, not the page), a
     solid background so the panel beneath does not show through while it scrolls under. */
  .ln-sticky{position:sticky;top:-16px;margin:-16px -16px 10px;padding:16px 16px 10px;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
  .ln-stagebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .ln-stagebar .btn{flex:none;white-space:nowrap}
  .ln-stage-panel{display:none}
  .ln-stage-panel.on{display:block}

  /* "NIDA/phone number progress-dot input" -- shows how many digits are still needed WITHOUT
     masking anything already typed, unlike a password dial. One dot per expected digit. */
  .ln-dots{display:flex;gap:3px;margin-top:5px;flex-wrap:wrap}
  .ln-dots span{width:7px;height:7px;border-radius:999px;background:var(--line);flex:none}
  .ln-dots span.filled{background:var(--b600,#2563EB)}
  .ln-dots span.over{background:var(--bad,#DC2626)}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--b500)}
  .facts{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
  .frow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .frow:last-child{border-bottom:0}
  .frow span:first-child{color:var(--mut)}
  .hist{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .t{display:flex;justify-content:space-between;color:var(--soft);font-size:10.5px;margin-bottom:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:11px 18px;
    border-radius:10px;font-size:13px;z-index:80;display:none;max-width:90vw}
  .toast.bad{background:var(--bad)}

  /* The menu stays on the LEFT at every size -- on a phone it slides in over the content
     instead of becoming a row of tabs across the top, so the navigation is always in the
     same place and the header stays readable. */
  .menuBtn{display:none;flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;align-items:center;justify-content:center}
  .scrim{display:none;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:39}
  @media (max-width:820px){
    .menuBtn{display:flex}
    .side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:230px;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    body.navopen .side{transform:none}
    body.navopen .scrim{display:block}
    .main{width:100%}
    .top{padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px}
    .body{padding:12px}
    .top h1{font-size:15px}
    .top .q{min-width:0;flex:1}
  }

  /* =====================================================================================
     GLASS EDGES -- the outline of every panel, and nothing else.
     =====================================================================================
       "can the app outer widgets margins be like the nowdays iphone glassed-like ones,
        not distrubing colors but only margins i think , am not sure"

     So this block touches THREE properties: the corner radius, the hairline on panels whose
     line is the neutral grey, and the shadow that puts a little air under a panel. Not one
     background, not one text colour, and not one of the SEMANTIC borders -- a warning keeps
     its amber edge, the total tile keeps its navy, the chosen pill keeps its blue -- because
     those carry meaning and an edge does not.

     WHY IT READS AS GLASS WITHOUT BEING SEE-THROUGH. On a phone, what makes a panel look like
     a pane is not the transparency; it is the edge. A wider, rounder corner, a hairline
     softer than a drawn line, a faint catch of light along the top, and a wide low shadow
     that lifts the panel off the page. Actual translucency over a white card would tint every
     figure printed on it, which is the one thing that was asked not to happen. Where something
     genuinely floats OVER the page -- a drawer, the notice, the menu on a phone -- the blur is
     real, because there the glass is doing what glass does and no figure sits behind it.

     Interior lines are deliberately left alone. A table's row rules, a card's header divider
     and a field's border are structure, not margin, and rounding them would only make the
     content look loose.

     It is last in the file on purpose, and every selector is at most as specific as the rule
     it softens, so anything carrying its own colour keeps it. */
  :root{
    --gr:16px;                                            /* panels */
    --gr-sm:12px;                                         /* tiles and controls */
    --gline:rgba(15,23,42,.09);
    --ghi:inset 0 1px 0 rgba(255,255,255,.85);            /* the light along the top edge */
    --gsh:0 1px 1.5px rgba(8,28,74,.045), 0 10px 26px -16px rgba(8,28,74,.30);
    --gsh-sm:0 1px 1px rgba(8,28,74,.04), 0 5px 14px -10px rgba(8,28,74,.26);
  }
  /* In the dark the light comes from inside the pane, not off it -- a white highlight at 85%
     on a dark card is a scratch, not a sheen. */
  body.dark{
    --gline:rgba(255,255,255,.11);
    --ghi:inset 0 1px 0 rgba(255,255,255,.05);
    --gsh:0 1px 1.5px rgba(0,0,0,.30), 0 12px 30px -18px rgba(0,0,0,.85);
    --gsh-sm:0 1px 1px rgba(0,0,0,.25), 0 6px 16px -11px rgba(0,0,0,.75);
  }

  /* Panels */
  .card,.facts{border-color:var(--gline);border-radius:var(--gr);box-shadow:var(--gsh),var(--ghi)}
  .kpi{border-color:var(--gline);border-radius:var(--gr-sm);box-shadow:var(--gsh-sm),var(--ghi)}
  /* The tip keeps its blue left edge -- that stripe is how you know which kind of message it
     is -- so it is given the shape and the lift and none of the hairline. */
  #tip{border-radius:var(--gr);box-shadow:0 18px 40px -20px rgba(8,28,74,.55),var(--ghi)}
  /* Shape only: every one of these carries a colour that means something. */
  .tcell,.note,.passout{border-radius:var(--gr-sm)}

  /* Controls -- rounder to match the panels they sit on, nothing else changed. */
  .btn{border-radius:12px}
  .btn.sm{border-radius:11px}
  .menuBtn,.pills .pill,.pills select,.bar select,.bar input,.top .q{border-radius:11px}
  .fld input,.fld select,.fld textarea{border-radius:12px}

  /* THINGS THAT ACTUALLY FLOAT, where the blur is real glass rather than an impression of it.
     Nothing readable sits behind these while they are open, so nothing is tinted. */
  .drawer{border-radius:22px 22px 0 0;box-shadow:0 -18px 50px -24px rgba(8,28,74,.55)}
  #annBox,#signin .box{border-radius:20px}
  .drawer-bg,.scrim,#annBg{-webkit-backdrop-filter:blur(14px) saturate(120%);backdrop-filter:blur(14px) saturate(120%)}
  @media (max-width:820px){
    .side{border-radius:0 20px 20px 0}
  }

  /* TWO PANELS THAT NEVER LEARNED ABOUT THE DARK.
     Not part of the edges above -- found while looking at them. Every other surface takes its
     background from --card and flips with the theme; these two were painted #fff outright, so
     in dark mode they came back as white slabs carrying pale grey text that cannot be read.
     The chosen pill is excluded by name so it keeps its blue, which is how you know which day
     you are looking at. */
  body.dark .facts,
  body.dark .pills .pill:not(.on){background:var(--card)}
</style>
</head>
<body>

<div id="signin">
  <div class="box">
    <h2>HOPE PMO</h2>
    <p>Weka msimbo wako wa kuingia. / Enter your access code.</p>
    <input id="code" placeholder="Access code" autocomplete="off" data-secret>
    <button class="btn w" id="inBtn">Ingia / Sign in</button>
    <div id="inErr" style="color:var(--bad);font-size:12.5px;margin-top:10px"></div>
    <a href="/" style="display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--mut)">&larr; Menu</a>
  </div>
</div>

<div class="shell hide" id="shell">
  <aside class="side">
    <div class="brand">HOPE MICROCREDIT<small>MKOPO CHAP CHAP</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <b id="meName">—</b><span id="meRole">—</span>
      <a href="/call" id="swapCalls" title="Badili kwenda simu">&#128222; Simu / Calls</a>
      <button id="outBtn">Toka / Sign out</button>
    </div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="menuBtn" id="menuBtn" title="Menyu / Menu">&#9776;</button>
      <h1 id="title">Dashboard</h1>
      <!-- The writing bar that used to sit here (the table filter) was removed on request:
           "The search icon on top should do tafuta mteja work and remove the sidenav and the
           writing bar before language switch". One search, one place: the magnifier. -->
      <button class="btn sm ghost" id="langBtn" title="Lugha / Language">SW</button>
      <!-- A LIGHTBULB, NOT A SECOND BELL. This was &#128276; -- the identical character the
           notifications button uses -- so the bar carried two bells, and the one without the
           unread badge read as a notification bell that does nothing when tapped
           ("the system had 2 notification icons the first one not working"). It was never

<script>
/* ES5-plain on purpose: this runs inside the Android WebView on whatever phone an officer
   owns. No build step, no framework, no CDN. */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n = Number(n)||0; return Math.round(n).toLocaleString('en-US'); }
/* THE AMOUNT, NOT A NOTE. "put no extra note, include the amount" -- when an Iliyonasia has
   moved a tile's own figure, this says by how much, signed, right beside it, instead of a
   sentence explaining that it moved. Empty string when nothing was registered, so an
   untouched tile reads exactly as it always has. */
function adjTag_(n){
  n = Number(n) || 0;
  if (!n) return '';
  return ' <span class="mutl">(rekebisho / adj '+(n>0?'+':'')+money(n)+')</span>';
}
/* "have J1 and J2 showing amount in 2.4m format single decimal" -- a weekend's recovery in the
   width of a day column, where the full figure would push the table off the screen. */
function m1_(v){
  if (v == null || v === '' || isNaN(v)) return '';
  var a = Math.abs(Number(v));
  // A trailing ".0" is noise, not precision: 2.4m, but 850k rather than 850.0k.
  var cut = function(x){ return x.toFixed(1).replace(/\.0$/, ''); };
  if (a >= 1e6) return cut(Number(v)/1e6)+'m';
  if (a >= 1e3) return cut(Number(v)/1e3)+'k';
  return String(Math.round(Number(v)));
}
/* The server's own num(), mirrored here. The Iliyonasia screen used it out of server habit
   with no definition on this page, and the first REAL adjustment row killed the whole tab
   with "num is not defined" -- a ReferenceError no parse guard can see. Defined once, the
   habit is safe on either side of the wire. */
function num(v){ v = Number(v); return isFinite(v) ? v : 0; }
/* A percentage, or a string that is ALREADY one. The grand-total row hands back "~62.5%" for
   a column it could only average rather than recompute -- the ~ is the whole point of it, so
   this has to let a formatted string through instead of running it past isNaN and printing a
   dash where a real summary was worked out. */
/* WHOLE NUMBERS, EVERYWHERE. "approximate all percentages like 96.7 = 97 everywhere not only
   dashboards but everywhere at commissions inclusive". The server still carries a decimal so
   ranking and the colour rule stay exact; the SCREEN says 97. A string that already ends in
   % (the total row's "~56.7%") is rounded the same way rather than passed through. */
function pct(v){
  if (typeof v === 'string' && v.charAt(v.length-1) === '%') {
    var n = parseFloat(v.replace(/[~%\s,]/g, ''));
    return isNaN(n) ? v : (v.charAt(0) === '~' ? '~' : '') + Math.round(n) + '%';
  }
  return (v==null||isNaN(v)) ? '\u2014' : Math.round(Number(v)) + '%';
}
function mb(b){ b = Number(b)||0;
  if (b >= 1073741824) return (b/1073741824).toFixed(2)+' GB';
  if (b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  return Math.round(b/1024)+' KB'; }
function fmtDur(sec){ sec = Math.max(0, Math.round(Number(sec)||0)); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  function p2(n){ return (n<10?'0':'')+n; } return h>0 ? (h+':'+p2(m)+':'+p2(s)) : (m+':'+p2(s)); }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
/* The Android app tracks an officer's location natively (OfficerLocationService) so it keeps
   working while the app is off screen, which needs the signed-in code OUTSIDE this WebView's
   own localStorage -- pushed here at every point the code changes, mirroring hopeCode exactly.
   A no-op everywhere else (plain browser, iOS, an old APK without the bridge method yet). */
function pushOfficerCode_(code){ try{ if (window.HopeCalls && HopeCalls.setOfficerCode) HopeCalls.setOfficerCode(code||''); }catch(e){} }
function toast(m, bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':'');
  t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3200); }
function today(){ var d=new Date(Date.now()+3*3600*1000); return d.toISOString().slice(0,10); }   // EAT
function addDays(key,n){ var d=new Date(key+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
/* Today as the server counts it -- on the Dar es Salaam clock, never the browser's timezone. */
function todayKeyClient(){ return new Date(Date.now() + 3*3600*1000).toISOString().slice(0,10); }
/* 'yyyy-mm' plus n months. */
function addMonths(ym, n){ var d=new Date(ym+'-01T12:00:00Z'); d.setUTCMonth(d.getUTCMonth()+n); return d.toISOString().slice(0,7); }

var WDFULL = { MON:'Monday', TUE:'Tuesday', WED:'Wednesday', THU:'Thursday', FRI:'Friday', SAT:'Saturday', SUN:'Sunday' };
var WD7 = ['MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT', 'SUN'];   // calendar order, Monday first
/* THE DAYS AS THE OFFICERS SAY THEM. Swahili weekday names carry their own number -- Jumamosi
   (mosi, 1st), Jumapili (pili, 2nd), Jumatatu (tatu, 3rd), Jumanne (nne, 4th), Jumatano (tano,
   5th) -- then Alhamisi and Ijumaa. So the working week reads J3 J4 J5 AL IJ, which is what is
   written on every board in every branch. MON/TUE/WED is the translation, not the original. */
var SWDAY = { MON:'J3', TUE:'J4', WED:'J5', THU:'AL', FRI:'IJ', SAT:'J1', SUN:'J2' };
function wdLabel(w){ return SWDAY[String(w||'').toUpperCase()] || w; }
var S = { code:'', me:null, view:'dashboard', data:null, rows:[], cols:[], q:'', sort:null, asc:true,
          sort2:null, asc2:false,
          args:{}, filters:{}, foot:'', roles:[], lang:'sw', tips:null, tipTimer:null, rid:0,
          targets:{},                       // the three % targets, from hints (see the colour rule)
          teamsCache:null, teamsCacheAt:0,   // see srvTeams_ -- the roster shared by Adjust/Teams/Settings
          /* ALWAYS BOOTS TO 'hopepmo', NEVER REMEMBERED. Only an admin ever sees the switch at
             all, and even for them a page load lands on the real book by default every time --
             the sandbox has to be chosen on purpose, on this visit, never carried in from a
             tab that was left open in it yesterday. */
          workspace: 'hopepmo' };

/* Which portal calls only LOOK at data. Everything not on this list is treated as a change to
   the books, which throws the whole remembered screen away -- a save on one tab can move the
   numbers on any other, so it is never safe to keep showing what we had.
   Fails safe on purpose: a name nobody listed here is assumed to write, so the worst a
   forgotten entry can do is bring back the old behaviour of always asking the server. */
var READ_FNS = { dashboardFull:1, dashboardProbe:1, officerBoards:1, expectedDay:1, expdfReport:1,
  expectedDefaulters:1, assignments:1, followup:1, followupReport:1, promises:1, par:1,
  weekly:1, leaderReports:1, reports:1, commission:1, callReport:1, callAgents:1,
  complaints:1, complaintLog:1, restructures:1, restructureEligible:1, legalPreview:1,
  legalFind:1, legalRecoveries:1, demandNoticePrint:1, demandNotices:1, abnormal:1, deductions:1,
  advStaff:1, advRequestPage:1, advQueue:1, advReport:1, credit:1, teams:1, staffRoster:1, settings:1, storageUsage:1,
  accessCodes:1, officerAccounts:1, loans:1, loanPipeline:1, hints:1, comments:1,
  // HOPE Loan's own reads -- opening a queue must not wipe the HOPE PMO screens' cache, and
  // vice versa; both live under one cache key scheme, so both lists matter equally.
  csSearch:1, managerQueue:1, teamQueue:1, seniorQueue:1, creditQueue:1, disburseQueue:1,
  disburseWindowStatus:1, financeBankReport:1, carriersList:1, adjustmentsList:1, pipelineSummary:1,
  reversalsList:1, paymentsList:1, complaintsList:1, adjustments:1,
  imprestRoles:1, imprestMine:1, imprestQueue:1, imprestReport:1, imprestPhotos:1,
  contractPhotosForShare:1, planPhotosForShare:1 };
// key = which remembered screen is on display right now. Views fill in their own defaults as
// they load (Expected decides the weekday, for one), so the key a screen is FILED under is not
// the key you would work out from the state afterwards -- keep the real one, or later touches
// like a team filter get written to a slot nobody reads.
var VC = { store:{}, watch:null, key:'' };
/* Set once at boot from ?imp=<id> (the GM email's "open in the portal" link) and cleared the
   moment it has been acted on -- see imprestOpenDeepLink_, called from drawView_(). */
var IMPREST_DEEPLINK_ID = null;
/* THE BUILD STAMP. Bumped by hand with every front-end change -- there is no build step in
   this system (public/*.html is served exactly as written), so this string IS the version.
   Read it aloud when a screen looks wrong: it says at once whether the fix is even present. */
var BUILD = '2026-10-16-j';

/* One call shape for the whole portal -- every tab goes through /api/portal. */
/* THE SERVER DID NOT SEND JSON, AND SAYING SO IN JAVASCRIPT'S WORDS HELPS NOBODY.
   A function that runs out of time or crashes is answered by the host with an HTML page, so
   r.json() throws  Unexpected token 'A', "An error o"...  -- which reads like a bug in this page
   and is in fact the server saying it gave up. Told plainly, with the status, it is something
   somebody can act on instead of paste into a search engine. */
function readJson_(r){
  return r.text().then(function(t){
    try { return { status: r.status, body: JSON.parse(t) }; }
    catch (e) {
      var slow = r.status === 504 || r.status === 408 || /timed? ?out|TIMEOUT/i.test(t);
      throw new Error((slow
        ? 'Seva imechukua muda mrefu mno / the server took too long'
        : 'Seva imeshindwa kujibu / the server could not answer')
        + ' \u2014 HTTP ' + r.status);
    }
  });
}
function srv(fn, args){
  if (!READ_FNS[fn]) {
    VC.store = {};                       // something changed: nothing remembered is trustworthy
    if (VC.watch) VC.watch.ok = false;   // and a screen built on top of a change is not either
    S.teamsCache = null;                 // the roster this held may be exactly what just changed
  }
  /* A DEADLINE. The platform gives up on a function at sixty seconds; this stops just short,
     so a screen that is never going to arrive says so instead of spinning until somebody
     reloads the page and starts the same wait again. Longer than the phone's twenty-five
     seconds on purpose -- the heaviest screens here legitimately take several. */
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 45000);
  var post = function(){
    return fetch('/api/portal', {
      method:'POST', headers:{'Content-Type':'application/json'},
      // `workspace` travels on EVERY call, not just the loan ones -- the server is the one place
      // that decides whether it is honoured (see api/_lib/workspace.js), so a stray value here
      // can, at worst, be ignored, never grant anything on its own.
      body: JSON.stringify({ code:S.code, fn:fn, args:args||{}, workspace:S.workspace }),
      signal: ctl ? ctl.signal : undefined
    });
  };
  /* ONE RETRY WHEN THE LINE DROPS A READ. "Failed to fetch" is not the server saying no -- it
     is the connection going before an answer came back, which on a field phone during a long
     dashboard read is ordinary. A READ can be asked again safely; a write cannot, and is not.
     The 45-second deadline covers both attempts together. */
  var attempt = function(n){
    return post().then(function(r){ clearTimeout(timer); return readJson_(r); },
      function(e){
        if (/abort/i.test(String((e && e.message) || e)) || (e && e.name === 'AbortError')) {
          clearTimeout(timer);
          throw new Error('Seva haijibu ndani ya sekunde 45 / the server did not answer within 45 seconds');
        }
        if (n < 1 && READ_FNS[fn] && (!e || !e.status)) {
          return new Promise(function(res){ setTimeout(res, 1500); }).then(function(){ return attempt(n + 1); });
        }
        clearTimeout(timer);
        throw e;
      });
  };
  return attempt(0)
    .then(function(x){
      if (x.status>=200 && x.status<300 && x.body.ok!==false) return x.body;
      /* The admin closed the system while this page was open. Every tab from here on would
         answer the same way, so a red message on each one teaches nothing -- say it once and
         go back to the launcher, which knows how to explain what is still available. */
      /* A CODE THAT IS NO LONGER CURRENT IS A SIGN-OUT, NOT A RED MESSAGE.

           "always logout all devices signed in with non current app codes"

         Every request already re-checks the code against the table, so rotating or deleting
         one does stop it working the moment it is saved. What was missing was this side: the
         401 came back and was drawn as "Imeshindikana / could not load" on whatever screen
         the person was looking at, so the device sat there still holding a dead code and
         offering it again on every tap. The stored code goes and the session ends, on every
         device, the next time any of them asks the server for anything -- which is what
         "logged out" has to mean when there is no way to reach a handset directly. */
      if (x.status === 401){
        store('hopeCode', null);
        VC.store = {}; if (VC.watch) VC.watch.ok = false;
        document.body.innerHTML = '<div class="msg" style="padding:40px;text-align:center;line-height:1.8">'
          + 'Msimbo wako si wa sasa &mdash; umetolewa nje.<br>'
          + 'Your access code is no longer current &mdash; you have been signed out.<br><br>'
          + '<a class="btn" href="/">Ingia upya / Sign in</a></div>';
        throw new Error((x.body && x.body.error) || 'Msimbo si sahihi. / That code is not current.');
      }
      if (x.status === 403 && x.body && /HOPE Calls/.test(String(x.body.error||''))){
        document.body.innerHTML = '<div class="msg" style="padding:40px;text-align:center;line-height:1.8">'
          + 'Mfumo umefungwa kwa sasa &mdash; tumia HOPE Calls.<br>'
          + 'The system is closed for now &mdash; please use HOPE Calls.<br><br>'
          + '<a class="btn" href="/">Rudi / Back</a></div>';
        throw new Error(x.body.error);
      }
      throw new Error((x.body && x.body.error) || ('HTTP '+x.status));
    });
}
/* THE TEAMS ROSTER, SHARED ACROSS TABS. Adjust, Teams and Settings each ask for the whole
   teams table on their own, just to read a handful of names off it -- so hopping between the
   three admin tabs in one sitting re-fetched the same small list every time. Short-lived
   (VC_MS, the same window the rest of this file treats a screen as still current) and thrown
   away the instant anything writes -- see the READ_FNS check in srv() above -- so this never
   outlives a change the way a longer cache could. */
function srvTeams_(){
  if (S.teamsCache && (Date.now() - S.teamsCacheAt < VC_MS)) return Promise.resolve(S.teamsCache);
  return srv('teams').then(function(d){ S.teamsCache = d; S.teamsCacheAt = Date.now(); return d; });
}

/* THE ONE CALL THIS PORTAL EVER MAKES TO A SERVER THAT IS NOT ITS OWN.
   =========================================================================================
     "I dont need to fill anything during shifting from one to other"

   Shift needs a batch minted on the OTHER company's register, and until this the only way
   to get one was to open their portal by hand and copy it over. There is no standing trust
   between HOPE's backend and Hoop's -- deliberately, see deviceShift in portal-core.js -- so
   this cannot become a server-to-server call without creating exactly the cross-tenant
   credential that design refuses to hold.

   What it can be is THIS BROWSER, using an admin's OWN access code for the other portal,
   doing over the wire exactly what that admin would otherwise do by hand: open their Sajili
   simu, paste the same IMEIs, read back the batch. The code lives in localStorage on THIS
   DEVICE ONLY -- see devShiftDrawer_ -- and is never sent to hope-pmo-v2's own database,
   never logged, never in the args. Both portals already answer any origin
   (Access-Control-Allow-Origin: *; see api/_lib/auth.js), so no server change was needed to
   let this browser speak to the other company's API at all.

   One attempt, not srv()'s two-retry loop: deviceEnrol is idempotent (a re-enrol of a phone
   already there is a no-op that returns the same token), so a caller who wants to try again
   after a network hiccup can simply press Hamisha a second time -- there is no risk of it
   quietly running twice underneath one click the way a write with side effects would carry. */
function srvOther_(server, code, fn, args){
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function(){ if (ctl) ctl.abort(); }, 20000);
  return fetch(server.replace(/\/+$/, '') + '/api/portal', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: code, fn: fn, args: args || {} }),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){ clearTimeout(timer); return readJson_(r); },
    function(e){
      clearTimeout(timer);
      if (/abort/i.test(String((e && e.message) || e)) || (e && e.name === 'AbortError')) {
        throw new Error('Ofisi nyingine haijibu ndani ya sekunde 20 / the other office did not '
          + 'answer within 20 seconds');
      }
      throw new Error('Haifikiki: ' + (server || '') + ' / cannot be reached: ' + (server || ''));
    })
    .then(function(x){
      if (x.status >= 200 && x.status < 300 && x.body.ok !== false) return x.body;
      throw new Error((x.body && x.body.error)
        || ('Ofisi nyingine imekataa (HTTP ' + x.status + ') / the other office refused (HTTP ' + x.status + ')'));
    });
}

/* ----------------------------------------------------------- sign in */
function signIn(){
  var code = $('#code').value.trim();
  if (!code){ $('#inErr').textContent='Weka msimbo. / Enter your code.'; return; }
  $('#inBtn').disabled = true; $('#inBtn').textContent = 'Inaingia…';
  fetch('/api/me?code='+encodeURIComponent(code))
    .then(readJson_)
    .then(function(x){
      $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in';
      if (x.status<200||x.status>=300||x.body.ok===false){ $('#inErr').textContent = x.body.error||'Msimbo si sahihi.'; return; }
      S.code = code; store('hopeCode', code); pushOfficerCode_(code); start(x.body);
    })
    /* A SERVER THAT ANSWERED BADLY IS NOT A MISSING NETWORK, and telling somebody to check
       their connection when the connection is fine sends them looking in the wrong place --
       which is exactly what happened at 8am with Supabase serving 296,000 requests. readJson_
       throws a described error for a non-JSON reply; only a fetch that never completed is
       genuinely "no connection". */
    .catch(function(e){
      $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in';
      var m = String((e && e.message) || e);
      $('#inErr').textContent = /Seva|HTTP/.test(m)
        ? m
        : ('Hakuna mtandao / no connection. (' + m + ')');
    });
}
$('#inBtn').onclick = signIn;
$('#code').onkeydown = function(e){ if (e.key==='Enter') signIn(); };
/* SIGNING OUT TAKES YOU TO THE SIGN-IN PAGE, NOT BACK TO THIS ONE.
   It used to drop the code and reload /dashboard, which left the person staring at a second
   sign-in box -- the portal's own -- on the address of the screen they had just left. Two
   different sign-in cards for one system is how somebody ends up believing their code stopped
   working. There is one front door and this is it. */
$('#outBtn').onclick = function(){
  // ONE SIGN-OUT FOR THE SYSTEM AND HOPE CALLS (brand.js, HOPESession): both, not just this page's code.
  if (window.HOPESession) HOPESession.signOutAll(); else { store('hopeCode', null); pushOfficerCode_(''); }
  window.location.replace('/');
};
/* ...and the other direction: signed out of Calls (which clears hopeCode) while this page is still open -- another tab, or this
   page restored from the back-forward cache -- sends this one back to the sign-in too. */
function signedOutElsewhere_(){
  if (S.code && !load('hopeCode')) { pushOfficerCode_(''); window.location.replace('/'); }
}
document.addEventListener('visibilitychange', function(){ if (!document.hidden) signedOutElsewhere_(); });
window.addEventListener('pageshow', function(ev){ if (ev.persisted) signedOutElsewhere_(); });
window.addEventListener('storage', function(ev){ if (ev.key === 'hopeCode' && !ev.newValue) signedOutElsewhere_(); });

   ALWAYS stood here: twenty-five tab ids drawn for anybody holding a code, whatever their role
   said. Its own comment argued the case -- the data is team-scoped server-side, so the gate
   that mattered was upload/settings. That was true of a portal where nobody chose the navs.
   It is not true of one where the whole point is choosing them: it made ticking twenty-five of
   the twenty-nine boxes decorative, and "Start empty" a button that emptied the table and
   changed nothing on anybody's screen.

   So it is gone, and a tab is drawn if and only if it was granted. Empty means empty, which is
   what makes the clean slate honest.

     ADMIN         holds every tab whatever any row says. Same rule as resolveTabs and can().

                   route in. The server gate in portal-core.js is what actually holds.

/* A view id says which workspace it belongs to just by its own name -- every HOPE Loan id is
   prefixed ln_, on purpose (see NAV_LOAN above), so nothing needs to be told separately which
   book a screen reads from. This is what let the switch go away: there is no mode to be in
   ahead of time, only the tab in front of you. */
function isLoanId_(id){ return typeof id === 'string' && id.indexOf('ln_') === 0; }
function allowed(id){
  if (isLoanId_(id)) {
    var n = NAV_LOAN.filter(function(x){ return x.id===id; })[0];
    if (!n) return false;
    // ln_pipeline has tab:null -- everyone who can even open HOPE Loan may see the summary.
    // A few screens (reversals) need either of two tabs, so `tab` may be one name or a list.
    if (!n.tab) return true;
    if (S.me.role === 'ADMIN') return true;
    var need = Array.isArray(n.tab) ? n.tab : [n.tab];
    return need.some(function(t){ return (S.me.tabs||[]).indexOf(t) >= 0; });
  }
  /* GRANTED, OR NOT DRAWN. /api/me hands over exactly what the role was ticked for, and this
     asks it about every tab rather than about four of them. */
  if (S.me.role === 'ADMIN') return true;
  if (HIDDEN_VIEWS.indexOf(id) >= 0) return true;   // reached from inside a gated screen
  /* A PMO ITEM MAY NAME THE TAB IT RIDES ON, exactly as a HOPE Loan one does. For a second
     screen onto a book somebody already holds -- Credit Info onto the Credit Analysts book --
     that is the honest gate: it needs no permission of its own, so nobody has to be re-ticked
     for a view of what they could already read, and the server gate names the same tab. */
  var n = NAV.filter(function(x){ return x.id===id; })[0];
  if (n && n.tab) return (S.me.tabs||[]).indexOf(n.tab)>=0;
  return (S.me.tabs||[]).indexOf(id)>=0;
}
/** The first tab this person actually holds -- where they land, instead of a dashboard they
    may not have been given. Null when nothing at all was granted. */
function firstAllowed_(){
  var pmo = NAV.filter(function(n){ return !n.hidden && allowed(n.id); })[0];
  if (pmo) return pmo.id;
  if (S.me.hopeLoanAvailable) {
    var ln = NAV_LOAN.filter(function(n){ return !n.hidden && allowed(n.id); })[0];
    if (ln) return ln.id;
  }
  return null;
}
