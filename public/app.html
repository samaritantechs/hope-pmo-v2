/* PRESENTATION — a real projector mode, not a card on a page: it goes full screen, plays
   like a deck for the office TV, auto-advances, and takes arrow keys / Esc. Each slide is a
   whole board (the same numbers the tabs show), so a meeting reads live figures rather than
   a screenshot someone exported that morning. */
VIEWS.present = function(){
  return Promise.all([srv('dashboardFull'), srv('officerBoards')]).then(function(r){
    /* KEPT, so ticking a segment box does not go back to the server. Rebuilding this screen is
       the most expensive thing the system does -- the dashboard AND the officer boards, a
       hundred-odd round trips -- and it was being done again on every tick of every checkbox.
       The figures do not change because somebody chose not to project a slide. */
    S.presData = { d: r[0], b: r[1] };
    return presRender();
  });
};

/** Build every slide from the figures already in hand. Filtering (which segments, which team)
    happens afterwards in presApply, so a choice never costs a request. */
function presSlides(){
    var d = S.presData.d, b = S.presData.b, c = d.cards;
    var slides = [];
    slides.push({ id:'kpi', kind:'kpi', title:'HOPE PMO — ' + d.weekday, items:[
      { l:'Current arrears', v:'TZS '+money(c.curArrears) },
      { l:'Recovered', v:'TZS '+money(c.recovered) },
      { l:'Defaulters', v:money(c.defaulters) },
      { l:'Sales this week', v:'TZS '+money(c.salesWeek) },
      { l:'Uncollected today', v:'TZS '+money(c.uncollectedToday) },
      { l:'Abnormal', v:money(c.abnormal) }]});
    /* TEAM PERFORMANCE. Ranked on the average of sales and collection, highest first -- a team
       that sells well and collects badly is not a good team, and neither is the reverse.

       "Uncollected" and "Collection %" follow the same basis as the recovery denominator:
       today from Monday to Friday, the whole week at the weekend. Recovery % is shown against
       all three denominators at once, because which one applies changes with the day and the
       room wants to see the comparison rather than be told which to look at. */
    var tpBasis = d.teamPerf && d.teamPerf.length ? d.teamPerf[0].basis : 'today';
    var tpLab = tpBasis === 'week' ? ' (week)' : ' (today)';
    slides.push({ id:'teams', kind:'table', title:'Team performance — best first', rows:d.teamPerf.slice(0,12),
      cols:[col('team','Team'),
        col('salesMonth','Monthly sales','money'),
        col('curArrears','Total def','money'), col('defaulters','No. of def','num'),
        col('uncollected','Uncollected'+tpLab,'money'), col('collPct','Collection %'+tpLab,'pct'),
        col('recPctMon','Rec % vs Mon','pct'), col('recPctYest','Rec % vs yest','pct'),
        col('recPctWeek','Rec % vs week','pct')] });
    /* Recovery is judged against the uncollected the officer is actually chasing, and which
       day's uncollected that is depends on the day: Monday divides by Monday, Tuesday to
       Friday by yesterday, and the weekend by the whole week. So the denominator goes on the
       slide, immediately before the figure it produced -- a recovery percentage with no
       visible denominator is a number the room has to take on trust. */
    var recBasis = d.weekday === 'SAT' || d.weekday === 'SUN' ? 'week' : (d.weekday === 'MON' ? 'today' : 'yesterday');
    var recUncolLabel = recBasis === 'week' ? 'Uncollected (week)'
      : recBasis === 'today' ? 'Uncollected (today)' : 'Uncollected (yesterday)';
    /* Today and the week on one slide, joined on the officer -- the same rule as every other
       role board here. Today's recovery is divided by the basis above; the week's always by the
       week, which is what makes it the weekly figure rather than a second copy of the daily. */
    var recT = {};
    (b.recToday || []).forEach(function(x){ recT[x.officer] = x; });
    var recRows = (b.recWeek || []).map(function(x){
      var t = recT[x.officer] || {};
      return { ...x, tUncollected: t.uncollected, tRecovered: t.recovered, tPct: t.pct }; });
    slides.push({ id:'recovery', kind:'table', title:'Recovery by officer — today and this week',
      rows: recRows.slice(0,12),
      cols:[col('officer','Officer'), col('initial','Initial','money'), col('current','Current','money'),
        col('tUncollected', recUncolLabel, 'money'),
        col('tRecovered','Recovered today','money'), col('tPct','Rec % (today)','pct'),
        col('uncollected','Uncollected (week)','money'),
        col('recovered','Recovered (week)','money'), col('pct','Rec % (week)','pct')] });
    /* Read the same way as PMO Collection, because it answers the same question about a
       different set of officers: how many teams, what is still out, and what share came in.
       The paid/overpaid counts are what the commission is worked out FROM, so they belong on
       the commission panel and not on a wall. */
    /* Early collection is judged on the list of who is due NEXT -- the INITIAL expected report
       here -- so "today" on this board is tomorrow's performance: what the officer has already
       brought in against a day that has not arrived. The two periods share one slide, joined
       on the officer. */
    var earlyW = {};
    (b.earlyWeek || []).forEach(function(x){ earlyW[x.officer] = x; });
    var earlyRows = (b.earlyToday || []).map(function(x){
      var w = earlyW[x.officer] || {};
      return { ...x, wUncollected: w.uncollected, wPct: w.pct }; });
    slides.push({ id:'early', kind:'table',
      title:'Early collection — today and this week' + (b.earlySource === 'tomorrow' ? ' (kesho)' : ''),
      rows: earlyRows.slice(0,12),
      cols:[col('officer','Officer'), col('teams','Teams','num'),
        col('uncollected','Uncollected (today)','money'), col('pct','Coll % (today)','pct'),
        col('wUncollected','Uncollected (week)','money'), col('wPct','Coll % (week)','pct')] });
    /* TWO DIFFERENT ROOMS, and this deck used to show one under the other's name.

       "Call agents" means the CUSTOMER CARE agents: the people named as CREATED BY on the
       application reports. Nobody records their talk time or puts them on a team, and what
       they are judged on is what they brought in -- TRACK# 1 only, because a repeat customer
       is not a new win.

       The HOPE Calls app officers are everybody in the field, and they get their own two
       slides: who is on the phone most, and who is on it least. */
    /* PMO COLLECTION. Five columns, and deliberately only five: number, name, how many teams
       they hold, what is still uncollected, and the percentage. NO COMMISSION -- that lives on
       the commission panel where the person it concerns can see their own figure. A projector
       in a meeting room is the wrong place for anybody's pay, and it changes what the room
       talks about. */
    /* TODAY AND THE WEEK SIDE BY SIDE, one slide per role. Split across two, the room read
       today's figure, discussed it, and had lost the week by the time it came round -- and
       "is this better or worse than the week?" is the question every one of these boards
       exists to answer. */
    slides.push({ id:'pmo', kind:'table', title:'PMO Collection — today and this week', rows:(b.pmo||[]).slice(0,12),
      cols:[col('officer','PMO'), col('teams','Teams','num'),
        col('uncollected','Uncollected (today)','money'), col('pct','Coll % (today)','pct'),
        col('weekUncollected','Uncollected (week)','money'), col('weekPct','Coll % (week)','pct')] });
    slides.push({ id:'cs', kind:'table', title:'Call agents — applications brought in', rows:b.csWeek.slice(0,12),
      cols:[col('agent','Agent'), col('unassigned','Unassigned','num'), col('assigned','Assigned','num'),
        col('brought','Brought in','num'), col('amount','Amount','money')] });
    /* BOTH ENDS ON ONE PAGE. Split across two slides the room saw the busiest, talked about
       them, and had forgotten the comparison by the time the quiet ones came round. Side by
       side the slide answers the question people actually ask: who is working the phone and
       who is not. An officer who never opened the app is IN this list at zero rather than
       missing from it, which is the whole reason it is worth projecting. */
    var callTop = (b.callWeek || []).slice(0, 6).map(function(x){ return { ...x, end:'Busiest' }; });
    var topNames = {};
    callTop.forEach(function(x){ topNames[x.agent] = 1; });
    var callLow = (b.callWeekWorst || []).filter(function(x){ return !topNames[x.agent]; })
      .slice(0, 6).map(function(x){ return { ...x, end:'Least active' }; });
    slides.push({ id:'calls', kind:'table', title:'HOPE Calls — busiest and least active this week',
      rows: callTop.concat(callLow),
      cols:[{ key:'end', label:'', cls:function(r){ return r.end==='Busiest'?'good':'bad'; } },
        col('agent','Officer'), col('team','Team'), col('calls','Calls','num'),
        col('duration','Talk time','dur'), col('portfolio','Portfolio','num'), col('connectPct','Connected %','pct')] });
    slides.push({ id:'credit', kind:'table', title:'Credit analysts — this week', rows:b.creditWeek.slice(0,12),
      cols:[col('analyst','Analyst'), col('apps','Apps','num'), col('amount','Amount','money'),
        col('salesPct','Sales %','pct'), col('perf','Perf','pct')] });
    slides.push({ id:'coltrend', kind:'table', title:'Weekly collection trend', rows:d.colTrend,
      cols:[col('weekday','Day'), col('expected','Expected','money'), col('collected','Collected','money'),
        col('uncollected','Uncollected','money'), col('pct','Coll %','pct')] });
    slides.push({ id:'fu', kind:'table', title:'Follow-up status — all defaulters', rows:b.fuStatus.slice(0,12),
      cols:[col('status','Status'), col('customers','Customers','num'), col('pct','% of book','pct'),
        col('arrears','Arrears','money')] });
    return slides;
}

/* Not every meeting wants every board. A recovery review does not need the credit slide, and an
   evaluation of one team should not project the whole company -- so segments are selectable and
   the deck can be scoped to a single team. Both choices persist, because the same meeting runs
   every week.

   NEITHER CHOICE COSTS A REQUEST. Both are applied to figures already in hand. */
function presApply(){
  if (!S.presOff) S.presOff = (load('hopePresOff') || '').split(',').filter(Boolean);
  if (S.presTeam == null) S.presTeam = load('hopePresTeam') || '';
  var slides = presSlides();
  if (S.presTeam){
    var only = function(list, key){
      return (list || []).filter(function(x){ return String(x[key] || '') === S.presTeam; }); };
    slides = slides.map(function(sl){
      if (sl.kind !== 'table') return sl;
      // Officer/analyst/agent boards belong to whoever covers the team, so they are scoped
      // by team where the row carries one and left whole where it does not.
      if (sl.rows.length && 'team' in sl.rows[0]) return { ...sl, rows: only(sl.rows, 'team') };
      return sl;
    });
  }
  var live = slides.filter(function(sl){ return S.presOff.indexOf(sl.id) < 0; });
  S.slides = live.length ? live : slides;
  return slides;                 // the FULL list, for drawing the checkboxes
}

function presRender(){
    var d = S.presData.d;
    var slides = presApply();

    HEAD = '<div class="kpis">'
      + kpi('Slides', money(S.slides.length), (S.presOff.length? money(S.presOff.length)+' hidden' : 'live figures, not a screenshot'), '', 'presCount')
      + kpi('Seconds per slide', String(S.presSecs || 15), 'change below')
      + kpi('Weekday', esc(d.weekday), d.weekOf) + '</div>'
      + '<div class="card"><div class="card-h">Sehemu za kuonyesha / Segments to include</div>'
      + '<div class="cleanbox"><div class="checks">'
      + slides.map(function(sl){
          return '<label><input type="checkbox" class="presSeg" value="'+esc(sl.id)+'"'
            + (S.presOff.indexOf(sl.id)<0?' checked':'')+'> '+esc(sl.title)+'</label>'; }).join('')
      + '</div>'
      + '<div class="fld" style="max-width:280px;margin-top:10px"><label>Onyesha timu / Show data for</label>'
      + '<select id="presTeam"><option value="">Timu zangu zote / All my teams</option>'
      + (d.teamPerf||[]).map(function(t){
          return '<option'+(S.presTeam===t.team?' selected':'')+'>'+esc(t.team)+'</option>'; }).join('')
      + '</select></div></div></div>'
      + bar('<button class="btn" id="presStart">▶ Anza / Play on the TV</button>'
        + '<label style="font-size:12px;color:var(--mut)">Sekunde / Seconds</label>'
        + '<input type="number" id="presSecs" min="5" max="300" value="'+(S.presSecs||15)+'" style="width:80px">'
        + '<span style="font-size:12px;color:var(--mut)">Esc kutoka · ← → kubadili slaidi / Esc exits, arrows change slide</span>');
    S.rows = S.slides.map(function(sl,i){ return { n:i+1, slide:sl.title, kind:sl.kind,
      rows: sl.kind==='table' ? sl.rows.length : sl.items.length }; });
    S.cols = [col('slide','Slide'), col('kind','Type'), col('rows','Rows','num')];
    ONROW = function(r){ presStart(r.n - 1); };
}
function presStart(from){
  if (!S.slides || !S.slides.length) return;
  var el = document.getElementById('pres');
  el.style.display = 'block';
  S.presI = from || 0;
  presDraw();
  clearInterval(S.presTimer);
  S.presTimer = setInterval(function(){ S.presI = (S.presI + 1) % S.slides.length; presDraw(); },
    Math.max(5, Math.min(300, Number(S.presSecs) || 15)) * 1000);
  // Real full screen: on the office TV the browser chrome should not be part of the picture.
  if (el.requestFullscreen) { try { el.requestFullscreen(); } catch(e){} }
}
function presStop(){
  clearInterval(S.presTimer);
  document.getElementById('pres').style.display = 'none';
  if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch(e){} }
}
function presDraw(){
  var s = S.slides[S.presI], body;
  if (s.kind === 'kpi'){
    body = '<div class="pkpis">' + s.items.map(function(it){
      return '<div class="pkpi"><div class="pl">'+esc(it.l)+'</div><div class="pv">'+esc(it.v)+'</div></div>'; }).join('') + '</div>';
  } else {
    /* THE GRAND TOTAL, on the wall as well as on the tab. It is the number the meeting reads
       out, and a projected table without one sends somebody to a calculator while the slide is
       still up. Same rule as everywhere else: counts, money and talk time add up; percentages
       are worked out again from the totals that made them, never summed. */
    var tot = autoTotals(s.rows, s.cols);
    body = '<table class="ptable"><thead><tr><th>#</th>' + s.cols.map(function(c){
        return '<th class="'+(isNum(c)?'r':'')+'">'+esc(c.label)+'</th>'; }).join('') + '</tr></thead><tbody>'
      + s.rows.map(function(r,i){ return '<tr><td>'+(i+1)+'</td>'+s.cols.map(function(c){
          return '<td class="'+(isNum(c)?'r':'')+'">'+cellHtml(r,c)+'</td>'; }).join('')+'</tr>'; }).join('')
      + (tot ? '<tr class="ptot"><td></td>' + s.cols.map(function(c,i){
          return '<td class="'+(isNum(c)?'r':'')+'">'+(i===0?'JUMLA / TOTAL':cellHtml(tot,c))+'</td>'; }).join('') + '</tr>' : '')
      + '</tbody></table>';
  }
  document.getElementById('pres').innerHTML =
    '<div class="phead"><span>'+esc(s.title)+'</span>'
    + '<span class="pnum">'+(S.presI+1)+' / '+S.slides.length+'</span>'
    + '<button class="pclose" onclick="presStop()">&#10005;</button></div>'
    + '<div class="pbody">'+body+'</div>'
    + '<button class="pnav pprev" onclick="presGo(-1)" title="Iliyopita / Previous">&#8249;</button>'
    + '<button class="pnav pnext" onclick="presGo(1)" title="Inayofuata / Next">&#8250;</button>';
}

/** Step the deck by hand. Moving deliberately also RESTARTS the timer -- otherwise the slide
    somebody just chose to look at gets taken away a second later by a countdown that was
    already half spent, which is the most irritating thing a deck can do. */
function presGo(step){
  if (!S.slides || !S.slides.length) return;
  S.presI = (S.presI + step + S.slides.length) % S.slides.length;
  presDraw();
  if (S.presTimer){
    clearInterval(S.presTimer);
    S.presTimer = setInterval(function(){ S.presI = (S.presI + 1) % S.slides.length; presDraw(); },
      Math.max(5, Math.min(300, Number(S.presSecs) || 15)) * 1000);
  }
}
document.addEventListener('keydown', function(e){
  if (document.getElementById('pres').style.display !== 'block') return;
  if (e.key === 'Escape') presStop();
  else if (e.key === 'ArrowRight'){ presGo(1); }
  else if (e.key === 'ArrowLeft'){ presGo(-1); }
});

/* Clicking a tab used to wipe the screen to a spinner and go back to the server every single
   time -- even flicking between two tabs you had just read. On a field connection that is a few
   seconds of blank page per click, all day. Now a tab you have already opened comes back
   instantly from what is already in hand, and the server is asked again quietly behind it.
   Only what is on screen changes when the answer lands; the page never goes blank twice.

   Held in memory only, and only for this sitting: it is a convenience, not a copy of the books.
   Anything that writes empties it (see srv), and the reload button ignores it outright. */
/* How long a remembered screen stays good before it is asked for again. Ninety seconds unless
   an admin sets REFRESH_SECONDS -- a meeting-length attention span was a guess, and the people
   running the meeting are better placed to say. */
var VC_MS = 90000;
function applyCadences(ui){
  if (!ui) return;
  VC_MS = Math.max(10, Number(ui.refreshSeconds) || 90) * 1000;
  S.presSecs = Number(ui.presentSeconds) || 15;
  S.hintEverySec = Number(ui.hintIntervalSeconds) || 240;
  S.hintHoldSec = Number(ui.hintLifetimeSeconds) || 7;
}
var VC_SKIP = { present:1 };             // the slideshow runs its own timers -- never replay it
function viewKey_(){
  var a = S.args || {};
  return S.view + '|' + Object.keys(a).sort().map(function(k){ return k + '=' + a[k]; }).join('&');
}
function snapTake_(){
  return { at:Date.now(), head:HEAD, onrow:ONROW, rows:S.rows, cols:S.cols, foot:S.foot,
           args:JSON.parse(JSON.stringify(S.args || {})),
           // The team/status dropdowns live inside the remembered HEAD, already ticked. Bring
           // the choice back with them, or you return to a tab showing "Team KONGOWE" in the
           // box while the table underneath quietly lists everybody.
           filters:JSON.parse(JSON.stringify(S.filters || {})) };
}
function snapPut_(s){
  HEAD = s.head; ONROW = s.onrow;
  S.rows = s.rows; S.cols = s.cols; S.foot = s.foot;
  S.args = JSON.parse(JSON.stringify(s.args || {}));
  S.filters = JSON.parse(JSON.stringify(s.filters || {}));
}
function busy_(on){ var b = $('#busy'); if (b) b.classList.toggle('on', !!on); }
function drawView_(){
  if (S.cols && S.cols.length) paint(); else paintHeadOnly();
  wireForms();
}
function render(opts){
  clearInterval(S.presentTimer);
  var fn = VIEWS[S.view];
  if (!fn){ $('#view').innerHTML = '<div class="msg">—</div>'; return; }
  var key = viewKey_();
  var hit = (opts && opts.force) ? null : VC.store[key];
  VC.key = key;
  if (hit && Date.now() - hit.at < VC_MS){
    snapPut_(hit);
    drawView_();
    load_(fn, key, true);                // keep reading; we will fix the numbers underneath you
    return;
  }
  loading();
  load_(fn, key, false);
}
/** quiet = there is already a good screen up. Two rules follow from that, and both matter:
    a slow answer must not paint over a tab you have since moved to (hence the ticket), and a
    failed refresh must not replace a page you are reading with an error -- the connection
    dropping for one moment is not a reason to take the work off someone's screen. */
function load_(fn, key, quiet){
  var my = ++S.rid;
  var watch = { ok:true };
  VC.watch = watch;
  busy_(true);
  fn().then(function(){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;            // a newer click already owns the screen
    busy_(false);
    if (watch.ok && !VC_SKIP[S.view]) VC.store[key] = snapTake_();
    drawView_();
  }).catch(function(e){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;
    busy_(false);
    if (!quiet) failed(e);
  });
}

/* CUSTOM ORDER -- drag the VALUES of a column into the order the work happens in.

   Up and down buttons rather than drag-and-drop: this is used on a laptop in a meeting and on
   a phone in the field, and dragging on a touch screen inside a scrolling drawer is a fight.
   Two buttons always work.

   Saved on the device, not on the server, because it is one person's way of working through
   their own list -- not a company rule, and not something to push onto everybody else. */
function openOrderPanel(key){
  var c = S.cols.filter(function(x){ return x.key===key; })[0];
  if (!c){ toast('Chagua safu kwanza. / Choose a column to sort by first.', true); return; }
  // Whatever is actually in the data, with any saved order applied first so the panel opens
  // showing the order currently in force.
  var seen = {}, values = [];
  S.rows.forEach(function(r){
    var v = String((c.get?c.get(r):r[c.key]) == null ? '' : (c.get?c.get(r):r[c.key]));
    if (!v || seen[v]) return; seen[v] = 1; values.push(v);
  });
  var saved = customOrder(key) || [];
  values.sort(function(a,b){
    var ai = saved.indexOf(a), bi = saved.indexOf(b);
    if (ai < 0) ai = 9999; if (bi < 0) bi = 9999;
    return ai - bi;
  });
  S.orderKey = key; S.orderVals = values;
  drawOrderPanel();
}
function drawOrderPanel(){
  var c = S.cols.filter(function(x){ return x.key===S.orderKey; })[0] || { label: S.orderKey };
  drawer('<h3 style="margin:0 0 4px">Panga mwenyewe / Custom order</h3>'
    + '<div class="hint" style="margin-bottom:10px">' + esc(c.label)
      + ' — pangilia kwa mpangilio wa kazi, si wa alfabeti.<br>'
      + 'Order these the way the work happens, not the way the alphabet does. '
      + 'Saved on this device only.</div>'
    + '<div id="ordList">' + S.orderVals.map(function(v, i){
        return '<div class="ordrow" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)">'
          + '<span style="flex:1;min-width:0">' + esc(v) + '</span>'
          + '<button class="btn sm ghost" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
          + '<button class="btn sm ghost" data-dn="'+i+'"'+(i===S.orderVals.length-1?' disabled':'')+'>↓</button>'
          + '</div>'; }).join('') + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
      + '<button class="btn" id="ordSave" style="flex:1">Hifadhi / Save</button>'
      + '<button class="btn ghost" id="ordClear">Ondoa / Reset to A–Z</button>'
    + '</div>');
  var move = function(i, j){
    if (j < 0 || j >= S.orderVals.length) return;
    var t = S.orderVals[i]; S.orderVals[i] = S.orderVals[j]; S.orderVals[j] = t;
    drawOrderPanel();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-up')); move(i, i-1); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-dn')); move(i, i+1); }; });
  document.getElementById('ordSave').onclick = function(){
    store('hopeOrder_' + S.orderKey, JSON.stringify(S.orderVals));
    // Sorting by that column is the whole point of having ordered it, so do it.
    S.sort = S.orderKey; closeDrawer(); paint();
    toast('Mpangilio umehifadhiwa. / Order saved on this device.');
  };
  document.getElementById('ordClear').onclick = function(){
    store('hopeOrder_' + S.orderKey, null); closeDrawer(); paint();
    toast('Imerudi kwa alfabeti. / Back to normal order.');
  };
}

/* Every field stays correctable after the fact -- a register you cannot correct just gets
   worked around on paper. The history under the form is the audit trail: who registered it,
   who edited it, who closed it. */
function openComplaint(r){
  r = r || {};
  var m = S.cxMeta || { categories:[], channels:[], statuses:['Open','In progress','Resolved'], teams:[] };
  var opts = function(list, cur, blank){
    return (blank ? '<option value="">— '+blank+' —</option>' : '')
      + list.map(function(x){ return '<option'+(x===cur?' selected':'')+'>'+esc(x)+'</option>'; }).join('');
  };
  drawer('<h3>'+(r.id ? 'Badili / Edit complaint' : 'Sajili malalamiko / Register a complaint')+'</h3>'
    + '<div class="sub">from a defaulter call, a walk-in, or any external party</div>'
    + '<div class="fld"><label>Tarehe / Date</label><input id="cxDate" type="date" value="'
      + esc(String(r.created_at||'').slice(0,10) || today())+'"></div>'
    + '<div class="fld"><label>Mlalamikaji / Complainant *</label><input id="cxWho" value="'+esc(r.complainant||'')+'"></div>'
    + '<div class="fld"><label>Simu / Phone</label><input id="cxPhone" inputmode="tel" value="'+esc(r.phone||'')+'"></div>'
    + '<div class="fld"><label>REF# (kama ni mteja / if a customer)</label><input id="cxRef" value="'+esc(r.ref||'')+'"></div>'
    + '<div class="fld"><label>Timu / Team</label><select id="cxTeam">'+opts(m.teams, r.team, 'none')+'</select></div>'
    + '<div class="fld"><label>Aina / Category</label><select id="cxCat">'+opts(m.categories, r.category, 'none')+'</select></div>'
    + '<div class="fld"><label>Njia / Channel</label><select id="cxChan">'+opts(m.channels, r.channel, 'none')+'</select></div>'
    + '<div class="fld"><label>Hali / Status</label><select id="cxStatus">'+opts(m.statuses, r.status||'Open')+'</select></div>'
    + '<div class="fld"><label>Maelezo / Details</label><textarea id="cxDetails" rows="3">'+esc(r.details||'')+'</textarea></div>'
    + '<div class="fld"><label>Ufumbuzi / Resolution</label><textarea id="cxRes" rows="3">'+esc(r.resolution||'')+'</textarea></div>'
    + '<button class="btn w" id="cxSave">Hifadhi / Save complaint</button>'
    + (r.id ? '<div class="cxhist"><h4>Historia / History — who logged what</h4><div id="cxHist" class="sk"></div></div>' : ''));
  $('#cxSave').onclick = function(){
    var who = $('#cxWho').value.trim();
    if (!who){ toast('Jina la mlalamikaji linahitajika. / Complainant name is required.', true); return; }
    srv('saveComplaint', { id:r.id||'', date:$('#cxDate').value, complainant:who,
      phone:$('#cxPhone').value.trim(), ref:$('#cxRef').value.trim(), team:$('#cxTeam').value,
      category:$('#cxCat').value, channel:$('#cxChan').value, status:$('#cxStatus').value,
      details:$('#cxDetails').value.trim(), resolution:$('#cxRes').value.trim() })
      .then(function(){ toast('Imehifadhiwa. / Saved.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
  /* Removing one entirely. Every other register can lose a row; this one could not, so a
     complaint logged against the wrong customer stayed in the register and in every count
     built off it. Admin only, and it asks first -- there is no undo. */
  if (r.id && S.me && S.me.can && S.me.can.admin){
    var host = $('#cxHist');
    if (host && host.parentNode){
      var del = document.createElement('button');
      del.className = 'btn ghost w'; del.id = 'cxDel'; del.style.marginTop = '10px';
      del.innerHTML = '&#128465; Futa lalamiko / Delete this complaint';
      host.parentNode.insertBefore(del, host);
      del.onclick = function(){
        if (!confirm('Futa lalamiko hili kabisa? Hakuna kurudi nyuma.\n\n'
          + 'Delete this complaint permanently? This cannot be undone.')) return;
        srv('deleteComplaint', { id: r.id })
          .then(function(){ toast('Limefutwa. / Deleted.'); closeDrawer(); render({ force:true }); })
          .catch(function(e){ toast(String(e.message||e), true); });
      };
    }
  }
  if (r.id) srv('complaintLog', { id:r.id }).then(function(h){
    var el = $('#cxHist'); if (!el) return;
    el.className = '';
    el.innerHTML = h.rows.length ? h.rows.map(function(x){
      return '<div class="hrow"><b>'+esc(x.created_by||'—')+'</b> '+esc(x.action||'')
        + (x.status ? ' → '+esc(x.status) : '')
        + '<span class="hat">'+esc(String(x.created_at||'').replace('T',' ').slice(0,16))+'</span>'
        + (x.note ? '<div class="hnote">'+esc(x.note)+'</div>' : '') + '</div>';
    }).join('') : '<div class="hnote">Hakuna historia bado. / No history recorded yet.</div>';
  }).catch(function(){ var el = $('#cxHist'); if (el){ el.className=''; el.innerHTML='<div class="hnote">History unavailable.</div>'; } });

/* Step 1 — find the customer. Eligibility is the deck's answer, not the officer's. */
function rxLookup(){
  drawer('<h3>Ombi jipya / New restructuring offer</h3>'
    + '<div class="sub">Anza na REF# ya mteja. / Start with the customer’s REF#.</div>'
    + '<div class="fld"><label>Customer REF#</label><input id="rxRef" placeholder="e.g. 111"></div>'
    + '<button class="btn w" id="rxLoad">Tafuta / Load</button>');
  var go = function(){
    var ref = $('#rxRef').value.trim();
    if (!ref){ toast('Weka REF#. / Enter a REF#.', true); return; }
    srv('restructureEligible', { ref:ref }).then(function(e){
      if (!e.found){ toast('Hakuna mteja mwenye REF# hiyo kwenye orodha ya wadaiwa. / No defaulter with that REF#.', true); return; }
      rxOffer(e);
    }).catch(function(err){ toast(String(err.message||err), true); });
  };
  $('#rxLoad').onclick = go;
  $('#rxRef').onkeydown = function(ev){ if (ev.key === 'Enter') go(); };
}
/* Step 2 — the calculator. It previews exactly what the server will recompute and store, so
   what the officer shows the customer and what gets written cannot drift apart. */
function rxOffer(e){
  var st = e.strategy;
  if (!e.eligible){
    drawer('<h3>'+esc(e.full_name||e.ref)+'</h3><div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+'</div>'
      + '<div class="msg bad">Hastahili kupangiwa upya. / Not eligible — this customer has <b>'+e.dc
      + '</b> missed installment(s); restructuring needs <b>'+st.minDc+'+</b>.</div>');
    return;
  }
  drawer('<h3>'+esc(e.full_name||e.ref)+'</h3>'
    + '<div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+' · '+esc(e.contact||'')+'</div>'
    + '<div class="facts"><div class="frow"><span>Missed installments (DC)</span><b>'+e.dc+'</b></div>'
    + '<div class="frow"><span>Arrears owed</span><b>TZS '+money(e.arrears)+'</b></div></div>'
    + '<div class="fld"><label>Malipo ya kwanza sasa / First payment now</label>'
      + '<input id="rxFirst" type="number" min="0" step="500" value="0"></div>'
    + '<div class="fld"><label>Awamu za wiki / Weekly installments (max '+st.maxInstallments+')</label>'
      + '<input id="rxCount" type="number" min="1" max="'+st.maxInstallments+'" step="1" placeholder="e.g. 10"></div>'
    + '<div class="fld"><label>Tarehe ya kwanza / First payment date</label>'
      + '<input id="rxStart" type="date" value="'+addDays(today(),7)+'"></div>'
    + '<label class="chk"><input id="rxInt" type="checkbox"> Ongeza riba ya '+st.interestPct+'% / add '+st.interestPct+'% on the remaining</label>'
    + '<div class="fld"><label>Maelezo / Notes</label><textarea id="rxNotes" rows="2"></textarea></div>'
    + '<div id="rxPrev"></div>'
    + '<button class="btn w" id="rxSubmit">Tuma kwa idhini / Submit for approval</button>');
  var preview = function(){
    var arrears = Number(e.arrears)||0;
    var first = Math.min(Math.max(0, Number($('#rxFirst').value)||0), arrears);
    var count = Math.max(1, Math.floor(Number($('#rxCount').value)||0));
    var remaining = arrears - first;
    var interest = $('#rxInt').checked ? Math.round(remaining * (st.interestPct/100)) : 0;
    var total = remaining + interest;
    var per = Math.round(total/count/500)*500;
    var start = $('#rxStart').value;
    var over = count > st.maxInstallments;
    var rows = [];
    for (var i=0;i<Math.min(count, st.maxInstallments);i++){
      rows.push({ n:i+1, date:start?addDays(start, 7*i):'—', amount:(i===count-1? total-per*(count-1) : per) });
    }
    $('#rxPrev').innerHTML =
      '<div class="kpis sm">'
      + kpi('Remaining', money(remaining)) + kpi('New interest', money(interest))
      + kpi('Total to repay', money(total)) + kpi('Per installment', money(per))
      + '</div>'
      + (over ? '<div class="msg bad">Exceeds the '+st.maxInstallments+'-installment cap — reduce the count.</div>' : '')
      + (total > 0
          ? tableSimple(rows, [col('date','Date','date'), col('amount','Installment','money')],
              {date:'', amount:total})
          : '<div class="msg">Hakuna kilichobaki. / Nothing left to reschedule.</div>');
  };
  ['rxFirst','rxCount','rxStart'].forEach(function(id){
    $('#'+id).oninput = preview; $('#'+id).onchange = preview; });
  $('#rxInt').onchange = preview;
  preview();
  $('#rxSubmit').onclick = function(){
    srv('addRestructure', { ref:e.ref, firstInst:$('#rxFirst').value, installments:$('#rxCount').value,
      startDate:$('#rxStart').value, interestOn:$('#rxInt').checked, notes:$('#rxNotes').value.trim() })
      .then(function(){ toast('Ombi limetumwa. / Submitted for approval.'); closeDrawer(); render(); })
      .catch(function(err){ toast(String(err.message||err), true); });
  };
}
/* The contract is printed off the STORED row, not off whatever is on screen, so one printed a
   week after approval says exactly what was approved. */
function printContract(r){
  srv('restructureContract', { id: r.id, ref: r.ref })
    .then(function(c){ printHtml(c.html); })
    .catch(function(err){ toast(String(err.message||err), true); });
}
function openRestructure(r){
  if (String(r.status||'').toUpperCase()!=='PENDING'){
    var approved = String(r.status||'').toUpperCase()==='APPROVED';
    drawer('<h3>'+esc(r.full_name||r.ref)+'</h3><div class="sub">'+esc(r.team||'')+' · '+esc(r.status)+'</div>'
      + '<div class="facts"><div class="frow"><span>Total</span><b>'+money(r.total)+'</b></div>'
      + '<div class="frow"><span>Installments</span><span>'+esc(r.installments||'')+' × '+money(r.inst_amt)+'</span></div>'
      + '<div class="frow"><span>Decided by</span><span>'+esc(r.approved_by||'')+'</span></div>'
      + (r.reject_reason?'<div class="frow"><span>Reason</span><span>'+esc(r.reject_reason)+'</span></div>':'')+'</div>'
      // Only an APPROVED offer gets a contract. Printing one for a rejected request would put
      // a signable document in front of a customer for an agreement nobody made.
      + (approved ? '<button class="btn w" id="rxPrint" style="margin-top:10px">'
          + '&#128424; Chapisha mkataba / Print contract</button>' : ''));
    if (approved) $('#rxPrint').onclick = function(){ printContract(r); };
    return;
  }
  drawer('<h3>'+esc(r.full_name||r.ref)+'</h3><div class="sub">'+esc(r.team||'')+' · REF '+esc(r.ref)+'</div>'
    + '<div class="facts"><div class="frow"><span>Arrears</span><b>'+money(r.arrears)+'</b></div>'
    + '<div class="frow"><span>Total</span><span>'+money(r.total)+'</span></div>'
    + '<div class="frow"><span>Plan</span><span>'+esc(r.installments||'')+' × '+money(r.inst_amt)+' from '+esc(String(r.start_date||'').slice(0,10))+'</span></div>'
    + '<div class="frow"><span>Requested by</span><span>'+esc(r.requested_by||'')+'</span></div></div>'
    + (r.schedule && r.schedule.length
        ? '<div class="rxsched">' + tableSimple(r.schedule,
            [col('date','Date','date'), col('amount','Installment','money')],
            {date:'', amount:r.total}) + '</div>' : '')
    + ((S.rxMeta && S.rxMeta.canApprove)
        ? '<div class="fld"><label>Sababu (kama unakataa) / Reason if rejecting</label><input id="rReason"></div>'
          + '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" id="rOk">Kubali / Approve</button>'
          + '<button class="btn ghost" style="flex:1" id="rNo">Kataa / Reject</button></div>'
        : '<div class="msg">Unaweza kuona tu — huwezi kuidhinisha. / View only: approving is limited to '
          + esc((S.rxMeta && S.rxMeta.strategy ? S.rxMeta.strategy.approvers.join(' / ') : 'the approvers'))
          + ' or an admin.</div>'));
  if (!(S.rxMeta && S.rxMeta.canApprove)) return;
  function decide(d){
    srv('decideRestructure', { id:r.id, decision:d, reason:$('#rReason').value.trim() })
      .then(function(){ toast(d==='approve'?'Imekubaliwa.':'Imekataliwa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  }
  $('#rOk').onclick=function(){ decide('approve'); };
  $('#rNo').onclick=function(){ decide('reject'); };
}

function fldRow(id, label, type){ return '<div class="fld"><label>'+esc(label)+'</label><input id="'+id+'"'+(type?' type="'+type+'"':'')+'></div>'; }

function wireForms(){
  // One drawer for new and existing complaints: free-text Category/Channel/Team boxes could
  // not be counted or filtered, and counting complaints by category is why the register exists.
  var nag = document.getElementById('newAgent');
  if (nag) nag.onclick = function(){ agentForm(null); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-agent]'), function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var id = el.getAttribute('data-agent');
      agentForm(((S.csAgents&&S.csAgents.agents)||[]).filter(function(a){ return a.user_id===id; })[0] || null);
    };
  });
  var nrole = document.getElementById('newRole');
  if (nrole) nrole.onclick = function(){ roleForm(null); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function(el){
    el.onclick = function(){
      var r = ((S.roleMeta && S.roleMeta.roles) || []).filter(function(x){ return x.role === el.getAttribute('data-role'); })[0];
      if (r) roleForm(r);
    };
  });
  var nc = document.getElementById('newComplaint');
  if (nc) nc.onclick = function(){ openComplaint(null); };
  // Restructuring starts from the CUSTOMER, not from a blank form: you cannot type an
  // arrears figure that disagrees with the deck, and every derived number is computed rather
  // than entered. The old form asked for arrears, total, installments AND per-installment by
  // hand -- four chances to write an offer the books do not agree with.
  var nr = document.getElementById('newRestructure');
  if (nr) nr.onclick = function(){ rxLookup(); };
  // The old form asked the officer to TYPE the fine and the total demand. Those are the two
  // numbers a demand notice exists to state correctly, and a mistyped one is a written demand
  // for the wrong amount with the company's stamp on it. They are computed now.
  var nn = document.getElementById('newNotice');
  if (nn) nn.onclick = function(){ lgIssue(); };
  /* Closing the system turns two hundred people away from a screen they were using a minute
     ago, so it asks first. Opening it does not -- letting people back in is not the move
     anybody regrets. */
  var so = document.getElementById('soToggle');
  if (so) so.onclick = function(){
    var open = document.getElementById('soState').textContent.indexOf('OPEN') >= 0;
    if (open && !confirm('Funga mfumo kwa watumiaji wote? Watabaki na HOPE Calls pekee.\n\n'
      + 'Close the system for everybody? They keep HOPE Calls only.')) return;
    so.disabled = true; so.textContent = 'Inabadili…';
    srv('systemOpenSet', { open: !open })
      .then(function(){ toast(open ? 'Mfumo umefungwa. / The system is closed.'
                                   : 'Mfumo umefunguliwa. / The system is open.');
                        render({ force: true }); })
      .catch(function(e){ so.disabled = false; toast(String(e.message || e), true); });
  };
  var ns = document.getElementById('newSetting');
  if (ns) ns.onclick = function(){ settingForm('', ''); };
  var nk = document.getElementById('newCode');
  if (nk) nk.onclick = function(){ codeForm(null); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-code]'), function(b){
    b.onclick = function(){
      var c = b.getAttribute('data-code');
      codeForm((S.acRows||[]).filter(function(x){ return String(x.code)===c; })[0] || null);
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-user]'), function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-user');
      officerForm(((S.officers&&S.officers.rows)||[]).filter(function(x){ return String(x.user_id)===id; })[0] || null);
    };
  });
  var no = document.getElementById('newOfficer');
  if (no) no.onclick = function(){ officerForm(null); };
}

/* A field officer account. The phone number IS the login name -- it is also what keys their
   call history, so it stays fixed once set. The passcode is shown exactly once, when it is
   generated: it is stored only as a hash, so nobody, including an admin, can read it back. */
function officerForm(x){
  var isNew = !x;
  var teams = (S.officers && S.officers.teams) || [];
  drawer('<h3>'+(isNew?'Afisa mpya / New field officer':esc(x.name||''))+'</h3>'
    + '<div class="sub">Afisa hawezi kujisajili mwenyewe. / An officer cannot register themselves — you issue the account.</div>'
    + '<div class="fld"><label>Jina / Name</label><input id="oName" value="'+esc(x?x.name:'')+'"></div>'
    + '<div class="fld"><label>Simu / Phone (ndio anaingia nayo / this is the login)</label>'
      + '<input id="oPhone" inputmode="tel" value="'+esc(x?x.phone:'')+'"'+(isNew?'':' readonly')+'></div>'
    + '<div class="fld"><label>Timu / Team</label><select id="oTeam"><option value="">— none —</option>'
      + teams.map(function(t){ return '<option'+(x&&x.team===t?' selected':'')+'>'+esc(t)+'</option>'; }).join('')
      + '</select></div>'
    + '<div class="fld"><label>Wadhifa / Role</label><input id="oRole" value="'+esc(x&&x.role?x.role:'OFFICER')+'"></div>'
    + '<label class="chk"><input id="oLeader" type="checkbox"'+(x&&x.is_leader?' checked':'')+'> Kiongozi / Leader (sees reports)</label>'
    + '<label class="chk"><input id="oActive" type="checkbox"'+(!x||x.active?' checked':'')+'> Inatumika / Active</label>'
    + '<div class="fldnote">Ukiizima, simu yake inakatwa mara moja. / Switching this off cuts their handset immediately.</div>'
    + '<label class="chk"><input id="oIssue" type="checkbox"'+(isNew?' checked disabled':'')+'> '
      + (isNew ? 'Tengeneza nenosiri / Issue a passcode' : 'Badilisha nenosiri / Issue a NEW passcode')+'</label>'
    + (isNew ? '' : '<div class="fldnote">Nenosiri jipya linakata simu iliyokuwa na la zamani. / A new passcode releases the handset that had the old one.</div>')
    + '<div id="oOut"></div>'
    + '<button class="btn w" id="oSave">Hifadhi / Save</button>'
    // Switching off keeps their call history and is right for someone who left. Deleting is
    // for accounts that should never have existed -- a test, a typo, a duplicate -- so it is
    // separate, and it says plainly that the call history goes with it.
    + (isNew ? '' : '<button class="btn ghost w" style="margin-top:8px;color:var(--bad);border-color:var(--badline)" id="oDel">Futa kabisa / Delete account</button>'
        + '<div class="fldnote">Kufuta kunaondoa na historia ya simu zake. Kuzima tu kunaihifadhi. / Deleting also removes their call history; switching off keeps it.</div>'));
  if (!isNew) $('#oDel').onclick = function(){
    if (!confirm('Futa akaunti ya "' + (x.name||'') + '" na historia yake yote ya simu?\n\n'
      + 'Kwa mtu aliyeondoka, ni bora kuizima badala yake. / Delete this account AND all of its call history? '
      + 'For someone who has left, switching it off is usually better.')) return;
    srv('deleteOfficerAccount', { userId: x.user_id })
      .then(function(){ toast('Imefutwa. / Deleted.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
  $('#oSave').onclick = function(){
    srv('saveOfficerAccount', { name:$('#oName').value.trim(), phone:$('#oPhone').value.trim(),
      team:$('#oTeam').value, role:$('#oRole').value.trim(),
      isLeader:$('#oLeader').checked, active:$('#oActive').checked,
      issuePasscode: isNew || $('#oIssue').checked })
      .then(function(r){
        if (r.passcode){
          // Shown once, and only here. There is no screen anywhere that can show it again.
          $('#oOut').innerHTML = '<div class="passout"><div class="pl">Nenosiri / Passcode — '
            + 'andika sasa, halitaonekana tena / write it down now, it is never shown again</div>'
            + '<div class="pv">'+esc(r.passcode)+'</div></div>';
          $('#oSave').textContent = 'Nimeandika / Done';
          $('#oSave').onclick = function(){ closeDrawer(); render(); };
          toast('Imehifadhiwa. / Saved.');
        } else { toast('Imehifadhiwa. / Saved.'); closeDrawer(); render(); }
      })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}

/** Add or edit a portal login. Editing keeps the code itself fixed -- changing it would
    silently orphan whoever is already using it. */
function codeForm(x){
  var isNew = !x;
  var roles = (S.roles||[]).map(function(r){ return r.role; });
  if (x && roles.indexOf(x.role) < 0) roles.push(x.role);
  drawer('<h3>'+(isNew?'Msimbo mpya / New access code':'Badili / Edit '+esc(x.name))+'</h3>'
    + '<div class="sub">Msimbo ndio nywila -- usiushirikishe. / The code is the password.</div>'
    + '<div class="fld"><label>Msimbo / Code</label><input id="kCode" value="'+esc(x?x.code:'')+'">'
      + (isNew ? '' : '<div class="fldnote">Unaweza kuubadilisha — mtumiaji ataingia na mpya. / You can change this; the holder signs in with the new one from that moment.</div>')
      + '</div>'
    + '<div class="fld"><label>Jina / Name</label><input id="kName" value="'+esc(x?x.name:'')+'"></div>'
    + '<div class="fld"><label>Wadhifa / Role</label><input id="kRole" list="roleList" value="'+esc(x?x.role:'')+'">'
      + '<datalist id="roleList">'+roles.map(function(r){ return '<option value="'+esc(r)+'">'; }).join('')+'</datalist></div>'
    + '<div class="fld"><label>Timu / Teams (ALL au orodha)</label><input id="kTeams" value="'+esc(x&&x.teams?x.teams.join(', '):'ALL')+'"></div>'
    + '<div class="fld"><label>Tabs za ziada / Extra tabs (upload, settings)</label><input id="kTabs" value="'+esc(x&&x.tabs?x.tabs.join(', '):'')+'"></div>'
    + '<button class="btn w" id="kSave">Hifadhi / Save</button>'
    + (isNew ? '' : '<button class="btn ghost w" style="margin-top:8px;color:var(--bad);border-color:var(--badline)" id="kDel">Futa msimbo / Delete code</button>'));
  document.getElementById('kSave').onclick = function(){
    srv('saveAccessCode', { code:document.getElementById('kCode').value.trim(), oldCode:(x?x.code:''), name:document.getElementById('kName').value.trim(),
      role:document.getElementById('kRole').value.trim(), teams:document.getElementById('kTeams').value.trim(),
      tabs:document.getElementById('kTabs').value.trim() })
      .then(function(){ toast('Imehifadhiwa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
  var del = document.getElementById('kDel');
  if (del) del.onclick = function(){
    if (!confirm('Futa msimbo wa '+(x.name)+'? Hataweza kuingia tena.\n\nDelete this code? They will no longer be able to sign in.')) return;
    srv('deleteAccessCode', { code:x.code })
      .then(function(){ toast('Imefutwa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}

/** Manage a phone registration. The two actions are genuinely different, so they are
    presented as such rather than one ambiguous "remove". */
function userForm(u){
  if (!u) return;
  drawer('<h3>'+esc(u.name||u.user_id)+'</h3><div class="sub">'+esc(u.team||'—')+' · '+esc(u.phone||'')+'</div>'
    + '<div class="facts">'
    + '<div class="frow"><span>Wadhifa / Role</span><span>'+esc(u.role||'')+(u.is_leader?' (leader)':'')+'</span></div>'
    + '<div class="frow"><span>Simu zilizorekodiwa / Calls</span><b>'+money(u.calls)+'</b></div>'
    + '<div class="frow"><span>Alijisajili / Registered</span><span>'+esc(String(u.registered_at||'').replace('T',' ').slice(0,16))+'</span></div>'
    + '<div class="frow"><span>Sync ya mwisho</span><span>'+esc(String(u.last_sync||'—').replace('T',' ').slice(0,16))+'</span></div>'
    + '<div class="frow"><span>Kifaa / Device</span><span>'+(u.device_id?'imeunganishwa / signed in':'huru / free')+'</span></div>'
    + '</div>'
    + '<button class="btn w" id="uFree">Ondoa kwenye simu / Sign the phone out</button>'
    + '<div style="font-size:11.5px;color:var(--mut);margin:6px 0 14px">Historia inabaki; mtumiaji atajisajili upya kwa jina/timu sahihi.<br>Keeps their call history &mdash; they simply register again with the right name and team.</div>'
    + '<button class="btn ghost w" style="color:var(--bad);border-color:var(--badline)" id="uDel">Futa kabisa / Delete this registration</button>'
    + '<div style="font-size:11.5px;color:var(--mut);margin-top:6px">Huondoa usajili NA simu zote zilizorekodiwa &mdash; kwa akaunti za majaribio.<br>Removes the registration AND its call logs &mdash; for test accounts.</div>');
  document.getElementById('uFree').onclick = function(){
    srv('removeCallUser', { userId:u.user_id, mode:'unregister' })
      .then(function(){ toast('Simu imeondolewa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
  document.getElementById('uDel').onclick = function(){
    if (!confirm('Futa usajili wa '+(u.name||u.user_id)+' na simu '+u.calls+' zilizorekodiwa?\n\nDelete this registration and its '+u.calls+' call log(s)? This cannot be undone.')) return;
    srv('removeCallUser', { userId:u.user_id, mode:'delete' })
      .then(function(){ toast('Imefutwa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}
function settingForm(key, value){
  /* Any setting that holds a picture -- the app logo above all -- used to need a URL hosted
     somewhere else, which is a deploy and a hosting decision for what is really just "here is
     our logo". Pick the file and it is stored inline, downscaled to 512px first so a 2MB
     export does not travel to every handset on every boot while still being sharp enough for
     the largest screen that shows it. */
  drawer('<h3>Badili thamani / Set a value</h3><div class="sub">Mfano: COMMISSION_RATE = 5</div>'
    + '<div class="fld"><label>Key</label><input id="sKey" value="'+esc(key)+'"'+(key?' readonly':'')+'></div>'
    + '<div class="fld"><label>Value</label><input id="sVal" value="'+esc(value)+'"></div>'
    + '<div class="fld"><label>Au chagua picha / Or choose an image (logo)</label>'
      + '<input type="file" id="sImg" accept="image/*"></div>'
    + '<div id="sPrev" style="margin:0 0 10px"></div>'
    + '<button class="btn w" id="sSave">Hifadhi / Save</button>'
    // Every other register here can lose a row. A key typed wrongly once used to stay forever,
    // and a switch left behind by an old build kept quietly applying.
    + (key ? '<button class="btn w ghost danger" id="sDel" style="margin-top:8px">Futa / Delete this setting</button>' : ''));
  if (/^data:image\//.test(String(value||''))) document.getElementById('sPrev').innerHTML =
    '<img src="'+esc(value)+'" style="width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff">';
  document.getElementById('sImg').onchange = function(){
    var f = this.files && this.files[0];
    if (!f) return;
    var rd = new FileReader();
    rd.onload = function(){
      var im = new Image();
      im.onload = function(){
        var n = 512, s = Math.min(n / im.width, n / im.height, 1);
        var cv = document.createElement('canvas');
        cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        var url = cv.toDataURL('image/png');
        document.getElementById('sVal').value = url;
        document.getElementById('sPrev').innerHTML =
          '<img src="'+esc(url)+'" style="width:64px;height:64px;object-fit:contain;border-radius:10px;background:#fff">';
        toast('Picha imesomwa — bonyeza Hifadhi. / Image read — now press Save.');
      };
      im.onerror = function(){ toast('Faili hii si picha inayosomeka. / That file is not a readable image.', true); };
      im.src = rd.result;
    };
    rd.readAsDataURL(f);
  };
  document.getElementById('sSave').onclick = function(){
    srv('settingSet', { key:document.getElementById('sKey').value.trim(), value:document.getElementById('sVal').value })
      .then(function(){ toast('Imehifadhiwa.'); closeDrawer(); render({ force:true }); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
  var sd = document.getElementById('sDel');
  if (sd) sd.onclick = function(){
    if (!confirm('Futa "'+key+'"? Mfumo utarudi kwenye thamani ya kawaida.\n\n'
      + 'Delete this setting? The system falls back to its built-in default.')) return;
    srv('settingDelete', { key: key })
      .then(function(){ toast('Imefutwa.'); closeDrawer(); render({ force:true }); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}

/* ----------------------------------------------------------- boot */
(function(){
  // Theme and language apply BEFORE anything renders, so there is no flash of the wrong one.
  applyTheme(load('hopeTheme') === 'dark');
  applyLang(load('hopeLang') || 'sw');
  var saved = load('hopeCode');
  if (!saved) return;
  S.code = saved;
  fetch('/api/me?code='+encodeURIComponent(saved))
    .then(readJson_)
    .then(function(x){
      if (x.status>=200 && x.status<300 && x.body.ok!==false) start(x.body);
      else { store('hopeCode', null); $('#code').value=''; }
    })
    .catch(function(){});
})();
</script>
