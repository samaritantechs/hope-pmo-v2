/* Opened as a document rather than downloaded: the officer prints it or saves it as PDF from
   the browser's own print dialog, which is what produced the letter in v1 too. */
/* PRINTING A DOCUMENT THAT SOMEBODY SIGNS.

   This opened a new window and wrote the document into it. Two problems with that, and both
   of them end with an officer unable to produce a legal document:

     - A pop-up blocker stops it, and the only clue is a small icon in the address bar.
     - The Android app has no pop-ups at all, and no print service of its own, so from the
       APK the button did nothing whatsoever.

   Printing now happens IN THE PAGE: the document is written into a hidden frame that the
   print stylesheet reveals and everything else hides. No new window, nothing to block, and
   the browser's own print dialog does the rest -- including "Save as PDF", which is how these
   end up attached to an email or a legal file.

   The APK still cannot print (Android WebView needs the app to offer a print service, which
   this one does not). Rather than a button that silently does nothing, it says so and offers
   the document in the phone's browser, where printing works. */
function canPrintHere(){
  // The Android shell announces itself; a plain browser does not.
  return !(window.HopeCalls || /HopeCalls/i.test(navigator.userAgent || ''));
}
function printHtml(html){
  if (!canPrintHere()){
    // Hand it to the real browser, which can print. A blob URL keeps the document off the
    // network -- it never leaves the phone.
    try {
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
      toast('Imefunguliwa kwenye kivinjari ili kuchapisha. / Opened in the browser, where you can print.');
      return;
    } catch(e){
      toast('Chapisha kwenye kompyuta. / Print this from a computer.', true); return;
    }
  }
  var f = document.getElementById('printFrame');
  if (!f){
    f = document.createElement('iframe');
    f.id = 'printFrame';
    f.setAttribute('aria-hidden', 'true');
    document.body.appendChild(f);
  }
  var doc = f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  // Give the images -- logo, stamp, signature -- a moment to load. A contract printed without
  // its stamp has to be printed again, and nobody notices until it is in front of a customer.
  var go = function(){
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('Imeshindikana kuchapisha. / Could not open the print dialog.', true); }
  };
  var imgs = doc.images ? doc.images.length : 0;
  if (!imgs) { setTimeout(go, 120); return; }
  var done = 0, fired = false;
  var maybe = function(){ if (++done >= imgs && !fired){ fired = true; setTimeout(go, 80); } };
  Array.prototype.forEach.call(doc.images, function(im){
    if (im.complete) return maybe();
    im.onload = maybe; im.onerror = maybe;
  });
  // A stamp that never loads must not mean a document that never prints.
  setTimeout(function(){ if (!fired){ fired = true; go(); } }, 2500);
}

/* NAME AND NUMBER, ONE COLUMN, RED WHEN THE NUMBER IS MISSING. "I need to see the full table
   of detailed teams and staff in the web so that I know what misses when am there too -- b/se
   its still unlike the export, there I see as before" -- the main table used to show only the
   name half of every role, so a team with nobody to call for its Bulk SMS export looked exactly
   like one that did. Every role column now carries its number too, and turns the same `bad` red
   the Msimbo/Code column already uses for "field officers cannot sign in" -- so a gap is visible
   by scanning the table, not only by running an export and reading its prompt. */
function roleCol(nameKey, phoneKey, label){
  return { key: nameKey, label: label,
    cls: function(r){ return r[phoneKey] ? '' : 'bad'; },
    get: function(r){
      var nm = String(r[nameKey] || '').trim(), ph = String(r[phoneKey] || '').trim();
      if (!nm && !ph) return '—';
      if (nm && ph) return nm + ' · ' + ph;
      return nm ? (nm + ' — no number') : ('(' + ph + ')');
    } };
}

/* ONE PERSON, ALL THEIR TEAMS, ONE SAVE.
 *
 *  The list of ticks IS the answer -- a team left unticked is taken off them. That is the half
 *  that made this worth building: a reassignment done ten rows at a time and abandoned half way
 *  leaves a team pointing at somebody who has left, and nothing on any screen says so.
 *
 *  The role decides where the save goes. Six of the seven live as a column on the teams table;
 *  a COLLECTION officer's teams are a list on their access code. Nobody using this screen has
 *  to know that -- the server writes to whichever place the role actually lives in. */
function staffForm(x){
  var meta = S.staff || { roles: [], allTeams: [] };
  var isNew = !x;
  var have = (x && x.teams) || [];
  var roles = meta.roles || [];
  drawer('<h3>'+(isNew ? 'Mfanyakazi mpya / New staff member' : esc(x.name))+'</h3>'
    + '<div class="sub">Timu ulizochagua ndio anazokuwa nazo. Usiyoichagua inaondolewa.'
    + ' / The teams you tick are the ones they hold. Anything unticked is taken off them.</div>'
    + '<div class="fld"><label>Jina / Name</label><input id="sfName" value="'+esc(x?x.name:'')+'"></div>'
    + '<div class="fld"><label>Wadhifa / Role</label><select id="sfRole">'
    + roles.map(function(r){
        return '<option value="'+esc(r.key)+'"'+((x && x.role===r.key)?' selected':'')+'>'+esc(r.label)+'</option>';
      }).join('') + '</select></div>'
    /* A collection officer IS an access code with that role. Saying so here means the refusal
       from the server is never the first time anybody hears it. */
    + '<div class="note" id="sfNote" style="display:none">Afisa wa makusanyo lazima awe na msimbo wa kuingia'
    + ' wenye wadhifa huo. / A collection officer must already have an access code with that role —'
    + ' create it under Settings first, then set their teams here.</div>'
    + '<div class="fld"><label>Timu / Teams <span id="sfCount" class="sub"></span></label>'
    + '<div style="margin:4px 0 8px"><button class="btn sm ghost" type="button" id="sfAll">Chagua zote / All</button> '
    + '<button class="btn sm ghost" type="button" id="sfNone">Ondoa zote / None</button></div>'
    + '<div class="checks" style="max-height:46vh;overflow:auto">'
    + (meta.allTeams||[]).map(function(t){
        return '<label><input type="checkbox" class="sfTeam" value="'+esc(t)+'"'
          + (have.indexOf(t)>=0?' checked':'')+'> '+esc(t)+'</label>'; }).join('')
    + '</div></div>'
    + '<button class="btn w" id="sfSave">Hifadhi / Save</button>');

  var boxes = function(){ return document.querySelectorAll('.sfTeam'); };
  var recount = function(){
    var n = 0;
    Array.prototype.forEach.call(boxes(), function(c){ if (c.checked) n++; });
    $('#sfCount').textContent = '(' + n + ')';
    $('#sfNote').style.display = ($('#sfRole').value === 'collection') ? '' : 'none';
  };
  Array.prototype.forEach.call(boxes(), function(c){ c.onchange = recount; });
  $('#sfRole').onchange = recount;
  $('#sfAll').onclick = function(){ Array.prototype.forEach.call(boxes(), function(c){ c.checked = true; }); recount(); };
  $('#sfNone').onclick = function(){ Array.prototype.forEach.call(boxes(), function(c){ c.checked = false; }); recount(); };
  recount();

  $('#sfSave').onclick = function(){
    var teams = Array.prototype.filter.call(boxes(), function(c){ return c.checked; })
      .map(function(c){ return c.value; });
    var name = $('#sfName').value.trim();
    if (!name) { toast('Jina linahitajika. / A name is required.', true); return; }
    srv('saveStaffTeams', { role: $('#sfRole').value, name: name, code: (x && x.code) || '', teams: teams })
      .then(function(r){
        /* SAY WHAT ACTUALLY HAPPENED. "Saved" after a save that changed nothing, or that quietly
           took somebody off four teams, is the same word for two very different events. */
        toast('Imehifadhiwa / Saved — ' + teams.length + ' timu'
          + (r && r.cleared ? ', ' + r.cleared + ' imeondolewa / removed' : ''));
        closeDrawer(); render();
      })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}

function teamForm(x){
  var isNew = !x;
  drawer('<h3>'+(isNew?'Timu mpya / New team':esc(x.team))+'</h3>'
    + '<div class="sub">Wasimamizi hapa ndio wanaotumika kwenye ugawaji na ripoti zote. / These names drive assignment and every leader report.</div>'
    + '<div class="fld"><label>Timu / Team</label><input id="tTeam" value="'+esc(x?x.team:'')+'"'+(isNew?'':' readonly')+'></div>'
    + '<div class="fld"><label>Msimbo wa timu / Team code</label>'
      + '<div style="display:flex;gap:8px"><input id="tCode" style="flex:1" value="'+esc(x&&x.team_code?x.team_code:'')+'">'
      + '<button class="btn sm ghost" id="tGen" style="width:auto">Tengeneza / Generate</button></div>'
      + '<div class="fldnote">Maafisa wa timu hii wanaingia nao. Ukiubadilisha, simu zao zote zinakatwa. / Field officers on this team sign in with this. Changing it releases every one of their handsets.</div></div>'
    + TEAM_ROLES.map(function(c){
        // "my final thought of the teams and staff table" renamed EXPECTED to EARLY COL --
        // the column is still `expected`, only the label people see changes.
        var label = c === 'expected' ? 'EARLY COL' : c.toUpperCase();
        return '<div class="fld"><label>'+label+'</label><input id="t_'+c+'" value="'+esc(x&&x[c]?x[c]:'')+'"></div>';
      }).join('')
    + TEAM_EXTRA.map(function(e){
        return '<div class="fld"><label>'+esc(e[1])+'</label><input id="t_'+e[0]+'" value="'+esc(x&&x[e[0]]?x[e[0]]:'')+'"></div>';
      }).join('')
    + '<button class="btn w" id="tSave">Hifadhi / Save</button>'
    /* MERGE IS A FIRST-CLASS CHOICE, NOT A CONSOLATION AFTER A FAILED DELETE.

         "Am not seeing the merge team option (provide opt to the new merged team name)"
         "and of course its the better option"

       It WAS only offered when a delete was refused, which meant it existed exactly where
       nobody would look for it -- behind an error. And it is the better option for the case
       that actually happens: a misspelling holding real work. So it sits above Delete, with
       every other team to choose from by name, and it says plainly what will happen. */
    + (isNew ? '' :
        '<div class="fld" style="margin-top:14px"><label>Unganisha na timu nyingine / Merge into another team</label>'
        + '<select id="tMergeTo"><option value="">— chagua timu sahihi / choose the correct team —</option>'
        /* EXACT comparison, not upper-cased. `teams.team` is the primary key and Postgres
           compares it exactly, so TUNDURU and Tunduru are two separate rows -- which is how a
           duplicate comes to exist at all. Excluding case-insensitively hid the very team
           somebody was trying to merge into, which was reported as "Tunduru is not appearing".
           Only the row you are standing on is left out. */
        + (S.teamNames || []).filter(function(n){ return String(n) !== String(x.team); })
            .map(function(n){ return '<option>' + esc(n) + '</option>'; }).join('')
        + '</select>'
        + '<div class="fldnote">Kumbukumbu zote za <b>' + esc(x.team) + '</b> zitahamia kwenye timu'
        + ' uliyochagua, kisha jina hili litaondolewa. Hakuna kinachofutwa isipokuwa jina.'
        + ' / Every record filed under <b>' + esc(x.team) + '</b> moves to the team you pick —'
        + ' snapshots, decks, follow-ups, loans, payments, complaints, call logs, handsets and'
        + ' the team lists on access codes. Then this name is removed.'
        + ' <b>Nothing is deleted except the name.</b></div></div>'
        + '<button class="btn ghost w" id="tMerge">\u21c4 Unganisha / Merge this team</button>')
    + (isNew ? '' : '<button class="btn ghost w" style="margin-top:8px;color:var(--bad);border-color:var(--badline)" id="tDel">Futa timu / Delete team</button>'));
  // Generate fills the box so the code is visible BEFORE saving -- an admin has to be able to
  // write it down or read it out, and a code that only appears after the drawer closes gets
  // lost. Nothing is committed until Save.
  document.getElementById('tGen').onclick = function(){
    var A = '23456789ABCDEFGHJKMNPQRSTUVWXYZ', out = '';
    var b = new Uint8Array(6);
    (window.crypto || window.msCrypto).getRandomValues(b);
    for (var i = 0; i < 6; i++) out += A[b[i] % A.length];
    document.getElementById('tCode').value = out;
  };
  document.getElementById('tSave').onclick = function(){
    var p = { team: document.getElementById('tTeam').value.trim(),
              teamCode: document.getElementById('tCode').value.trim() };
    TEAM_ROLES.forEach(function(c){ p[c] = document.getElementById('t_'+c).value.trim(); });
    TEAM_EXTRA.forEach(function(e){ p[e[0]] = document.getElementById('t_'+e[0]).value.trim(); });
    srv('saveTeam', p).then(function(r){
      toast(r.rotated
        ? ('Msimbo umebadilishwa — simu ' + money(r.released) + ' zimekatwa. / Code changed, ' + money(r.released) + ' handset(s) released.')
        : 'Imehifadhiwa. / Saved.');
      closeDrawer(); render();
    }).catch(function(e){ toast(String(e.message||e), true); });
  };
  /* A MISSPELLED TEAM HOLDS REAL WORK.

       "Team TUNDURU should be deleted because the correct one is Tunduru. it fails saying it
        has expected snapshots"

     Refusing the delete is right -- removing a team that still holds records would orphan
     them. But the admin's intention was never "throw the snapshots away"; it was "these belong
     to the other spelling". So when the server refuses, the screen offers the merge instead of
     leaving them at a dead end with an error they cannot act on. */
  var mrg = document.getElementById('tMerge');
  if (mrg) mrg.onclick = function(){
    var sel = document.getElementById('tMergeTo');
    var into = sel ? sel.value.trim() : '';
    if (!into){ toast('Chagua timu sahihi kwanza. / Choose the correct team first.', true); return; }
    if (!confirm('Hamisha kumbukumbu ZOTE za ' + x.team + ' kwenda ' + into + ', kisha uondoe '
        + x.team + '?\n\nMove EVERY record from ' + x.team + ' to ' + into
        + ', then remove ' + x.team + '?\n\nNothing is deleted except the name. This cannot be undone.')) return;
    srv('deleteTeam', { team:x.team, moveTo:into }).then(function(r){
      var what = Object.keys(r.moved||{}).map(function(k){ return money(r.moved[k])+' '+k; });
      toast('Imeunganishwa na ' + r.mergedInto + '. / Merged into ' + r.mergedInto
        + (what.length ? ' — ' + what.join(', ') + '.' : ' — nothing needed moving.'));
      closeDrawer(); render();
    }).catch(function(e){ toast(String(e.message||e), true); });
  };
  var del = document.getElementById('tDel');
  if (del) del.onclick = function(){
    if (!confirm('Futa timu '+x.team+'?\n\nDelete this team?')) return;
    var done = function(r){
      toast(r && r.mergedInto
        ? ('Imehamishwa kwenda ' + r.mergedInto + '. / Merged into ' + r.mergedInto + ' — '
           + Object.keys(r.moved||{}).map(function(k){ return money(r.moved[k])+' '+k; }).join(', ')
           + (Object.keys(r.moved||{}).length ? '' : 'nothing to move') + '.')
        : (r && r.released
            ? ('Imefutwa \u2014 simu ' + r.released + ' zimekatwa. / Deleted, ' + r.released + ' handset(s) released.')
            : 'Imefutwa. / Deleted.'));
      closeDrawer(); render();
    };
    srv('deleteTeam', { team:x.team }).then(done).catch(function(e){
      var msg = String(e.message||e);
      // Only the "still holds records" refusal has a merge as its answer.
      if (!/still holds|bado ina kumbukumbu/i.test(msg)) { toast(msg, true); return; }
      var into = prompt(msg + '\n\n— — —\nAndika jina la timu sahihi ya kuihamishia,'
        + ' au bonyeza Cancel.\nType the CORRECT team to merge ' + x.team
        + ' into, or press Cancel:', '');
      if (!into || !into.trim()) return;
      if (!confirm('Hamisha kumbukumbu zote za ' + x.team + ' kwenda ' + into.trim().toUpperCase()
          + ', kisha futa ' + x.team + '?\n\nMove EVERY record from ' + x.team + ' to '
          + into.trim().toUpperCase() + ', then remove ' + x.team + '? Nothing is deleted except the name.')) return;
      srv('deleteTeam', { team:x.team, moveTo:into.trim() }).then(done)
        .catch(function(e2){ toast(String(e2.message||e2), true); });
    });
  };
}

/* EVERY report that grows, not just the big five. This list used to stop at Call Logs, which
   left an admin able to clean five things and stuck with the rest.
   `kept` marks the four registers people ALSO type into from inside the app. Cleaning a date
   there takes only what arrived in an upload -- a complaint logged at the desk or an officer's
   comment is somebody's work, not a report, and must not vanish in a tidy-up. */
var CLEAN_TYPES = [
  { key:'expected',       label:'Expected Repayment' },
  { key:'defaulters',     label:'Defaulters (initial + current)' },
  { key:'received',       label:'Received Payments' },
  { key:'abnormal',       label:'Abnormal Payments' },
  { key:'calls',          label:'Call Logs' },
  { key:'loans',          label:'Loan Pipeline (all stages)' },
  { key:'comments',       label:'Comments Log', kept:1 },
  { key:'complaints',     label:'Complaints', kept:1 },
  { key:'restructures',   label:'Loan Restructuring', kept:1 },
  { key:'demand_notices', label:'Demand Notices', kept:1 },
  /* The one register that grew with no way to clean it: a customer who leaves the deck keeps
     their row on purpose, so nothing ever removed one. It is last in the list and marked,
     because unlike every other line here it takes comment history with it. */
  { key:'followup',       label:'Follow-up list (customers + their comments)', cascade:1 },
];
/* WHO DID WHAT. Reads from the top, because that is how a log is read -- and says plainly when
   the table does not exist yet, rather than showing an empty one. An empty audit log reads as
   "nobody has done anything", which is the single conclusion it must never invite by accident. */
VIEWS.perf = function(){
  var a = S.args || {};
  var period = a.period || 'week';
  return srv('perfHistory', { period: period, metric: a.metric || '', scope: a.scope || '' }).then(function(d){
    var best = function(scope, metric){
      var top = (d.rows||[]).filter(function(r){ return r.scope===scope && r.metric===metric; })[0];
      return top ? (top.name + ' · TZS ' + money(top.value)) : '—';
    };
    HEAD = '<div class="kpis">'
      + kpi('Rekodi / Records', money(d.count), d.available ? (d.periods||[]).length + ' periods' : 'not set up yet')
      + kpi('Mauzo / Sales', best('leader','sales'), 'best leader in the newest period')
      + kpi('Makusanyo / Collection', best('leader','collection'), null, 'good')
      + kpi('Urejeshaji / Recovery', best('leader','recovery'), null, 'good')
      + '</div>'
      + (d.available ? '' : '<div class="note bad">' + esc(d.note) + '</div>')
      + '<div class="note" style="display:block">Majina hapa ni ya WAKATI ULE. Ukibadilisha viongozi kesho, '
      + 'rekodi za nyuma hazibadiliki.<br><i>The names here are as they were AT THE TIME. Reassign a leader '
      + 'tomorrow and every live board re-points with them — these records do not, which is the only thing '
      + 'that makes a year of them worth keeping.</i></div>'
      + bar(['week','month','year'].map(function(p){
          return '<button class="pill'+(p===period?' on':'')+'" data-arg="period" data-val="'+p+'">'
            + (p==='week'?'Wiki / Weekly':p==='month'?'Mwezi / Monthly':'Mwaka / Yearly') + '</button>'; }).join('')
        + '<select data-filter="metric" style="margin-left:auto"><option value="">Vyote / All three</option>'
        + ['sales','collection','recovery'].map(function(m){
            return '<option'+(S.filters.metric===m?' selected':'')+'>'+m+'</option>'; }).join('') + '</select>'
        + '<select data-filter="scope"><option value="">Timu na viongozi / Teams and leaders</option>'
        + ['team','leader'].map(function(x){
            return '<option'+(S.filters.scope===x?' selected':'')+'>'+x+'</option>'; }).join('') + '</select>');
    S.rows = d.rows || [];
    S.cols = [col('period_start','Period','date'),
      {key:'metric', label:'Metric', kind:'chip', chip:function(r){
        return r.metric==='recovery'?'ok':(r.metric==='sales'?'warn':'mut'); }},
      {key:'scope', label:'Team or leader', kind:'chip', chip:function(r){ return r.scope==='leader'?'ok':'mut'; }},
      col('name','Name'), col('position','Position then'),
      col('value','Value','money'), col('basis','Out of','money'), col('pct','%','pct'),
      col('recorded_at','Recorded','dt')];
    S.foot = 'Imehifadhiwa wakati ripoti ya wiki ilipofunguliwa. / Written when the weekly report is opened.';
  });
};

/* WHERE IS THIS CUSTOMER, AND IF NOWHERE, WHY.

   Defaulter decks are stored PER WEEKDAY -- deliberately, because an initial MON deck against a
   current TUE deck measures two different populations. But every screen reads TODAY'S weekday,
   so a customer whose deck went in under Tuesday is invisible on Monday to EVERYONE, admin
   included, with nothing anywhere to say so. The data is right and the screens are right, and
   the person looking has no way to tell which is lying to them.

   This screen says it in words. */
VIEWS.findcust = function(){
  var q = S.args.q || '';
  HEAD = bar('<label style="font-size:12px;color:var(--mut)">REF#, jina au namba / reference, name or phone</label>'
      + '<input id="fcQ" value="' + esc(q) + '" placeholder="e.g. 2-209-72865  ·  ESTER  ·  0746115063" style="min-width:280px">'
      + '<button class="btn sm" id="fcGo">\ud83d\udd0d Tafuta / Find</button>');
  S.rows = []; S.cols = []; ONROW = null;
  if (q.length < 3) {
    HEAD += '<div class="note">Andika angalau herufi 3. / Type at least 3 characters and press Find.'
      + ' This looks in the defaulter decks, the expected decks and the follow-up register, and'
      + ' then tells you whether today\u2019s screens can see them.</div>';
    return Promise.resolve();
  }
  return srv('findCustomer', { q: q }).then(function(d){
    HEAD += '<div class="kpis">'
      + kpi('Imepatikana / Found', money(d.count), 'latest upload only, one row per customer', d.count?'good':'bad')
      + kpi('Leo / Today', esc(d.weekdayToday), esc(d.today))
      + kpi('Timu / Teams', esc((d.teams||[]).join(', ') || '\u2014'))
      + '</div>'
      + (d.notes||[]).map(function(n){
          return '<div class="note' + (/ARE in the defaulter deck|Not found/.test(n) ? ' bad' : '') + '">'
            + esc(n) + '</div>'; }).join('')
      + (d.count ? '<div class="note">Bofya mstari kuona historia na kuongeza maoni. / Tap a row to see full history and add a comment.</div>' : '');
    /* ONE ROW PER CUSTOMER, THE LATEST UPLOAD ONLY -- "results should show of latest uploaded
       labeled [expected or default] file only and not transactions or whatever". The server
       already collapsed each ref's whole snapshot history down to its newest row and dropped
       the follow-up register from this list entirely (its comments are not gone -- opening a
       row below reads them fresh, same as every other follow-up drawer in this system). */
    S.rows = (d.decks||[]).map(function(r){ return {
      where: r.where, date: r.date, team: r.team, ref: r.ref, name: r.name, full_name: r.name,
      contact: r.contact, guarantor_name: r.guarantor_name, guarantor_contact: r.guarantor_contact,
      status: r.status, ds: r.ds, arrears: r.arrears,
      seen: r.onToday && r.dated ? 'Ndiyo / yes' : (r.onToday ? 'Si ya leo / not today\u2019s date' : 'Siku nyingine / other weekday') };
    }).concat((d.expected||[]).map(function(r){ return {
      where: r.where, date: r.date, team: r.team, ref: r.ref, name: r.name, full_name: r.name,
      contact: r.contact, status: r.status, ds: r.ds, arrears: r.arrears,
      seen: r.dated ? 'Ndiyo / yes' : 'Si ya leo / not today\u2019s date' };
    }));
    S.cols = [col('where','Deck'), col('date','Date','date'), col('team','Team'),
      col('ref','REF#'), col('name','Fullname'), col('status','Status'), col('ds','D.S'),
      col('arrears','Arrears','money'),
      {key:'seen', label:'Inaonekana leo? / Visible today?', kind:'chip', chip:function(r){
        return /Ndiyo/.test(r.seen) ? 'ok' : 'bad'; }}];
    S.fcToday = d.weekdayToday;
    S.foot = 'Leo / today: ' + d.weekdayToday + ' \u00b7 ' + d.today;
    // The whole point of this screen now: pick the customer, see the insight, add a comment --
    // the same drawer Defaulters Followup already opens, so there is one comment box in this
    // system, not a second one reinvented here.
    ONROW = function(r){ openFollowup(r); };
  });
};

      + kpi('Watu / People', money((d.actors||[]).length))

      + (d.available ? '' : '<div class="note bad">' + esc(d.note) + '</div>')

/* PRESENTATION — a real projector mode, not a card on a page: it goes full screen, plays
   like a deck for the office TV, auto-advances, and takes arrow keys / Esc. Each slide is a
   whole board (the same numbers the tabs show), so a meeting reads live figures rather than
   a screenshot someone exported that morning. */
VIEWS.present = function(){
  // BOTH halves take the same week, or the slides would pair one week's cards against another
  // week's officer boards -- which is the sort of thing nobody notices in a dark room.
  var wk = { weekOf: S.args.weekOf || '' };
  return Promise.all([srv('dashboardFull', wk), srv('officerBoards', wk)]).then(function(r){
    /* KEPT, so ticking a segment box does not go back to the server. Rebuilding this screen is
       the most expensive thing the system does -- the dashboard AND the officer boards, a
       hundred-odd round trips -- and it was being done again on every tick of every checkbox.
       The figures do not change because somebody chose not to project a slide. */
    S.presData = { d: r[0], b: r[1] };
    return presRender();
  });
};

/** Build every slide from the figures already in hand. Filtering (which segments, which team)
    happens afterwards in presApply, so a choice never costs a request. */
function presSlides(){
    var d = S.presData.d, b = S.presData.b, c = d.cards;
    var slides = [];
    slides.push({ id:'kpi', kind:'kpi', title:'HOPE PMO — ' + d.weekday, items:[
      { l:'Current arrears', v:'TZS '+money(c.curArrears) },
      { l:'Recovered', v:'TZS '+money(c.recovered) },
      { l:'Defaulters', v:money(c.defaulters) },
      { l:'Sales this week', v:'TZS '+money(c.salesWeek) },
      { l:'Uncollected today', v:'TZS '+money(c.uncollectedToday) },
      { l:'Abnormal', v:money(c.abnormal) }]});
    /* TEAM PERFORMANCE. Ranked on the average of sales and collection, highest first -- a team
       that sells well and collects badly is not a good team, and neither is the reverse.

       "Uncollected" and "Collection %" follow the same basis as the recovery denominator:
       today from Monday to Friday, the whole week at the weekend. Recovery % is shown against
       all three denominators at once, because which one applies changes with the day and the
       room wants to see the comparison rather than be told which to look at. */
    var tpBasis = d.teamPerf && d.teamPerf.length ? d.teamPerf[0].basis : 'today';
    var tpLab = tpBasis === 'week' ? ' (week)' : ' (today)';
    slides.push({ id:'teams', kind:'table', title:'Team performance — best first', rows:d.teamPerf.slice(0,12),
      cols:[col('branch','Branch'), col('team','Team'),
        col('salesMonth','Monthly sales','money'),
        col('curArrears','Total def','money'), col('defaulters','No. of def','num'),
        col('uncollected','Uncollected'+tpLab,'money'), col('collPct','Collection %'+tpLab,'pct'),
        col('recPctMon','Rec % vs Mon','pct'), col('recPctYest','Rec % vs yest','pct'),
        col('recPctWeek','Rec % vs week','pct')] });
    /* Recovery is judged against the uncollected the officer is actually chasing, and which
       day's uncollected that is depends on the day: Monday divides by Monday, Tuesday to
       Friday by yesterday, and the weekend by the whole week. So the denominator goes on the
       slide, immediately before the figure it produced -- a recovery percentage with no
       visible denominator is a number the room has to take on trust. */
    var recBasis = d.weekday === 'SAT' || d.weekday === 'SUN' ? 'week' : (d.weekday === 'MON' ? 'today' : 'yesterday');
    var recUncolLabel = recBasis === 'week' ? 'Uncollected (week)'
      : recBasis === 'today' ? 'Uncollected (today)' : 'Uncollected (yesterday)';
    /* Today and the week on one slide, joined on the officer -- the same rule as every other
       role board here. Today's recovery is divided by the basis above; the week's always by the
       week, which is what makes it the weekly figure rather than a second copy of the daily. */
    var recT = {};
    (b.recToday || []).forEach(function(x){ recT[x.officer] = x; });
    var recRows = (b.recWeek || []).map(function(x){
      var t = recT[x.officer] || {};
      return { ...x, tUncollected: t.uncollected, tRecovered: t.recovered, tPct: t.pct }; });
    slides.push({ id:'recovery', kind:'table', title:'Recovery by officer — today and this week',
      rows: recRows.slice(0,12),
      cols:[col('officer','Officer'), col('initial','Initial','money'), col('current','Current','money'),
        col('tUncollected', recUncolLabel, 'money'),
        col('tRecovered','Recovered today','money'), col('tPct','Rec % (today)','pct'),
        col('uncollected','Uncollected (week)','money'),
        col('recovered','Recovered (week)','money'), col('pct','Rec % (week)','pct')] });
    /* Read the same way as PMO Collection, because it answers the same question about a
       different set of officers: how many teams, what is still out, and what share came in.
       The paid/overpaid counts are what the commission is worked out FROM, so they belong on
       the commission panel and not on a wall. */
    /* Early collection is judged on the list of who is due NEXT -- the INITIAL expected report
       here -- so "today" on this board is tomorrow's performance: what the officer has already
       brought in against a day that has not arrived. The two periods share one slide, joined
       on the officer. */
    var earlyW = {};
    (b.earlyWeek || []).forEach(function(x){ earlyW[x.officer] = x; });
    var earlyRows = (b.earlyToday || []).map(function(x){
      var w = earlyW[x.officer] || {};
      return { ...x, wUncollected: w.uncollected, wPct: w.pct }; });
    slides.push({ id:'early', kind:'table',
      title:'Early collection — today and this week' + (b.earlySource === 'tomorrow' ? ' (kesho)' : ''),
      rows: earlyRows.slice(0,12),
      cols:[col('officer','Officer'), col('teams','Teams','num'),
        col('uncollected','Uncollected (today)','money'), col('pct','Coll % (today)','pct'),
        col('wUncollected','Uncollected (week)','money'), col('wPct','Coll % (week)','pct')] });
    /* TWO DIFFERENT ROOMS, and this deck used to show one under the other's name.

       "Call agents" means the CUSTOMER CARE agents: the people named as CREATED BY on the
       application reports. Nobody records their talk time or puts them on a team, and what
       they are judged on is what they brought in -- TRACK# 1 only, because a repeat customer
       is not a new win.

       The HOPE Calls app officers are everybody in the field, and they get their own two
       slides: who is on the phone most, and who is on it least. */
    /* PMO COLLECTION. Five columns, and deliberately only five: number, name, how many teams
       they hold, what is still uncollected, and the percentage. NO COMMISSION -- that lives on
       the commission panel where the person it concerns can see their own figure. A projector
       in a meeting room is the wrong place for anybody's pay, and it changes what the room
       talks about. */
    /* TODAY AND THE WEEK SIDE BY SIDE, one slide per role. Split across two, the room read
       today's figure, discussed it, and had lost the week by the time it came round -- and
       "is this better or worse than the week?" is the question every one of these boards
       exists to answer. */
    /* THE FIVE DAYS BEFORE THE WEEK, because the daily percentage is what pay is worked out
       from -- each day banded on its own and added up -- and the week's figure alone is the one
       number the officers are NOT paid on. Today is one of these five columns, so it is no
       longer shown twice. */
    slides.push({ id:'pmo', kind:'table', title:'PMO Collection — kila siku / each day, then the week',
      rows:(b.pmo||[]).slice(0,12),
      cols:[col('officer','PMO'), col('teams','Teams','num'),
        col('pctJ3','J3','pct'), col('pctJ4','J4','pct'), col('pctJ5','J5','pct'),
        col('pctAL','AL','pct'), col('pctIJ','IJ','pct'),
        col('weekUncollected','Uncollected (week)','money'), col('weekPct','Coll % (week)','pct')] });
    /* "the callagents/customer service reports of assigned and unassigned at presentation i
        need it to always be sum of weekly from mon to sun"
       csWeek is already the Mon-Sun sum -- the title said neither which days nor that it was a
       sum, so on a Tuesday the room read it as Tuesday's. Now it says so. */
    slides.push({ id:'cs', kind:'table',
      title:'Call agents — applications brought in · jumla ya wiki Jumatatu–Jumapili / week total Mon–Sun',
      rows:b.csWeek.slice(0,12),
      cols:[col('agent','Agent'), col('unassigned','Unassigned','num'), col('assigned','Assigned','num'),
        col('brought','Brought in','num'), col('amount','Amount','money')] });
    /* BOTH ENDS ON ONE PAGE. Split across two slides the room saw the busiest, talked about
       them, and had forgotten the comparison by the time the quiet ones came round. Side by
       side the slide answers the question people actually ask: who is working the phone and
       who is not. An officer who never opened the app is IN this list at zero rather than
       missing from it, which is the whole reason it is worth projecting. */
    /* THE THREE PMO UNITS ONLY.
       "For the presentation slides am interested in the 3 PMO department's Units (expected,
        collection and recovery officers - show only those for busiest and least active ones)"

       Everybody in the field calls, so this board was every registered handset in the company
       -- and the twelve names it had room for were whoever happened to call most, which on any
       given week is rarely one of the three units the meeting is about. The unit is decided on
       the server, off the teams table and the access codes, so this is a filter and not a
       second opinion about who is a recovery officer.

       If NOBODY on the board holds one of the three units -- a book where the columns are not
       filled in -- the slide falls back to the whole list rather than going blank. An empty
       slide in a meeting reads as a broken system; a full one reads as "nobody is labelled",
       which is a thing somebody can go and fix. */
    var PMO_UNITS = { EXPECTED:1, COLLECTION:1, RECOVERY:1 };
    var callPool = (b.callWeek || []).filter(function(x){ return PMO_UNITS[x.unit]; });
    var callPoolWorst = (b.callWeekWorst || []).filter(function(x){ return PMO_UNITS[x.unit]; });
    var unitOnly = callPool.length > 0;
    if (!unitOnly) { callPool = b.callWeek || []; callPoolWorst = b.callWeekWorst || []; }
    var callTop = callPool.slice(0, 6).map(function(x){ return { ...x, end:'Busiest' }; });
    var topNames = {};
    callTop.forEach(function(x){ topNames[x.agent] = 1; });
    var callLow = callPoolWorst.filter(function(x){ return !topNames[x.agent]; })
      .slice(0, 6).map(function(x){ return { ...x, end:'Least active' }; });
    slides.push({ id:'calls', kind:'table',
      title:'HOPE Calls — busiest and least active this week'
        + (unitOnly ? ' · Expected · Collection · Recovery' : ' · vitengo havijawekwa / units not set'),
      rows: callTop.concat(callLow),
      cols:[{ key:'end', label:'', cls:function(r){ return r.end==='Busiest'?'good':'bad'; } },
        col('agent','Officer'), col('unit','Unit'), col('team','Team'), col('calls','Calls','num'),
        col('duration','Talk time','dur'), col('portfolio','Portfolio','num'), col('connectPct','Connected %','pct')] });
    slides.push({ id:'credit', kind:'table', title:'Credit analysts — this week', rows:b.creditWeek.slice(0,12),
      cols:[col('analyst','Analyst'), col('apps','Apps','num'), col('amount','Amount','money'),
        col('salesPct','Sales %','pct'), col('perf','Perf','pct')] });
    slides.push({ id:'coltrend', kind:'table', title:'Weekly collection trend', rows:d.colTrend,
      cols:[col('weekday','Day'), col('expected','Expected','money'), col('collected','Collected','money'),
        col('uncollected','Uncollected','money'), col('pct','Coll %','pct')] });
    slides.push({ id:'fu', kind:'table', title:'Follow-up status — all defaulters', rows:b.fuStatus.slice(0,12),
      cols:[col('status','Status'), col('customers','Customers','num'), col('pct','% of book','pct'),
        col('arrears','Arrears','money')] });
    return slides;
}

/* Not every meeting wants every board. A recovery review does not need the credit slide, and an
   evaluation of one team should not project the whole company -- so segments are selectable and
   the deck can be scoped to a single team. Both choices persist, because the same meeting runs
   every week.

   NEITHER CHOICE COSTS A REQUEST. Both are applied to figures already in hand. */
function presApply(){
  if (!S.presOff) S.presOff = (load('hopePresOff') || '').split(',').filter(Boolean);
  if (S.presTeam == null) S.presTeam = load('hopePresTeam') || '';
  var slides = presSlides();
  if (S.presTeam){
    var only = function(list, key){
      return (list || []).filter(function(x){ return String(x[key] || '') === S.presTeam; }); };
    slides = slides.map(function(sl){
      if (sl.kind !== 'table') return sl;
      // Officer/analyst/agent boards belong to whoever covers the team, so they are scoped
      // by team where the row carries one and left whole where it does not.
      if (sl.rows.length && 'team' in sl.rows[0]) return { ...sl, rows: only(sl.rows, 'team') };
      return sl;
    });
  }
  var live = slides.filter(function(sl){ return S.presOff.indexOf(sl.id) < 0; });
  S.slides = live.length ? live : slides;
  return slides;                 // the FULL list, for drawing the checkboxes
}

      + bar('<button class="btn" id="presStart">▶ Anza / Play on the TV</button>'
        + '<label style="font-size:12px;color:var(--mut)">Sekunde / Seconds</label>'
        + '<input type="number" id="presSecs" min="5" max="300" value="'+(S.presSecs||15)+'" style="width:80px">'
        + '<span style="font-size:12px;color:var(--mut)">Esc kutoka · ← → kubadili slaidi / Esc exits, arrows change slide</span>');
    S.rows = S.slides.map(function(sl,i){ return { n:i+1, slide:sl.title, kind:sl.kind,
      rows: sl.kind==='table' ? sl.rows.length : sl.items.length }; });
    S.cols = [col('slide','Slide'), col('kind','Type'), col('rows','Rows','num')];

}
function presStart(from){
  if (!S.slides || !S.slides.length) return;
  var el = document.getElementById('pres');
  el.style.display = 'block';
  S.presI = from || 0;
  S.presBlank = false;                    // a new play never starts behind the black
  presDraw();
  clearInterval(S.presTimer);
  S.presTimer = setInterval(function(){ S.presI = (S.presI + 1) % S.slides.length; presDraw(); },
    Math.max(5, Math.min(300, Number(S.presSecs) || 15)) * 1000);
  // Real full screen: on the office TV the browser chrome should not be part of the picture.
  if (el.requestFullscreen) { try { el.requestFullscreen(); } catch(e){} }
}
function presStop(){
  clearInterval(S.presTimer);
  document.getElementById('pres').style.display = 'none';
  if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch(e){} }
}
function presDraw(){
  var s = S.slides[S.presI], body;
  if (s.kind === 'kpi'){
    body = '<div class="pkpis">' + s.items.map(function(it){
      return '<div class="pkpi"><div class="pl">'+esc(it.l)+'</div><div class="pv">'+esc(it.v)+'</div></div>'; }).join('') + '</div>';
  } else {
    /* THE GRAND TOTAL, on the wall as well as on the tab. It is the number the meeting reads
       out, and a projected table without one sends somebody to a calculator while the slide is
       still up. Same rule as everywhere else: counts, money and talk time add up; percentages
       are worked out again from the totals that made them, never summed. */
    var tot = autoTotals(s.rows, s.cols);
    /* Wrapped, so a board still wider than the screen scrolls inside its own box rather than
       pushing the whole slide sideways and taking the navigation arrows off the edge with it. */
    body = '<div class="pscroll"><table class="ptable"><thead><tr><th>#</th>' + s.cols.map(function(c){
        return '<th class="'+(isNum(c)?'r':'')+'">'+esc(c.label)+'</th>'; }).join('') + '</tr></thead><tbody>'
      + s.rows.map(function(r,i){ return '<tr><td>'+(i+1)+'</td>'+s.cols.map(function(c){
          return '<td class="'+(isNum(c)?'r':'')+'">'+cellHtml(r,c)+'</td>'; }).join('')+'</tr>'; }).join('')
      + (tot ? '<tr class="ptot"><td></td>' + s.cols.map(function(c,i){
          return '<td class="'+(isNum(c)?'r':'')+'">'+(i===0?'JUMLA / TOTAL':cellHtml(tot,c))+'</td>'; }).join('') + '</tr>' : '')
      + '</tbody></table></div>';
  }
  document.getElementById('pres').innerHTML =
    '<div class="phead"><span>'+esc(s.title)+'</span>'
    + '<span class="pnum">'+(S.presI+1)+' / '+S.slides.length+'</span>'
    /* A LABEL, NOT A DOT. This was a bare filled circle beside the close cross, which reads as
       decoration rather than a button -- the person it was built for looked at the deck and did
       not see it. It says what it does now. */
    + '<button class="pblankbtn" onclick="presBlank(true)" title="Skrini nyeusi (B) / Blank the screen">'
      + '&#9679; Skrini nyeusi</button>'
    + '<button class="pclose" onclick="presStop()">&#10005;</button></div>'
    + '<div class="pbody">'+body+'</div>'
    + '<button class="pnav pprev" onclick="presGo(-1)" title="Iliyopita / Previous">&#8249;</button>'
    + '<button class="pnav pnext" onclick="presGo(1)" title="Inayofuata / Next">&#8250;</button>'
    /* Drawn as part of the slide, not laid over it once, so an auto-advance that happens to
       fire cannot pull the black away and put the figures back in front of the room. */
    + (S.presBlank ? '<div class="pblank" onclick="presBlank(false)">'
        + '<div class="pbx">&#10005;</div>'
        + '<div class="pbnote">Bofya popote kurudi / tap anywhere to come back</div></div>' : '');
}

/** BLACK THE SCREEN WITHOUT LOSING THE DECK.
 *
 *  There is prayer time in the office, and turning the television off and on again costs the
 *  meeting a minute of watching the deck load. This covers it instead -- the presentation stays
 *  exactly where it is, still full screen, and comes back on one tap.
 *
 *  THE CLOCK STOPS WITH IT. An auto-advance running behind the black would have the deck three
 *  slides further on by the time anybody looks again, which is precisely the thing somebody
 *  standing in front of the room does not want to explain.
 */
function presBlank(on){
  S.presBlank = !!on;
  if (on){
    S.presWasRunning = !!S.presTimer;
    clearInterval(S.presTimer); S.presTimer = null;
  } else if (S.presWasRunning){
    clearInterval(S.presTimer);
    S.presTimer = setInterval(function(){ S.presI = (S.presI + 1) % S.slides.length; presDraw(); },
      Math.max(5, Math.min(300, Number(S.presSecs) || 15)) * 1000);
  }
  presDraw();
}

/** Step the deck by hand. Moving deliberately also RESTARTS the timer -- otherwise the slide
    somebody just chose to look at gets taken away a second later by a countdown that was
    already half spent, which is the most irritating thing a deck can do. */
function presGo(step){
  if (!S.slides || !S.slides.length) return;
  S.presI = (S.presI + step + S.slides.length) % S.slides.length;
  presDraw();
  if (S.presTimer){
    clearInterval(S.presTimer);
    S.presTimer = setInterval(function(){ S.presI = (S.presI + 1) % S.slides.length; presDraw(); },
      Math.max(5, Math.min(300, Number(S.presSecs) || 15)) * 1000);
  }
}
document.addEventListener('keydown', function(e){
  if (document.getElementById('pres').style.display !== 'block') return;
  /* While the screen is black, EVERY key brings it back and none of them move the deck. A
     presenter reaching for the remote in a dark room should not land three slides away. */
  if (S.presBlank){ e.preventDefault(); presBlank(false); return; }
  if (e.key === 'Escape') presStop();
  else if (e.key === 'b' || e.key === 'B'){ e.preventDefault(); presBlank(true); }
  else if (e.key === 'ArrowRight'){ presGo(1); }
  else if (e.key === 'ArrowLeft'){ presGo(-1); }
});

/* Clicking a tab used to wipe the screen to a spinner and go back to the server every single
   time -- even flicking between two tabs you had just read. On a field connection that is a few
   seconds of blank page per click, all day. Now a tab you have already opened comes back
   instantly from what is already in hand, and the server is asked again quietly behind it.
   Only what is on screen changes when the answer lands; the page never goes blank twice.

   Held in memory only, and only for this sitting: it is a convenience, not a copy of the books.
   Anything that writes empties it (see srv), and the reload button ignores it outright. */
/* How long a remembered screen stays good before it is asked for again. Ninety seconds unless
   an admin sets REFRESH_SECONDS -- a meeting-length attention span was a guess, and the people
   running the meeting are better placed to say. */
var VC_MS = 90000;
function applyCadences(ui){
  if (!ui) return;
  VC_MS = Math.max(10, Number(ui.refreshSeconds) || 90) * 1000;
  S.presSecs = Number(ui.presentSeconds) || 15;
  S.hintEverySec = Number(ui.hintIntervalSeconds) || 240;
  S.hintHoldSec = Number(ui.hintLifetimeSeconds) || 7;
}
var VC_SKIP = { present:1 };             // the slideshow runs its own timers -- never replay it
function viewKey_(){
  var a = S.args || {};
  return S.view + '|' + Object.keys(a).sort().map(function(k){ return k + '=' + a[k]; }).join('&');
}
function snapTake_(){
  return { at:Date.now(), head:HEAD, onrow:ONROW, rows:S.rows, cols:S.cols, foot:S.foot,
           args:JSON.parse(JSON.stringify(S.args || {})),
           // The team/status dropdowns live inside the remembered HEAD, already ticked. Bring
           // the choice back with them, or you return to a tab showing "Team KONGOWE" in the
           // box while the table underneath quietly lists everybody.
           filters:JSON.parse(JSON.stringify(S.filters || {})) };
}
function snapPut_(s){
  HEAD = s.head; ONROW = s.onrow;
  S.rows = s.rows; S.cols = s.cols; S.foot = s.foot;
  S.args = JSON.parse(JSON.stringify(s.args || {}));
  S.filters = JSON.parse(JSON.stringify(s.filters || {}));
}

   ln_ prefix -- see isLoanId_) automatically, through the same srv() every HOPE PMO tab uses --

var LN = { money: money, esc: esc };   // nothing here needs more than these two, kept short

function lnQueueTable(rows, cols, onRow){

}
function lnStageChip(s){

}

/** Same call, but the panel stays open -- "updating personal info shoulnt close the pannel
    after each section filling". lnAct's closeDrawer() is right for a TERMINAL action (assign,

function lnActKeep_(fn, args, okMsg){

/* =====================================================================================
   KYC CAPTURE -- COMPRESS ON THE DEVICE, DRAW ON A CANVAS, ASK FOR GPS. Three small building
   blocks, reused everywhere a photo, a signature/thumbprint, or a pinpoint is asked for.
   ===================================================================================== */

/* "adapt the whatsapp tech, when someone uploads their 5mb photo, we optimize it before
   storing and store the low quality" -- every capture path resizes and re-encodes ON THE
   DEVICE before a byte is sent (openCameraOverlay_ draws straight from the live video frame
   at a capped dimension), which is what actually matters on a field connection; kycUpload's
   own 2MB cap is only the backstop. */
function kycUpload_(loanId, kind, dataUrl){
  return srv('kycUpload', { loan_id: loanId, kind: kind, data_url: dataUrl });
}

/* THE SAME CAPTURE FOR BOTH SIGNATURE AND THUMBPRINT.
   "i mean they press the thumb on phone screen and we record the fingerprint or draw
    signature too llike how we work with phone notes apps" -- one canvas, drawn on with a
   finger; there is no hardware fingerprint reader involved, on purpose, confirmed rather than
   assumed before this was built. Pointer events cover touch and mouse the same way, so this
   works identically on a phone in the field and a laptop in the office. */
/** mode 'line' is a signature -- a pen stroke, thin, follows the path exactly. mode 'stamp' is
    a thumbprint -- "fingerprint capturing is still miserable it works as typing": a thin exact
    line IS what typing/drawing precisely feels like, and a thumb pressed on glass is neither
    thin nor precise. Stamp mode lays down overlapping soft-edged circles the width of a real
    thumb along wherever the finger moves, so the result reads as a pressed smear, not a traced
    outline -- the same physical gesture a real inked thumbprint takes. */
function wireCanvasPad_(canvasId, mode){
  var canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  var ctx = canvas.getContext('2d');
  var stamp = mode === 'stamp';
  ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1a2b4a';
  ctx.fillStyle = 'rgba(26,43,74,.55)';
  var drawing = false, dirty = false, last = null;
  function pos(e){
    var r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (canvas.width / r.width), y: (e.clientY - r.top) * (canvas.height / r.height) };
  }
  function dab(p){
    var r = Math.max(canvas.width, canvas.height) * 0.09;   // thumb-pad sized, not pen-tip sized
    ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fill();
  }
  function start(e){
    e.preventDefault(); drawing = true; last = pos(e);
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}   // keeps the stroke on THIS canvas even off a fast, small screen
    if (stamp) { dab(last); dirty = true; }
  }
  function move(e){
    if (!drawing) return; e.preventDefault();
    var p = pos(e);
    if (stamp) {
      // Dab along the path, not just at the endpoints, or a fast smear leaves gaps.
      var dx = p.x - last.x, dy = p.y - last.y, dist = Math.sqrt(dx * dx + dy * dy);
      var step = Math.max(canvas.width, canvas.height) * 0.03;
      for (var d = 0; d < dist; d += step) dab({ x: last.x + dx * (d / dist), y: last.y + dy * (d / dist) });
      dab(p);
    } else {
      ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    }
    last = p; dirty = true;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('pointerdown', start);
  canvas.addEventListener('pointermove', move);
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointerleave', end);
  canvas.addEventListener('pointercancel', end);
  return {
    isDirty: function(){ return dirty; },
    dataUrl: function(){ return canvas.toDataURL('image/png'); },
    clear: function(){ ctx.clearRect(0, 0, canvas.width, canvas.height); dirty = false; },
  };
}
/** A pad's "Save" button: upload only if something was actually drawn since the pad opened
    (re-saving the section must not silently re-upload and re-point at a new file when nothing
    changed), and hand the resulting path to whoever owns this field. */
function saveCanvasPad_(pad, loanId, kind, onPath){
  if (!pad || !pad.isDirty()) return Promise.resolve();
  return kycUpload_(loanId, kind, pad.dataUrl()).then(function(r){ onPath(r.path); });
}

/** A camera/file capture button -- compress, upload, remember the path. Used for the passport
    photo (customer and guarantor) and for the three site-verification photos alike; only the
    `kind` string and where the resulting path lands differ. */
/** A LIVE camera feed, never a file/gallery picker -- "photo shouldnt use gallary but phone
    camera only". A file input's capture="environment" is only a HINT some browsers ignore,
    and any hint still leaves a chooser a gallery photo can be picked from. getUserMedia opens
    the camera directly; there is no picker step for an old photo to be substituted at. */
function openCameraOverlay_(onCapture){
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:999;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center';
  var video = document.createElement('video');
  video.autoplay = true; video.playsInline = true; video.muted = true;
  video.style.cssText = 'width:100%;max-height:80vh;object-fit:contain;background:#000';
  var bar = document.createElement('div');
  bar.style.cssText = 'display:flex;gap:12px;padding:16px;width:100%;max-width:420px';
  var shotBtn = document.createElement('button');
  shotBtn.type = 'button'; shotBtn.className = 'btn w'; shotBtn.style.flex = '1'; shotBtn.textContent = '📷 Piga / Capture';
  var cancelBtn = document.createElement('button');
  cancelBtn.type = 'button'; cancelBtn.className = 'btn w ghost'; cancelBtn.style.flex = '1'; cancelBtn.textContent = 'Ghairi / Cancel';
  bar.appendChild(shotBtn); bar.appendChild(cancelBtn);
  overlay.appendChild(video); overlay.appendChild(bar);
  document.body.appendChild(overlay);

  var stream = null, stopped = false;
  function stop(){
    if (stopped) return; stopped = true;
    if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    if (overlay.parentNode) document.body.removeChild(overlay);
  }
  cancelBtn.onclick = stop;
  shotBtn.disabled = true;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    stop(); toast('Kamera haipatikani kwenye kivinjari hiki. / Camera is not available in this browser.', true); return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
    .then(function(s){
      if (stopped) { s.getTracks().forEach(function(t){ t.stop(); }); return; }   // Cancel pressed while permission was pending
      stream = s; video.srcObject = s; shotBtn.disabled = false;
    })
    .catch(function(e){ stop(); toast('Imeshindikana kufungua kamera / could not open camera: ' + (e.message || e), true); });
  shotBtn.onclick = function(){
    var maxDim = 1280, vw = video.videoWidth || maxDim, vh = video.videoHeight || maxDim;
    var scale = Math.min(1, maxDim / Math.max(vw, vh));
    var c = document.createElement('canvas'); c.width = Math.round(vw * scale); c.height = Math.round(vh * scale);
    c.getContext('2d').drawImage(video, 0, 0, c.width, c.height);
    var dataUrl = c.toDataURL('image/jpeg', 0.7);
    stop();
    onCapture(dataUrl);
  };
}
function wirePhotoCapture_(btnId, statusId, loanId, kind, existingPath, onPath){
  var btn = document.getElementById(btnId), status = document.getElementById(statusId);
  if (!btn) return;
  function setStatus(has){ if (status) status.textContent = has ? '✓ Imepigwa / Captured' : ''; }
  setStatus(!!existingPath);
  btn.onclick = function(){
    openCameraOverlay_(function(dataUrl){
      btn.disabled = true; if (status) status.textContent = 'Inapakia... / Uploading...';
      kycUpload_(loanId, kind, dataUrl)
        .then(function(r){ onPath(r.path); setStatus(true); btn.disabled = false; })
        .catch(function(e){ btn.disabled = false; setStatus(!!existingPath); toast(String((e && e.message) || e), true); });
    });
  };
}
/** A "Capture location" button -- one GPS reading, shown back as coordinates so the officer
    can see it actually landed before moving on. Used for the customer's residence, the
    business, and the guarantor's residence -- three buttons, same wiring. */
function wireGpsCapture_(btnId, statusId, existingLat, existingLng, onCoords){
  var btn = document.getElementById(btnId), status = document.getElementById(statusId);
  if (!btn) return;
  function setStatus(lat, lng){ if (status) status.textContent = (lat != null && lng != null) ? (Number(lat).toFixed(5) + ', ' + Number(lng).toFixed(5)) : ''; }
  setStatus(existingLat, existingLng);
  btn.onclick = function(){
    if (!navigator.geolocation) { toast('Simu hii haina GPS. / This device has no GPS.', true); return; }
    btn.disabled = true; if (status) status.textContent = 'Inatafuta mahali... / Finding location...';
    navigator.geolocation.getCurrentPosition(function(pos){
      var lat = pos.coords.latitude, lng = pos.coords.longitude;
      onCoords(lat, lng); setStatus(lat, lng); btn.disabled = false;
    }, function(err){
      btn.disabled = false; setStatus(existingLat, existingLng);
      toast('Imeshindikana kupata mahali / could not get location: ' + err.message, true);
    }, { enableHighAccuracy: true, timeout: 15000 });
  };
}

    wirePhotoCapture_('lnCustResPhotoBtn', 'lnCustResPhotoStatus', loan.id, 'residence', PATHS.custResPhoto, function(p){ PATHS.custResPhoto = p; });

    // ---- save handlers -- each one merges whatever this visit captured with the currently

    $('#lnSaveRec').onclick = function(){

    $('#lnSaveGuar').onclick = function(){

        saveCanvasPad_(gSigPad, loan.id, 'g-signature', function(p){ PATHS.gSignature = p; }),

      ]).then(function(){
        // "guarantor id should be choices too.. not just nida" -- same ID_TYPES choice as

    $('#lnRejectRec').onclick = function(){
      lnReasonPrompt_(function(reason){ lnAct('teamSubmit', { loan_id: loan.id, decision: 'REJECTED', reason: reason }, 'Rejected.', function(){ go('ln_team'); }); });
    };

    // ---- copy KYC for WhatsApp -- text only; if a pinpoint was captured this visit it is not
    //      yet saved server-side, so the copy reads live DOM/capture state, not the stale `c`/`g`
    //      this drawer opened with. Maps links, not photos -- a photo needs the private bucket's
    //      signed URL to open at all, and is not something to paste into a chat unprotected. ----
    function mapLink_(coord){ return (coord && coord.lat != null && coord.lng != null) ? ('https://maps.google.com/?q=' + coord.lat + ',' + coord.lng) : null; }
    function toggleCopyBtn(){ $('#lnCopyKyc').disabled = !Number($('#lnRecAmt').value); }
    $('#lnRecAmt').oninput = toggleCopyBtn; toggleCopyBtn();
    $('#lnCopyKyc').onclick = function(){
      var idType = $('#lnIdType').value, idNo = $('#lnIdNo').value.trim();
      var lines = [
        '*HOPE LOAN - KYC*',
        'Ref: ' + (loan.loan_id || '') + '   Docket: ' + (loan.docket_no || ''),
        'Jina / Name: ' + loan.full_name,
        'Simu / Phone: ' + (loan.contact || ''),
        'Jinsia / Gender: ' + ($('#lnGender').value || '—'),
        idType + ': ' + (idNo || '—'),
        'Wilaya/Kata/Mtaa: ' + [$('#lnDistrict').value, $('#lnCustWard').value, $('#lnCustStreet').value].filter(Boolean).join(' / '),
        'Biashara / Business: ' + ($('#lnBizName').value || '—') + ' (' + (c.business_type || '—') + ')',
        'Kiasi kilichoombwa / Requested: ' + money(loan.requested_amt),
        'Kiasi kilichopendekezwa / Recommended: ' + money(Number($('#lnRecAmt').value) || 0),
        '',
        '*Mdhamini / Guarantor*: ' + ($('#lnGName').value || '—') + '  ·  ' + ($('#lnGPhone').value || '—') + '  ·  ' + ($('#lnGRel').value || '—'),
        'Wilaya/Kata/Mtaa: ' + [$('#lnGDistrict').value, $('#lnGWard').value, $('#lnGStreet').value].filter(Boolean).join(' / '),
      ];
      var extra = [0, 1, 2, 3, 4].map(function(i){ return $('#lnAlt' + i + 'Name').value.trim(); }).filter(Boolean);
      if (extra.length) lines.push('Wadhamini wa ziada / Extra contacts: ' + [0, 1, 2, 3, 4]
        .map(function(i){ var n = $('#lnAlt' + i + 'Name').value.trim(); return n ? (n + ' (' + $('#lnAlt' + i + 'Phone').value.trim() + ', ' + $('#lnAlt' + i + 'Rel').value.trim() + ')') : ''; })
        .filter(Boolean).join('; '));
      var locLines = [
        ['Makazi ya mteja / Customer residence', mapLink_(COORDS.custRes)],
        ['Biashara / Business', mapLink_(COORDS.biz)],
        ['Makazi ya mdhamini / Guarantor residence', mapLink_(COORDS.gRes)],
      ].filter(function(x){ return x[1]; });
      if (locLines.length) {
        lines.push('', '*Mahali / Locations*');
        locLines.forEach(function(x){ lines.push(x[0] + ': ' + x[1]); });
      }
      var text = lines.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function(){ toast('Imenakiliwa. / Copied.'); })
          .catch(function(){ toast('Imeshindikana kunakili. / Could not copy.', true); });
      } else {
        toast('Kivinjari hiki hakiwezi kunakili moja kwa moja. / This browser cannot copy directly.', true);
      }
    };
  }).catch(function(e){ toast(String((e && e.message) || e), true); });
}

/* ---------- GMO / OPM senior review ---------- */
/* TWO SCREENS, ONE HELPER. Each nav id now fixes its own tier -- Manager Review always asks
   for 'manager', GMO Review always asks for 'gmo' -- so there is no dropdown to wire any more;
   which screen you are on already says which tier you are working. */
function lnSeniorView_(navId, tier, thresholdNote){
  HEAD = '<div class="note">' + esc(thresholdNote) + '</div>';
  return srv('seniorQueue', { tier: tier }).then(function(d){
    S.rows = d.rows; S.cols = [
      col('loan_id', 'Ref'), col('full_name', 'Customer'), col('branch', 'Branch'), col('team', 'Team'),
      { key:'team_recomm', label:'Recommended', kind:'money' }];
    ONROW = function(r){ lnSeniorForm_(r, tier, navId); };
  });
}
VIEWS.ln_manager_review = function(){
  return lnSeniorView_('ln_manager_review', 'manager', 'Mandatory for every loan 1,000,000+. / Lazima kwa mkopo wowote wa 1,000,000+.');
};
VIEWS.ln_gmo_review = function(){
  return lnSeniorView_('ln_gmo_review', 'gmo', 'Mandatory for every loan 6,000,000+, ALONGSIDE Manager Review, not instead of it. / '
    + 'Lazima kwa mkopo wowote wa 6,000,000+, PAMOJA na Manager Review, si badala yake.');
};
function lnSeniorForm_(loan, tier, navId){
  drawer('<h3>' + esc(loan.full_name) + '</h3><div class="sub">Recommended: ' + money(loan.team_recomm) + '</div>'
    + '<div class="fld"><label>Your recommended amount</label><input id="lnSrAmt" type="number" value="' + (loan.team_recomm||'') + '"></div>'

    + '<button class="btn w" id="lnSrSubmit">Record recommendation</button>');

    lnAct('seniorRecommend', { loan_id: loan.id, tier: tier, amount: Number($('#lnSrAmt').value) || 0, remarks: $('#lnSrRemarks').value.trim() },
      'Recorded.', function(){ go(navId); });

}

VIEWS.ln_credit = function(){
  return srv('creditQueue', {}).then(function(d){
    S.rows = d.rows; S.cols = [
      col('loan_id', 'Ref'), col('full_name', 'Customer'), col('branch', 'Branch'), col('team', 'Team'),
      { key:'team_recomm', label:'Recommended', kind:'money' },
      { key:'gmo_recommend', label:'GMO said', kind:'money' }];
    ONROW = function(r){ lnCreditForm_(r); };

};
function lnCreditForm_(loan){
  drawer('<h3>' + esc(loan.full_name) + '</h3><div class="sub">Ref ' + esc(loan.loan_id) + '</div>'
    + '<div class="fld"><label>Granted amount (TZS)</label><input id="lnGrantAmt" type="number" value="' + (loan.team_recomm||'') + '"></div>'
    + '<div class="fld"><label>Previous balance (for a top-up)</label><input id="lnPrevBal" type="number" value="0"></div>'
    + '<div class="fld"><label>Disbursement mode</label><select id="lnDisbMode2">'
      + '<option value="">— chagua / choose —</option>'
      + DISB_MODES.map(function(m){ return '<option' + (loan.disbursement_type===m?' selected':'') + '>' + m + '</option>'; }).join('')
      + '</select></div>'
    + '<div class="fld" id="lnBankFld"><label>Bank name</label><input id="lnBankName"></div>'
    + '<div class="fld" id="lnAcctFld"><label>Account no.</label><input id="lnAcctNo"></div>'
    + '<div id="lnSchedulePreview" class="sub" style="margin:6px 0"></div>'
    + '<button class="btn w" id="lnGrantBtn">Grant</button>'
    + '<button class="btn w ghost" id="lnCrRejectBtn" style="margin-top:8px">Reject / Return for refilling</button>'
    // "with choice comment to return" -- a picked reason, not a typed one, so a return says
    // WHAT is missing instead of whatever prose came to mind. Hidden until Reject is pressed.
    + '<div id="lnCrReasonBox" class="hide" style="margin-top:8px">'
    + '<div class="fld"><label>Sababu / Reason</label><select id="lnCrReasonChoice">'
      + CREDIT_RETURN_REASONS.map(function(r){ return '<option>' + esc(r) + '</option>'; }).join('')
      + '</select></div>'
    + '<div class="fld"><label>Maelezo zaidi (hiari) / More detail (optional)</label><input id="lnCrReasonNote"></div>'
    + '<button class="btn w ghost" id="lnCrRejectConfirm">Thibitisha kurudisha / Confirm return</button>'
    + '</div>');
  function preview(){
    var g = Number($('#lnGrantAmt').value) || 0;
    var interest = Math.round(g * 0.36), total = g + interest, inst = Math.round(total / 12);
    $('#lnSchedulePreview').textContent = 'Interest ' + money(interest) + ' · Total ' + money(total) + ' · 12 x ' + money(inst) + '/week';
  }
  $('#lnGrantAmt').oninput = preview; preview();
  // Bank name/account only mean something for a bank disbursement -- shown for Bank, hidden
  // (not required) for Momo or nothing chosen yet.
  function toggleBankFlds(){
    var isBank = $('#lnDisbMode2').value === 'Bank';
    $('#lnBankFld').style.display = isBank ? '' : 'none';
    $('#lnAcctFld').style.display = isBank ? '' : 'none';
  }
  $('#lnDisbMode2').onchange = toggleBankFlds; toggleBankFlds();
  $('#lnGrantBtn').onclick = function(){
    lnAct('creditApprove', {

function busy_(on){ var b = $('#busy'); if (b) b.classList.toggle('on', !!on); }
function drawView_(){
  if (S.cols && S.cols.length) paint(); else paintHeadOnly();
  wireForms();
}
function render(opts){
  clearInterval(S.presentTimer);
  var fn = VIEWS[S.view];
  if (!fn){ $('#view').innerHTML = '<div class="msg">—</div>'; return; }
  var key = viewKey_();
  var hit = (opts && opts.force) ? null : VC.store[key];
  VC.key = key;
  if (hit && Date.now() - hit.at < VC_MS){
    snapPut_(hit);
    drawView_();
    load_(fn, key, true);                // keep reading; we will fix the numbers underneath you
    return;
  }
  loading();
  load_(fn, key, false);
}
/** quiet = there is already a good screen up. Two rules follow from that, and both matter:
    a slow answer must not paint over a tab you have since moved to (hence the ticket), and a
    failed refresh must not replace a page you are reading with an error -- the connection
    dropping for one moment is not a reason to take the work off someone's screen. */
function load_(fn, key, quiet){
  var my = ++S.rid;
  var watch = { ok:true };
  VC.watch = watch;
  busy_(true);
  fn().then(function(){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;            // a newer click already owns the screen
    busy_(false);
    if (watch.ok && !VC_SKIP[S.view]) VC.store[key] = snapTake_();
    drawView_();
  }).catch(function(e){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;
    busy_(false);
    if (!quiet) failed(e);
  });
}

/* ----------------------------------------------------------- drawers / forms */
/* CUSTOM ORDER -- drag the VALUES of a column into the order the work happens in.

   Up and down buttons rather than drag-and-drop: this is used on a laptop in a meeting and on
   a phone in the field, and dragging on a touch screen inside a scrolling drawer is a fight.
   Two buttons always work.

   Saved on the device, not on the server, because it is one person's way of working through
   their own list -- not a company rule, and not something to push onto everybody else. */
function openOrderPanel(key){
  var c = S.cols.filter(function(x){ return x.key===key; })[0];
  if (!c){ toast('Chagua safu kwanza. / Choose a column to sort by first.', true); return; }
  // Whatever is actually in the data, with any saved order applied first so the panel opens
  // showing the order currently in force.
  var seen = {}, values = [];
  S.rows.forEach(function(r){
    var v = String((c.get?c.get(r):r[c.key]) == null ? '' : (c.get?c.get(r):r[c.key]));
    if (!v || seen[v]) return; seen[v] = 1; values.push(v);
  });
  var saved = customOrder(key) || [];
  values.sort(function(a,b){
    var ai = saved.indexOf(a), bi = saved.indexOf(b);
    if (ai < 0) ai = 9999; if (bi < 0) bi = 9999;
    return ai - bi;
  });
  S.orderKey = key; S.orderVals = values;
  drawOrderPanel();
}
function drawOrderPanel(){
  var c = S.cols.filter(function(x){ return x.key===S.orderKey; })[0] || { label: S.orderKey };
  drawer('<h3 style="margin:0 0 4px">Panga mwenyewe / Custom order</h3>'
    + '<div class="hint" style="margin-bottom:10px">' + esc(c.label)
      + ' — pangilia kwa mpangilio wa kazi, si wa alfabeti.<br>'
      + 'Order these the way the work happens, not the way the alphabet does. '
      + 'Saved on this device only.</div>'
    + '<div id="ordList">' + S.orderVals.map(function(v, i){
        return '<div class="ordrow" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)">'
          + '<span style="flex:1;min-width:0">' + esc(v) + '</span>'
          + '<button class="btn sm ghost" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
          + '<button class="btn sm ghost" data-dn="'+i+'"'+(i===S.orderVals.length-1?' disabled':'')+'>↓</button>'
          + '</div>'; }).join('') + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
      + '<button class="btn" id="ordSave" style="flex:1">Hifadhi / Save</button>'
      + '<button class="btn ghost" id="ordClear">Ondoa / Reset to A–Z</button>'
    + '</div>');
  var move = function(i, j){
    if (j < 0 || j >= S.orderVals.length) return;
    var t = S.orderVals[i]; S.orderVals[i] = S.orderVals[j]; S.orderVals[j] = t;
    drawOrderPanel();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-up')); move(i, i-1); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-dn')); move(i, i+1); }; });
  document.getElementById('ordSave').onclick = function(){
    store('hopeOrder_' + S.orderKey, JSON.stringify(S.orderVals));
    // Sorting by that column is the whole point of having ordered it, so do it.
    S.sort = S.orderKey; closeDrawer(); paint();
    toast('Mpangilio umehifadhiwa. / Order saved on this device.');
  };
  document.getElementById('ordClear').onclick = function(){
    store('hopeOrder_' + S.orderKey, null); closeDrawer(); paint();
    toast('Imerudi kwa alfabeti. / Back to normal order.');
  };
}

   #drawerBg is `position:fixed;inset:0` with `align-items:flex-end` -- the comment box sits
   flush with the bottom of the PAGE. Opening the on-screen keyboard on a phone does not shrink
   that page (the layout viewport) unless the browser is told to; the keyboard just draws on
   top of it. So the drawer stayed pinned behind the keyboard, and whatever was typed into
   Maoni / Comment landed under it, invisible until Save.

   Two fixes, because no single one covers every handset in the field:
     1. `interactive-widget=resizes-content` on the viewport meta -- on a browser that honours
        it, the layout viewport itself shrinks and this function never has to do anything.
     2. This one, for the Android WebView builds and older Chrome that do not: `visualViewport`
        reports the REAL visible height once the keyboard is up, so the drawer is pinned to
        that instead of the full page -- it rises, because the space behind the keyboard has
        been taken out of its own height. */
function fitPanelToKeyboard_(bgId){
  var vv = window.visualViewport;
  if (!vv) return;
  var bg = document.getElementById(bgId);
  if (!bg) return;
  bg.style.height = vv.height + 'px';
  bg.style.top = vv.offsetTop + 'px';
}
/* THE LOGIN BOX IS THE SAME SHAPE AS THE DRAWER, AND HAD THE SAME FAULT.
   "login page doesnt slide app visibility of writting field: refer this challenge to what i
   faced in hopcalls comment field" -- #signin is `position:fixed;inset:0` too, same as
   #drawerBg was, just centred instead of flush to the bottom. A phone that does not honour
   `interactive-widget=resizes-content` never shrank it for the keyboard, so the access-code
   box (and the field itself) could sit wherever the keyboard now covers, same blind typing the
   comment box already had. Same fix, same function -- just another id in the list. */
(function(){
  var vv = window.visualViewport;
  if (!vv) return;
  var ids = ['drawerBg', 'signin'];
  function refit(){
    ids.forEach(function(id){
      var bg = document.getElementById(id);
      if (bg && bg.style.display !== 'none' && !bg.classList.contains('hide')) fitPanelToKeyboard_(id);
    });
  }
  vv.addEventListener('resize', refit);
  vv.addEventListener('scroll', refit);
})();
/* Belt-and-suspenders for a WebView slow to fire visualViewport's resize: once the keyboard's
   own open animation has had time to run, bring the field being typed into back into its
   panel's own visible area -- so even a late resize event still ends with the words on screen.
   One listener, both panels: #signin exists in the DOM from page load, unlike the drawer which
   is built by drawer() each time it opens. */
['drawerBg', 'signin'].forEach(function(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('focusin', function(e){
    var t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(function(){ t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300);
  });
});

/* Step 2 — the calculator. It previews exactly what the server will recompute and store, so
   what the officer shows the customer and what gets written cannot drift apart. */
function rxOffer(e){
  var st = e.strategy;
  if (!e.eligible){
    drawer('<h3>'+esc(e.full_name||e.ref)+'</h3><div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+'</div>'
      + '<div class="msg bad">Hastahili kupangiwa upya. / Not eligible — this customer has <b>'+e.dc
      + '</b> missed installment(s); restructuring needs <b>'+st.minDc+'+</b>.</div>');
    return;
  }
  drawer('<h3>'+esc(e.full_name||e.ref)+'</h3>'
    + '<div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+' · '+esc(e.contact||'')+'</div>'
    + '<div class="facts"><div class="frow"><span>Missed installments (DC)</span><b>'+e.dc+'</b></div>'
    + '<div class="frow"><span>Arrears owed</span><b>TZS '+money(e.arrears)+'</b></div></div>'
    + '<div class="fld"><label>Malipo ya kwanza sasa / First payment now</label>'
      + '<input id="rxFirst" type="number" min="0" step="500" value="0"></div>'
    + '<div class="fld"><label>Awamu za wiki / Weekly installments (max '+st.maxInstallments+')</label>'
      + '<input id="rxCount" type="number" min="1" max="'+st.maxInstallments+'" step="1" placeholder="e.g. 10"></div>'
    + '<div class="fld"><label>Tarehe ya kwanza / First payment date</label>'
      + '<input id="rxStart" type="date" value="'+addDays(today(),7)+'"></div>'
    + '<label class="chk"><input id="rxInt" type="checkbox"> Ongeza riba ya '+st.interestPct+'% / add '+st.interestPct+'% on the remaining</label>'
    + '<div class="fld"><label>Maelezo / Notes</label><textarea id="rxNotes" rows="2"></textarea></div>'
    + '<div id="rxPrev"></div>'
    + '<button class="btn w" id="rxSubmit">Tuma kwa idhini / Submit for approval</button>');
  var preview = function(){
    var arrears = Number(e.arrears)||0;
    var first = Math.min(Math.max(0, Number($('#rxFirst').value)||0), arrears);
    var count = Math.max(1, Math.floor(Number($('#rxCount').value)||0));
    var remaining = arrears - first;
    var interest = $('#rxInt').checked ? Math.round(remaining * (st.interestPct/100)) : 0;
    var total = remaining + interest;
    var per = Math.round(total/count/500)*500;
    var start = $('#rxStart').value;
    var over = count > st.maxInstallments;
    var rows = [];
    for (var i=0;i<Math.min(count, st.maxInstallments);i++){
      rows.push({ n:i+1, date:start?addDays(start, 7*i):'—', amount:(i===count-1? total-per*(count-1) : per) });
    }
    $('#rxPrev').innerHTML =
      '<div class="kpis sm">'
      + kpi('Remaining', money(remaining)) + kpi('New interest', money(interest))
      + kpi('Total to repay', money(total)) + kpi('Per installment', money(per))
      + '</div>'
      + (over ? '<div class="msg bad">Exceeds the '+st.maxInstallments+'-installment cap — reduce the count.</div>' : '')
      + (total > 0
          ? tableSimple(rows, [col('date','Date','date'), col('amount','Installment','money')],
              {date:'', amount:total})
          : '<div class="msg">Hakuna kilichobaki. / Nothing left to reschedule.</div>');
  };
  ['rxFirst','rxCount','rxStart'].forEach(function(id){
    $('#'+id).oninput = preview; $('#'+id).onchange = preview; });
  $('#rxInt').onchange = preview;
  preview();
  $('#rxSubmit').onclick = function(){
    srv('addRestructure', { ref:e.ref, firstInst:$('#rxFirst').value, installments:$('#rxCount').value,
      startDate:$('#rxStart').value, interestOn:$('#rxInt').checked, notes:$('#rxNotes').value.trim() })
      .then(function(){ toast('Ombi limetumwa. / Submitted for approval.'); closeDrawer(); render(); })
      .catch(function(err){ toast(String(err.message||err), true); });
  };
}
