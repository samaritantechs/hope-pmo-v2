            + money(d.teamTotals.companyTarget) + ' (' + d.teamCount + ' teams).</div>')
      /* The five sections the weekly meeting walks, per team, in this order. */
      + board('wSales','Mauzo / Sales','approved principal vs per-team target', d.teams,
          [col('branch','Branch'), col('team','Team'), col('sales','Sales','money'), col('salesPct','% of target','pct')],
          {team:'', sales:d.teamTotals.sales, salesPct:d.teamTotals.salesPct})
      + board('wC16','Count 1–6 progress','defaulters paid ≤ 6 of 12 · cleared & reduced are the wins',
          d.teams.filter(function(r){ return r.c16>0; }),
          [col('branch','Branch'), col('team','Team'), col('c16','Count 1–6','num'),
           {key:'cleared', label:'Cleared', kind:'num', cls:function(){ return 'good'; }},
           {key:'reduced', label:'Reduced', kind:'num', cls:function(){ return 'good'; }},
           {key:'bad', label:'Bad', kind:'num', cls:function(){ return 'bad'; }},
           col('stat','Static','num'), col('success','Success %','pct')],
          {team:'', c16:d.teamTotals.c16, cleared:d.teamTotals.cleared, reduced:d.teamTotals.reduced,
           bad:d.teamTotals.bad, stat:d.teamTotals.stat, success:d.teamTotals.success})
      /* THE CORRECTION HAS ITS OWN COLUMN, AND THAT IS THE POINT.
         The server has sent `adjusted` beside every collected figure since the register was
         first applied -- how much of Collected came from Iliyonasia rather than from the deck
         -- and this board quietly dropped it. So the figure moved and the screen never said
         why, which is the one thing an adjustment must never do: a correction nobody can see
         is indistinguishable from a bug, and it is exactly what sent somebody to check their
         Excel. The column only appears in a week that HAS a correction; a week with none is
         drawn as it always was. */
      + board('wColl','Makusanyo / Collection (Mon–Fri expected)',
          d.teamTotals.adjusted ? 'collected vs expected · Collected includes Iliyonasia'
                                : 'collected vs expected', d.teams,
          [col('branch','Branch'), col('team','Team'), col('expected','Expected','money'), col('collected','Collected','money')]
          .concat(d.teamTotals.adjusted
            ? [{key:'adjusted', label:'Iliyonasia', kind:'money',
                cls:function(r){ return r.adjusted ? 'good' : ''; }}]
            : [])
          .concat([
           {key:'uncollected', label:'Uncollected', kind:'money', cls:function(){ return 'bad'; }},
           col('collPct','Collection %','pct')]),
          {team:'', expected:d.teamTotals.expected, collected:d.teamTotals.collected,
           adjusted:d.teamTotals.adjusted,
           uncollected:d.teamTotals.uncollected, collPct:d.teamTotals.collPct})
      + board('wRec','Urejeshaji / Recovery','recovered ÷ the week’s uncollected', d.teams,
          [col('branch','Branch'), col('team','Team'),
           {key:'uncollected', label:'Uncollected', kind:'money', cls:function(){ return 'bad'; }},
           {key:'recovered', label:'Recovered (week)', kind:'money', cls:function(r){ return r.recovered>0?'good':(r.recovered<0?'bad':''); }},
           // Leo, per team, beside the week -- which team moved TODAY is the question a
           // Thursday morning actually asks, and the week's column cannot answer it.
           {key:'recToday', label:'Leo rec / today', kind:'money', cls:function(r){ return r.recToday>0?'good':(r.recToday<0?'bad':''); }},
           col('recPct','Recovery %','pct')],
          {team:'', uncollected:d.teamTotals.uncollected, recovered:d.teamTotals.recovered,
           recToday:d.teamTotals.recToday, recPct:d.teamTotals.recPct})
      /* Ongezeko la deni: Monday's debt against the week-end's. A POSITIVE change means the
         debt fell, which is why it reads green with a minus sign in front of it. */
      + board('wDebt','Ongezeko la deni (Monday → '+esc(d.weekEndDate||'week end')+')',
          'green = debt fell (recovered) · red = debt rose', d.teams,
          [col('branch','Branch'), col('team','Team'), col('mondayDebt','Monday debt','money'), col('curDebt','Current debt','money'),
           // Pre-formatted, so kind stays 'num' (right-aligned) instead of being re-run
           // through money() -- a leading minus sign would come back as NaN.
           {key:'debtDelta', label:'Change', kind:'num', cls:function(r){ return r.debtDelta>=0?'good':'bad'; },
            get:function(r){ return (r.debtDelta>=0?'−':'+') + money(Math.abs(r.debtDelta)); }}],
          {team:'', mondayDebt:d.teamTotals.mondayDebt, curDebt:d.teamTotals.curDebt,
           debtDelta:(d.teamTotals.debtDelta>=0?'−':'+') + money(Math.abs(d.teamTotals.debtDelta))})
      /* "weekly report is intended to have reports of all leaders in the leaders' table" */
      + weeklyLeaderBoards(d);
    S.rows = d.days;
    // Same rule as the team board above: the day strip names its correction or has none.
    S.cols = [col('weekday','Day'), col('date','Date','date'), col('customers','Customers','num'),
      col('expected','Expected','money'), col('collected','Collected','money')]
      .concat(d.teamTotals.adjusted
        ? [{key:'adjusted', label:'Iliyonasia', kind:'money',
            cls:function(r){ return r.adjusted ? 'good' : ''; }}]
        : [])
      .concat([col('uncollected','Uncollected','money'),
        col('pct','Collection %','pct'), col('recovered','Recovered','money'), col('received','Received','money')]);
    ONROW = null;
    S.foot = 'Sales: TZS '+money(d.teamTotals.sales)+' ('+pct(d.teamTotals.salesPct)+' of target)'
      + ' · Collection: '+pct(d.teamTotals.collPct)+' · Recovery: '+pct(d.teamTotals.recPct)
      + (d.teamTotals.adjusted ? ' · incl. Iliyonasia TZS '+money(d.teamTotals.adjusted) : '');
  });
};

/* =====================================================================================
   EVERY LEADER IN THE LEADERS' TABLE, ON THE WEEKLY REPORT.

     "weekly report is intended to have reports of all leaders in the leaders' table"

   The weekly report answered "how is each TEAM doing". A director asks the other question --
   "how is each PERSON doing" -- and most supervisors carry several teams, so their real week
   is the roll-up across all of them. That roll-up existed nowhere on this screen: the leader
   columns were carried on every row and never added up.

   ALL of them, not just the ones with figures. Somebody named in the table whose teams
   produced nothing appears with zeros, because "this GMO sold nothing this week" is precisely
   what a Monday meeting needs to see, and dropping them would make the report quietly
   flattering. A team whose column is blank is grouped under (hakuna / nobody named), which is
   the prompt to go and fill it in.

   COMPUTED ON THIS SCREEN, from the team rows and the leaders table the weekly response
   already carries. No extra request, no second definition of what a week is -- these are the
   same numbers the boards above print, added up a different way, so the two can never
   disagree. */
function weeklyLeaderBoards(d){
  var cols = d.leadCols || ['opm','recovery','gmo','manager','credit','expected','bike'];
  var byTeam = {};
  (d.teams||[]).forEach(function(t){ byTeam[String(t.team||'').trim().toUpperCase()] = t; });
  var any = false;
  var out = cols.map(function(colKey){
    var by = {};
    (d.teamRows||[]).forEach(function(tr){
      var who = String(tr[colKey]==null?'':tr[colKey]).trim();
      var k = who ? who.toUpperCase() : '␀';        // blank sorts last, under one heading
      if (!by[k]) by[k] = { leader: who || '(hakuna / nobody named)', teams:0, teamList:[],
        sales:0, expected:0, collected:0, uncollected:0, recovered:0 };
      var b = by[k];
      b.teams++; b.teamList.push(tr.team);
      var t = byTeam[String(tr.team||'').trim().toUpperCase()];
      if (t){
        b.sales += Number(t.sales)||0;             b.expected += Number(t.expected)||0;
        b.collected += Number(t.collected)||0;     b.uncollected += Number(t.uncollected)||0;
        b.recovered += Number(t.recovered)||0;
      }
    });
    var rows = Object.keys(by).map(function(k){
      var b = by[k];
      b.teamList = b.teamList.slice().sort().join(', ');
      b.collPct = b.expected > 0 ? Math.round(1000*b.collected/b.expected)/10 : null;
      b.recPct = b.uncollected > 0 ? Math.round(1000*b.recovered/b.uncollected)/10 : null;
      return b;
    }).sort(function(a,b){ return (b.collected - a.collected) || (b.sales - a.sales); });
    if (!rows.length) return '';
    any = true;
    var sum = function(f){ return rows.reduce(function(s,r){ return s + (Number(r[f])||0); }, 0); };
    var tExp = sum('expected'), tCol = sum('collected'), tUnc = sum('uncollected'), tRec = sum('recovered');
    var named = rows.filter(function(r){ return r.leader.charAt(0) !== '('; }).length;
    return board('wl_' + colKey, 'Kwa ' + colKey.toUpperCase() + ' / By ' + colKey.toUpperCase(),
      money(named) + ' named · ' + money(sum('teams')) + ' teams · wiki nzima / the whole week',
      rows,
      [{key:'leader', label:colKey.toUpperCase(),
        cls:function(r){ return r.leader.charAt(0)==='(' ? 'bad' : ''; }},
       col('teams','Teams','num'), col('teamList','Which teams'),
       col('sales','Sales','money'),
       col('expected','Expected','money'),
       {key:'collected', label:'Collected', kind:'money', cls:function(){ return 'good'; }},
       col('collPct','Collection %','pct'),
       {key:'uncollected', label:'Uncollected', kind:'money', cls:function(){ return 'bad'; }},
       {key:'recovered', label:'Recovered', kind:'money', cls:function(r){ return r.recovered>0?'good':''; }},
       col('recPct','Recovery %','pct')],
      {leader:'', teams:sum('teams'), teamList:'', sales:sum('sales'),
       expected:tExp, collected:tCol,
       collPct: tExp>0 ? Math.round(1000*tCol/tExp)/10 : null,
       uncollected:tUnc, recovered:tRec,
       recPct: tUnc>0 ? Math.round(1000*tRec/tUnc)/10 : null});
  }).join('');
  return any ? out : '';
}

/* ======================================================================================
   THE LEADER REPORTS' ORODHA -- nine tables, and the chip that picks which.

     "I need chipped table segments of 9 ... so one leader goes his teams, grand
      totals/averages row then start the other leader in the same table"
     "Opening orodha chip should list the roles so that I tick the role(s) and get reports
      (sales, col or recovery) that I need to spill. [TWO CHOICES - Roles and Report types]"

   Two tick lists, and a table for every ticked pair the server emits. The nine open ticked;
   sales and the credit analyst are one tick away. What is ticked is remembered on the device,
   because whoever opens this screen opens it for the same reason every week.

   J3..IJ are a LOOKUP of the latest occurrence of that weekday, not this week's -- see
   leaderSegments_ in portal-core.js. The date each column actually read is on its tooltip. */
function lrDayCol_(sec, k, subCls){
  var when = (sec.dayDates && sec.dayDates[k]) || '';
  if (sec.metric === 'sales'){
    /* "for sales in the 6 days use format of 10c-10% to refer last achievied no of customers
       and sales%" -- two facts in one column, because a count without its percentage does not
       say whether the day was good. */
    return { key:'d_'+k, label:k, kind:'text', title:'Wateja na % / customers and % · '+when,
      get:function(r){ var c = r.d ? r.d[k] : null;
        return c ? (money(c.n)+'c-'+(c.pct==null?'—':Math.round(c.pct)+'%')) : ''; }, cls:subCls };
  }
  return { key:'d_'+k, label:k, kind:'pct', title:when,
    get:function(r){ return r.d ? r.d[k] : null; }, cls:subCls };
}
function lrCols_(sec){
  var subCls = function(r){ return r.sub ? 'subrow' : ''; };
  var cols = [ {key:'leader', label:'Kiongozi / Leader', kind:'text', cls:subCls},
               {key:'team', label:'Timu / Team', kind:'text', cls:subCls} ];
  if (sec.metric === 'rec'){
    var bl = sec.basis === 'week' ? 'wiki / week' : sec.basis === 'mon' ? 'Jumatatu / Mon' : 'jana / yest';
    cols.push({key:'uncol', label:'Uncol '+bl, kind:'money', cls:subCls});
    cols.push({key:'recovered', label:'Recovered', kind:'money', cls:subCls});
    cols.push({key:'pct', label:'Rec %', kind:'pct', target:'rec', cls:subCls});
  } else if (sec.metric === 'sales'){
    cols.push({key:'count', label:'Count', kind:'num', title:'Idadi ya wateja / number of customers', cls:subCls});
    cols.push({key:'pct', label:'Sales %', kind:'pct', target:'sales', cls:subCls});
  } else {
    cols.push({key:'uncol', label:'Uncollected', kind:'money', cls:subCls});
    cols.push({key:'pct', label:(sec.metric==='ecol'?'E.Col %':'Col %'), kind:'pct',
      target:(sec.metric==='ecol'?'ecol':'col'), cls:subCls});
  }
  // The wall between today's figures and the same-day lookups beside them.
  cols.push({key:'_gap', label:'', kind:'text', get:function(){ return ''; }, cls:function(){ return 'gapcol'; }});
  (sec.dayKeys||[]).forEach(function(k){ cols.push(lrDayCol_(sec, k, subCls)); });
  (sec.amtKeys||[]).forEach(function(k){
    cols.push({key:'a_'+k, label:k, kind:'text',
      title:'Kilichorejeshwa / recovered · '+((sec.dayDates&&sec.dayDates[k])||''),
      get:function(r){ return m1_(r.a ? r.a[k] : null); }, cls:subCls});
  });
  return cols;
}
function lrSegHtml_(sec){
  var rows = [];
  (sec.groups||[]).forEach(function(g){
    (g.rows||[]).forEach(function(r){ rows.push(Object.assign({}, r, {leader:g.leader})); });
    rows.push(Object.assign({}, g.total, {leader:'JUMLA — '+g.leader, team:'', sub:true}));
  });
  var days = (sec.dayKeys||[]).concat(sec.amtKeys||[])
    .map(function(k){ return k+' = '+((sec.dayDates&&sec.dayDates[k])||'—'); }).join(' · ');
  return board('lrseg_'+sec.id, sec.label,
    money((sec.groups||[]).length)+' viongozi / leaders · '+money(sec.teams||0)+' timu / teams'
      + (sec.unstaffed ? ' · '+money(sec.unstaffed)+' bila jina / with nobody named' : '')
      + (days ? ' · ' + days : ''),
    rows, lrCols_(sec),
    Object.assign({}, sec.totals, {leader:'JUMLA / TOTAL', team:'', sub:true}));
}
function lrSegsHtml_(d){
  if (!d || !d.segments) return '<div class="msg">—</div>';
  var segs = d.segments.filter(function(s){
    return S.lrM.indexOf(s.metric) >= 0 && S.lrR.indexOf(s.role) >= 0; });
  if (!segs.length) return '<div class="msg">Chagua angalau ripoti moja na nafasi moja hapo juu.'
    + ' / Tick at least one report type and one role above.</div>';
  return segs.map(lrSegHtml_).join('');
}
function lrPicksHtml_(d){
  var box = function(cls, items, keyOf, labOf, have){
    return items.map(function(x){
      return '<label><input type="checkbox" class="'+cls+'" value="'+esc(keyOf(x))+'"'
        + (have.indexOf(keyOf(x))>=0 ? ' checked' : '') + ' onchange="lrPick_()"> '+esc(labOf(x))+'</label>';
    }).join('');
  };
  return '<div class="cleanbox">'
    + '<div class="fld"><label>Ripoti / Report types</label><div class="checks">'
    + box('lrM', d.segMetrics||[], function(x){ return x.metric; }, function(x){ return x.label; }, S.lrM)
    + '</div></div>'
    + '<div class="fld"><label>Nafasi / Roles</label><div class="checks">'
    + box('lrR', d.segRoles||[], function(x){ return x.role; }, function(x){ return x.label; }, S.lrR)
    + '</div></div></div>';
}
function lrPick_(){
  var pick = function(cls){ return Array.prototype.filter.call(document.querySelectorAll('.'+cls),
    function(c){ return c.checked; }).map(function(c){ return c.value; }); };
  S.lrM = pick('lrM'); S.lrR = pick('lrR');
  try { localStorage.setItem('hopeLrM', S.lrM.join(',')); localStorage.setItem('hopeLrR', S.lrR.join(',')); } catch(e){}
  var host = document.getElementById('lrSegs');
  if (host){ host.innerHTML = lrSegsHtml_(S.lrData); wireBar(); }
}
/** What was ticked last time, or the nine the report opened with. */
function lrPicksInit_(d){
  var read = function(key, dflt){
    var v = null; try { v = localStorage.getItem(key); } catch(e){}
    if (v == null) return dflt;
    return String(v).split(',').filter(Boolean);
  };
  S.lrM = read('hopeLrM', (d.segMetrics||[]).filter(function(x){ return x.dflt; }).map(function(x){ return x.metric; }));
  /* Every role opens ticked, including the credit analyst -- who has no early-col, col or rec
     table of their own, so the default view is still exactly the nine, and ticking Sales shows
     all three of its tables at once instead of one blank screen. */
  S.lrR = read('hopeLrR', (d.segRoles || []).map(function(x){ return x.role; }));
}

/* MODULE: legal -- this screen lives in public/mod/legal.js and loads when its tab opens (modLoad_). */
/* Issuing a notice is a two-step: preview the arithmetic against the customer's own row, then
   commit it. The letter that prints is built from the SAME figures that get stored, so the
   register and the document in the customer's hands can never disagree. */
/* THE SEARCH BOX TAKES A REF#, A NAME OR A PHONE NUMBER -- "ina search by ref peke yake" ->
   "search by ref, phone no and names etc". The server (legalFind) looks the customer up on the
   defaulter deck by any of the three; one match goes straight to the preview, several are
   listed to pick from, and a bare reference that is not on the deck window is still tried
   directly, as the old box did. */
/* THE CUSTOMERS BEHIND A LEGAL RECOVERY CARD -- the dashboard's recoveryCustomersDrawer_ for
   the Legal tab: who paid in the period, how much, on which days, under which notice and
   against what it demanded, with the grand total, which is the card's own figure (same fold
   on the server). Exports wired here because the drawer is drawn after the screen's wiring. */
function legalRecoveriesDrawer_(period){
  var week = period === 'week';
  var title = week ? 'Imerejeshwa wiki hii / Recovered this week' : 'Imerejeshwa leo / Recovered today';
  drawer('<h3>' + title + '</h3><div class="sub">Inapakia... / Loading...</div>', { wide: true });
  srv('legalRecoveries', { period: week ? 'week' : 'today' }).then(function(d){
    var when = week ? (d.from + ' → ' + d.to) : (wdLabel(weekdayOf_(d.today)) + ' ' + d.today);
    var all = d.rows || [];
    var cols = [col('full_name', 'Mteja / Customer'), col('ref', 'REF#'), col('team', 'Timu / Team'),
      {key:'contact', label:'Simu / Phone', kind:'tel'},
      col('notice_id', 'Notisi / Notice'), col('notice_date', 'Tarehe ya notisi / Notice date', 'date'),
      // "At notice", the figure the letter demanded against -- the percentage's base.
      {key:'owed', label:'At notice', kind:'money'},
      {key:'paid', label:'Imerejeshwa / Recovered', kind:'money', cls:function(){ return 'good'; }},
      {key:'pct', label:'Rec %', kind:'pct', from:['paid', 'owed']},
      col('payments', 'Malipo / Payments', 'num'), col('days', 'Siku na kiasi / Days and amounts')];
    var sub = function(rows){
      return money(d.totals.customers) + ' waliolipa / paid · ' + money(d.totals.noticed) + ' wenye notisi / noticed'
        + (rows.length !== all.length ? ' · inaonyesha / showing ' + money(rows.length) + ' / ' + money(all.length) : '');
    };
    drawer('<h3>' + title + ' · ' + esc(when) + '</h3>'
      + (d.on === false ? '<div class="note">⚠ ' + esc(d.note || '') + '</div>'
        : all.length
          ? '<div class="bar"><input id="lgRecQ" placeholder="Tafuta jina / ref / timu — search"></div><div id="lgRecBoard"></div>'
          : '<div class="note">Hakuna malipo kutoka kwa wateja wenye notisi katika kipindi hiki. / No payments from noticed customers in this period.</div>'), { wide: true });
    if (d.on === false || !all.length) return;
    var host = document.getElementById('lgRecBoard');
    function paint_(){
      var q = ($('#lgRecQ').value || '').trim().toUpperCase();
      var rows = all.filter(function(r){
        if (!q) return true;

/* Opened as a document rather than downloaded: the officer prints it or saves it as PDF from
   the browser's own print dialog, which is what produced the letter in v1 too. */
/* PRINTING A DOCUMENT THAT SOMEBODY SIGNS.

   This opened a new window and wrote the document into it. Two problems with that, and both
   of them end with an officer unable to produce a legal document:

     - A pop-up blocker stops it, and the only clue is a small icon in the address bar.
     - The Android app has no pop-ups at all, and no print service of its own, so from the
       APK the button did nothing whatsoever.

   Printing now happens IN THE PAGE: the document is written into a hidden frame that the
   print stylesheet reveals and everything else hides. No new window, nothing to block, and
   the browser's own print dialog does the rest -- including "Save as PDF", which is how these
   end up attached to an email or a legal file.

   The APK still cannot print (Android WebView needs the app to offer a print service, which
   this one does not). Rather than a button that silently does nothing, it says so and offers
   the document in the phone's browser, where printing works. */
function canPrintHere(){
  // The Android shell announces itself; a plain browser does not.
  return !(window.HopeCalls || /HopeCalls/i.test(navigator.userAgent || ''));
}
function printHtml(html){
  if (!canPrintHere()){
    // Hand it to the real browser, which can print. A blob URL keeps the document off the
    // network -- it never leaves the phone.
    try {
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
      toast('Imefunguliwa kwenye kivinjari ili kuchapisha. / Opened in the browser, where you can print.');
      return;
    } catch(e){
      toast('Chapisha kwenye kompyuta. / Print this from a computer.', true); return;
    }
  }
  var f = document.getElementById('printFrame');
  if (!f){
    f = document.createElement('iframe');
    f.id = 'printFrame';
    f.setAttribute('aria-hidden', 'true');
    document.body.appendChild(f);
  }
  var doc = f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  /* THE FILE IS NAMED AFTER THE CUSTOMER -- "Saving demand notice pdf name should generate
     with Customer Names.PDF". "Save as PDF" names the file after the TOP page's title, never
     the frame's, so a letter printed from this frame was offered as the portal's own title
     however carefully the letter's <title> carried the customer's name. That title is LENT to
     this page for exactly as long as the dialog is open -- set before print(), given back on
     afterprint (either window), or after two minutes if neither fires. */
  var tm = /<title>([^<]*)<\/title>/i.exec(html);
  var docTitle = tm ? tm[1].replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').trim() : '';
  var ownTitle = document.title, lent = false;
  var restore = function(){ if (lent){ lent = false; document.title = ownTitle; } };
  // Give the images -- logo, stamp, signature -- a moment to load. A contract printed without
  // its stamp has to be printed again, and nobody notices until it is in front of a customer.
  var go = function(){
    /* A document that fits itself to the sheet (the demand notice's hopeFit) is fitted HERE,
       with every image in, right before the dialog opens -- not every browser fires
       beforeprint for a frame, and a letter measured before its logo arrived measures short. */
    try { if (f.contentWindow.hopeFit) f.contentWindow.hopeFit(); } catch(e){}
    if (docTitle){
      lent = true; document.title = docTitle;
      try { f.contentWindow.addEventListener('afterprint', restore); } catch(e){}
      window.addEventListener('afterprint', restore);
      setTimeout(restore, 120000);
    }
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ restore(); toast('Imeshindikana kuchapisha. / Could not open the print dialog.', true); }
  };
  var imgs = doc.images ? doc.images.length : 0;
  if (!imgs) { setTimeout(go, 120); return; }
  var done = 0, fired = false;
  var maybe = function(){ if (++done >= imgs && !fired){ fired = true; setTimeout(go, 80); } };
  Array.prototype.forEach.call(doc.images, function(im){
    if (im.complete) return maybe();
    im.onload = maybe; im.onerror = maybe;
  });
  // A stamp that never loads must not mean a document that never prints.
  setTimeout(function(){ if (!fired){ fired = true; go(); } }, 2500);
}

/** How long ago a stamp was, in words somebody can act on. */
function devAgo_(iso){
  if (!iso) return 'haijawahi / never';
  var mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (!isFinite(mins)) return '—';
  if (mins < 2) return 'sasa hivi / just now';
  if (mins < 90) return mins + ' dak / min';
  var hrs = Math.round(mins / 60);
  return hrs < 48 ? hrs + ' saa / hrs' : Math.round(hrs / 24) + ' siku / days';
}

/* A DECK LEFT PLAYING NEVER LEARNT THERE WAS A NEW VERSION.
     "am not seeing the early col slide auto update column on current presentation"
   The build check (freshEnough_) runs once, at sign-in. A television that has been on the
   deck since the morning refetches its FIGURES every three minutes and keeps drawing them with
   the morning's code -- so a column shipped at noon reaches every tab that opens, and never
   the one screen it was shipped for. Now each refetch also asks /api/me which version the
   server has (the cheapest read there is) and, when it is behind, writes down where the deck
   was and reloads past the cache; start() picks the note up and presses Play again on the
   same slide, same seconds, same week. The guard against a reload loop is freshEnough_'s own.
   The one thing a page cannot do for itself is go full screen without a hand on the keyboard,
   so a browser that was not already in kiosk mode comes back as a window: the deck still
   fills it. */
var PRES_RESUME_KEY = 'hopePresResume';
function presResumeNote_(){
  return { i: S.presI || 0, secs: S.presSecs || 15, weekOf: (S.presWk && S.presWk.weekOf) || '' };
}
function presCheckBuild_(){
  if (!S.code) return;
  fetch('/api/me?code=' + encodeURIComponent(S.code)).then(readJson_).then(function(x){
    var me = x && x.body;
    if (!me || !me.build || me.build === BUILD) return;
    if (document.getElementById('pres').style.display !== 'block') return;
    try { sessionStorage.setItem(PRES_RESUME_KEY, JSON.stringify(presResumeNote_())); } catch (e) {}
    freshEnough_(me);
  }).catch(function(){ /* a missed check is tried again on the next refetch */ });
}
/** The note a reload left behind, if this page is the one it was left for. Read once. */
function presResumeTake_(){
  try {
    var raw = sessionStorage.getItem(PRES_RESUME_KEY);
    if (!raw) return null;
    sessionStorage.removeItem(PRES_RESUME_KEY);
    var n = JSON.parse(raw);
    return n && typeof n === 'object' ? n : null;
  } catch (e) { return null; }
}

window.addEventListener('resize', function(){ if (S.view === 'present' && S.slides && S.slides.length) presFit_(); });

document.addEventListener('keydown', function(e){
  if (document.getElementById('pres').style.display !== 'block') return;
  /* While the screen is black, EVERY key brings it back and none of them move the deck. A
     presenter reaching for the remote in a dark room should not land three slides away. */
  if (S.presBlank){ e.preventDefault(); presBlank(false); return; }
  if (e.key === 'Escape') presStop();
  else if (e.key === 'b' || e.key === 'B'){ e.preventDefault(); presBlank(true); }
  else if (e.key === 'ArrowRight'){ presGo(1); }
  else if (e.key === 'ArrowLeft'){ presGo(-1); }
});

/* Clicking a tab used to wipe the screen to a spinner and go back to the server every single
   time -- even flicking between two tabs you had just read. On a field connection that is a few
   seconds of blank page per click, all day. Now a tab you have already opened comes back
   instantly from what is already in hand, and the server is asked again quietly behind it.
   Only what is on screen changes when the answer lands; the page never goes blank twice.

function imprestOpenDeepLink_(){
  if (!IMPREST_DEEPLINK_ID) return;
  if (['impappr','imprep','impreq'].indexOf(S.view) < 0) { IMPREST_DEEPLINK_ID = null; return; }
  var row = (S.rows||[]).filter(function(r){ return String(r.id)===IMPREST_DEEPLINK_ID; })[0];
  // Not found -- most likely the id is stale or wrong; nothing to open, and nothing to retry.
  if (!row) { IMPREST_DEEPLINK_ID = null; return; }
  var id = IMPREST_DEEPLINK_ID; IMPREST_DEEPLINK_ID = null;
  if (S.view==='impappr' && row.status==='pending') imprestDecideDrawer_(row);
  else imprestDetailsDrawer_(row, { canRetire: S.view==='impreq', canFund: S.view==='imprep' });
}
function render(opts){
  clearInterval(S.presentTimer);
  /* A SCREEN THAT LIVES IN A MODULE is fetched the first time its tab opens -- see modLoad_.
     The spinner shows meanwhile; a tab switched away from during the fetch is left alone. */
  var mod = modOf_(S.view);
  if (mod && !MOD_READY_[mod]) {
    var want = S.view;
    loading();
    modLoad_(mod).then(function(){ if (S.view === want) render(opts); },
                       function(e){ if (S.view === want) failed(e); });
    return;
  }
  var fn = VIEWS[S.view];
  if (!fn){ $('#view').innerHTML = '<div class="msg">—</div>'; return; }
  var key = viewKey_();
  var hit = (opts && opts.force) ? null : VC.store[key];
  VC.key = key;
  if (hit && Date.now() - hit.at < VC_MS){
    snapPut_(hit);
    drawView_();
    load_(fn, key, true);                // keep reading; we will fix the numbers underneath you
    return;
  }
  loading();
  load_(fn, key, false);
}
/** quiet = there is already a good screen up. Two rules follow from that, and both matter:
    a slow answer must not paint over a tab you have since moved to (hence the ticket), and a
    failed refresh must not replace a page you are reading with an error -- the connection
    dropping for one moment is not a reason to take the work off someone's screen. */
function load_(fn, key, quiet){
  var my = ++S.rid;
  var watch = { ok:true };
  VC.watch = watch;
  busy_(true);
  fn().then(function(){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;            // a newer click already owns the screen
    busy_(false);
    if (watch.ok && !VC_SKIP[S.view]) VC.store[key] = snapTake_();
    drawView_();
  }).catch(function(e){
    if (VC.watch === watch) VC.watch = null;
    if (my !== S.rid) return;
    busy_(false);
    if (!quiet) failed(e);
  });
}

/* CUSTOM ORDER -- drag the VALUES of a column into the order the work happens in.

   Up and down buttons rather than drag-and-drop: this is used on a laptop in a meeting and on
   a phone in the field, and dragging on a touch screen inside a scrolling drawer is a fight.
   Two buttons always work.

   Saved on the device, not on the server, because it is one person's way of working through
   their own list -- not a company rule, and not something to push onto everybody else. */
function openOrderPanel(key){
  var c = S.cols.filter(function(x){ return x.key===key; })[0];
  if (!c){ toast('Chagua safu kwanza. / Choose a column to sort by first.', true); return; }
  // Whatever is actually in the data, with any saved order applied first so the panel opens
  // showing the order currently in force.
  var seen = {}, values = [];
  S.rows.forEach(function(r){
    var v = String((c.get?c.get(r):r[c.key]) == null ? '' : (c.get?c.get(r):r[c.key]));
    if (!v || seen[v]) return; seen[v] = 1; values.push(v);
  });
  var saved = customOrder(key) || [];
  values.sort(function(a,b){
    var ai = saved.indexOf(a), bi = saved.indexOf(b);
    if (ai < 0) ai = 9999; if (bi < 0) bi = 9999;
    return ai - bi;
  });
  S.orderKey = key; S.orderVals = values;
  drawOrderPanel();
}
function drawOrderPanel(){
  var c = S.cols.filter(function(x){ return x.key===S.orderKey; })[0] || { label: S.orderKey };
  drawer('<h3 style="margin:0 0 4px">Panga mwenyewe / Custom order</h3>'
    + '<div class="hint" style="margin-bottom:10px">' + esc(c.label)
      + ' — pangilia kwa mpangilio wa kazi, si wa alfabeti.<br>'
      + 'Order these the way the work happens, not the way the alphabet does. '
      + 'Saved on this device only.</div>'
    + '<div id="ordList">' + S.orderVals.map(function(v, i){
        return '<div class="ordrow" style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)">'
          + '<span style="flex:1;min-width:0">' + esc(v) + '</span>'
          + '<button class="btn sm ghost" data-up="'+i+'"'+(i===0?' disabled':'')+'>↑</button>'
          + '<button class="btn sm ghost" data-dn="'+i+'"'+(i===S.orderVals.length-1?' disabled':'')+'>↓</button>'
          + '</div>'; }).join('') + '</div>'
    + '<div style="display:flex;gap:8px;margin-top:12px">'
      + '<button class="btn" id="ordSave" style="flex:1">Hifadhi / Save</button>'
      + '<button class="btn ghost" id="ordClear">Ondoa / Reset to A–Z</button>'
    + '</div>');
  var move = function(i, j){
    if (j < 0 || j >= S.orderVals.length) return;
    var t = S.orderVals[i]; S.orderVals[i] = S.orderVals[j]; S.orderVals[j] = t;
    drawOrderPanel();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-up]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-up')); move(i, i-1); }; });
  Array.prototype.forEach.call(document.querySelectorAll('[data-dn]'), function(b){
    b.onclick = function(){ var i = Number(b.getAttribute('data-dn')); move(i, i+1); }; });
  document.getElementById('ordSave').onclick = function(){
    store('hopeOrder_' + S.orderKey, JSON.stringify(S.orderVals));
    // Sorting by that column is the whole point of having ordered it, so do it.
    S.sort = S.orderKey; closeDrawer(); paint();
    toast('Mpangilio umehifadhiwa. / Order saved on this device.');
  };
  document.getElementById('ordClear').onclick = function(){
    store('hopeOrder_' + S.orderKey, null); closeDrawer(); paint();
    toast('Imerudi kwa alfabeti. / Back to normal order.');
  };
}

/* THE ANDROID BACK BUTTON, FOR EVERY LAYER THAT SITS ON TOP OF A SCREEN.

     "Clicking back at customer card in loan recommendation goes to hope calls instead of
      returning to tab as close does., treat that and any card that behaves so too"

   The app's onBackPressed only ever asks the WebView "is there a previous PAGE"
   (web.canGoBack()). A drawer, the fullscreen presentation and the phone's side menu are
   DOM elements on top of one page, so with nothing in the history the hardware Back skipped
   straight past them and left the portal for the launcher. The camera overlay solved this
   for itself (openCameraOverlay_: push one same-document history entry on open, pop it on
   close, close on popstate); this is the same rule, written once, for every other layer.

   How it holds together:
     open   -> one pushState entry tagged with the layer's name (once, even if the layer
               re-draws itself while open, as the recommendation form does over the plan drawer)
     Back   -> the WebView pops that entry (no navigation), popstate fires, the top layer closes
     Close  -> the layer closes itself and consumes its own entry with history.back(), so a
               LATER Back press does not pop it for nothing
   A pop that lands ON the top layer's own entry was something above it (the camera) closing,
   not ours -- left alone. Desktop browsers get the same: Back closes the drawer instead of
   leaving the page. */
var BACK_LAYERS_ = [];          // open layers, in the order they were opened
var BACK_POPPING_ = false;      // true while a layer is being closed BY a Back press
function backLayerOpen_(name){
  if (BACK_LAYERS_.indexOf(name) >= 0) return;
  BACK_LAYERS_.push(name);
  try { history.pushState({ hopeLayer: name }, '', location.href); } catch (e) {}
}
function backLayerClose_(name){
  var i = BACK_LAYERS_.indexOf(name);
  if (i < 0) return;
  BACK_LAYERS_.splice(i, 1);
  if (!BACK_POPPING_) { try { history.back(); } catch (e) {} }
}
var BACK_CLOSERS_ = {
  drawer: function(){ closeDrawer(); },
  pres: function(){ if (window.presStop) presStop(); },
  nav: function(){ navClose_(); },
};
window.addEventListener('popstate', function(e){
  if (!BACK_LAYERS_.length) return;
  var top = BACK_LAYERS_[BACK_LAYERS_.length - 1];
  if (e.state && (e.state.hopeLayer === top || e.state.hopeCam)) return;   // something ABOVE us closed
  BACK_POPPING_ = true;
  try { BACK_CLOSERS_[top](); } finally { BACK_POPPING_ = false; }
});
/* The phone's side menu, through the same door -- go() and the scrim used to clear the class
   directly, which would have left the menu's history entry behind for the next Back to eat. */
function navOpen_(){ document.body.classList.add('navopen'); backLayerOpen_('nav'); }
function navClose_(){ document.body.classList.remove('navopen'); backLayerClose_('nav'); }

/** opts.wide: a table-shaped drawer takes the screen's width (see .drawer.wide); every other
    drawer keeps the form width, and the class is dropped the moment a normal one opens. */
function drawer(html, opts){
  $('#drawer').classList.toggle('wide', !!(opts && opts.wide));
  $('#drawer').innerHTML = html + '<button class="btn ghost w" style="margin-top:6px" onclick="closeDrawer()">Funga / Close</button>';
  $('#drawerBg').style.display = 'flex';
  fitPanelToKeyboard_('drawerBg');
  backLayerOpen_('drawer');
}
function closeDrawer(){
  $('#drawerBg').style.display='none';
  $('#drawerBg').style.height = ''; $('#drawerBg').style.top = '';
  $('#drawer').style.maxHeight = '';
  backLayerClose_('drawer');
}
$('#drawerBg').onclick = function(e){ if (e.target===$('#drawerBg')) closeDrawer(); };
/* THE DRAWER DID NOT RISE ABOVE THE KEYBOARD.
   "when someone wants to comment in app, the customer board doesnt rise, so they type without
    preview of whats being written"

   #drawerBg is `position:fixed;inset:0` with `align-items:flex-end` -- the comment box sits
   flush with the bottom of the PAGE. Opening the on-screen keyboard on a phone does not shrink
   that page (the layout viewport) unless the browser is told to; the keyboard just draws on
   top of it. So the drawer stayed pinned behind the keyboard, and whatever was typed into
   Maoni / Comment landed under it, invisible until Save.

   Two fixes, because no single one covers every handset in the field:
     1. `interactive-widget=resizes-content` on the viewport meta -- on a browser that honours
        it, the layout viewport itself shrinks and this function never has to do anything.
     2. This one, for the Android WebView builds and older Chrome that do not: `visualViewport`
        reports the REAL visible height once the keyboard is up, so the drawer is pinned to
        that instead of the full page -- it rises, because the space behind the keyboard has
        been taken out of its own height. */
function fitPanelToKeyboard_(bgId){
  var vv = window.visualViewport;
  if (!vv) return;
  var bg = document.getElementById(bgId);
  if (!bg) return;
  bg.style.height = vv.height + 'px';
  bg.style.top = vv.offsetTop + 'px';
  /* THE INNER PANEL MUST FIT THE PINNED BOX TOO -- "the commenting panels still covered by
     the keyboard ... for some phones". The drawer's own max-height is 90vh, and vh is
     measured against the FULL page: on a phone where only the visual viewport shrinks for
     the keyboard, the drawer could stand TALLER than the box it was pinned inside, and how
     that overflow lands varies by WebView -- on some, the bottom edge (the comment field and
     Save) ended up behind the keyboard anyway. Capping the panel to what is actually visible
     removes the guesswork: everything scrolls INSIDE the visible box, on every phone. */
  if (bgId === 'drawerBg'){
    var d = document.getElementById('drawer');
    if (d) d.style.maxHeight = Math.max(200, vv.height - 10) + 'px';
  }
}
/* THE LOGIN BOX IS THE SAME SHAPE AS THE DRAWER, AND HAD THE SAME FAULT.
   "login page doesnt slide app visibility of writting field: refer this challenge to what i
   faced in hopcalls comment field" -- #signin is `position:fixed;inset:0` too, same as
   #drawerBg was, just centred instead of flush to the bottom. A phone that does not honour
   `interactive-widget=resizes-content` never shrank it for the keyboard, so the access-code
   box (and the field itself) could sit wherever the keyboard now covers, same blind typing the
   comment box already had. Same fix, same function -- just another id in the list. */
(function(){
  var vv = window.visualViewport;
  if (!vv) return;
  var ids = ['drawerBg', 'signin'];
  function refit(){
    ids.forEach(function(id){
      var bg = document.getElementById(id);
      if (bg && bg.style.display !== 'none' && !bg.classList.contains('hide')) fitPanelToKeyboard_(id);
    });
  }
  vv.addEventListener('resize', refit);
  vv.addEventListener('scroll', refit);
  // Some WebViews announce the keyboard through the WINDOW's resize rather than the visual
  // viewport's -- listen to both, refit is idempotent either way.
  window.addEventListener('resize', refit);
})();
/* Belt-and-suspenders for a WebView slow to fire visualViewport's resize: once the keyboard's
   own open animation has had time to run, bring the field being typed into back into its
   panel's own visible area -- so even a late resize event still ends with the words on screen.
   One listener, both panels: #signin exists in the DOM from page load, unlike the drawer which
   is built by drawer() each time it opens. */
['drawerBg', 'signin'].forEach(function(id){
  var el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('focusin', function(e){
    var t = e.target;
    if (!/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    setTimeout(function(){ t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 300);
    // And once more after the slowest keyboards have finished animating -- the 300ms nudge
    // lands mid-animation on some phones and the field drifts back under.
    setTimeout(function(){ t.scrollIntoView({ block: 'center' }); }, 850);
  });
});

    + '<div class="fld"><label>Njia / Channel</label><select id="cxChan">'+opts(m.channels, r.channel, 'none')+'</select></div>'
    + '<div class="fld"><label>Hali / Status</label><select id="cxStatus">'+opts(m.statuses, r.status||'Open')+'</select></div>'

/* Step 1 — find the customer. Eligibility is the deck's answer, not the officer's. */
function rxLookup(){
  drawer('<h3>Ombi jipya / New restructuring offer</h3>'
    + '<div class="sub">Anza na REF# ya mteja. / Start with the customer’s REF#.</div>'
    + '<div class="fld"><label>Customer REF#</label><input id="rxRef" placeholder="e.g. 111"></div>'
    + '<button class="btn w" id="rxLoad">Tafuta / Load</button>');
  var go = function(){
    var ref = $('#rxRef').value.trim();
    if (!ref){ toast('Weka REF#. / Enter a REF#.', true); return; }
    srv('restructureEligible', { ref:ref }).then(function(e){
      if (!e.found){ toast('Hakuna mteja mwenye REF# hiyo kwenye orodha ya wadaiwa. / No defaulter with that REF#.', true); return; }
      rxOffer(e);
    }).catch(function(err){ toast(String(err.message||err), true); });
  };
  $('#rxLoad').onclick = go;
  $('#rxRef').onkeydown = function(ev){ if (ev.key === 'Enter') go(); };
}
/* Step 2 — the calculator. It previews exactly what the server will recompute and store, so
   what the officer shows the customer and what gets written cannot drift apart. */
function rxOffer(e){
  var st = e.strategy;
  if (!e.eligible){
    drawer('<h3>'+esc(e.full_name||e.ref)+'</h3><div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+'</div>'
      + '<div class="msg bad">Hastahili kupangiwa upya. / Not eligible — this customer has <b>'+e.dc
      + '</b> missed installment(s); restructuring needs <b>'+st.minDc+'+</b>.</div>');
    return;
  }
  drawer('<h3>'+esc(e.full_name||e.ref)+'</h3>'
    + '<div class="sub">'+esc(e.team||'')+' · REF '+esc(e.ref)+' · '+esc(e.contact||'')+'</div>'
    + '<div class="facts"><div class="frow"><span>Missed installments (DC)</span><b>'+e.dc+'</b></div>'
    + '<div class="frow"><span>Arrears owed</span><b>TZS '+money(e.arrears)+'</b></div></div>'
    + '<div class="fld"><label>Malipo ya kwanza sasa / First payment now</label>'
      + '<input id="rxFirst" type="number" min="0" step="500" value="0"></div>'
    + '<div class="fld"><label>Awamu za wiki / Weekly installments (max '+st.maxInstallments+')</label>'
      + '<input id="rxCount" type="number" min="1" max="'+st.maxInstallments+'" step="1" placeholder="e.g. 10"></div>'
    + '<div class="fld"><label>Tarehe ya kwanza / First payment date</label>'
      + '<input id="rxStart" type="date" value="'+addDays(today(),7)+'"></div>'
    + '<label class="chk"><input id="rxInt" type="checkbox"> Ongeza riba ya '+st.interestPct+'% / add '+st.interestPct+'% on the remaining</label>'
    + '<div class="fld"><label>Maelezo / Notes</label><textarea id="rxNotes" rows="2"></textarea></div>'
    + '<div id="rxPrev"></div>'
    + '<button class="btn w" id="rxSubmit">Tuma kwa idhini / Submit for approval</button>');
  var preview = function(){
    var arrears = Number(e.arrears)||0;
    var first = Math.min(Math.max(0, Number($('#rxFirst').value)||0), arrears);
    var count = Math.max(1, Math.floor(Number($('#rxCount').value)||0));
    var remaining = arrears - first;
    var interest = $('#rxInt').checked ? Math.round(remaining * (st.interestPct/100)) : 0;
    var total = remaining + interest;
    var per = Math.round(total/count/500)*500;
    var start = $('#rxStart').value;
    var over = count > st.maxInstallments;
    var rows = [];
    for (var i=0;i<Math.min(count, st.maxInstallments);i++){
      rows.push({ n:i+1, date:start?addDays(start, 7*i):'—', amount:(i===count-1? total-per*(count-1) : per) });
    }
    $('#rxPrev').innerHTML =
      '<div class="kpis sm">'
      + kpi('Remaining', money(remaining)) + kpi('New interest', money(interest))
      + kpi('Total to repay', money(total)) + kpi('Per installment', money(per))
      + '</div>'
      + (over ? '<div class="msg bad">Exceeds the '+st.maxInstallments+'-installment cap — reduce the count.</div>' : '')
      + (total > 0
          ? tableSimple(rows, [col('date','Date','date'), col('amount','Installment','money')],
              {date:'', amount:total})
          : '<div class="msg">Hakuna kilichobaki. / Nothing left to reschedule.</div>');
  };
  ['rxFirst','rxCount','rxStart'].forEach(function(id){
    $('#'+id).oninput = preview; $('#'+id).onchange = preview; });
  $('#rxInt').onchange = preview;
  preview();
  $('#rxSubmit').onclick = function(){
    srv('addRestructure', { ref:e.ref, firstInst:$('#rxFirst').value, installments:$('#rxCount').value,
      startDate:$('#rxStart').value, interestOn:$('#rxInt').checked, notes:$('#rxNotes').value.trim() })
      .then(function(){ toast('Ombi limetumwa. / Submitted for approval.'); closeDrawer(); render(); })
      .catch(function(err){ toast(String(err.message||err), true); });
  };
}
/* The contract is printed off the STORED row, not off whatever is on screen, so one printed a
   week after approval says exactly what was approved. */
function printContract(r){
  srv('restructureContract', { id: r.id, ref: r.ref })
    .then(function(c){ printHtml(c.html); })
    .catch(function(err){ toast(String(err.message||err), true); });
}
function openRestructure(r){
  if (String(r.status||'').toUpperCase()!=='PENDING'){
    var approved = String(r.status||'').toUpperCase()==='APPROVED';
    drawer('<h3>'+esc(r.full_name||r.ref)+'</h3><div class="sub">'+esc(r.team||'')+' · '+esc(r.status)+'</div>'
      + '<div class="facts"><div class="frow"><span>Total</span><b>'+money(r.total)+'</b></div>'
      + '<div class="frow"><span>Installments</span><span>'+esc(r.installments||'')+' × '+money(r.inst_amt)+'</span></div>'
      + '<div class="frow"><span>Decided by</span><span>'+esc(r.approved_by||'')+'</span></div>'
      + (r.reject_reason?'<div class="frow"><span>Reason</span><span>'+esc(r.reject_reason)+'</span></div>':'')+'</div>'
      // Only an APPROVED offer gets a contract. Printing one for a rejected request would put
      // a signable document in front of a customer for an agreement nobody made.
      + (approved ? '<button class="btn w" id="rxPrint" style="margin-top:10px">'
          + '&#128424; Chapisha mkataba / Print contract</button>' : ''));

  }
  drawer('<h3>'+esc(r.full_name||r.ref)+'</h3><div class="sub">'+esc(r.team||'')+' · REF '+esc(r.ref)+'</div>'
    + '<div class="facts"><div class="frow"><span>Arrears</span><b>'+money(r.arrears)+'</b></div>'
    + '<div class="frow"><span>Total</span><span>'+money(r.total)+'</span></div>'
    + '<div class="frow"><span>Plan</span><span>'+esc(r.installments||'')+' × '+money(r.inst_amt)+' from '+esc(String(r.start_date||'').slice(0,10))+'</span></div>'
    + '<div class="frow"><span>Requested by</span><span>'+esc(r.requested_by||'')+'</span></div></div>'
    + (r.schedule && r.schedule.length
        ? '<div class="rxsched">' + tableSimple(r.schedule,
            [col('date','Date','date'), col('amount','Installment','money')],
            {date:'', amount:r.total}) + '</div>' : '')
    + ((S.rxMeta && S.rxMeta.canApprove)
        ? '<div class="fld"><label>Sababu (kama unakataa) / Reason if rejecting</label><input id="rReason"></div>'
          + '<div style="display:flex;gap:8px"><button class="btn" style="flex:1" id="rOk">Kubali / Approve</button>'
          + '<button class="btn ghost" style="flex:1" id="rNo">Kataa / Reject</button></div>'
        : '<div class="msg">Unaweza kuona tu — huwezi kuidhinisha. / View only: approving is limited to '
          + esc((S.rxMeta && S.rxMeta.strategy ? S.rxMeta.strategy.approvers.join(' / ') : 'the approvers'))
          + ' or an admin.</div>'));
  if (!(S.rxMeta && S.rxMeta.canApprove)) return;
  function decide(d){
    srv('decideRestructure', { id:r.id, decision:d, reason:$('#rReason').value.trim() })
      .then(function(){ toast(d==='approve'?'Imekubaliwa.':'Imekataliwa.'); closeDrawer(); render(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  }
  $('#rOk').onclick=function(){ decide('approve'); };
  $('#rNo').onclick=function(){ decide('reject'); };
}

function wireForms(){

     load, which is too early for anything this file renders -- the Change-my-code form is built
     when Settings opens, and an unmasked box that is SUPPOSED to be masked is worse than one
     that never claimed to be. Calling it again is free: a box already masked is left alone. */
  if (window.hopeSecrets) window.hopeSecrets();
  /* HOPE LOAN'S OWN HEAD BUTTONS, WIRED HERE AND ONLY HERE -- see the note beside wireLnCs_.
     A view function's own returned promise resolves BEFORE this runs; wiring a button inside
     the view function itself, before drawView_() has painted HEAD into the page, attaches a
     click handler to an element that does not exist yet and silently does nothing. Every
     other HOPE Loan HEAD button (Finance, Reversals, GM) had exactly this bug on first write;
     all four are gated here alongside it. (Manager/GMO Review had a fifth -- the tier select --
     but each is its own fixed-tier nav item now, so there is no dropdown left to wire.) */
  if (S.workspace === 'hopeloan' && window.wireLnCs_) {
    wireLnCs_(); wireLnFinance_(); wireLnReversals_(); wireLnGm_(); wireLnAssessPlan_();

  // One drawer for new and existing complaints: free-text Category/Channel/Team boxes could

    };

      if (x) staffForm(x);

  var nrole = document.getElementById('newRole');
  if (nrole) nrole.onclick = function(){ roleForm(null); };
  /* "+ New team" on Teams & Staff was drawn for every admin and wired to nothing: the drawer
     already knew how to make a new team (a blank row is isNew) but no click ever opened it
     that way, so a team could only be created by uploading the leaders sheet. */
  var nteam = document.getElementById('newTeam');
  if (nteam) nteam.onclick = function(){ teamForm(null); };
  /* The clean slate, and the way back from it. Both confirm in words, because both change what
     every person in the company can open. */
  var rreset = document.getElementById('resetRoles');
  if (rreset) rreset.onclick = function(){
    if (!confirm('Ondoa tabs zote kwa nafasi zote? ADMIN inabaki na zote, na hali ya sasa inahifadhiwa ili uweze kurudisha.'
      + '\n\nClear every role\'s tabs? ADMIN keeps all of them. The current state is saved first, so Undo can put it back.')) return;
    rreset.disabled = true;
    srv('resetRoleTabs', {})
      .then(function(r){
        toast('Nafasi ' + money(r.emptied) + ' zimeanzishwa upya; misimbo ' + money(r.codesCleared) + ' imesafishwa.'
          + ' / ' + money(r.emptied) + ' role(s) emptied, ' + money(r.codesCleared) + ' code(s) cleared. ADMIN keeps all.');
        render();
      })
      .catch(function(e){ rreset.disabled = false; toast(String(e.message||e), true); });
  };
  var rundo = document.getElementById('undoRoles');
  if (rundo) rundo.onclick = function(){
    if (!confirm('Rudisha tabs zote kama zilivyokuwa kabla ya "Anza upya"?'
      + '\n\nPut every role and code back exactly as it was before "Start empty"?')) return;
    rundo.disabled = true;
    srv('resetRoleTabs', { undo: true })
      .then(function(r){
        toast('Imerudishwa: nafasi ' + money(r.roles) + ', misimbo ' + money(r.codes)

      })
      .catch(function(e){ rundo.disabled = false; toast(String(e.message||e), true); });

  Array.prototype.forEach.call(document.querySelectorAll('[data-role]'), function(el){
    el.onclick = function(){

      if (r) roleForm(r);

  var nc = document.getElementById('newComplaint');

  // PMO Deduction: the form and the on-screen report.
  var ndd = document.getElementById('newDeduction');
  if (ndd) ndd.onclick = function(){ dedNew(); };
  var drp = document.getElementById('dedReport');
  if (drp) drp.onclick = function(){ dedReport(); };
  // Salary advance: the ask, the GMO's bulk decision, HR's new-staff form.
  var asb = document.getElementById('advSubmit');
  if (asb) asb.onclick = function(){ advSubmit(); };
  var ans = document.getElementById('newAdvStaff');
  if (ans) ans.onclick = function(){ advStaffForm(null); };
  // Restructuring starts from the CUSTOMER, not from a blank form: you cannot type an
  // arrears figure that disagrees with the deck, and every derived number is computed rather
  // than entered. The old form asked for arrears, total, installments AND per-installment by
  // hand -- four chances to write an offer the books do not agree with.

  if (nr) nr.onclick = function(){ rxLookup(); };
  // The old form asked the officer to TYPE the fine and the total demand. Those are the two
  // numbers a demand notice exists to state correctly, and a mistyped one is a written demand
  // for the wrong amount with the company's stamp on it. They are computed now.

  if (nn) nn.onclick = function(){ lgIssue(); };
  // The two recovery cards open the customers and payments behind them -- the whole card,
  // as the dashboard's recovery tiles do, not just the figure.
  [['lgRecT', 'today'], ['lgRecW', 'week']].forEach(function(p){
    var v = document.getElementById(p[0]), card = v && v.closest ? v.closest('.kpi') : null;
    if (!card) return;
    card.style.cursor = 'pointer'; card.setAttribute('role', 'button'); card.setAttribute('tabindex', '0');
    card.title = 'Bofya kuona orodha / Tap for the list';
    card.onclick = function(e){ e.stopPropagation(); legalRecoveriesDrawer_(p[1]); };
    card.onkeydown = function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); legalRecoveriesDrawer_(p[1]); } };
  });
  /* The letterhead's pieces, settable from the Legal tab itself (admin): the same settingForm

  /* Closing the system turns two hundred people away from a screen they were using a minute

  var sgOfficerLoc = document.getElementById('sgOfficerLoc');
  if (sgOfficerLoc) sgOfficerLoc.onclick = function(){ go('officerloc'); };
  var so = document.getElementById('soToggle');
  if (so) so.onclick = function(){
    var open = document.getElementById('soState').textContent.indexOf('OPEN') >= 0;
    if (open && !confirm('Funga mfumo kwa watumiaji wote? Watabaki na HOPE Calls pekee.\n\n'
      + 'Close the system for everybody? They keep HOPE Calls only.')) return;
    so.disabled = true; so.textContent = 'Inabadili…';
    srv('systemOpenSet', { open: !open })
      .then(function(){ toast(open ? 'Mfumo umefungwa. / The system is closed.'
                                   : 'Mfumo umefunguliwa. / The system is open.');
                        render({ force: true }); })
      .catch(function(e){ so.disabled = false; toast(String(e.message || e), true); });
  };
  /* The HOPE LOAN visibility switch. No confirm dialog -- hiding is visibility only, deletes
     nothing, and is undone by the same press. The sidebar is drawn from /api/me, so the same
     code is asked again afterwards: the navs appear or vanish right here, without asking the
     presenter to sign out and back in in front of a room. */
  var hl = document.getElementById('hlToggle');
  if (hl) hl.onclick = function(){
    var shown = document.getElementById('hlState').textContent.indexOf('SHOWN') >= 0;
    hl.disabled = true; hl.textContent = 'Inabadili…';
    srv('settingSet', { key: 'HOPELOAN_VISIBLE', value: shown ? 'NO' : 'YES' })

      .then(function(x){

          buildNav();
          // Fresh buttons carry no highlight -- put it back on the tab being looked at.

     arrears pair it is worth saying, because recovery is morning arrears minus evening arrears
     and the two therefore pull OPPOSITE ways. And it is worth getting right: this hint used to

                                        + '/ evening arrears go DOWN — RECOVERY GOES UP')

  Array.prototype.forEach.call(document.querySelectorAll('[data-user]'), function(b){
    b.onclick = function(){
      var id = b.getAttribute('data-user');
      officerForm(((S.officers&&S.officers.rows)||[]).filter(function(x){ return String(x.user_id)===id; })[0] || null);
    };
  });
  var no = document.getElementById('newOfficer');
  if (no) no.onclick = function(){ officerForm(null); };

  /* IMPREST: the request form's live preview, then Send -- the server recomputes every figure
     from the role's own rate regardless of what this preview shows, so a stale form (a rate
     changed while it sat open) can never submit a total nobody meant. */
  (function(){
    var send = document.getElementById('imqSend');
    if (!send) return;
    var invalid = false;
    var num = function(id){ var el=document.getElementById(id), v=el?el.value:''; if (v===''||v==null) return 0; var n=Number(v);
      if (!isFinite(n)||Math.floor(n)!==n||n<0){ invalid=true; if (el) el.style.borderColor='var(--bad)'; return 0; }
      if (el) el.style.borderColor=''; return n; };
    var rateOf = function(){
      var sel = document.getElementById('imqRole');
      var opt = sel && sel.selectedOptions && sel.selectedOptions[0];
      return opt ? (Number(opt.getAttribute('data-rate'))||0) : 0;
    };
    var recalc = function(){
      invalid = false;
      var rate = rateOf();
      var fare = num('imqTrips')*num('imqTrip'), accom = num('imqDays')*rate;
      var others = num('imqO1a')+num('imqO2a')+num('imqO3a');
      var rateEl = document.getElementById('imqRate'), fareEl = document.getElementById('imqFare'), accomEl = document.getElementById('imqAccom');
      if (rateEl) rateEl.value = money(rate); if (fareEl) fareEl.value = money(fare); if (accomEl) accomEl.value = money(accom);
      document.getElementById('imqTotal').textContent = invalid?'—':money(fare+accom+others);
      // A button closed by the unretired-imprest gate stays closed whatever the figures do.
      send.disabled = invalid || send.getAttribute('data-blocked') === '1';
    };
    ['imqRole','imqTrips','imqTrip','imqDays','imqO1a','imqO2a','imqO3a'].forEach(function(id){
      var el = document.getElementById(id); if (el){ el.oninput=recalc; el.onchange=recalc; }
    });
    recalc();
    send.onclick = function(){
      var b = send; b.disabled = true;
      var say = function(html, bad){ var o=document.getElementById('imqOut'); o.style.display='block'; o.className='note'+(bad?' bad':''); o.innerHTML=html; };
      var g = function(id){ var el=document.getElementById(id); return el?el.value:''; };
      srv('imprestRequest', {
        fullName: g('imqName'), mobile: g('imqMobile'), recipientName: g('imqRecip'), email: g('imqEmail'),
        imprestRole: g('imqRole'), payMode: g('imqPay'), accountNo: g('imqAcct'),
        travelDate: g('imqDate'), destination: g('imqDest'),
        fareTrips: g('imqTrips'), farePerTrip: g('imqTrip'), accomDays: g('imqDays'),
        other1Desc: g('imqO1d'), other1Amount: g('imqO1a'), other2Desc: g('imqO2d'), other2Amount: g('imqO2a'),
        other3Desc: g('imqO3d'), other3Amount: g('imqO3a'), purpose: g('imqPurpose'),
      }).then(function(d){
        say((d.emailed ? '✅ ' : '⚠️ ') + 'Ombi limetumwa · ' + money(d.total) + ' TZS'
          + (d.emailed ? ' · GM ameambiwa kwa email / GM was emailed' : ' · email haikutumwa: ' + (d.emailNote||'')), !d.emailed);
        render({ force:true });
      }).catch(function(e){ b.disabled=false; say(String(e.message||e), true); });
    };
  })();

  /* IDHINI YA IMPREST: the state filter above the queue, and the rate-table editor. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-impq]'), function(b){
    b.onclick = function(){ IMPQ_STATE = b.getAttribute('data-impq'); if (S.view==='impappr') render({ force:true }); };
  });
  (function(){
    var add = document.getElementById('rlAdd');
    if (!add) return;
    var saveRole = function(role, rate, b){
      if (b) b.disabled = true;
      srv('imprestRoleSave', { role:role, rate:rate })
        .then(function(){ toast('Kiwango kimehifadhiwa / Rate saved'); render({ force:true }); })
        .catch(function(e){ if (b) b.disabled=false; toast(String(e.message||e), true); });
    };
    add.onclick = function(){
      var role = document.getElementById('rlRole').value, rate = document.getElementById('rlRate').value;
      if (!role) { toast('Chagua wadhifa kwanza. / Choose a role first.', true); return; }
      if (rate === '') { toast('Andika kiwango cha malazi (0 inaruhusiwa). / Enter the nightly rate (0 is allowed).', true); return; }
      saveRole(role, rate, add);
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-rle]'), function(b){
      b.onclick = function(){
        document.getElementById('rlRole').value = b.getAttribute('data-rle');
        document.getElementById('rlRate').value = b.getAttribute('data-rate');
        document.getElementById('rlRate').focus();
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-rld]'), function(b){
      b.onclick = function(){
        var role = b.getAttribute('data-rld');
        if (!confirm('Futa wadhifa ' + role + '? Maombi ya zamani hayabadiliki. / Delete role ' + role + '? Old requests keep their stamped rate.')) return;
        b.disabled = true;
        srv('imprestRoleDelete', { role: role })
          .then(function(){ toast('Imefutwa / Deleted'); render({ force:true }); })
          .catch(function(e){ b.disabled=false; toast(String(e.message||e), true); });
      };
    });
  })();
}

/* ----------------------------------------------------------- boot */
(function(){
  // Theme and language apply BEFORE anything renders, so there is no flash of the wrong one.
  applyTheme(load('hopeTheme') === 'dark');
  applyLang(load('hopeLang') || 'sw');
  var saved = load('hopeCode');
  if (!saved) return;
  S.code = saved;
  fetch('/api/me?code='+encodeURIComponent(saved))
    .then(readJson_)
    .then(function(x){
      if (x.status>=200 && x.status<300 && x.body.ok!==false) { pushOfficerCode_(saved); start(x.body); }
      else { store('hopeCode', null); pushOfficerCode_(''); $('#code').value=''; }
    })
    .catch(function(){});
})();
</script>
<script src="/brand.js"></script>
