<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOPE PMO — Portal</title>
<style>
  :root{--b950:#081C4A;--b900:#0B2A6B;--b800:#10357F;--b700:#1D4ED8;--b600:#2563EB;--b500:#3B82F6;--b300:#93C5FD;--b100:#DBEAFE;--b50:#EFF6FF;
        --bg:#F6F8FC;--card:#FFF;--ink:#0F172A;--mut:#64748B;--soft:#94A3B8;--line:#E2E8F0;
        --ok:#067647;--okbg:#E7F6EE;--okline:#CFEADD;--warn:#92400E;--warnbg:#FEF3DC;--warnline:#F6E3BC;
        --bad:#B42318;--badbg:#FDECEA;--badline:#F6CFCB;--rad:14px}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);height:100%;
    font-family:'Inter',-apple-system,Segoe UI,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  button,input,select,textarea{font-family:inherit;font-size:14px}
  .hide{display:none !important}
  .sk{width:20px;height:20px;border:2.5px solid var(--b100);border-top-color:var(--b600);border-radius:50%;animation:sp .7s linear infinite;margin:40px auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  /* A hairline that slides across the top while the screen you are already reading is quietly
     brought up to date behind you. It replaces the old habit of wiping the page to a spinner
     on every single click -- you keep your place, and the numbers change under you when they
     are ready. Two pixels tall on purpose: it should be noticeable, not distracting. */
  /* The print frame. Invisible on screen; on paper it is the ONLY thing, at full page width.
     A legal document with the app's navigation printed down the side of it is not a legal
     document anybody wants to hand to a customer. */
  #printFrame{position:fixed;left:-10000px;top:0;width:210mm;height:297mm;border:0;visibility:hidden}
  @media print{
    body > *{display:none !important}
    #printFrame{position:static;left:0;width:100%;height:auto;min-height:100vh;
                visibility:visible;display:block !important}
  }
  /* The noticeboard. It covers everything on purpose -- that is what "announcement" means
     here -- but it is always dismissible, because a notice nobody can get past is an outage. */
  #annBg{position:fixed;inset:0;background:rgba(6,26,54,.92);z-index:80;display:none;
         align-items:center;justify-content:center;padding:20px}
  #annBg.on{display:flex}
  #annBox{background:var(--card);border-radius:18px;max-width:520px;width:100%;
          max-height:88vh;overflow:auto;padding:18px;text-align:center}
  #annBox img{max-width:100%;border-radius:12px;display:block;margin:0 auto 12px}
  #annBox .t{font-size:16px;line-height:1.5;white-space:pre-wrap;text-align:left}
  /* The bell. A count nobody can read is a dot nobody looks at. */
  .bell{position:relative}
  .bell b{position:absolute;top:-5px;right:-5px;background:#B42318;color:#fff;border-radius:999px;
          font-size:10px;line-height:1;padding:3px 5px;min-width:16px;font-weight:800}
  #notifList{max-height:60vh;overflow:auto}
  .nrow{display:block;padding:9px 0;border-top:1px solid var(--line);font-size:13.5px}
  .nrow.new{background:var(--b50);margin:0 -16px;padding-left:16px;padding-right:16px}
  .nrow .m{color:var(--mut);font-size:11.5px;margin-top:2px}
  .busy{height:2px;background:transparent;overflow:hidden;flex:0 0 auto}
  .busy.on{background:var(--b100)}
  .busy.on::after{content:'';display:block;height:100%;width:40%;background:var(--b600);animation:bz 1.1s ease-in-out infinite}
  @keyframes bz{0%{margin-left:-40%}100%{margin-left:100%}}

  /* sign-in */
  #signin{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--b900),var(--b800));padding:20px;z-index:50}
  #signin .box{background:#fff;border-radius:18px;padding:26px 22px;width:100%;max-width:380px;box-shadow:0 20px 50px -20px rgba(0,0,0,.5)}
  #signin h2{margin:0 0 4px;font-size:18px}
  #signin p{margin:0 0 18px;font-size:13px;color:var(--mut)}
  #signin input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:11px;margin-bottom:12px}
  #signin input:focus{outline:none;border-color:var(--b500);box-shadow:0 0 0 3px var(--b100)}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;cursor:pointer;border-radius:10px;
    padding:11px 16px;font-weight:700;font-size:14px;background:var(--b700);color:#fff}
  .btn.w{width:100%;padding:13px}
  .btn.sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
  .btn.ghost{background:#fff;color:var(--mut);border:1.5px solid var(--line)}
  .btn:disabled{opacity:.55}

  /* shell */
  .shell{display:flex;height:100%}
  /* The sidebar is the SAME navy the phone app's header uses, not the darkest shade in the
     ramp. The app's colour was right; what made the system read as hard was painting 225
     pixels of near-black down the whole height of the screen, next to a white page. One step
     lighter is the app's own header colour, which is the thing it was meant to match. */
  .side{width:225px;flex:0 0 auto;background:var(--b900);color:#cfe0ff;display:flex;flex-direction:column;padding:16px 12px}
  .side .brand{color:#fff;font-weight:800;font-size:14px;line-height:1.35}
  .side .brand small{display:block;color:var(--b300);font-weight:500;font-size:11px;margin-top:2px}
  .nav{margin-top:18px;display:flex;flex-direction:column;gap:2px;flex:1;overflow:auto}
  .nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;color:#cfe0ff;
    padding:9px 11px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer}
  .nav button svg{width:16px;height:16px;flex:0 0 16px;opacity:.85}
  .nav button.on svg{opacity:1}
  .nav button span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav button.on{background:#fff;color:var(--b800)}
  .side .foot{border-top:1px solid rgba(255,255,255,.12);padding-top:12px;margin-top:10px}
  .side .foot b{color:#fff;font-size:12.5px;display:block}
  .side .foot span{font-size:11px;color:var(--b300);display:block;margin-bottom:8px}
  .side .foot a,.side .foot button{display:block;width:100%;text-align:center;margin-top:6px;font-size:12px;padding:8px;
    border-radius:8px;text-decoration:none;background:rgba(255,255,255,.1);color:#fff;border:0;cursor:pointer;font-weight:600}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:#fff;border-bottom:1px solid var(--line);padding:13px 18px;display:flex;align-items:center;gap:12px}
  .top h1{margin:0;font-size:16.5px;font-weight:800;flex:1;min-width:0}
  .top .q{padding:8px 12px;border:1.5px solid var(--line);border-radius:9px;min-width:150px}
  .top .q:focus{outline:none;border-color:var(--b500)}
  .body{flex:1;overflow:auto;padding:16px 18px 60px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:10px;margin-bottom:14px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
  .kpi .l{font-size:10.5px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
  .kpi .v{font-size:19px;font-weight:800;margin-top:3px}
  .kpi .s{font-size:11px;color:var(--soft);margin-top:2px}
  .good{color:var(--ok)}.bad{color:var(--bad)}.warnc{color:var(--warn)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
  .card-h{padding:11px 14px;border-bottom:1px solid var(--line);font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .card-h .sub{font-weight:400;color:var(--mut);font-size:12px;margin-left:auto}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;padding:8px 12px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;
    border-bottom:1px solid var(--line);white-space:nowrap;background:var(--b50);cursor:pointer;user-select:none}
  td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--b50)}
  .r{text-align:right}
  th.sn,td.sn{width:1%;text-align:right;color:var(--soft);font-variant-numeric:tabular-nums;padding-right:6px}
  td.sn{font-size:11.5px}
  /* weekday trend grids */
  .tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:12px 14px}
  .tcell{background:var(--b50);border:1px solid var(--b100);border-radius:10px;padding:9px 10px;text-align:center}
  /* A day nobody has uploaded yet. Deliberately faint: it is not a bad number, it is not a
     number. Zero collection and no sheet must never look the same on a wall. */
  .tcell.pend{background:transparent;border-style:dashed;opacity:.6}
  .tcell.tot{background:var(--b900);border-color:var(--b900);color:#fff}
  .tcell.tot .th,.tcell.tot .mutl{color:var(--b300)}
  .tcell .th{font-size:11.5px;font-weight:800;letter-spacing:.03em;margin-bottom:4px}
  .tcell .tl{font-size:12.5px;line-height:1.5}
  .tcell .mutl{color:var(--mut);font-size:11px}
  .tcell .badl{color:var(--bad);font-size:11px}
  /* pipeline funnel */
  .fun{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:12.5px}
  .fun .fl{width:150px;color:var(--mut);text-transform:capitalize}
  .fun .fv{width:60px;text-align:right;font-weight:700}
  .fun .fb{flex:1;height:8px;background:var(--b50);border-radius:99px;overflow:hidden}
  .fun .fb i{display:block;height:100%;background:var(--b500)}
  /* weekday pills + filters */
  .pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .pills .pill{padding:7px 13px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--mut);
    font-weight:700;font-size:12.5px;cursor:pointer}
  .pills .pill.on{background:var(--b700);border-color:var(--b700);color:#fff}
  .pills select{padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .tblfoot{padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--mut);background:var(--b50)}
  a.tel{color:var(--b600);text-decoration:none}

  /* dark mode -- one class on <body>, every colour comes from the variables above */
  body.dark{--bg:#0B1120;--card:#131C2E;--line:#22304A;--ink:#E5EAF2;--mut:#8B9AB3;--soft:#64748B;
    --b50:#16233C;--b100:#22304A;--b900:#060D1C;--b950:#040914;
    --okbg:#12301F;--okline:#1D5136;--warnbg:#33260C;--warnline:#5C4517;--badbg:#3A1512;--badline:#6B2620}
  body.dark input,body.dark select,body.dark textarea,body.dark .btn.ghost,body.dark .tcell{background:#0F1830;color:var(--ink)}
  body.dark th{background:#101B31}
  body.dark .menuBtn{background:#0F1830;color:var(--ink)}
  body.dark #signin .box{background:var(--card)}
  /* paired boards side by side on a wide screen, stacked on a phone */
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media (max-width:1000px){ .pair{grid-template-columns:1fr} }
  tr.totrow td{font-weight:800;background:var(--b50);border-top:2px solid var(--b100)}
  /* presentation: a real projector deck, full screen, dark, readable across a room */
  /* THE DECK FOLLOWS THE THEME. It was a fixed dark navy whatever the rest of the system was
     set to, so somebody working in light mode got a black screen thrown at them on the
     projector -- and a bright meeting room is exactly where a light deck reads better. Every
     colour here is a variable that flips with body.dark, so one toggle changes both. */
  :root{ --pbg:#FFFFFF; --pink:#0F172A; --plab:#1D4ED8; --pline:rgba(8,28,74,.14);
         --psoft:rgba(11,42,107,.06); --pedge:rgba(8,28,74,.10) }
  body.dark{ --pbg:#081C4A; --pink:#FFFFFF; --plab:#93C5FD; --pline:rgba(255,255,255,.22);
             --psoft:rgba(255,255,255,.07); --pedge:rgba(255,255,255,.12) }
  #pres{display:none;position:fixed;inset:0;z-index:200;background:var(--pbg);color:var(--pink);padding:26px 34px;overflow:auto}
  #pres .phead{display:flex;align-items:center;gap:14px;font-size:26px;font-weight:800;margin-bottom:18px}
  #pres .pnum{margin-left:auto;font-size:15px;font-weight:600;color:var(--plab)}
  #pres .pclose{background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer}
  /* The arrows. On a TV nobody is holding a keyboard, and on a phone or tablet there are no
     arrow keys at all -- so the two things a person wants during a deck have to be touchable.
     Big, at the vertical middle, hard against each edge where a thumb already is. */
  #pres .ptot td{border-top:2px solid var(--pline);font-weight:800;background:var(--psoft)}
  #pres .pnav{position:fixed;top:50%;transform:translateY(-50%);z-index:210;
    background:var(--psoft);border:1px solid var(--pedge);color:var(--pink);width:64px;height:96px;
    font-size:34px;line-height:1;cursor:pointer;border-radius:12px;
    display:flex;align-items:center;justify-content:center}
  #pres .pnav:hover{background:var(--b100);color:var(--b800)}
  #pres .pprev{left:10px} #pres .pnext{right:10px}
  /* Out of the way on a small screen: half the size, and low enough not to sit over a name. */
  @media (max-width:700px){ #pres .pnav{width:44px;height:64px;font-size:24px} }
  #pres .pkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  #pres .pkpi{background:var(--psoft);border:1px solid var(--pedge);border-radius:16px;padding:22px}
  #pres .pl{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--plab)}
  #pres .pv{font-size:40px;font-weight:800;margin-top:8px}
  #pres .ptable{width:100%;border-collapse:collapse;font-size:19px}
  #pres .ptable th{text-align:left;padding:10px 12px;color:var(--plab);font-size:14px;text-transform:uppercase;
    border-bottom:1px solid var(--pline);background:transparent}
  #pres .ptable td{padding:10px 12px;border-bottom:1px solid var(--pedge)}
  #pres .ptable .r{text-align:right}
  /* tips toast */
  #tip{position:fixed;right:18px;bottom:18px;max-width:330px;background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--b500);border-radius:12px;padding:12px 14px;font-size:12.5px;color:var(--ink);
    box-shadow:0 14px 34px -18px rgba(8,28,74,.6);opacity:0;transform:translateY(12px);transition:all .3s ease;
    pointer-events:none;z-index:70}
  #tip.show{opacity:1;transform:none}
  .msg{padding:34px 18px;text-align:center;color:var(--mut);font-size:13px}
  .msg.bad{color:var(--bad)}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:10.5px;font-weight:700;background:var(--b50);color:var(--b600);border:1px solid var(--b100)}
  .chip.ok{background:var(--okbg);color:var(--ok);border-color:var(--okline)}
  .chip.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warnline)}
  .chip.bad{background:var(--badbg);color:var(--bad);border-color:var(--badline)}
  .chip.mut{background:#F1F5F9;color:var(--mut);border-color:var(--line)}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .bar select,.bar input{padding:8px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff}
  .bar select:focus,.bar input:focus{outline:none;border-color:var(--b500)}
  .note{padding:10px 13px;border:1px solid var(--warnline);background:var(--warnbg);color:var(--warn);border-radius:10px;font-size:12.5px;margin-bottom:12px}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}

  /* commission rate editor + report cleanup: forms that live INSIDE a card, not a drawer,
     because typing a rate and watching the numbers move is the whole point of both. */
  .cmsrates,.cleanbox{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
  .cmsrates{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;align-items:end}
  .cmsrates .note,.cleanbox .note{grid-column:1/-1;margin:0}
  .checks{display:flex;flex-wrap:wrap;gap:6px 16px}
  .checks label,.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink)}
  .checks input,.chk input{width:auto;margin:0}
  .chk{margin:6px 0 10px}
  .clact{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .passout{margin:12px 0;padding:12px 14px;border:1.5px solid var(--okline);background:var(--okbg);border-radius:10px;text-align:center}
  .passout .pl{font-size:11.5px;color:var(--ok);font-weight:700;margin-bottom:6px}
  .passout .pv{font-size:26px;font-weight:800;letter-spacing:.14em;font-family:ui-monospace,Menlo,monospace;color:var(--ok)}
  .note.bad{border-color:var(--badline);background:var(--badbg);color:var(--bad)}
  .clickrow{cursor:pointer}
  .kpis.sm .kpi{padding:8px 10px}
  .kpis.sm .kpi .v{font-size:16px}
  .rxsched{margin:10px 0 14px;max-height:280px;overflow:auto}
  /* Complaint audit trail. Deliberately NOT .hist -- that class already styles the follow-up
     comment history, and reusing it silently restyled both. */
  .cxhist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .cxhist h4{margin:0 0 8px;font-size:11px;letter-spacing:.04em;color:var(--mut);text-transform:uppercase}
  .cxhist .hrow{padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .cxhist .hrow:last-child{border-bottom:0}
  .cxhist .hat{float:right;color:var(--mut);font-size:11px}
  .cxhist .hnote{color:var(--mut);margin-top:2px;clear:both;font-size:12px}
  .btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(8,17,34,.45);display:none;z-index:60;align-items:flex-end;justify-content:center}
  .drawer{background:var(--bg);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}
  .drawer h3{margin:0 0 4px;font-size:16px}
  .drawer .sub{color:var(--mut);font-size:12.5px;margin-bottom:12px}
  .fld{margin-bottom:11px}
  .fld label{display:block;font-size:11.5px;font-weight:700;color:var(--mut);margin-bottom:5px}
  .fld input,.fld select,.fld textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--b500)}
  .facts{background:#fff;border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:12px}
  .frow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .frow:last-child{border-bottom:0}
  .frow span:first-child{color:var(--mut)}
  .hist{font-size:12px;padding:8px 0;border-bottom:1px solid var(--line)}
  .hist:last-child{border-bottom:0}
  .hist .t{display:flex;justify-content:space-between;color:var(--soft);font-size:10.5px;margin-bottom:2px}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:11px 18px;
    border-radius:10px;font-size:13px;z-index:80;display:none;max-width:90vw}
  .toast.bad{background:var(--bad)}

  /* The menu stays on the LEFT at every size -- on a phone it slides in over the content
     instead of becoming a row of tabs across the top, so the navigation is always in the
     same place and the header stays readable. */
  .menuBtn{display:none;flex:0 0 auto;width:36px;height:36px;border-radius:9px;border:1.5px solid var(--line);
    background:#fff;color:var(--ink);font-size:17px;line-height:1;cursor:pointer;align-items:center;justify-content:center}
  .scrim{display:none;position:fixed;inset:0;background:rgba(8,17,34,.45);z-index:39}
  @media (max-width:820px){
    .menuBtn{display:flex}
    .side{position:fixed;top:0;bottom:0;left:0;z-index:40;width:230px;transform:translateX(-100%);
      transition:transform .2s ease;box-shadow:0 0 40px rgba(0,0,0,.35)}
    body.navopen .side{transform:none}
    body.navopen .scrim{display:block}
    .main{width:100%}
    .top{padding:10px 12px}
    .body{padding:12px}
    .top h1{font-size:15px}
    .top .q{min-width:0;flex:1}
  }
</style>
</head>
<body>

<div id="signin">
  <div class="box">
    <h2>HOPE PMO</h2>
    <p>Weka msimbo wako wa kuingia. / Enter your access code.</p>
    <input id="code" placeholder="Access code" autocomplete="off">
    <button class="btn w" id="inBtn">Ingia / Sign in</button>
    <div id="inErr" style="color:var(--bad);font-size:12.5px;margin-top:10px"></div>
    <a href="/" style="display:block;text-align:center;margin-top:14px;font-size:12.5px;color:var(--mut)">&larr; Menu</a>
  </div>
</div>

<div class="shell hide" id="shell">
  <aside class="side">

<script>
/* ES5-plain on purpose: this runs inside the Android WebView on whatever phone an officer
   owns. No build step, no framework, no CDN. */
var $ = function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function money(n){ n = Number(n)||0; return Math.round(n).toLocaleString('en-US'); }
function pct(v){ return (v==null||isNaN(v)) ? '—' : v + '%'; }
function mb(b){ b = Number(b)||0;
  if (b >= 1073741824) return (b/1073741824).toFixed(2)+' GB';
  if (b >= 1048576) return (b/1048576).toFixed(1)+' MB';
  return Math.round(b/1024)+' KB'; }
function fmtDur(sec){ sec = Math.max(0, Math.round(Number(sec)||0)); var h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=sec%60;
  function p2(n){ return (n<10?'0':'')+n; } return h>0 ? (h+':'+p2(m)+':'+p2(s)) : (m+':'+p2(s)); }
function store(k,v){ try{ if(v==null) localStorage.removeItem(k); else localStorage.setItem(k,v);}catch(e){} }
function load(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function toast(m, bad){ var t=$('#toast'); t.textContent=m; t.className='toast'+(bad?' bad':'');
  t.style.display='block'; clearTimeout(toast._t); toast._t=setTimeout(function(){t.style.display='none';},3200); }
function today(){ var d=new Date(Date.now()+3*3600*1000); return d.toISOString().slice(0,10); }   // EAT
function addDays(key,n){ var d=new Date(key+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }

var WDFULL = { MON:'Monday', TUE:'Tuesday', WED:'Wednesday', THU:'Thursday', FRI:'Friday', SAT:'Saturday', SUN:'Sunday' };
/* THE DAYS AS THE OFFICERS SAY THEM. Swahili weekday names carry their own number -- Jumamosi
   (mosi, 1st), Jumapili (pili, 2nd), Jumatatu (tatu, 3rd), Jumanne (nne, 4th), Jumatano (tano,
   5th) -- then Alhamisi and Ijumaa. So the working week reads J3 J4 J5 AL IJ, which is what is
   written on every board in every branch. MON/TUE/WED is the translation, not the original. */
var SWDAY = { MON:'J3', TUE:'J4', WED:'J5', THU:'AL', FRI:'IJ', SAT:'J1', SUN:'J2' };
function wdLabel(w){ return SWDAY[String(w||'').toUpperCase()] || w; }
var S = { code:'', me:null, view:'dashboard', data:null, rows:[], cols:[], q:'', sort:null, asc:true,
          sort2:null, asc2:false,
          args:{}, filters:{}, foot:'', roles:[], lang:'sw', tips:null, tipTimer:null, rid:0 };

/* Which portal calls only LOOK at data. Everything not on this list is treated as a change to
   the books, which throws the whole remembered screen away -- a save on one tab can move the
   numbers on any other, so it is never safe to keep showing what we had.
   Fails safe on purpose: a name nobody listed here is assumed to write, so the worst a
   forgotten entry can do is bring back the old behaviour of always asking the server. */
var READ_FNS = { dashboardFull:1, officerBoards:1, expectedDay:1, expdfReport:1,
  expectedDefaulters:1, assignments:1, followup:1, followupReport:1, promises:1, par:1,
  weekly:1, leaderReports:1, reports:1, commission:1, callReport:1, callAgents:1,
  complaints:1, complaintLog:1, restructures:1, restructureEligible:1, legalPreview:1,
  demandNotices:1, abnormal:1, credit:1, teams:1, settings:1, storageUsage:1,
  accessCodes:1, officerAccounts:1, loans:1, loanPipeline:1, hints:1, comments:1 };
// key = which remembered screen is on display right now. Views fill in their own defaults as
// they load (Expected decides the weekday, for one), so the key a screen is FILED under is not
// the key you would work out from the state afterwards -- keep the real one, or later touches
// like a team filter get written to a slot nobody reads.
var VC = { store:{}, watch:null, key:'' };

/* One call shape for the whole portal -- every tab goes through /api/portal. */
/* THE SERVER DID NOT SEND JSON, AND SAYING SO IN JAVASCRIPT'S WORDS HELPS NOBODY.
   A function that runs out of time or crashes is answered by the host with an HTML page, so
   r.json() throws  Unexpected token 'A', "An error o"...  -- which reads like a bug in this page
   and is in fact the server saying it gave up. Told plainly, with the status, it is something
   somebody can act on instead of paste into a search engine. */
function readJson_(r){
  return r.text().then(function(t){
    try { return { status: r.status, body: JSON.parse(t) }; }
    catch (e) {
      var slow = r.status === 504 || r.status === 408 || /timed? ?out|TIMEOUT/i.test(t);
      throw new Error((slow
        ? 'Seva imechukua muda mrefu mno / the server took too long'
        : 'Seva imeshindwa kujibu / the server could not answer')
        + ' \u2014 HTTP ' + r.status);
    }
  });
}
function srv(fn, args){
  if (!READ_FNS[fn]) {
    VC.store = {};                       // something changed: nothing remembered is trustworthy
    if (VC.watch) VC.watch.ok = false;   // and a screen built on top of a change is not either
  }
  return fetch('/api/portal', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ code:S.code, fn:fn, args:args||{} })
  }).then(readJson_)
    .then(function(x){
      if (x.status>=200 && x.status<300 && x.body.ok!==false) return x.body;
      /* The admin closed the system while this page was open. Every tab from here on would
         answer the same way, so a red message on each one teaches nothing -- say it once and
         go back to the launcher, which knows how to explain what is still available. */
      if (x.status === 403 && x.body && /HOPE Calls/.test(String(x.body.error||''))){
        document.body.innerHTML = '<div class="msg" style="padding:40px;text-align:center;line-height:1.8">'
          + 'Mfumo umefungwa kwa sasa &mdash; tumia HOPE Calls.<br>'
          + 'The system is closed for now &mdash; please use HOPE Calls.<br><br>'
          + '<a class="btn" href="/">Rudi / Back</a></div>';
        throw new Error(x.body.error);
      }
      throw new Error((x.body && x.body.error) || ('HTTP '+x.status));
    });
}

/* ----------------------------------------------------------- sign in */
function signIn(){
  var code = $('#code').value.trim();
  if (!code){ $('#inErr').textContent='Weka msimbo. / Enter your code.'; return; }
  $('#inBtn').disabled = true; $('#inBtn').textContent = 'Inaingia…';
  fetch('/api/me?code='+encodeURIComponent(code))
    .then(readJson_)
    .then(function(x){
      $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in';
      if (x.status<200||x.status>=300||x.body.ok===false){ $('#inErr').textContent = x.body.error||'Msimbo si sahihi.'; return; }
      S.code = code; store('hopeCode', code); start(x.body);
    })
    .catch(function(e){ $('#inBtn').disabled=false; $('#inBtn').textContent='Ingia / Sign in'; $('#inErr').textContent='Hakuna mtandao. ('+e+')'; });
}
$('#inBtn').onclick = signIn;
$('#code').onkeydown = function(e){ if (e.key==='Enter') signIn(); };
$('#outBtn').onclick = function(){ store('hopeCode', null); location.reload(); };

/* Tabs the v1 portal gated on. A tab nobody was ever granted (defexp, par, weekly...) stays
   visible to anyone holding a code, because the DATA is team-scoped server-side anyway --
   the gate that matters is upload/settings, which are checked on the server too. */
var ALWAYS = ['dashboard','expected','defexp','expdfrep','assignments','followup','promises','fureport','par','weekly','reports','commission','calls','complaints','restructure','legal','abnormal','credit','present','teams','apps'];

function allowed(id){
  if (id==='upload' || id==='settings') return (S.me.tabs||[]).indexOf(id)>=0;
  return ALWAYS.indexOf(id)>=0;
}
function buildNav(){
  var el = $('#nav'); el.innerHTML='';
  NAV.forEach(function(n){
    if (!allowed(n.id)) return;
    var b = document.createElement('button');
    // The icon is how people find a tab in a list of 23 -- they recognise the shape before
    // they read the word, which is the whole reason v1 had them.
    b.innerHTML = (n.ic
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" '
        + 'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + n.ic + '</svg>'
      : '') + '<span>' + esc(n.label) + '</span>';
    b.setAttribute('data-v', n.id);
    b.onclick = function(){ go(n.id); };
    el.appendChild(b);
  });
}
function go(view){
  S.view = view; S.q=''; $('#q').value=''; S.sort=null; S.sort2=null; S.asc=true; S.asc2=false;
  S.args={}; S.filters={}; S.foot='';
  document.body.classList.remove('navopen');        // picking a tab closes the phone drawer
  var t = NAV.filter(function(n){ return n.id===view; })[0];
  $('#title').textContent = t ? t.label : view;
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-v')===view);
  });
  if (view==='upload'){ location.href='/upload'; return; }
  render();
}

/* THE NOTICEBOARD, on the reader's side.

   Dismissed PER ANNOUNCEMENT, not per session: waving away Monday's notice must not also wave
   away Tuesday's, and reading Monday's twice because you opened a second tab is worse than
   useless. The version stamp the server sends is what tells them apart, and it is also what
   keeps the image off the wire -- a phone that has already seen this one asks for nothing. */
function annKey_(ts){ return 'hopeAnnSeen_' + ts; }
function annCheck(){
  return srv2('api_announcement').then(function(a){
    if (!a || !a.on || !a.ts) { $('#annBg').classList.remove('on'); return; }
    if (load(annKey_(a.ts))) return;                 // this one has already been waved away
    $('#annBox').innerHTML =
        (a.image ? '<img src="' + esc(a.image) + '" alt="">' : '')
      + (a.text ? '<div class="t">' + esc(a.text) + '</div>' : '')
      + '<button class="btn w" id="annOk" style="margin-top:14px">Sawa / Got it</button>';
    $('#annBg').classList.add('on');
    $('#annOk').onclick = function(){
      store(annKey_(a.ts), '1');
      $('#annBg').classList.remove('on');
    };
  }).catch(function(){ /* a noticeboard that will not load must never block the system */ });
}
/* The announcement is read WITHOUT an access code -- it has to reach the sign-in screen -- so
   it goes to the calls door, not the portal one. */
function srv2(fn, args){
  return fetch('/api/call', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fn:fn, args:args||[] }) }).then(function(r){ return r.json(); });
}

/* THE BELL. How a supervisor learns a complaint was logged without opening the tab. */
function bellRefresh(){
  return srv('notifications').then(function(d){
    S.notif = d;
    var b = $('#bellBtn');
    b.innerHTML = '&#128276;' + (d.unseen ? '<b>' + (d.unseen > 99 ? '99+' : d.unseen) + '</b>' : '');
  }).catch(function(){ /* the bell is never the reason a screen fails */ });
}
function bellOpen(){
  var d = S.notif || { items: [] };
  drawer('<h3 style="margin:0 0 2px">Taarifa / Notifications</h3>'
    + '<div class="hint" style="margin-bottom:8px">Malalamiko na maoni ya ufuatiliaji ya timu zako.'
    + '<br>Complaints and follow-up comments from your own teams.</div>'
    + '<div id="notifList">' + (d.items.length ? d.items.map(function(i){
        return '<div class="nrow' + (i.unseen ? ' new' : '') + '">'
          + '<b>' + esc(i.kind === 'complaint' ? 'Lalamiko / Complaint' : 'Maoni / Follow-up') + '</b> — '
          + esc(i.who || i.ref || '')
          + '<div>' + esc(i.what) + '</div>'
          + '<div class="m">' + esc(i.team || '') + ' · ' + esc(i.by || '')
            + ' · ' + esc(String(i.at).replace('T', ' ').slice(0, 16)) + '</div></div>';
      }).join('') : '<div class="hint">Hakuna kipya. / Nothing new.</div>') + '</div>'
    + (d.unseen ? '<button class="btn w" id="notifSeen" style="margin-top:10px">'
        + 'Nimesoma zote / Mark all read</button>' : ''));
  var b = $('#notifSeen');
  if (b) b.onclick = function(){
    srv('notifSeen', {}).then(function(){ closeDrawer(); bellRefresh(); })
      .catch(function(e){ toast(String(e.message||e), true); });
  };
}

/* WHERE IS THIS CUSTOMER? -- one reference number, every book at once.

   It is not a tab, because it does not belong to any one of them: an officer opens it while a
   customer is on the phone, reads what they need, and closes it again. */
function findOpen(prefill){
  drawer('<h3 style="margin:0 0 2px">Tafuta mteja / Find a customer</h3>'
    + '<div class="hint" style="margin-bottom:8px">Namba ya kumbukumbu, jina, au namba ya simu.'
    + '<br>Reference number, name, or phone number — searches every book at once.</div>'
    + '<input id="findQ" placeholder="mf. 12345" autocomplete="off" value="' + esc(prefill||'') + '">'
    + '<button class="btn w" id="findGo" style="margin-top:8px">Tafuta / Search</button>'
    + '<div id="findOut" style="margin-top:12px"></div>');
  var out = function(html){ $('#findOut').innerHTML = html; };
  var run = function(){
    var q = $('#findQ').value.trim();
    if (q.length < 3){ out('<div class="hint">Andika angalau herufi tatu. / Type at least three characters.</div>'); return; }
    out('<div class="sk"></div>');
    srv('customerSearch', { q: q }).then(function(d){
      if (d.tooShort){ out('<div class="hint">Andika angalau herufi tatu. / Type at least three characters.</div>'); return; }
      if (!d.total){ out('<div class="hint">Hakuna aliyepatikana kwa "' + esc(d.q) + '".'
        + '<br>Nobody found. Check the reference, or they may belong to another team.</div>'); return; }
      out(d.books.map(function(b){
        if (b.failed) return '<div class="note bad">' + esc(b.label)
          + ' — imeshindikana kusoma / could not be read</div>';
        return '<div style="margin-bottom:12px"><b>' + esc(b.label) + '</b> ('+b.rows.length+')'
          + b.rows.map(function(r){
              // Show what each book actually knows, rather than a fixed shape that would be
              // half empty in most of them.
              var bits = [];
              Object.keys(r).forEach(function(k){
                if (r[k] == null || r[k] === '' || k === 'team') return;
                bits.push('<span style="color:var(--mut)">'+esc(k.replace(/_/g,' '))+':</span> '+esc(String(r[k])));
              });
              return '<div class="nrow"><b>' + esc(r.full_name || r.customer_name || r.complainant || r.ref || '')
                + '</b> <span class="chip mut">' + esc(r.team||'') + '</span>'
                + '<div class="m">' + bits.join(' · ') + '</div></div>';
            }).join('') + '</div>';
      }).join('')
      + (d.capped ? '<div class="hint">Kuna wengi zaidi — fanya utafutaji uwe mahususi zaidi.'
          + ' / There are more matches than shown; narrow the search.</div>' : ''));
    }).catch(function(e){ out('<div class="note bad">' + esc(String(e.message||e)) + '</div>'); });
  };
  $('#findGo').onclick = run;
  $('#findQ').onkeydown = function(e){ if (e.key === 'Enter') run(); };
  $('#findQ').focus();
  if (prefill) run();
}

function start(me){
  S.me = me;
  // Before anything is drawn: the first tab load already uses the remembered-screen window.
  applyCadences(me.ui);
  $('#signin').classList.add('hide');
  $('#shell').classList.remove('hide');
  $('#meName').textContent = me.name;
  $('#meRole').textContent = me.role + ' · ' + (me.teams ? me.teamCount+' team(s)' : 'All teams');
  buildNav();
  tipsStart();
  go('dashboard');
  annCheck();
  bellRefresh();
  $('#bellBtn').onclick = bellOpen;
  $('#findBtn').onclick = function(){ findOpen(''); };
  // Checked again when somebody comes back to the tab, so a notice posted mid-morning reaches
  // a screen that has been sitting open since eight.
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden){ annCheck(); bellRefresh(); }
  });
}

/* ----------------------------------------------------------- table engine
   Every list tab is the same thing: rows + a column spec. One renderer means a new tab is a
   few lines of config instead of a new screen, and search/sort/CSV work everywhere for free. */
function col(key, label, kind){ return { key:key, label:label, kind:kind||'text' }; }
function cellText(r, c){
  var v = r[c.key];
  if (c.get) v = c.get(r);
  if (v==null || v==='') return '';
  if (c.kind==='money') return money(v);
  if (c.kind==='pct') return pct(v);
  if (c.kind==='dur') return fmtDur(v);
  if (c.kind==='date') return String(v).slice(0,10);
  if (c.kind==='dt') return String(v).replace('T',' ').slice(0,16);
  return String(v);
}
function cellHtml(r, c){
  var txt = cellText(r, c);
  if (c.kind==='chip') return txt ? '<span class="chip '+(c.chip? c.chip(r):'mut')+'">'+esc(txt)+'</span>' : '';
  // Phone numbers are dialable everywhere in v1 -- keep that, it is how officers actually work.
  if (c.kind==='tel') return txt ? '<a class="tel" href="tel:'+esc(txt)+'" onclick="event.stopPropagation()">'+esc(txt)+'</a>' : '';
  return esc(txt);
}
function isNum(c){ return c.kind==='money'||c.kind==='num'||c.kind==='pct'||c.kind==='dur'; }

function filtered(){
  var rows = S.rows;
  // Dropdown filters (team / status) narrow BEFORE the text search, so the footer totals and
  // the CSV/Excel export always describe exactly what is on screen.
  if (S.filters.team) rows = rows.filter(function(r){ return String(r.team||'')===S.filters.team; });
  if (S.filters.status) rows = rows.filter(function(r){
    return String(r.todays_status||'').trim().toUpperCase() === S.filters.status
        || (!r.todays_status && S.filters.status === '(BLANK)'); });
  // Any other data-filter="x" narrows on the row property of the same name, so a tab can add
  // a dropdown (analyst, state, officer, follow-up status) without touching this function.
  Object.keys(S.filters).forEach(function(k){
    if (k==='team' || k==='status' || !S.filters[k]) return;
    rows = rows.filter(function(r){ return String(r[k]==null?'':r[k]).trim() === S.filters[k]; });
  });
  var q = S.q.trim().toUpperCase();
  if (!q) return rows;
  return rows.filter(function(r){
    for (var i=0;i<S.cols.length;i++){ if (cellText(r,S.cols[i]).toUpperCase().indexOf(q)>=0) return true; }
    return false;
  });
}
/* SORTING BY THE ORDER THE WORK HAPPENS IN, NOT BY THE ALPHABET.

   A follow-up status sorted A-Z puts AMETOA AHADI above ANALIPA LEO above HAPATIKANI, which is
   no order anybody works in. A recovery officer wants the people who said they would pay today
   at the top, then the promises, then the ones who cannot be reached at all.

   So a column may carry its own order of VALUES, and the user may drag that order about. It is
   remembered on the device, because it is a personal working preference and not company data.
   Columns with no custom order sort normally. */
function customOrder(key){
  try { var raw = load('hopeOrder_' + key); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function cmpOn(c, a, b, asc){
  var av = c.get?c.get(a):a[c.key], bv = c.get?c.get(b):b[c.key];
  var ord = customOrder(c.key);
  if (ord && ord.length){
    // Anything not in the saved order sorts after everything that is, rather than jumping to
    // the top -- a status nobody has ranked is not the most urgent thing on the screen.
    var ai = ord.indexOf(String(av==null?'':av)), bi = ord.indexOf(String(bv==null?'':bv));
    if (ai < 0) ai = ord.length; if (bi < 0) bi = ord.length;
    if (ai !== bi) return asc ? ai-bi : bi-ai;
    return 0;
  }
  if (isNum(c)){ av=Number(av)||0; bv=Number(bv)||0; return asc ? av-bv : bv-av; }
  av=String(av==null?'':av).toUpperCase(); bv=String(bv==null?'':bv).toUpperCase();
  return asc ? (av<bv?-1:av>bv?1:0) : (av>bv?-1:av<bv?1:0);
}
function sorted(rows){
  var c1 = S.sort ? S.cols.filter(function(x){ return x.key===S.sort; })[0] : null;
  var c2 = S.sort2 ? S.cols.filter(function(x){ return x.key===S.sort2; })[0] : null;
  if (!c1 && !c2) return rows;
  var out = rows.slice();
  // Two levels: sort by follow-up status, THEN by arrears descending inside each status. One
  // level answers "who is worst"; two answers "who is worst among the ones I can act on".
  out.sort(function(a,b){
    if (c1){ var r = cmpOn(c1, a, b, S.asc); if (r) return r; }
    if (c2) return cmpOn(c2, a, b, S.asc2);
    return 0;
  });
  return out;
}
/* The sort bar. Offered on any tab that asks for it, so this does not become a followup-only
   feature that the next tab has to reinvent. */
function sortBarHtml(){
  var opts = function(sel){
    return '<option value="">—</option>' + S.cols.map(function(c){
      return '<option value="'+esc(c.key)+'"'+(sel===c.key?' selected':'')+'>'+esc(c.label)+'</option>'; }).join('');
  };
  return '<select id="sortA">' + opts(S.sort) + '</select>'
    + '<select id="sortAd"><option value="1"'+(S.asc?' selected':'')+'>↑</option><option value="0"'+(!S.asc?' selected':'')+'>↓</option></select>'
    + '<span style="color:var(--mut);font-size:12px">kisha / then</span>'
    + '<select id="sortB">' + opts(S.sort2) + '</select>'
    + '<select id="sortBd"><option value="1"'+(S.asc2?' selected':'')+'>↑</option><option value="0"'+(!S.asc2?' selected':'')+'>↓</option></select>'
    + '<button class="btn sm ghost" id="ordBtn">Panga mwenyewe / Custom order…</button>';
}
/* Every table carries a serial number. These lists run to thousands of rows and get read
   aloud in meetings ("number 42..."), so position has to be visible without counting. It is
   the row's position in the CURRENT view, so it stays 1..n after a search or a re-sort. */
function tableHtml(rows, cols, onRow){
  if (!rows.length) return '<div class="msg">Hakuna taarifa. / Nothing here yet.</div>';
  var head = '<th class="sn">S/N</th>' + cols.map(function(c){
    var arrow = S.sort===c.key ? (S.asc?' ↑':' ↓') : '';
    return '<th class="'+(isNum(c)?'r':'')+'" data-sort="'+esc(c.key)+'">'+esc(c.label)+arrow+'</th>';
  }).join('');
  var body = rows.map(function(r, i){
    return '<tr'+(onRow?' data-i="'+i+'" style="cursor:pointer"':'')+'>'
      + '<td class="sn">'+(i+1)+'</td>'
      + cols.map(function(c){
          return '<td class="'+(isNum(c)?'r':'')+(c.cls?(' '+c.cls(r)):'')+'">'+cellHtml(r,c)+'</td>';
        }).join('') + '</tr>';
  }).join('');
  /* THE GRAND TOTAL ON THE MAIN LIST TOO. Every card board and every projected slide grew one,
     and this table -- the biggest on every tab, and the one the commission week is read from --
     did not. Same rule as everywhere else, so the figure at the bottom of a card and the figure
     at the bottom of the list are worked out the same way and cannot disagree.

     It totals what is ON SCREEN. Filter to one team and the total is that team's; that is the
     only reading that makes sense under a filter, and a total that ignored the filter would be
     read as the filtered one by everybody. */
  var tot = autoTotals(rows, cols);
  if (tot) body += '<tr class="totrow"><td class="sn"></td>' + cols.map(function(c, i){
    return '<td class="'+(isNum(c)?'r':'')+'">'+(i===0?'JUMLA / TOTAL':cellHtml(tot,c))+'</td>'; }).join('') + '</tr>';
  return '<div class="scroll"><table><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>';
}
function wireTable(rows, onRow){
  Array.prototype.forEach.call(document.querySelectorAll('th[data-sort]'), function(th){
    th.onclick = function(){
      var k = th.getAttribute('data-sort');
      if (S.sort===k) S.asc = !S.asc; else { S.sort=k; S.asc=false; }
      paint();
    };
  });
  if (onRow) Array.prototype.forEach.call(document.querySelectorAll('tbody tr[data-i]'), function(tr){
    tr.onclick = function(){ onRow(rows[+tr.getAttribute('data-i')]); };
  });
}
function exportCsv(){
  if (!S.rows.length){ toast('Hakuna cha kupakua.', true); return; }
  var rows = sorted(filtered());
  var lines = ['"S/N",' + S.cols.map(function(c){ return '"'+String(c.label).replace(/"/g,'""')+'"'; }).join(',')];
  rows.forEach(function(r, i){
    lines.push('"'+(i+1)+'",' + S.cols.map(function(c){ return '"'+cellText(r,c).replace(/"/g,'""')+'"'; }).join(','));
  });
  download(new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}), S.view+'-'+today()+'.csv');
}
function download(blob, name){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 1500);
}
/* Excel: a real .xls workbook written as SpreadsheetML-flavoured HTML. Excel and WPS both
   open it natively, it keeps numbers as numbers, and it needs no library -- which matters
   because this has to work inside the Android WebView with no CDN. */
function exportXls(){
  if (!S.rows.length){ toast(t('nothing'), true); return; }
  var rows = sorted(filtered());
  function cell(v, numeric){
    return '<td'+(numeric?' x:num':'')+'>'+esc(v)+'</td>';
  }
  var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    + '<xml><x:ExcelWorkbook><x:ExcelWorksheets><x:ExcelWorksheet>'
    + '<x:Name>'+esc(S.view)+'</x:Name><x:WorksheetOptions><x:FreezePanes/><x:SplitHorizontal>1</x:SplitHorizontal>'
    + '<x:TopRowBottomPane>1</x:TopRowBottomPane></x:WorksheetOptions></x:ExcelWorksheet>'
    + '</x:ExcelWorksheets></x:ExcelWorkbook></xml>'
    + '<style>th{background:#0B2A6B;color:#fff;font-weight:700}td,th{border:1px solid #ccc;padding:4px 6px}</style>'
    + '</head><body><table><thead><tr><th>S/N</th>'
    + S.cols.map(function(c){ return '<th>'+esc(c.label)+'</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rows.map(function(r,i){
        return '<tr>'+cell(i+1,true)+S.cols.map(function(c){
          var raw = c.get ? c.get(r) : r[c.key];
          return isNum(c) ? cell(Number(raw)||0, true) : cell(cellText(r,c), false);
        }).join('')+'</tr>';
      }).join('')
    + '</tbody></table>' + (S.foot ? '<p>'+esc(S.foot)+'</p>' : '') + '</body></html>';
  download(new Blob(['﻿'+html], {type:'application/vnd.ms-excel;charset=utf-8;'}), S.view+'-'+today()+'.xls');
}
/* JPG: draws the element to a canvas by rasterising a cloned copy through an SVG
   foreignObject -- no html2canvas, no CDN, so it works offline in the app. Falls back to a
   clear message rather than a silent nothing if the browser refuses to taint-free render. */
function saveJpg(el){
  if (!el){ toast(t('nothing'), true); return; }
  try {
    var w = Math.min(el.scrollWidth, 1600), h = el.scrollHeight;
    var clone = el.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('button'), function(b){ b.remove(); });
    var css = '';
    Array.prototype.forEach.call(document.styleSheets, function(sh){
      try { Array.prototype.forEach.call(sh.cssRules, function(r){ css += r.cssText; }); } catch(e){}
    });
    var html = '<div xmlns="http://www.w3.org/1999/xhtml" class="'+document.body.className+'">'
      + '<style>'+css+'</style><div style="background:var(--bg);padding:10px;width:'+w+'px">'
      + clone.outerHTML + '</div></div>';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+(h+24)+'">'
      + '<foreignObject width="100%" height="100%">'+html+'</foreignObject></svg>';
    var img = new Image();
    img.onload = function(){
      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h+24;
      var ctx = cv.getContext('2d');
      ctx.fillStyle = document.body.classList.contains('dark') ? '#0B1120' : '#F6F8FC';
      ctx.fillRect(0,0,cv.width,cv.height);
      ctx.drawImage(img,0,0);
      cv.toBlob(function(b){
        if (!b){ toast(t('jpgfail'), true); return; }
        download(b, S.view+'-'+today()+'.jpg');
      }, 'image/jpeg', 0.94);
    };
    img.onerror = function(){ toast(t('jpgfail'), true); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  } catch(e){ toast(t('jpgfail'), true); }
}

/* ---- language, theme, tips ---- */
var STR = {
  sw: { nothing:'Hakuna cha kupakua.', jpgfail:'Imeshindikana kutengeneza picha.', saved:'Imehifadhiwa.' },
  en: { nothing:'Nothing to download.', jpgfail:'Could not build the picture.', saved:'Saved.' }
};
function t(k){ return (STR[S.lang] || STR.sw)[k] || k; }
function applyLang(l){
  S.lang = (l === 'en') ? 'en' : 'sw';
  store('hopeLang', S.lang);
  var b = $('#langBtn'); if (b) b.textContent = (S.lang === 'sw') ? 'SW' : 'EN';
}
function applyTheme(dark){
  document.body.classList.toggle('dark', !!dark);
  store('hopeTheme', dark ? 'dark' : 'light');
  var b = $('#themeBtn'); if (b) b.innerHTML = dark ? '&#9788;' : '&#9789;';
}
function tipShow(){
  if (!S.tips) return;
  var byLang = S.tips[S.lang] || S.tips.en || S.tips.sw || {};
  var pool = (byLang[S.view] || []).concat(byLang.all || []);
  if (!pool.length) return;
  var el = $('#tip');
  el.textContent = pool[Math.floor(Math.random()*pool.length)];
  el.classList.add('show');
  clearTimeout(S.tipHide);
  S.tipHide = setTimeout(function(){ el.classList.remove('show'); },
    Math.max(3, Number(S.hintHoldSec) || 7) * 1000);
}
function tipsStart(){
  srv('hints').then(function(h){
    S.tips = h.tips || {};
    clearInterval(S.tipTimer);
    setTimeout(tipShow, 3000);
    S.tipTimer = setInterval(tipShow, Math.max(30, Number(S.hintEverySec) || 240) * 1000);
  }).catch(function(){});
}

/* `id`, when given, names the VALUE and the SUBTITLE so a caller can update just those two
   without redrawing the screen around them. */
function kpi(l, v, s, cls, id){ return '<div class="kpi"><div class="l">'+esc(l)+'</div>'
  + '<div class="v'+(cls?' '+cls:'')+'"'+(id?' id="'+id+'"':'')+'>'+v+'</div>'
  + (s?'<div class="s"'+(id?' id="'+id+'S"':'')+'>'+esc(s)+'</div>':'') + '</div>'; }
function bar(html){ return '<div class="bar">'+html+'</div>'; }

/* `head` is redrawn on every paint, `rows`/`cols` drive the table. */
var HEAD = '', ONROW = null;
function paint(){
  var rows = sorted(filtered());
  $('#view').innerHTML = HEAD + '<div class="card" id="mainCard">'
    + '<div class="card-h">Orodha / List<span class="sub">' + rows.length + ' / ' + S.rows.length
    + ' <button class="btn sm ghost" data-xls="mainCard">Excel</button>'
    + ' <button class="btn sm ghost" data-jpg="mainCard">JPG</button>'
    + ' <button class="btn sm ghost" data-csv="mainCard">CSV</button></span></div>'
    + tableHtml(rows, S.cols, ONROW)
    + (S.foot ? '<div class="tblfoot">Showing '+rows.length+' of '+S.rows.length+' · '+esc(S.foot)+'</div>' : '')
    + '</div>';
  wireTable(rows, ONROW);
  wireBar();
}
function paintHeadOnly(){ $('#view').innerHTML = HEAD; wireBar(); }
function wireBar(){
  // The bar's HTML is built once, when the tab is loaded, with whatever was chosen at that
  // moment written into it. Anything picked afterwards -- a team filter, or a choice carried
  // back when you return to a tab -- lives in S, not in that HTML. Put S back on the controls
  // so the boxes say what the table is actually showing. A dropdown reading "All teams" over a
  // table listing one team is worse than no filter at all.
  Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function(el){
    var want = S.filters[el.getAttribute('data-filter')] || '';
    if (el.value !== want) el.value = want;
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-arg]'), function(el){
    // A button carrying data-val sets the arg on CLICK; inputs and selects still use change.
    if (el.hasAttribute('data-val')) {
      el.onclick = function(){ S.args[el.getAttribute('data-arg')] = el.getAttribute('data-val'); render(); };
      return;
    }
    el.onchange = function(){ S.args[el.getAttribute('data-arg')] = el.value; render(); };
  });
  // The two-level sort. Changing it re-sorts what is already on screen -- no trip to the
  // server, because sorting is not a question the server was ever asked.
  var sa = document.getElementById('sortA');
  if (sa){
    sa.onchange = function(){ S.sort = this.value || null; paint(); };
    document.getElementById('sortAd').onchange = function(){ S.asc = this.value === '1'; paint(); };
    document.getElementById('sortB').onchange = function(){ S.sort2 = this.value || null; paint(); };
    document.getElementById('sortBd').onchange = function(){ S.asc2 = this.value === '1'; paint(); };
  }
  var ob = document.getElementById('ordBtn');
  if (ob) ob.onclick = function(){ openOrderPanel(S.sort || (S.cols[0]||{}).key); };
  var mw = document.getElementById('mailWeekly');
  if (mw) mw.onclick = function(){
    if (!confirm('Tuma ripoti ya wiki kwa admin? / Email this week’s report to the admin address?')) return;
    mw.disabled = true; mw.textContent = 'Inatuma… / Sending…';
    srv('emailWeeklyExpdf', {})
      .then(function(r){ toast('Imetumwa kwa ' + r.to + '. / Sent.'); mw.disabled = false;
        mw.textContent = '✉ Tuma wiki kwa admin / Email weekly report'; })
      .catch(function(e){ toast(String(e.message||e), true); mw.disabled = false;
        mw.textContent = '✉ Tuma wiki kwa admin / Email weekly report'; });
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-wd]'), function(el){
    el.onclick = function(){ S.args.weekday = el.getAttribute('data-wd'); render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-filter]'), function(el){
    el.onchange = function(){
      S.filters[el.getAttribute('data-filter')] = el.value;
      // Narrowing the list needs no trip to the server -- but remember the choice with the
      // screen, so coming back to this tab shows the same box ticked and the same rows.
      if (VC.store[VC.key]) VC.store[VC.key].filters = JSON.parse(JSON.stringify(S.filters));
      paint();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-jpg]'), function(el){
    el.onclick = function(e){ e.stopPropagation(); saveJpg(document.getElementById(el.getAttribute('data-jpg'))); };
  });
  // Excel/CSV on a board export THAT board; on the main card they export the filtered table.
  Array.prototype.forEach.call(document.querySelectorAll('[data-xls]'), function(el){
    el.onclick = function(e){ e.stopPropagation(); var id = el.getAttribute('data-xls');
      if (id === 'mainCard') exportXls(); else exportBoard(id, 'xls'); };
  });
  var ps = document.getElementById('presStart');
  if (ps) ps.onclick = function(){ S.presSecs = Number(document.getElementById('presSecs').value) || 15; presStart(0); };
  // Segment and team choices persist -- the same meeting runs every week and nobody wants to
  // re-tick nine boxes each Monday.
  /* TICKING A BOX MUST NOT REBUILD THE SCREEN. render() here re-ran the whole view, and this
     view is never cached (the slideshow runs its own timers), so every tick went back to the
     server for the dashboard AND the officer boards -- a hundred-odd round trips because
     somebody chose not to project one slide. The figures cannot change because of a checkbox,
     so nothing is fetched: the deck is rebuilt from what is already in hand and only the
     counter is redrawn. */
  var presCount = function(){
    var n = document.getElementById('presCount'), sub = document.getElementById('presCountS');
    if (n) n.innerHTML = money(S.slides.length);
    if (sub) sub.textContent = S.presOff.length ? money(S.presOff.length) + ' hidden'
      : 'live figures, not a screenshot';
  };
  Array.prototype.forEach.call(document.querySelectorAll('.presSeg'), function(el){
    el.onchange = function(){
      S.presOff = Array.prototype.filter.call(document.querySelectorAll('.presSeg'), function(c){ return !c.checked; })
        .map(function(c){ return c.value; });
      store('hopePresOff', S.presOff.join(','));
      presApply(); presCount();
    };
  });
  var pt = document.getElementById('presTeam');
  if (pt) pt.onchange = function(){
    S.presTeam = pt.value; store('hopePresTeam', pt.value);
    presApply(); presCount();
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-csv]'), function(el){
    el.onclick = function(e){ e.stopPropagation(); var id = el.getAttribute('data-csv');
      if (id === 'mainCard') exportCsv(); else exportBoard(id, 'csv'); };
  });
  // Expected Defaulters' weekday tabs -- the customer set changes, so this re-renders.
  Array.prototype.forEach.call(document.querySelectorAll('[data-day]'), function(el){
    el.onclick = function(){ S.args.day = Number(el.getAttribute('data-day')); render(); };
  });
  /* Posting to the noticeboard. The picture is read here and sent as part of the request --
     there is no file store in this system, and a URL would point every screen in the company
     at somebody else's server. */
  var annPost = document.getElementById('annPost');
  if (annPost){
    var annImg = '';
    var f = document.getElementById('annFile');
    f.onchange = function(){
      var file = f.files && f.files[0];
      if (!file) { annImg = ''; document.getElementById('annPrev').innerHTML = ''; return; }
      // Say it here rather than after a slow upload that fails.
      if (file.size > 600 * 1024){
        toast('Picha ni kubwa mno (zaidi ya 600 KB). / That picture is too big — keep it under 600 KB.', true);
        f.value = ''; return;
      }
      var rd = new FileReader();
      rd.onload = function(){ annImg = String(rd.result || '');
        document.getElementById('annPrev').innerHTML = '<img src="'+esc(annImg)+'" style="max-width:100%;border-radius:10px">'; };
      rd.readAsDataURL(file);
    };
    annPost.onclick = function(){
      var text = document.getElementById('annText').value.trim();
      if (!text && !annImg){ toast('Andika ujumbe au chagua picha. / Write something or choose a picture.', true); return; }
      srv('announceSave', { text: text, image: annImg })
        .then(function(){ toast('Limetangazwa. / Posted to every screen.'); })
        .catch(function(e){ toast(String(e.message||e), true); });
    };
    document.getElementById('annOff').onclick = function(){
      srv('announceSave', { text: '', image: '', on: false })
        .then(function(){ toast('Limeondolewa. / Taken down.'); render({ force:true }); })
        .catch(function(e){ toast(String(e.message||e), true); });
    };
  }
  var cmSave = document.getElementById('cmSave');

/* Check counts and NAMES the first few, because "412 customers" is not something anybody should
   act on without recognising at least one of them. */
function wireFollowupClean(){
  var chk = document.getElementById('fcCheck'), run = document.getElementById('fcRun');
  if (!chk && !run) return;
  var out = document.getElementById('fcOut');
  var say = function(html, bad){ out.style.display='block'; out.className='note'+(bad?' bad':''); out.innerHTML = html; };
  var call = function(confirm){
    var days = parseInt(document.getElementById('fcDays').value, 10) || 14;
    say('Inahesabu\u2026 / counting\u2026');
    srv('followupClean', { days: days, confirm: confirm })
      .then(function(r){
        if (!r.stale) return say('Hakuna aliyepitwa na wakati \u2014 kila mtu kwenye orodha amethibitishwa ndani ya siku ' + days
          + '. / Nobody is stale; everyone on the list was confirmed within ' + days + ' days.');
        var names = (r.sample||[]).map(function(x){
          return esc(x.name || x.ref) + ' <span style="color:var(--mut)">(' + esc(x.team) + ', D.S ' + esc(x.ds||'\u2014')
            + ', ' + esc(x.lastSeen) + ')</span>'; }).join('<br>');
        if (r.applied) {
          say('<b>' + money(r.retired) + '</b> wameondolewa kwenye orodha hai. Maoni yao yote yapo pale pale. / '
            + money(r.retired) + ' taken off the working list. Every comment is untouched.');
          render();
          return;
        }
        say('<b>' + money(r.stale) + '</b> kati ya ' + money(r.checked) + ' hawajathibitishwa tangu <b>' + esc(r.cutoff) + '</b>.'
          + '<br><span style="color:var(--mut);font-size:11.5px">Bonyeza <b>Safisha</b> kuwaondoa kwenye orodha hai. Hakuna kinachofutwa.</span>'
          + (names ? '<div style="margin-top:8px;font-size:12px;line-height:1.6">' + names
              + (r.stale > (r.sample||[]).length ? '<br><span style="color:var(--mut)">\u2026na wengine ' + money(r.stale - r.sample.length) + '</span>' : '')
              + '</div>' : ''));
      })
      .catch(function(e){ say(esc(String(e.message || e)), true); });
  };
  if (chk) chk.onclick = function(){ call(false); };
  if (run) run.onclick = function(){ call(true); };
}
/* Cleaning old reports deletes a DAY OF HISTORY, so the flow is deliberately two-step: Check
   counts the rows without touching anything, Clean asks once more and names the number. */
function wireClean(){
  var run = document.getElementById('clRun'), chk = document.getElementById('clCheck');
  if (!run && !chk) return;
  var chosen = function(){
    return Array.prototype.filter.call(document.querySelectorAll('.clType'), function(c){ return c.checked; })
      .map(function(c){ return c.value; });
  };
  var out = document.getElementById('clOut');
  var say = function(html, bad){ out.style.display='block'; out.className = 'note'+(bad?' bad':''); out.innerHTML = html; };
  // Ten report types is too many to tick one by one when the answer is usually "all of them".
  var setAll = function(on){
    Array.prototype.forEach.call(document.querySelectorAll('.clType'), function(c){ c.checked = on; });
  };
  var all = document.getElementById('clAll'), none = document.getElementById('clNone');
  if (all) all.onclick = function(){ setAll(true); };
  if (none) none.onclick = function(){ setAll(false); };
  var call = function(dryRun){
    var types = chosen();
    if (!types.length){ say('Chagua angalau aina moja ya ripoti. / Choose at least one report type.', true); return; }
    var date = document.getElementById('clDate').value;
    var through = document.getElementById('clThrough').checked;
    srv('purgeSnapshots', { date: date, types: types, through: through, dryRun: dryRun })
      .then(function(r){
        // Only name the reports that actually had something. A line listing eight zeroes buries
        // the one number that mattered.
        var hits = Object.keys(r.deleted).filter(function(k){ return r.deleted[k] > 0; });
        var detail = hits.length
          ? hits.map(function(k){ return k+': '+money(r.deleted[k]); }).join(' · ')
          : 'hakuna kitu kwa tarehe hiyo / nothing stored for that date';
        var kept = r.protectedRows
          ? '<br><span style="color:var(--mut)">' + money(r.protectedRows)
            + ' iliyoandikwa ndani ya mfumo imeachwa / typed inside the app, left alone</span>'
          : '';
        /* What ELSE goes. Removing a customer from the follow-up list takes their whole
           comment history with them, and a cascade discovered afterwards is the worst kind of
           surprise in a system holding the company's follow-up record. Said in red, before. */
        var extra = '';
        Object.keys(r.cascaded || {}).forEach(function(k){
          var c = r.cascaded[k];
          if (c.rows) extra += '<br><span style="color:var(--bad)"><b>' + money(c.rows) + '</b> '
            + esc(c.label) + ' zitaondoka pamoja nao / go with them</span>';
          if (c.stillDefaulters) extra += '<br><span style="color:var(--bad)"><b>' + money(c.stillDefaulters)
            + '</b> kati yao bado ni wadaiwa hai / of these are still live defaulters</span>';
        });
        if (dryRun){
          say('<b>'+money(r.total)+'</b> rows would be deleted for <b>'+esc(r.date)+'</b>'
            + (r.through?' and everything before it':'') + '.<br>'+esc(detail) + kept + extra);
        } else {
          say('<b>'+money(r.total)+'</b> rows deleted. '+esc(detail) + kept + extra);
          S.storage = null; render({ force:true });
        }
      })
      .catch(function(e){ say(esc(String(e.message || e)), true); });
  };
  if (chk) chk.onclick = function(){ call(true); };
  if (run) run.onclick = function(){
    var types = chosen(), date = document.getElementById('clDate').value;
    var through = document.getElementById('clThrough').checked;
    if (!types.length){ say('Chagua angalau aina moja ya ripoti. / Choose at least one report type.', true); return; }
    var warn = types.indexOf('followup') >= 0
      ? '\n\nONYO / WARNING: "Follow-up list" huondoa wateja NA maoni yao yote.'
        + ' / removes customers AND every comment ever written about them.'
      : '';
    if (!confirm('Futa ' + types.join(', ') + ' ya ' + date
      + (through ? ' na zote za kabla yake' : '') + '?\n\nHistoria ya siku hiyo itapotea. / That day’s history will be gone.'
      + warn)) return;
    call(false);
  };
}
function exportBoard(id, kind){
  var b = BOARDS[id];
  if (!b || !b.rows.length){ toast(t('nothing'), true); return; }
  var name = b.title.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-' + today();
  if (kind === 'csv'){
    var lines = ['"S/N",' + b.cols.map(function(c){ return '"'+String(c.label).replace(/"/g,'""')+'"'; }).join(',')];
    b.rows.forEach(function(r,i){
      lines.push('"'+(i+1)+'",' + b.cols.map(function(c){ return '"'+cellText(r,c).replace(/"/g,'""')+'"'; }).join(','));
    });
    download(new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'}), name+'.csv');
    return;
  }
  var html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">'
    + '<style>th{background:#0B2A6B;color:#fff}td,th{border:1px solid #ccc;padding:4px 6px}</style></head><body>'
    + '<h3>'+esc(b.title)+'</h3><table><thead><tr><th>S/N</th>'
    + b.cols.map(function(c){ return '<th>'+esc(c.label)+'</th>'; }).join('')+'</tr></thead><tbody>'
    + b.rows.map(function(r,i){
        return '<tr><td>'+(i+1)+'</td>'+b.cols.map(function(c){
          var raw = c.get ? c.get(r) : r[c.key];
          return isNum(c) ? '<td x:num>'+(Number(raw)||0)+'</td>' : '<td>'+esc(cellText(r,c))+'</td>';
        }).join('')+'</tr>'; }).join('')
    + '</tbody></table></body></html>';
  download(new Blob(['﻿'+html], {type:'application/vnd.ms-excel;charset=utf-8;'}), name+'.xls');
}
function loading(){ $('#view').innerHTML = '<div class="sk"></div>'; }
/** A failure has to READ like a failure. This printed the raw server payload straight onto the
    screen, so a backend error came out as a page of JSON -- unreadable, alarming, and it leaked
    customer names and phone numbers onto a screen anyone nearby could see. The message is now
    trimmed to something a person can act on, and anything that looks like raw data is dropped
    rather than shown. */
function failed(e){
  var raw = String((e && e.message) || e || '');
  var looksLikeData = raw.charAt(0) === '[' || raw.charAt(0) === '{' || raw.length > 300;
  var msg = looksLikeData
    ? 'Mfumo haukujibu vizuri. Jaribu tena baada ya sekunde chache. / The server did not answer properly — try again in a few seconds.'
    : raw;
  $('#view').innerHTML = '<div class="msg bad"><b>Imeshindikana / Could not load.</b><br>' + esc(msg) + '</div>';
  if (looksLikeData && window.console) console.error('[hope] raw failure:', raw.slice(0, 2000));
}

function chipFor(s){
  var k = String(s||'').toUpperCase();
  if (k==='PAID'||k==='OVERPAID'||k==='CLEARED'||k==='ANALIPA LEO'||k==='APPROVED'||k==='RESOLVED') return 'ok';
  if (k==='UNDERPAID'||k==='AMETOA AHADI'||k==='PENDING'||k==='OPEN') return 'warn';
  if (k==='UNPAID'||k==='DEFAULTER'||k==='REJECTED'||k.indexOf('HANA USHIRIKIANO')>=0) return 'bad';
  return 'mut';
}

/* Small static tables inside a head block (no search/sort -- those belong to the main table). */
function tableSimple(rows, cols, totalRow){
  if (!rows || !rows.length) return '<div class="msg">—</div>';
  var body = rows.map(function(r,i){ return '<tr><td class="sn">'+(i+1)+'</td>'+cols.map(function(c){
        return '<td class="'+(isNum(c)?'r':'')+(c.cls?(' '+c.cls(r)):'')+'">'+cellHtml(r,c)+'</td>'; }).join('')+'</tr>'; }).join('');
  // A TOTAL row is not decoration on these boards -- it is the number read out in the meeting.
  if (totalRow) body += '<tr class="totrow"><td class="sn"></td>'+cols.map(function(c,i){
      return '<td class="'+(isNum(c)?'r':'')+'">'+(i===0?'JUMLA / TOTAL':cellHtml(totalRow,c))+'</td>'; }).join('')+'</tr>';
  return '<div class="scroll"><table><thead><tr><th class="sn">S/N</th>'+cols.map(function(c){
      return '<th class="'+(isNum(c)?'r':'')+'">'+esc(c.label)+'</th>'; }).join('')+'</tr></thead><tbody>'
    + body + '</tbody></table></div>';
}
function sumRow(rows, fields){
  var o = {};
  fields.forEach(function(f){ o[f] = rows.reduce(function(s,r){ return s + (Number(r[f])||0); }, 0); });
  return o;
}

/** THE GRAND TOTAL, WORKED OUT FROM THE COLUMNS THEMSELVES.
 *
 *  Every board used to have to be told which fields to add up, and boards whose author forgot
 *  simply had no total -- so the number people read out in the meeting was missing from some
 *  tables and present in others for no reason anybody could see.
 *
 *  The rule is in the column definition, which already knows what each column IS:
 *
 *    num, money, dur   added up. Counts, shillings and talk time all sum honestly.
 *    pct               NEVER added up. A column of percentages summed is nonsense -- and
 *                      dividing by the row count is nearly as bad, because it weights a team
 *                      of four the same as a team of four hundred. Where the two columns that
 *                      MADE the percentage are both on the board, it is worked out again from
 *                      their totals, which is the only honest answer. Otherwise it is blank.
 *    anything else     blank.
 *
 *  A `get` column is computed per row, so its total is computed the same way from the totals
 *  row rather than by summing whatever it displayed. */
var PCT_FROM = {   // percentage column -> [numerator field, denominator field]
  pct: ['collected', 'expected'], collPctToday: ['colToday', 'expToday'],
  collPctEarly: ['colEarly', 'expEarly'], weekPct: ['weekCollected', 'weekExpected'],
  connectPct: ['connected', 'calls'], portfolioPct: ['portfolio', 'calls'],
  salesPct: ['amount', 'target'], par: ['arrears', 'balance'],
  // Recovery: recovered over the uncollected it was chased against, for each period.
  tPct: ['tRecovered', 'tUncollected'], wPct: ['wCollected', 'wExpected'],
  // Team performance: the three recovery denominators, and the basis collection column.
  recPctMon: ['recovered', 'uncolMon'], recPctYest: ['recovered', 'uncolYest'],
  recPctWeek: ['recovered', 'uncolWeek'], collPct: ['colBasis', 'expBasis'],
  collPctWeek: ['colWeek', 'expWeek'],
};
function autoTotals(rows, cols){
  if (!rows || !rows.length || !cols || !cols.length) return null;
  var t = {}, any = false;
  cols.forEach(function(c){
    var k = c.key, kind = c.kind;
    if (kind === 'num' || kind === 'money' || kind === 'dur'){
      t[k] = rows.reduce(function(s, r){
        var v = c.get ? c.get(r) : r[k];
        return s + (Number(v) || 0); }, 0);
      any = true;
    }
  });
  if (!any) return null;
  // Percentages last, so the totals they are built from are already in place.
  cols.forEach(function(c){
    if (c.kind !== 'pct') return;
    var src = PCT_FROM[c.key];
    if (!src) return;
    var n = rows.reduce(function(s, r){ return s + (Number(r[src[0]]) || 0); }, 0);
    var d = rows.reduce(function(s, r){ return s + (Number(r[src[1]]) || 0); }, 0);
    if (d > 0) t[c.key] = Math.round((n / d) * 1000) / 10;
  });
  return t;
}
/** Every board is its own card with its OWN Excel and JPG buttons -- exports belong to the
    widget being read, not to a page-wide bar that cannot know which table you meant. */
var BOARDS = {};
/* `totalRow` may still be given explicitly -- several boards know something autoTotals cannot,
   such as a percentage whose denominator is not on the table. Passing `false` says this board
   genuinely has nothing to total. Omitting it gets the automatic one. */
function board(id, title, sub, rows, cols, totalRow){
  BOARDS[id] = { title: title, rows: rows, cols: cols };
  if (totalRow === undefined) totalRow = autoTotals(rows, cols);
  if (totalRow === false) totalRow = null;
  return '<div class="card" id="'+id+'"><div class="card-h">'+esc(title)
    + (sub ? '<span style="font-weight:400;color:var(--mut);font-size:12px">'+esc(sub)+'</span>' : '')
    + '<span class="sub"><button class="btn sm ghost" data-xls="'+id+'">Excel</button>'
    + ' <button class="btn sm ghost" data-jpg="'+id+'">JPG</button>'
    + ' <button class="btn sm ghost" data-csv="'+id+'">CSV</button></span></div>'
    + tableSimple(rows, cols, totalRow) + '</div>';
}
function boardPair(idA, titleA, subA, a, idB, titleB, subB, b, cols, totalFields){
  return '<div class="pair">'
    + board(idA, titleA, subA, a, cols, totalFields ? sumRow(a, totalFields) : undefined)
    + board(idB, titleB, subB, b, cols, totalFields ? sumRow(b, totalFields) : undefined)
    + '</div>';
}

/* Opened as a document rather than downloaded: the officer prints it or saves it as PDF from
   the browser's own print dialog, which is what produced the letter in v1 too. */
/* PRINTING A DOCUMENT THAT SOMEBODY SIGNS.

   This opened a new window and wrote the document into it. Two problems with that, and both
   of them end with an officer unable to produce a legal document:

     - A pop-up blocker stops it, and the only clue is a small icon in the address bar.
     - The Android app has no pop-ups at all, and no print service of its own, so from the
       APK the button did nothing whatsoever.

   Printing now happens IN THE PAGE: the document is written into a hidden frame that the
   print stylesheet reveals and everything else hides. No new window, nothing to block, and
   the browser's own print dialog does the rest -- including "Save as PDF", which is how these
   end up attached to an email or a legal file.

   The APK still cannot print (Android WebView needs the app to offer a print service, which
   this one does not). Rather than a button that silently does nothing, it says so and offers
   the document in the phone's browser, where printing works. */
function canPrintHere(){
  // The Android shell announces itself; a plain browser does not.
  return !(window.HopeCalls || /HopeCalls/i.test(navigator.userAgent || ''));
}
function printHtml(html){
  if (!canPrintHere()){
    // Hand it to the real browser, which can print. A blob URL keeps the document off the
    // network -- it never leaves the phone.
    try {
      var url = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
      window.open(url, '_blank');
      toast('Imefunguliwa kwenye kivinjari ili kuchapisha. / Opened in the browser, where you can print.');
      return;
    } catch(e){
      toast('Chapisha kwenye kompyuta. / Print this from a computer.', true); return;
    }
  }
  var f = document.getElementById('printFrame');
  if (!f){
    f = document.createElement('iframe');
    f.id = 'printFrame';
    f.setAttribute('aria-hidden', 'true');
    document.body.appendChild(f);
  }
  var doc = f.contentWindow.document;
  doc.open(); doc.write(html); doc.close();
  // Give the images -- logo, stamp, signature -- a moment to load. A contract printed without
  // its stamp has to be printed again, and nobody notices until it is in front of a customer.
  var go = function(){
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch(e){ toast('Imeshindikana kuchapisha. / Could not open the print dialog.', true); }
  };
  var imgs = doc.images ? doc.images.length : 0;
  if (!imgs) { setTimeout(go, 120); return; }
  var done = 0, fired = false;
  var maybe = function(){ if (++done >= imgs && !fired){ fired = true; setTimeout(go, 80); } };
  Array.prototype.forEach.call(doc.images, function(im){
    if (im.complete) return maybe();
    im.onload = maybe; im.onerror = maybe;
  });
  // A stamp that never loads must not mean a document that never prints.
  setTimeout(function(){ if (!fired){ fired = true; go(); } }, 2500);
}
